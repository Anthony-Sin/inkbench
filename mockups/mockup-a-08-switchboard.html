<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Switchboard</title>
<style>
  :root{
    --cream:#efe6d2; --cream2:#e2d6b8; --felt:#1e4034; --felt2:#173228;
    --brass:#b08d57; --brass2:#8a6a3c; --ink:#2e2a20; --red:#a03a2e; --grn:#2e7a4a;
    --serif:Georgia,"Times New Roman",serif; --mono:"Courier New",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--mono);font-size:12px;
    background:#2b2620 linear-gradient(#3a332a,#241f18)}
  .exch{height:100vh;display:grid;grid-template-rows:64px 1fr 132px;gap:10px;padding:12px}

  header{display:flex;align-items:center;gap:18px;background:linear-gradient(#efe6d2,#d9cba8);
    border:2px solid var(--brass2);border-radius:4px;padding:0 20px;box-shadow:0 4px 0 #14110c,inset 0 1px 0 #fff}
  .plate{font-family:var(--serif);font-size:19px;letter-spacing:.3em;font-weight:700;color:#4a3c22}
  .plate small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.28em;color:#8a744a;font-weight:400}
  .lamps{margin-left:auto;display:flex;gap:14px}
  .blmp{display:flex;flex-direction:column;align-items:center;gap:3px}
  .blmp .g{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7dff9e,#2e7a4a 70%);
    border:2px solid var(--brass2);box-shadow:0 0 10px #2e7a4a66,inset 0 -2px 3px #0005}
  .blmp span{font-size:7.5px;letter-spacing:.12em;color:#6a5a3a}
  .exchange-no{font-size:10px;letter-spacing:.2em;color:#6a5a3a;border:1.5px solid var(--brass);
    padding:5px 12px;border-radius:3px;background:#fff8}

  main{display:grid;grid-template-columns:600px 1fr 340px;gap:10px;min-height:0}

  /* jack field */
  .field{background:linear-gradient(#22493b,#173228);border:2px solid var(--brass2);border-radius:4px;
    padding:14px;position:relative;box-shadow:inset 0 0 60px #0006;display:flex;flex-direction:column;min-height:0}
  .field .fh{color:#d9cfae;font-size:9px;letter-spacing:.35em;text-align:center;margin-bottom:8px}
  .field svg{flex:1;min-height:0;width:100%}

  /* center: framed render + directory */
  .center{display:flex;flex-direction:column;gap:10px;min-height:0}
  .frame{flex:1;background:linear-gradient(#efe6d2,#e2d6b8);border:10px solid;border-image:linear-gradient(#caa86a,#8a6a3c) 1;
    box-shadow:0 6px 18px #0009,inset 0 0 40px #0002;position:relative;overflow:hidden;min-height:0}
  .frame img{width:100%;height:100%;object-fit:contain;display:block}
  .frame .plq{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    background:linear-gradient(#caa86a,#a8834e);border:1px solid #6a5228;color:#3a2c12;
    font-family:var(--serif);font-size:10px;letter-spacing:.2em;padding:4px 16px;border-radius:2px;box-shadow:0 2px 4px #0006}
  .dir{background:linear-gradient(#efe6d2,#d9cba8);border:2px solid var(--brass2);border-radius:4px;padding:10px 14px}
  .dir h4{margin:0 0 6px;font-family:var(--serif);font-size:11px;letter-spacing:.3em;color:#4a3c22;text-align:center;
    border-bottom:1px solid var(--brass);padding-bottom:5px}
  .dir .dr{display:flex;justify-content:space-between;font-size:9.5px;color:#5a4c2e;padding:2.5px 0;border-bottom:1px dotted #b09a6a}
  .dir .dr b{color:#3a2c12;font-weight:400}

  /* patch rows */
  .patch{background:linear-gradient(#efe6d2,#d9cba8);border:2px solid var(--brass2);border-radius:4px;
    padding:12px;display:flex;flex-direction:column;min-height:0;box-shadow:0 4px 0 #14110c}
  .patch h4{margin:0 0 8px;font-family:var(--serif);font-size:11px;letter-spacing:.3em;color:#4a3c22;
    text-align:center;border-bottom:1px solid var(--brass);padding-bottom:6px}
  .prows{flex:1;overflow:auto;min-height:0}
  .pr{display:grid;grid-template-columns:30px 24px 1fr 22px;gap:8px;align-items:center;
    background:#fbf4e0;border:1px solid #c9b88e;border-radius:3px;padding:6px 8px;margin-bottom:6px;
    box-shadow:0 2px 3px #0003}
  .pr:hover{transform:translateX(2px)}
  .pr .cct{font-size:10px;color:#8a6a3c;font-weight:700}
  .pr .jk{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle,#14110c 30%,#4a4032 70%);
    border:2px solid var(--brass)}
  .pr .tx{font-size:10px;color:#3a3222}
  .pr .tx small{display:block;font-size:8px;color:#8a744a}
  .pr .lm{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd9a0,#b06a2a);
    border:1px solid #6a5228;box-shadow:0 0 5px #ffb45488}

  /* bottom: telegram + ticker */
  footer{display:grid;grid-template-columns:1fr 620px;gap:10px}
  .telegram{background:#f4ecd6;border:2px solid var(--brass2);border-radius:3px;padding:10px 16px;
    display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #14110c;position:relative;
    background-image:repeating-linear-gradient(0deg,transparent 0 27px,#8a6a3c22 27px 28px)}
  .telegram .tl{font-family:var(--serif);font-size:10px;letter-spacing:.3em;color:#8a6a3c;writing-mode:vertical-rl;
    transform:rotate(180deg);border-left:1px solid var(--brass);padding-left:6px}
  .telegram input{flex:1;background:transparent;border:none;border-bottom:1.5px dashed #8a6a3c;
    font-family:var(--serif);font-style:italic;font-size:15px;color:#3a2c12;padding:6px 4px}
  .telegram input:focus{outline:none;border-bottom-color:#4a3c22}
  .key{background:linear-gradient(#4a4032,#2b2620);color:#e8d9ae;border:2px solid var(--brass2);border-radius:4px;
    font-family:var(--mono);font-size:10px;letter-spacing:.25em;padding:10px 22px;cursor:pointer;
    box-shadow:0 3px 0 #14110c}
  .key:hover{background:linear-gradient(#5a5042,#332c24)}
  .key:active{transform:translateY(2px);box-shadow:0 1px 0 #14110c}
  .tapew{background:linear-gradient(#efe6d2,#d9cba8);border:2px solid var(--brass2);border-radius:4px;
    padding:8px;display:flex;gap:10px;align-items:center;overflow:hidden}
  .tape{flex:1;background:#f8f2df;border:1px solid #b09a6a;height:100%;overflow:hidden;position:relative;
    box-shadow:inset 0 2px 6px #0003}
  .tape .inner{position:absolute;white-space:nowrap;top:50%;transform:translateY(-50%);
    font-family:var(--mono);font-size:10.5px;color:#4a3c22;letter-spacing:.05em;animation:tape 28s linear infinite}
  .tape .inner b{color:var(--grn);font-weight:700}
  @keyframes tape{to{transform:translate(-50%,-50%)}}
  .tapel{font-size:8px;letter-spacing:.25em;color:#8a6a3c;writing-mode:vertical-rl;transform:rotate(180deg)}
</style>
</head>
<body>
<div class="exch">
  <header>
    <div class="plate">INKBENCH EXCHANGE<small>AGENTIC CAD · MANUAL CORD BOARD No. 1</small></div>
    <div class="exchange-no" id="exno"></div>
    <div class="lamps" id="lamps"></div>
  </header>
  <main>
    <div class="field">
      <div class="fh">— JACK FIELD · JOINT CIRCUITS —</div>
      <svg id="field" viewBox="0 0 560 620" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="center">
      <div class="frame"><img src="lamp_flat.png" alt="render"><div class="plq" id="plq"></div></div>
      <div class="dir"><h4>SUBSCRIBER DIRECTORY</h4><div id="dir"></div></div>
    </div>
    <div class="patch">
      <h4>PATCH ROWS — ASSEMBLY CIRCUITS</h4>
      <div class="prows" id="prows"></div>
    </div>
  </main>
  <footer>
    <div class="telegram">
      <div class="tl">TELEGRAM · BRIEF</div>
      <input id="brief" spellcheck="false">
      <button class="key" id="send">SEND ▸</button>
    </div>
    <div class="tapew"><div class="tapel">TICKER</div>
      <div class="tape"><div class="inner" id="tape"></div></div></div>
  </footer>
</div>
<script src="data.js"></script>
<script>
const D=window.DATA;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const f1=v=>(+v).toFixed(1),f2=v=>(+v).toFixed(2);
const totalMass=D.measures.reduce((s,m)=>s+m.massG,0);
const stab=D.report.checks.find(c=>c.name==='stability');

document.getElementById('exno').textContent='EXCH '+D.figures[0].figNum+' · '+(D.report.pass?'VERIFIED':'FAULT');
document.getElementById('plq').textContent='FIG.'+D.figures[0].figNum+' — '+D.spec.name.toUpperCase();

/* busy lamps = checks */
document.getElementById('lamps').innerHTML=D.report.checks.map(c=>`
  <div class="blmp"><div class="g" style="${c.status!=='pass'?'background:radial-gradient(circle at 35% 30%,#ff9e8a,#a03a2e 70%)':''}"></div>
  <span>${esc(c.name.split(' ')[0].toUpperCase())}</span></div>`).join('');

/* jack field: per part a vertical row of jacks; cords join a→b */
const cols=D.spec.parts.map(p=>p.id);
const colX=id=>60+cols.indexOf(id)*110;
const JY=(id,k)=>90+cols.indexOf(id)*0+k*0; // rows are vertical columns
let s='';
/* column headers + jack sockets (6 per part column) */
D.spec.parts.forEach((p,i)=>{
  const x=colX(p.id);
  s+=`<text x="${x}" y="42" text-anchor="middle" fill="#d9cfae" font-size="12" letter-spacing="3" font-family="Courier New">${esc(p.id.toUpperCase())}</text>
      <text x="${x}" y="58" text-anchor="middle" fill="#b08d57" font-size="9">${p.shape} · ${p.material}</text>`;
  for(let j=0;j<6;j++){
    const y=90+j*84;
    s+=`<circle cx="${x}" cy="${y}" r="11" fill="#0d1f18" stroke="#b08d57" stroke-width="2.5"/>
        <circle cx="${x}" cy="${y}" r="4" fill="#050d0a"/>`;
  }
});
/* cords: joint i connects part a jack[i] -> part b jack[i], sagging */
const cordCol={fixed:'#a03a2e',revolute:'#2e8a4a'};
D.spec.joints.forEach((j,i)=>{
  const x1=colX(j.a),y1=90+i*84,x2=colX(j.b),y2=90+i*84;
  const sag=90+Math.abs(x2-x1)*.28;
  s+=`<path d="M ${x1} ${y1} C ${x1} ${y1+sag}, ${x2} ${y2+sag}, ${x2} ${y2}"
       fill="none" stroke="${cordCol[j.type]||'#b08d57'}" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="${x1}" cy="${y1}" r="6" fill="${cordCol[j.type]}" stroke="#d9cfae" stroke-width="1.5"/>
      <circle cx="${x2}" cy="${y2}" r="6" fill="${cordCol[j.type]}" stroke="#d9cfae" stroke-width="1.5"/>
      <text x="${(x1+x2)/2}" y="${y1+sag*.72}" text-anchor="middle" fill="#efe6d2" font-size="9" letter-spacing="1">${esc(j.type.toUpperCase())}</text>`;
});
/* legend */
s+=`<text x="280" y="600" text-anchor="middle" fill="#b08d57" font-size="9" letter-spacing="2">— CORD: RED=FIXED · GREEN=REVOLUTE —</text>`;
document.getElementById('field').innerHTML=s;

/* directory */
document.getElementById('dir').innerHTML=D.measures.map(m=>{
  const dm=m.shape==='box'?m.dims.join('×'):'⌀'+f1(m.dims[0])+'×'+f1(m.dims[2]);
  return `<div class="dr"><b>${esc(m.id)}</b><span>${esc(m.material)} · ${dm}mm · ${f1(m.massG)}g</span></div>`;
}).join('')+`<div class="dr"><b>TOTAL</b><span>${f2(totalMass/1000)}kg · tip ${f2(stab.measured)}mm</span></div>`;

/* patch rows = plan */
document.getElementById('prows').innerHTML=D.plan.map((p,i)=>{
  if(p.kind==='place')return `<div class="pr"><span class="cct">C${String(p.step).padStart(2,'0')}</span>
    <span class="jk"></span><span class="tx">LINE ${p.arm} — place <b>${esc(p.part)}</b> ${p.glyph}<small>${f1(p.massG)}g · seat ${p.seat.map(v=>f1(v)).join(',')}</small></span>
    <span class="lm"></span></div>`;
  return `<div class="pr" style="background:#efe2c2"><span class="cct">···</span>
    <span class="jk" style="border-color:#7a5a2a"></span><span class="tx">${esc(p.type)} ${esc(p.a)}→${esc(p.b)}<small>@${p.anchor.map(v=>f1(v)).join(',')}${p.late?' · late':''}</small></span>
    <span class="lm" style="background:radial-gradient(circle at 35% 30%,#9effc0,#2e7a4a)"></span></div>`;
}).join('');

/* telegram + ticker */
const bi=document.getElementById('brief');bi.value=D.brief;
document.getElementById('send').onclick=()=>{bi.select&&bi.select();};
const tp=D.log.map(esc).join('  +++  ')+'  +++  '+(D.report.pass?'<b>REPORT ▸ PASS</b>':'<b>REPORT ▸ FAIL</b>');
document.getElementById('tape').innerHTML=(tp+'  +++  ').repeat(2);
</script>
</body>
</html>
