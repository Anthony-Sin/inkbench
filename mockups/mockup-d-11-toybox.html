<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Toybox Sandbox</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1700px; height: 900px; overflow: hidden; }
  body {
    background: #fbf1dc;
    background-image: radial-gradient(circle, rgba(58,49,41,.06) 1.5px, transparent 1.5px);
    background-size: 30px 30px;
    color: #3a3129; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 12px; position: relative; user-select: none;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }

  /* ---------- header ---------- */
  #head {
    position: absolute; left: 24px; right: 24px; top: 20px; height: 62px;
    background: #fff8ea; border: 3px solid #3a3129; border-radius: 22px;
    display: flex; align-items: center; gap: 16px; padding: 0 20px;
    box-shadow: 0 5px 0 rgba(58,49,41,.9); z-index: 10;
  }
  #head .logo {
    font-size: 19px; font-weight: 900; letter-spacing: .02em;
    background: #ffe9a3; border: 2.5px solid #3a3129; border-radius: 14px;
    padding: 6px 14px; transform: rotate(-1.5deg); box-shadow: 0 3px 0 rgba(58,49,41,.9);
  }
  #head .logo i { color: #d6538d; font-style: normal; }
  #head .tag { font-size: 10px; letter-spacing: .18em; color: #8b7d68; text-transform: uppercase; font-weight: 700; }
  #head .status {
    margin-left: auto; font-size: 11px; font-weight: 800; letter-spacing: .08em;
    background: #b8e6c9; border: 2.5px solid #3a3129; border-radius: 20px;
    padding: 7px 16px; box-shadow: 0 3px 0 rgba(58,49,41,.9); transform: rotate(1deg);
  }
  #head .status.bad { background: #f5c2c2; }

  /* ---------- columns ---------- */
  .col { position: absolute; top: 100px; bottom: 118px; width: 300px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  #colL { left: 24px; }
  #colR { right: 24px; }

  .card {
    background: #fff8ea; border: 3px solid #3a3129; border-radius: 20px;
    box-shadow: 0 5px 0 rgba(58,49,41,.9); padding: 14px 16px; flex: none;
  }
  .card h5 {
    font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: #3a3129; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
  }
  .card h5 .chiplet {
    font-size: 8.5px; background: #b3dcf5; border: 2px solid #3a3129; border-radius: 10px;
    padding: 1px 8px; letter-spacing: .1em;
  }

  /* brief card */
  #cardBrief { transform: rotate(-.8deg); }
  #cardBrief .bt { font-size: 13px; line-height: 1.5; color: #5a4f41; font-style: italic; }
  #cardBrief input {
    width: 100%; margin-top: 9px; font-size: 11.5px; padding: 9px 12px;
    border: 2.5px solid #3a3129; border-radius: 14px; background: #fffdf4;
    color: #3a3129; outline: none; font-family: inherit;
  }
  #cardBrief input:focus { background: #fff; box-shadow: 0 0 0 3px #ffe9a3; }
  #cardBrief button {
    width: 100%; margin-top: 9px; padding: 10px 0; font-size: 12px; font-weight: 800;
    letter-spacing: .1em; border: 2.5px solid #3a3129; border-radius: 16px;
    background: #ffd9b3; color: #3a3129; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 0 rgba(58,49,41,.9); text-transform: uppercase;
  }
  #cardBrief button:hover { background: #ffc98f; }
  #cardBrief button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(58,49,41,.9); }

  /* sticker checks */
  #stickers { flex: 1; min-height: 0; overflow: hidden auto; }
  #stickers::-webkit-scrollbar { width: 0; }
  .sticker {
    display: flex; align-items: center; gap: 10px; margin: 9px 4px;
    border: 2.5px solid #3a3129; border-radius: 16px; padding: 8px 12px;
    box-shadow: 0 3px 0 rgba(58,49,41,.9); cursor: default;
    transition: transform .15s;
  }
  .sticker:hover { transform: rotate(0deg) scale(1.03) !important; }
  .sticker .tick {
    width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #3a3129;
    display: flex; align-items: center; justify-content: center; font-weight: 900;
    font-size: 14px; background: #fff; flex: none;
  }
  .sticker .n { font-weight: 800; font-size: 12px; text-transform: capitalize; }
  .sticker .m { margin-left: auto; font-size: 9.5px; color: #8b7d68; font-family: ui-monospace, Menlo, monospace; }

  /* ---------- sandbox ---------- */
  #sandbox {
    position: absolute; left: 348px; right: 348px; top: 100px; bottom: 118px;
    background: #fff4d9; border: 3px solid #3a3129; border-radius: 28px;
    box-shadow: 0 6px 0 rgba(58,49,41,.9), inset 0 0 0 6px rgba(58,49,41,.05);
    overflow: hidden;
  }
  #sandbox .inner {
    position: absolute; inset: 14px; border: 2.5px dashed #c9b896; border-radius: 20px;
  }
  #sandbox .floor {
    position: absolute; left: 8%; right: 8%; bottom: 60px; height: 18px;
    background: radial-gradient(ellipse, rgba(58,49,41,.18), transparent 70%);
    border-radius: 50%;
  }
  #sandbox img.hero {
    position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%);
    height: 74%;
  }
  #sandbox .hint {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: .2em; color: #a89a7d; text-transform: uppercase;
    font-weight: 700; white-space: nowrap;
  }
  #sandbox .statetag {
    position: absolute; left: 20px; bottom: 18px; font-size: 9.5px; letter-spacing: .16em;
    color: #a89a7d; text-transform: uppercase; font-family: ui-monospace, Menlo, monospace;
  }
  #sandbox .counttag {
    position: absolute; right: 20px; bottom: 18px; font-size: 9.5px; letter-spacing: .16em;
    color: #a89a7d; text-transform: uppercase; font-family: ui-monospace, Menlo, monospace;
  }
  .dropTok {
    position: absolute; width: 34px; height: 34px; border-radius: 50%;
    border: 2.5px solid #3a3129; display: flex; align-items: center; justify-content: center;
    font-size: 15px; box-shadow: 0 3px 0 rgba(58,49,41,.9);
    animation: plop .45s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes plop { 0%{transform:scale(0) rotate(-30deg)} 70%{transform:scale(1.25) rotate(8deg)} 100%{transform:scale(1) rotate(0)} }
  .plusone {
    position: absolute; font-size: 13px; font-weight: 900; color: #d6538d;
    animation: rise 1s ease-out forwards; pointer-events: none;
  }
  @keyframes rise { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(-46px)} }

  /* ---------- recipe (right col) ---------- */
  #cardRecipe { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #recipeRows { overflow: hidden auto; flex: 1; }
  #recipeRows::-webkit-scrollbar { width: 0; }
  .rrow {
    display: flex; align-items: center; gap: 10px; padding: 7px 8px; margin: 4px 0;
    border-radius: 14px; border: 2px solid transparent; cursor: default;
  }
  .rrow:hover { border-color: #3a3129; background: #fff3d9; }
  .rrow .num {
    width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid #3a3129;
    background: #ffe9a3; font-weight: 900; font-size: 11px;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .rrow .gl { font-size: 14px; }
  .rrow .pt { font-weight: 800; font-size: 12px; }
  .rrow .ms { font-size: 9px; color: #8b7d68; font-family: ui-monospace, Menlo, monospace; }
  .rrow .at {
    margin-left: auto; font-size: 9px; font-weight: 900; padding: 3px 9px;
    border-radius: 11px; border: 2px solid #3a3129; flex: none;
  }
  .at.A { background: #b3dcf5; } .at.B { background: #f5c2d4; }
  .rrow.j { opacity: .7; }
  .rrow.j .num { background: #d8c9f0; border-radius: 8px; font-size: 9px; }
  .rrow.j .pt { font-weight: 500; font-size: 10px; font-family: ui-monospace, Menlo, monospace; }

  /* chatter bubbles */
  #cardChatter { flex: none; max-height: 190px; display: flex; flex-direction: column; }
  #chatter { overflow: hidden auto; flex: 1; }
  #chatter::-webkit-scrollbar { width: 0; }
  .bub {
    background: #fff; border: 2px solid #3a3129; border-radius: 14px 14px 14px 4px;
    padding: 6px 11px; margin: 6px 0; font-size: 10px; color: #5a4f41;
    font-family: ui-monospace, Menlo, monospace; width: fit-content; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bub:last-child { background: #b8e6c9; font-weight: 700; color: #3a3129; }

  /* ---------- part bin ---------- */
  #bin {
    position: absolute; left: 24px; right: 24px; bottom: 20px; height: 84px;
    background: #fff8ea; border: 3px solid #3a3129; border-radius: 22px;
    box-shadow: 0 5px 0 rgba(58,49,41,.9); display: flex; align-items: center;
    gap: 12px; padding: 0 20px; z-index: 10;
  }
  #bin .bh { font-size: 9.5px; letter-spacing: .2em; font-weight: 800; color: #8b7d68; text-transform: uppercase; flex: none; }
  .chip {
    display: flex; align-items: center; gap: 9px; padding: 9px 15px;
    border: 2.5px solid #3a3129; border-radius: 18px; box-shadow: 0 4px 0 rgba(58,49,41,.9);
    cursor: grab; font-family: inherit; background: #fff; flex: none;
    transition: transform .12s;
  }
  .chip:hover { transform: translateY(-3px) rotate(-1deg); }
  .chip:active { cursor: grabbing; }
  .chip .ico {
    width: 24px; height: 24px; border-radius: 9px; border: 2px solid #3a3129;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .chip .cn { font-weight: 800; font-size: 12px; }
  .chip .cm { font-size: 9px; color: #8b7d68; font-family: ui-monospace, Menlo, monospace; }
  .ghost {
    position: fixed; z-index: 100; pointer-events: none; opacity: .92;
    transform: translate(-50%,-60%) rotate(-4deg) scale(1.06);
  }
</style>
</head>
<body>
  <div id="head">
    <div class="logo">INK<i>BENCH</i></div>
    <div class="tag">TOYBOX · AGENTIC CAD PLAYSET</div>
    <div class="status" id="headStatus"></div>
  </div>

  <div class="col" id="colL">
    <div class="card" id="cardBrief">
      <h5>Mission Card <span class="chiplet">brief</span></h5>
      <div class="bt" id="briefText"></div>
      <input id="briefIn" spellcheck="false">
      <button id="briefBtn">Build it! ▸</button>
    </div>
    <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <h5>Sticker Book <span class="chiplet" id="chkChip"></span></h5>
      <div id="stickers"></div>
    </div>
  </div>

  <div id="sandbox">
    <div class="inner"></div>
    <div class="hint" id="sbHint"></div>
    <div class="floor"></div>
    <img class="hero" src="lamp_flat.png" alt="toy render">
    <div class="statetag" id="sbLeft"></div>
    <div class="counttag" id="sbRight"></div>
  </div>

  <div class="col" id="colR">
    <div class="card" id="cardRecipe">
      <h5>Recipe <span class="chiplet" id="recChip"></span></h5>
      <div id="recipeRows"></div>
    </div>
    <div class="card" id="cardChatter">
      <h5>Chatter <span class="chiplet">log</span></h5>
      <div id="chatter"></div>
    </div>
  </div>

  <div id="bin">
    <div class="bh">PART<br>BIN</div>
    <div id="binChips" style="display:flex;gap:10px"></div>
  </div>

<script src="data.js"></script>
<script>
(function(){
  const D = window.DATA, $ = s => document.querySelector(s);
  const fmtSize = s => Array.isArray(s) ? s.join('×') : ('⌀' + (s.r*2) + '×' + s.h);
  const shapeIco = s => ({cylinder:'●', box:'■', cone:'▲'}[s] || '◆');
  const massOf = id => { const m = D.measures.find(m=>m.id===id); return m ? m.massG : 0; };
  const pastels = ['#ffe9a3','#b8e6c9','#b3dcf5','#f5c2d4','#d8c9f0','#ffd9b3'];
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

  /* header */
  $('#headStatus').textContent = D.report.pass ? '★ ALL CHECKS PASSED ★' : '✗ OOPS — CHECK AGAIN';
  if (!D.report.pass) $('#headStatus').classList.add('bad');

  /* brief */
  $('#briefText').textContent = '“' + D.brief + '”';
  $('#briefIn').value = D.brief;
  $('#briefBtn').onclick = () => {
    const b = document.createElement('div');
    b.className = 'bub'; b.textContent = 'you ▸ ' + $('#briefIn').value;
    $('#chatter').appendChild(b); b.scrollIntoView();
  };

  /* stickers = checks */
  $('#chkChip').textContent = D.report.checks.length + ' checks · ' + D.report.timingMs + 'ms';
  $('#stickers').innerHTML = D.report.checks.map((c,i) =>
    '<div class="sticker" style="background:' + pastels[i % pastels.length] + ';transform:rotate(' + ((i%2?1:-1)*(1+i%3)*.8) + 'deg)" title="' + esc(c.detail).replace(/"/g,'&quot;') + '">' +
    '<span class="tick">' + (c.status==='pass' ? '✓' : '✗') + '</span>' +
    '<span class="n">' + c.name + '</span><span class="m">' + (c.measured ? c.measured.toFixed(1) : 'ok') + '</span></div>').join('');

  /* recipe = plan */
  $('#recChip').textContent = D.plan.filter(s=>s.kind==='place').length + ' steps';
  $('#recipeRows').innerHTML = D.plan.map(s => {
    if (s.kind === 'place') return '<div class="rrow" title="seat (' + s.seat.join(',') + ')">' +
      '<span class="num">' + s.step + '</span><span class="gl">' + s.glyph + '</span>' +
      '<span><div class="pt">' + s.part + '</div><div class="ms">' + s.massG.toFixed(0) + ' g</div></span>' +
      '<span class="at ' + s.arm + '">ARM ' + s.arm + '</span></div>';
    return '<div class="rrow j" title="axis (' + s.axis.join(',') + ') @(' + s.anchor.join(',') + ')">' +
      '<span class="num">⚿</span><span class="pt">' + s.type + ' snap: ' + s.a + ' + ' + s.b + '</span></div>';
  }).join('');

  /* chatter = log */
  $('#chatter').innerHTML = D.log.map(l => '<div class="bub">' + esc(l) + '</div>').join('');

  /* sandbox labels */
  $('#sbHint').textContent = '▸ DRAG PARTS INTO THE SANDBOX ◂';
  $('#sbLeft').textContent = 'fig ' + D.figures[0].figNum + ' · ' + D.spec.name.toLowerCase() + ' · ' + D.spec.units;
  let dropped = 0;
  const updCount = () => $('#sbRight').textContent = 'parts in box: ' + dropped + ' / ' + D.spec.parts.length;
  updCount();

  /* ---------- bin chips + drag ---------- */
  const sb = $('#sandbox');
  D.spec.parts.forEach((p,i) => {
    const c = document.createElement('div');
    c.className = 'chip';
    c.innerHTML = '<span class="ico" style="background:' + D.spec.materials[p.material].color + '">' + shapeIco(p.shape) + '</span>' +
      '<span><div class="cn">' + p.id + '</div><div class="cm">' + fmtSize(p.size) + ' · ' + massOf(p.id).toFixed(0) + 'g</div></span>';
    $('#binChips').appendChild(c);

    c.addEventListener('mousedown', ev => {
      ev.preventDefault();
      const g = c.cloneNode(true);
      g.classList.add('ghost');
      document.body.appendChild(g);
      const move = e => { g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; };
      move(ev);
      const up = e => {
        window.removeEventListener('mousemove', move);
        window.removeEventListener('mouseup', up);
        g.remove();
        const r = sb.getBoundingClientRect();
        if (e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom) {
          const tok = document.createElement('div');
          tok.className = 'dropTok';
          tok.style.background = D.spec.materials[p.material].color;
          tok.style.left = (e.clientX - r.left - 17) + 'px';
          tok.style.top  = (e.clientY - r.top - 17) + 'px';
          tok.textContent = shapeIco(p.shape);
          tok.title = p.id + ' · ' + massOf(p.id).toFixed(0) + 'g';
          sb.appendChild(tok);
          const po = document.createElement('div');
          po.className = 'plusone'; po.textContent = '+1 ' + p.id;
          po.style.left = (e.clientX - r.left + 16) + 'px';
          po.style.top  = (e.clientY - r.top - 30) + 'px';
          sb.appendChild(po); setTimeout(()=>po.remove(), 1000);
          dropped = Math.min(D.spec.parts.length, dropped + 1); updCount();
          const b = document.createElement('div');
          b.className = 'bub'; b.textContent = 'clunk! ' + p.id + ' in the box (' + massOf(p.id).toFixed(0) + 'g)';
          $('#chatter').appendChild(b); b.scrollIntoView();
        }
      };
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', up);
    });
  });
})();
</script>
</body>
</html>
