<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Node Graph</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1700px; height: 900px; overflow: hidden; }
  body {
    background: #16181d; color: #d4d8e0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 12px; display: flex; flex-direction: column;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }

  /* ---------- top bar ---------- */
  #topbar {
    height: 44px; flex: none; display: flex; align-items: center; gap: 18px;
    padding: 0 18px; background: #101216; border-bottom: 1px solid #23262d;
  }
  #topbar .logo { font-size: 14px; font-weight: 800; letter-spacing: .14em; color: #eef0f4; }
  #topbar .logo i { color: #f59e0b; font-style: normal; }
  #topbar .crumb { font-size: 10.5px; color: #6b7280; letter-spacing: .1em; }
  #topbar .crumb b { color: #aab0bd; font-weight: 600; }
  #topbar .spacer { flex: 1; }
  .tchip {
    font-size: 10px; letter-spacing: .14em; padding: 4px 12px; border-radius: 20px;
    border: 1px solid #2e323b; color: #9aa0ab; background: #15181d;
  }
  .tchip.ok { color: #6ee7b7; border-color: #14532d; background: #05231a; }
  .tchip b { color: #e5e7eb; }

  /* ---------- canvas ---------- */
  #canvas {
    flex: 1; position: relative; overflow: hidden;
    background-image: radial-gradient(circle, #2c3039 1.2px, transparent 1.2px);
    background-size: 26px 26px;
  }
  #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #wires path {
    fill: none; stroke: #3d434e; stroke-width: 2;
    transition: stroke .15s;
  }
  #wires path.hot { stroke: #f59e0b; }
  #wires path.dash { stroke-dasharray: 5 6; }
  #wires path.pulse { stroke: #fcd34d; stroke-width: 3; }

  /* ---------- nodes ---------- */
  .node {
    position: absolute; background: #1d2026; border: 1px solid #33383f;
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
    min-width: 180px; transition: box-shadow .15s, border-color .15s;
  }
  .node:hover { border-color: #f59e0b; box-shadow: 0 14px 34px rgba(0,0,0,.6); z-index: 5; }
  .nhead {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid #2a2e36; border-radius: 8px 8px 0 0;
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: #aab0bd;
    background: #22252c; cursor: grab; user-select: none;
  }
  .nhead .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .nhead .sub { margin-left: auto; font-size: 9px; color: #5d6470; letter-spacing: .08em; }
  .nbody { padding: 10px 12px; }
  .port {
    position: absolute; width: 11px; height: 11px; border-radius: 50%;
    background: #16181d; border: 2px solid #6b7280; cursor: crosshair; z-index: 6;
    transition: transform .12s, border-color .12s;
  }
  .port:hover { transform: scale(1.5); border-color: #f59e0b; }
  .port.in  { left: -6px; }
  .port.out { right: -6px; }
  .port .tip {
    display: none; position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    font-size: 8.5px; color: #16181d; background: #f59e0b; padding: 1px 6px;
    border-radius: 8px; white-space: nowrap; letter-spacing: .1em;
  }
  .port:hover .tip { display: block; }

  /* node bodies */
  #n-brief textarea {
    width: 100%; height: 58px; resize: none; background: #14161b; color: #e5e7eb;
    border: 1px solid #2e323b; border-radius: 5px; padding: 7px 9px; font-size: 11.5px;
    font-family: inherit; outline: none; line-height: 1.45;
  }
  #n-brief textarea:focus { border-color: #f59e0b; }
  #n-brief button {
    width: 100%; margin-top: 7px; padding: 7px 0; border: none; border-radius: 5px;
    background: #b45309; color: #fff; font-size: 11px; letter-spacing: .12em;
    cursor: pointer; font-family: inherit; text-transform: uppercase;
  }
  #n-brief button:hover { background: #d97706; }
  #n-brief button:active { transform: translateY(1px); }

  table.kv { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.kv td { padding: 3px 4px; border-bottom: 1px solid #262a31; color: #b9bec9; }
  table.kv tr:hover td { background: #23262d; }
  table.kv .id { color: #fbbf24; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; }
  table.kv .num { text-align: right; font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #8b919e; }
  .jointrows { margin-top: 7px; border-top: 1px dashed #2e323b; padding-top: 6px; }
  .jointrows div {
    font-size: 10px; color: #8b919e; font-family: ui-monospace, Menlo, monospace;
    padding: 1.5px 0; white-space: nowrap;
  }
  .jointrows .ty { color: #7dd3fc; }

  /* render node */
  #n-render .nbody { padding: 0; }
  .vptools {
    display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid #2a2e36;
  }
  .vptools .tb {
    font-size: 9.5px; letter-spacing: .14em; padding: 4px 12px; border-radius: 20px;
    border: 1px solid #3a3f49; background: #14161b; color: #8b919e; cursor: pointer;
    font-family: inherit; text-transform: uppercase;
  }
  .vptools .tb:hover { color: #e5e7eb; border-color: #6b7280; }
  .vptools .tb.on { background: #f59e0b; border-color: #f59e0b; color: #1a1206; font-weight: 700; }
  .vptools .vpname { margin-left: auto; font-size: 9.5px; color: #5d6470; align-self: center; letter-spacing: .1em; }
  .vpimg { position: relative; height: 560px; overflow: hidden; border-radius: 0 0 8px 8px; }
  .vpimg img {
    position: absolute; inset: 0; margin: auto; max-height: 96%; max-width: 96%;
    object-fit: contain; filter: drop-shadow(0 18px 30px rgba(0,0,0,.55));
  }
  .vpimg .vpline { position: absolute; background: rgba(251,191,36,.12); pointer-events: none; }
  .vpimg .vplabel {
    position: absolute; bottom: 8px; left: 12px; font-size: 9.5px; color: #6b7280;
    letter-spacing: .14em; font-family: ui-monospace, Menlo, monospace;
  }

  /* verify node */
  .vbig {
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .vbig .vb {
    font-size: 16px; font-weight: 800; letter-spacing: .2em; padding: 4px 14px;
    border-radius: 5px; background: #052e1c; border: 1px solid #059669; color: #6ee7b7;
  }
  .vbig .vm { font-size: 9.5px; color: #6b7280; line-height: 1.55; }
  .chk { display: flex; gap: 7px; align-items: center; padding: 3px 0; font-size: 10.5px; cursor: default; }
  .chk:hover { background: #23262d; }
  .chk .d { width: 7px; height: 7px; border-radius: 50%; background: #34d399; flex: none; }
  .chk .d.f { background: #f87171; }
  .chk .n { color: #c9cdd6; text-transform: capitalize; }
  .chk .m { margin-left: auto; font-size: 9px; color: #5d6470; font-family: ui-monospace, Menlo, monospace; }

  /* arms node */
  .arow {
    display: flex; align-items: center; gap: 8px; padding: 4px 2px;
    font-size: 11px; border-bottom: 1px solid #23262d; cursor: default;
  }
  .arow:hover { background: #23262d; }
  .arow .st { width: 18px; text-align: center; font-size: 9px; color: #5d6470; font-family: ui-monospace, Menlo, monospace; }
  .arow .gl { width: 16px; text-align: center; color: #fbbf24; }
  .arow .pt { color: #e5e7eb; }
  .arow .ms { margin-left: auto; font-size: 9.5px; color: #5d6470; font-family: ui-monospace, Menlo, monospace; }
  .armtag {
    font-size: 8.5px; font-weight: 700; padding: 1px 7px; border-radius: 10px; letter-spacing: .08em;
  }
  .armtag.A { background: #0c2d42; color: #7dd3fc; border: 1px solid #155e75; }
  .armtag.B { background: #3d0f24; color: #f9a8d4; border: 1px solid #9d174d; }
  .arow.jn { opacity: .75; }
  .arow.jn .pt { color: #8b919e; font-family: ui-monospace, Menlo, monospace; font-size: 10px; }
  .arow.jn .ty { font-size: 8.5px; color: #7dd3fc; border: 1px dashed #155e75; padding: 1px 6px; border-radius: 8px; }

  /* mass node */
  .massbar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; margin: 4px 0 8px; }
  .massbar div { height: 100%; }
  .mrow { display: flex; justify-content: space-between; font-size: 10.5px; padding: 2.5px 0; color: #9aa0ab; }
  .mrow .v { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #d4d8e0; }
  .mrow .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  /* log node */
  #n-log .lines { font-family: ui-monospace, Menlo, monospace; font-size: 10px; line-height: 1.8; color: #7d8490; }
  #n-log .lines div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #n-log .lines div:last-child { color: #6ee7b7; }
  #n-log .lines div:hover { color: #e5e7eb; }

  #minimap {
    position: absolute; right: 16px; bottom: 16px; width: 190px; height: 108px;
    background: #101216; border: 1px solid #2e323b; border-radius: 6px; z-index: 8;
    overflow: hidden; opacity: .9;
  }
  #minimap .mmn { position: absolute; border-radius: 2px; background: #3d434e; }
  #minimap .mmv { position: absolute; border: 1px solid #f59e0b; border-radius: 2px; }
  #minimap .mml { position: absolute; bottom: 4px; left: 7px; font-size: 8px; color: #5d6470; letter-spacing: .18em; }
</style>
</head>
<body>
  <div id="topbar">
    <div class="logo">INK<i>BENCH</i></div>
    <div class="crumb" id="crumb"></div>
    <div class="spacer"></div>
    <div class="tchip">PIPELINE · <b id="cStages"></b></div>
    <div class="tchip">VERIFY <b id="cTime"></b></div>
    <div class="tchip">ATTEMPT <b id="cAtt"></b></div>
    <div class="tchip ok" id="cPass"></div>
  </div>

  <div id="canvas">
    <svg id="wires"></svg>

    <div class="node" id="n-brief" style="left:34px;top:36px;width:300px">
      <div class="nhead"><span class="dot" style="background:#f59e0b"></span>BRIEF<span class="sub">input.txt</span></div>
      <div class="nbody">
        <textarea id="briefIn" spellcheck="false"></textarea>
        <button id="briefBtn">▸ Run pipeline</button>
      </div>
      <div class="port out" id="p-brief-out" style="top:52%"><span class="tip">prompt</span></div>
    </div>

    <div class="node" id="n-log" style="left:34px;top:280px;width:300px">
      <div class="nhead"><span class="dot" style="background:#6b7280"></span>AGENT LOG<span class="sub">stdout</span></div>
      <div class="nbody"><div class="lines" id="logLines"></div></div>
      <div class="port in" id="p-log-in" style="top:50%"><span class="tip">events</span></div>
    </div>

    <div class="node" id="n-meta" style="left:34px;top:586px;width:300px">
      <div class="nhead"><span class="dot" style="background:#8b5cf6"></span>FIGURE<span class="sub">meta</span></div>
      <div class="nbody"><div id="figMeta"></div></div>
    </div>

    <div class="node" id="n-spec" style="left:412px;top:30px;width:330px">
      <div class="nhead"><span class="dot" style="background:#7dd3fc"></span>SPEC · <span id="specName" style="margin-left:4px"></span><span class="sub" id="specSub"></span></div>
      <div class="nbody">
        <table class="kv"><tbody id="specRows"></tbody></table>
        <div class="jointrows" id="jointRows"></div>
      </div>
      <div class="port in" id="p-spec-in" style="top:50%"><span class="tip">brief</span></div>
      <div class="port out" id="p-spec-out" style="top:34%"><span class="tip">model</span></div>
      <div class="port out" id="p-spec-out2" style="top:78%"><span class="tip">measures</span></div>
    </div>

    <div class="node" id="n-mass" style="left:412px;top:560px;width:330px">
      <div class="nhead"><span class="dot" style="background:#34d399"></span>MASS BUDGET<span class="sub" id="massTotal"></span></div>
      <div class="nbody"><div class="massbar" id="massBar"></div><div id="massRows"></div></div>
      <div class="port in" id="p-mass-in" style="top:44%"><span class="tip">measures</span></div>
    </div>

    <div class="node" id="n-render" style="left:806px;top:24px;width:560px">
      <div class="nhead"><span class="dot" style="background:#f472b6"></span>BUILD · VIEWPORT<span class="sub" id="vpSub"></span></div>
      <div class="nbody">
        <div class="vptools">
          <button class="tb on" data-img="lamp_flat.png">Assembled</button>
          <button class="tb" data-img="lamp_exploded.png">Exploded</button>
          <span class="vpname">cam 35mm · toon shade</span>
        </div>
        <div class="vpimg">
          <div class="vpline" style="left:0;right:0;top:50%;height:1px"></div>
          <div class="vpline" style="top:0;bottom:0;left:50%;width:1px"></div>
          <img id="vpImg" src="lamp_flat.png" alt="render">
          <div class="vplabel" id="vpLabel"></div>
        </div>
      </div>
      <div class="port in" id="p-render-in" style="top:46%"><span class="tip">model</span></div>
      <div class="port out" id="p-render-out" style="top:46%"><span class="tip">mesh</span></div>
    </div>

    <div class="node" id="n-verify" style="left:1420px;top:24px;width:258px">
      <div class="nhead"><span class="dot" style="background:#6ee7b7"></span>VERIFY<span class="sub" id="vSub"></span></div>
      <div class="nbody">
        <div class="vbig"><div class="vb" id="vBadge"></div><div class="vm" id="vMeta"></div></div>
        <div id="checks"></div>
      </div>
      <div class="port in" id="p-verify-in" style="top:38%"><span class="tip">mesh</span></div>
      <div class="port out" id="p-verify-out" style="top:78%"><span class="tip">verdict</span></div>
    </div>

    <div class="node" id="n-arms" style="left:1390px;top:378px;width:288px">
      <div class="nhead"><span class="dot" style="background:#f9a8d4"></span>TWO-ARM PLAN<span class="sub" id="planSub"></span></div>
      <div class="nbody" id="planRows" style="padding:6px 10px"></div>
      <div class="port in" id="p-arms-in" style="top:34%"><span class="tip">verdict</span></div>
    </div>

    <div id="minimap"></div>
  </div>

<script src="data.js"></script>
<script>
(function(){
  const D = window.DATA, $ = s => document.querySelector(s);
  const fmtSize = s => Array.isArray(s) ? s.join('×') : ('⌀' + (s.r*2) + '×' + s.h);
  const massOf = id => { const m = D.measures.find(m=>m.id===id); return m ? m.massG : 0; };
  const partOf = id => D.spec.parts.find(p=>p.id===id);

  /* topbar */
  $('#crumb').innerHTML = 'pipeline &rsaquo; <b>' + D.spec.name.toLowerCase() + '</b> &rsaquo; fig ' + D.figures[0].figNum;
  $('#cStages').textContent = '6 NODES';
  $('#cTime').textContent = D.report.timingMs + 'ms';
  $('#cAtt').textContent = D.attempts;
  $('#cPass').textContent = D.report.pass ? '● PASS' : '● FAIL';
  if (!D.report.pass) { $('#cPass').classList.remove('ok'); $('#cPass').style.color='#fca5a5'; }

  /* brief */
  $('#briefIn').value = D.brief;
  $('#briefBtn').onclick = () => {
    const l = document.createElement('div');
    l.textContent = 'brief ▸ ' + $('#briefIn').value;
    $('#logLines').appendChild(l);
    const w = document.querySelector('path[data-e="e1"]');
    if (w) { w.classList.add('pulse'); setTimeout(()=>w.classList.remove('pulse'), 900); }
  };

  /* spec node */
  $('#specName').textContent = D.spec.name;
  $('#specSub').textContent = D.spec.units + ' · ' + D.spec.parts.length + 'p/' + D.spec.joints.length + 'j';
  $('#specRows').innerHTML = D.spec.parts.map(p =>
    '<tr><td class="id">' + p.id + '</td><td>' + p.shape + '</td><td class="num">' + fmtSize(p.size) +
    '</td><td>' + p.material + '</td></tr>').join('');
  $('#jointRows').innerHTML = D.spec.joints.map(j =>
    '<div><span class="ty">' + j.type + '</span> ' + j.a + '~' + j.b + ' @(' + j.anchor.join(',') + ')</div>').join('');

  /* mass node */
  const tot = D.measures.reduce((a,m)=>a+m.massG,0);
  $('#massTotal').textContent = (tot/1000).toFixed(2) + ' kg';
  $('#massBar').innerHTML = D.measures.map(m =>
    '<div style="width:' + (m.massG/tot*100) + '%;background:' + D.spec.materials[m.material].color + '" title="' + m.id + ' ' + m.massG.toFixed(0) + 'g"></div>').join('');
  $('#massRows').innerHTML = D.measures.map(m =>
    '<div class="mrow"><span><span class="sw" style="background:' + D.spec.materials[m.material].color + '"></span>' + m.id + ' · ' + m.material + '</span><span class="v">' + m.massG.toFixed(0) + 'g · ' + (m.volMM3/1000).toFixed(1) + 'cm³</span></div>').join('');

  /* figure meta node */
  const f = D.figures[0];
  $('#figMeta').innerHTML =
    '<div class="mrow"><span>figure</span><span class="v">#' + f.figNum + ' ' + f.name + '</span></div>' +
    '<div class="mrow"><span>tests</span><span class="v">clr≥' + D.spec.tests.min_clearance_mm + 'mm tip≤' + D.spec.tests.max_tip_angle_deg + '°</span></div>' +
    '<div class="mrow"><span>insert dir</span><span class="v">' + D.spec.assembly.map(a=>'(' + a.insert_from.join(',') + ')').join(' ') + '</span></div>' +
    '<div class="mrow"><span>order</span><span class="v">' + D.report.explodedOrder.join(' → ') + '</span></div>';

  /* render node */
  $('#vpSub').textContent = D.spec.parts.length + ' solids';
  $('#vpLabel').textContent = 'viewport ▸ ' + D.spec.name.toLowerCase() + ' · ' + D.spec.units;
  document.querySelectorAll('.vptools .tb').forEach(b => b.onclick = () => {
    document.querySelectorAll('.vptools .tb').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); $('#vpImg').src = b.dataset.img;
  });

  /* verify node */
  $('#vSub').textContent = D.report.timingMs + 'ms';
  $('#vBadge').textContent = D.report.pass ? 'PASS' : 'FAIL';
  if (!D.report.pass) { const b=$('#vBadge'); b.style.background='#3b0a0a'; b.style.borderColor='#dc2626'; b.style.color='#fca5a5'; }
  $('#vMeta').innerHTML = D.report.checks.length + ' checks · ' + D.report.failures.length + ' failures<br>attempt ' + D.attempts;
  $('#checks').innerHTML = D.report.checks.map(c =>
    '<div class="chk" title="' + c.detail.replace(/"/g,'&quot;') + '">' +
    '<span class="d' + (c.status==='pass'?'':' f') + '"></span><span class="n">' + c.name + '</span>' +
    '<span class="m">' + (c.measured ? c.measured.toFixed(2) : '—') + '</span></div>').join('');

  /* arms node */
  $('#planSub').textContent = D.plan.filter(s=>s.kind==='place').length + ' seats';
  $('#planRows').innerHTML = D.plan.map(s => {
    if (s.kind === 'place') return '<div class="arow" title="seat (' + s.seat.join(', ') + ')">' +
      '<span class="st">' + s.step + '</span><span class="gl">' + s.glyph + '</span>' +
      '<span class="pt">' + s.part + '</span><span class="armtag ' + s.arm + '">ARM ' + s.arm + '</span>' +
      '<span class="ms">' + s.massG.toFixed(0) + 'g</span></div>';
    return '<div class="arow jn" title="axis (' + s.axis.join(', ') + ') anchor (' + s.anchor.join(', ') + ')">' +
      '<span class="st">⚿</span><span class="ty">' + s.type + '</span>' +
      '<span class="pt">' + s.a + '~' + s.b + '</span></div>';
  }).join('');

  /* log node */
  $('#logLines').innerHTML = D.log.map(l => '<div>' + l + '</div>').join('');

  /* ---------- wires ---------- */
  const edges = [
    { id:'e1', from:'p-brief-out', to:'p-spec-in',   n:['n-brief','n-spec'] },
    { id:'e2', from:'p-spec-out',  to:'p-render-in', n:['n-spec','n-render'] },
    { id:'e3', from:'p-spec-out2', to:'p-mass-in',   n:['n-spec','n-mass'], dash:true },
    { id:'e4', from:'p-render-out',to:'p-verify-in', n:['n-render','n-verify'] },
    { id:'e5', from:'p-verify-out',to:'p-arms-in',   n:['n-verify','n-arms'] },
    { id:'e6', from:'p-brief-out', to:'p-log-in',    n:['n-brief','n-log'], dash:true }
  ];
  const svg = $('#wires'), cv = $('#canvas');
  function portC(id){
    const r = document.getElementById(id).getBoundingClientRect();
    const c = cv.getBoundingClientRect();
    return { x: r.left - c.left + r.width/2, y: r.top - c.top + r.height/2 };
  }
  function draw(){
    svg.innerHTML = '';
    edges.forEach(e => {
      const a = portC(e.from), b = portC(e.to);
      const dx = Math.max(60, Math.abs(b.x-a.x)*0.45);
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', 'M' + a.x + ',' + a.y + ' C' + (a.x+dx) + ',' + a.y + ' ' + (b.x-dx) + ',' + b.y + ' ' + b.x + ',' + b.y);
      p.dataset.e = e.id;
      if (e.dash) p.classList.add('dash');
      svg.appendChild(p);
    });
  }
  draw();
  edges.forEach(e => e.n.forEach(nid => {
    const n = document.getElementById(nid);
    n.addEventListener('mouseenter', () => { const p = svg.querySelector('path[data-e="'+e.id+'"]'); if(p) p.classList.add('hot'); });
    n.addEventListener('mouseleave', () => { const p = svg.querySelector('path[data-e="'+e.id+'"]'); if(p) p.classList.remove('hot'); });
  }));

  /* minimap */
  const mm = $('#minimap');
  let mhtml = '';
  document.querySelectorAll('.node').forEach(n => {
    const r = n.getBoundingClientRect(), c = cv.getBoundingClientRect();
    mhtml += '<div class="mmn" style="left:' + ((r.left-c.left)/c.width*190) + 'px;top:' + ((r.top-c.top)/c.height*108) +
      'px;width:' + (r.width/c.width*190) + 'px;height:' + (r.height/c.height*108) + 'px"></div>';
  });
  mhtml += '<div class="mmv" style="left:0;top:0;width:189px;height:107px"></div><div class="mml">MINIMAP</div>';
  mm.innerHTML = mhtml;
})();
</script>
</body>
</html>
