<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1700">
<title>INKBENCH — Desk lamp · dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f4; --tile:#ffffff; --line:#e3e5ea; --line2:#d5d8df;
  --txt:#17181d; --mut:#6d7280; --dim:#9aa0ac;
  --acc:#4f46e5; --acc-soft:#eeedfd; --acc-ink:#3f3ac2;
  --ok:#0e9f5d; --ok-soft:#e3f6ec;
  --amber:#d97706; --amber-soft:#fdf0dd;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);overflow:hidden;display:flex;flex-direction:column;
  font:13px/1.5 "Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
::selection{background:var(--acc-soft)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cfd3db;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- nav ---------- */
#nav{height:56px;flex:0 0 56px;background:var(--tile);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 20px}
.mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4f46e5,#7c3aed);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;letter-spacing:-.02em;
  box-shadow:0 2px 8px rgba(79,70,229,.35)}
.word{font-weight:700;font-size:14.5px;letter-spacing:-.02em}
.crumb{color:var(--dim);font-size:13px;display:flex;align-items:center;gap:7px}
.crumb b{color:var(--txt);font-weight:600}
.crumb .tag{font:600 10px var(--mono);background:#f1f2f5;border:1px solid var(--line);
  border-radius:5px;padding:2px 6px;color:var(--mut)}
#nav .r{margin-left:auto;display:flex;align-items:center;gap:12px}
.pillok{display:flex;align-items:center;gap:7px;height:30px;padding:0 13px;border-radius:99px;
  background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:12.5px}
.pillok .d{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(14,159,93,.18)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);
  display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:700}
.navbtn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);color:var(--mut);
  font-weight:500;transition:all .15s}
.navbtn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}

/* ---------- bento grid ---------- */
#grid{
  flex:1;display:grid;gap:14px;padding:16px 20px;min-height:0;
  grid-template-columns:repeat(12,1fr);
  grid-template-rows:118px 1fr 1fr 168px;
}
.tile{
  background:var(--tile);border:1px solid var(--line);border-radius:16px;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative;
  transition:box-shadow .2s,transform .2s,border-color .2s;
}
.tile:hover{box-shadow:0 10px 32px rgba(23,24,29,.09),0 2px 6px rgba(23,24,29,.05);
  transform:translateY(-1px);border-color:#dcdfe6}
.th{display:flex;align-items:center;gap:8px;padding:13px 16px 0}
.th .t{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.th .ic{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;flex:0 0 18px}
.th .x{margin-left:auto;font:500 10.5px var(--mono);color:var(--dim)}
.tb{flex:1;min-height:0;padding:10px 16px 14px;overflow:hidden}
.tb.scr{overflow-y:auto}

/* hero render */
.t-render{grid-column:1/5;grid-row:1/5}
#hero{flex:1;position:relative;display:grid;place-items:center;min-height:0;
  background:
    radial-gradient(600px 380px at 50% 38%,#f4f2ff 0%,transparent 70%),
    linear-gradient(#fafbff,#f5f6fa);}
#hero img{max-height:92%;max-width:88%;border-radius:10px;
  box-shadow:0 24px 60px rgba(50,44,140,.18),0 4px 14px rgba(50,44,140,.1)}
#hero .figno{position:absolute;top:14px;left:16px;font:700 10.5px var(--mono);
  color:var(--acc-ink);background:var(--acc-soft);border-radius:6px;padding:3px 8px}
#hero .viewsw{position:absolute;top:14px;right:16px;display:flex;gap:4px;background:#fff;
  border:1px solid var(--line);border-radius:8px;padding:3px}
#hero .viewsw button{font-size:10.5px;font-weight:600;color:var(--mut);padding:3px 9px;border-radius:6px}
#hero .viewsw button:hover{color:var(--txt)}
#hero .viewsw button.on{background:var(--acc);color:#fff}
#herofoot{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
#herofoot .n{flex:1;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#herofoot .chip{font:600 10px var(--mono);padding:3px 8px;border-radius:6px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.dim{background:#f1f2f5;color:var(--mut);border:1px solid var(--line)}
.chip.acc{background:var(--acc-soft);color:var(--acc-ink)}

/* brief */
.t-brief{grid-column:5/9;grid-row:1}
#briefrow{display:flex;gap:8px;margin-top:8px}
#brief{flex:1;height:38px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;
  font-size:12.5px;background:#fafbfd;transition:all .15s}
#brief::placeholder{color:var(--dim)}
#brief:focus{outline:none;border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px var(--acc-soft)}
#go{height:38px;padding:0 18px;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;
  box-shadow:0 3px 10px rgba(79,70,229,.3);transition:all .15s}
#go:hover{background:var(--acc-ink);transform:translateY(-1px);box-shadow:0 6px 14px rgba(79,70,229,.35)}
#go:active{transform:translateY(0)}
#go:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
#briefsub{font-size:10.5px;color:var(--dim);margin-top:7px;font-family:var(--mono)}

/* status */
.t-status{grid-column:9/13;grid-row:1;justify-content:center}
#verdict{display:flex;align-items:center;gap:12px;padding:4px 16px}
#verdict .big{font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--ok)}
#verdict .sub{font-size:11px;color:var(--mut);line-height:1.4}
#verdict .sub b{color:var(--txt);font-family:var(--mono);font-weight:600}
#vbar{height:5px;border-radius:3px;background:#f1f2f5;margin:9px 16px 0;overflow:hidden}
#vbar i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#0e9f5d);border-radius:3px}

/* metric tiles */
.t-mass{grid-column:5/7;grid-row:2}
.t-margin{grid-column:7/9;grid-row:2}
.metric-num{font-size:30px;font-weight:800;letter-spacing:-.04em;margin-top:4px}
.metric-num small{font-size:14px;font-weight:600;color:var(--mut);letter-spacing:0}
.metric-sub{font-size:11px;color:var(--mut);margin-top:2px}
.mbar{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-top:12px;background:#f1f2f5}
.mbar i{display:block;height:100%}
.mleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:10px;color:var(--mut)}
.mleg span{display:flex;align-items:center;gap:5px}
.mleg .sw{width:8px;height:8px;border-radius:2.5px}
.gauge{margin-top:12px}
.gtrack{height:7px;border-radius:4px;background:#f1f2f5;position:relative}
.gfill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;
  background:linear-gradient(90deg,#34d399,#0e9f5d)}
.gmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--amber)}
.glab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);margin-top:5px;font-family:var(--mono)}

/* checks */
.t-checks{grid-column:5/9;grid-row:3/5}
.ck{display:flex;gap:10px;padding:8px 6px;border-radius:10px;transition:background .12s;cursor:default}
.ck:hover{background:#f7f8fb}
.ck .ci{width:20px;height:20px;border-radius:50%;flex:0 0 20px;display:grid;place-items:center;
  font-size:11px;background:var(--ok-soft);color:var(--ok);margin-top:1px}
.ck .nm{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:8px}
.ck .nm .mv{font:500 10.5px var(--mono);color:var(--acc-ink);background:var(--acc-soft);border-radius:5px;padding:1px 6px}
.ck .dt{font-size:11px;color:var(--mut);line-height:1.45;margin-top:1px}
.ckf{display:flex;align-items:center;gap:8px;padding:9px 16px;border-top:1px solid var(--line);
  font-size:11px;color:var(--mut)}
.ckf b{color:var(--ok);font-family:var(--mono)}

/* spec */
.t-spec{grid-column:9/13;grid-row:3}
.srow{display:flex;align-items:center;gap:9px;padding:5px 4px;border-radius:8px;font-size:12px;transition:background .12s}
.srow:hover{background:#f7f8fb}
.srow .sw{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.srow .id{flex:1;font-weight:550;white-space:nowrap}
.srow .sh{color:var(--dim);font-size:11px}
.srow .sz{font:10.5px var(--mono);color:var(--mut)}

/* plan */
.t-plan{grid-column:9/13;grid-row:4}
.t-plan .tb{padding-top:6px}
.pl{display:flex;align-items:center;gap:8px;padding:4px 4px;border-radius:7px;font-size:11.5px;
  white-space:nowrap;transition:background .12s}
.pl:hover{background:#f7f8fb}
.pl .n{font:600 9.5px var(--mono);color:var(--dim);width:16px;flex:0 0 16px}
.pl .p{flex:1;overflow:hidden;text-overflow:ellipsis}
.pl .p small{color:var(--dim)}
.pl.joint .p{color:var(--mut);font-size:10.5px}
.armchip{font:700 9px var(--mono);padding:2px 6px;border-radius:5px;flex:0 0 auto}
.armchip.a{background:var(--acc-soft);color:var(--acc-ink)}
.armchip.b{background:#fdf0fa;color:#a21caf}
.armchip.ab{background:var(--amber-soft);color:var(--amber)}
.jtag{font:500 9px var(--mono);color:var(--dim);border:1px dashed var(--line2);border-radius:4px;padding:1px 5px}

/* log */
.t-log{grid-column:5/9;grid-row:5}
#loglines{font:11px/1.65 var(--mono);color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
#loglines div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#loglines .g{color:var(--ok)}
#loglines .c{color:var(--acc-ink)}
#loglines .y{color:var(--amber)}
#loglines .ts{color:var(--dim)}
</style>
</head>
<body>

<nav id="nav">
  <div class="mark">IK</div>
  <span class="word">inkbench</span>
  <span class="crumb">/ workspace <span style="color:var(--line2)">›</span>
    <span class="tag" id="figno"></span> <b id="figname"></b></span>
  <div class="r">
    <span class="pillok" id="pill"></span>
    <button class="navbtn">Share</button>
    <div class="av">DV</div>
  </div>
</nav>

<div id="grid">
  <!-- hero -->
  <section class="tile t-render">
    <div id="hero">
      <span class="figno" id="herono"></span>
      <div class="viewsw"><button class="on" data-img="lamp_flat.png">Assembled</button><button data-img="lamp_exploded.png">Exploded</button></div>
      <img src="lamp_flat.png" alt="render of desk lamp" id="heroimg">
    </div>
    <div id="herofoot">
      <span class="n" id="heroname"></span>
      <span class="chip acc" id="footparts"></span>
      <span class="chip dim" id="footunits"></span>
    </div>
  </section>

  <!-- brief -->
  <section class="tile t-brief">
    <div class="th"><span class="ic" style="background:var(--acc-soft);color:var(--acc-ink)">✎</span>
      <span class="t">Design brief</span><span class="x">⌘↵ to submit</span></div>
    <div class="tb">
      <div id="briefrow">
        <input id="brief" spellcheck="false" placeholder="Describe a mechanism to design, verify, and build…">
        <button id="go">Generate</button>
      </div>
      <div id="briefsub">inkbench · llm → spec → verify → arm plan</div>
    </div>
  </section>

  <!-- status -->
  <section class="tile t-status">
    <div class="th"><span class="ic" style="background:var(--ok-soft);color:var(--ok)">✓</span>
      <span class="t">Verification</span><span class="x" id="vtime"></span></div>
    <div class="tb" style="padding-top:4px">
      <div id="verdict"></div>
      <div id="vbar"><i id="vfill"></i></div>
    </div>
  </section>

  <!-- mass -->
  <section class="tile t-mass">
    <div class="th"><span class="ic" style="background:var(--acc-soft);color:var(--acc-ink)">◆</span>
      <span class="t">Total mass</span><span class="x">Σ parts</span></div>
    <div class="tb">
      <div class="metric-num" id="massnum"></div>
      <div class="metric-sub" id="masssub"></div>
      <div class="mbar" id="massbar"></div>
      <div class="mleg" id="massleg"></div>
    </div>
  </section>

  <!-- tip margin -->
  <section class="tile t-margin">
    <div class="th"><span class="ic" style="background:var(--amber-soft);color:var(--amber)">↥</span>
      <span class="t">Tip-over margin</span><span class="x">stability</span></div>
    <div class="tb">
      <div class="metric-num" id="marginnum"></div>
      <div class="metric-sub">distance from CoM ray to support hull</div>
      <div class="gauge">
        <div class="gtrack"><div class="gfill" id="gfill"></div><div class="gmark" id="gmark"></div></div>
        <div class="glab"><span>0</span><span>base radius ≈ 80 mm</span><span>160</span></div>
      </div>
    </div>
  </section>

  <!-- checks -->
  <section class="tile t-checks">
    <div class="th"><span class="ic" style="background:var(--ok-soft);color:var(--ok)">☰</span>
      <span class="t">Geometric checks</span><span class="x" id="ckx"></span></div>
    <div class="tb scr" id="checks"></div>
    <div class="ckf" id="ckf"></div>
  </section>

  <!-- spec -->
  <section class="tile t-spec">
    <div class="th"><span class="ic" style="background:var(--acc-soft);color:var(--acc-ink)">⬡</span>
      <span class="t">Spec · parts</span><span class="x" id="specx"></span></div>
    <div class="tb scr" id="spec" style="padding-top:4px"></div>
  </section>

  <!-- plan -->
  <section class="tile t-plan">
    <div class="th"><span class="ic" style="background:var(--acc-soft);color:var(--acc-ink)">⚒</span>
      <span class="t">Arm plan</span><span class="x" id="planx"></span></div>
    <div class="tb scr" id="plan" style="padding-top:2px"></div>
  </section>

  <!-- log -->
  <section class="tile t-log">
    <div class="th"><span class="ic" style="background:#f1f2f5;color:var(--mut)">▸</span>
      <span class="t">Agent log</span><span class="x">live</span></div>
    <div class="tb"><div id="loglines"></div></div>
  </section>
</div>

<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const checks=D.report.checks,passed=checks.filter(c=>c.status==='pass').length;
const fig=D.figures[0];
const totalMass=D.measures.reduce((s,m)=>s+m.massG,0);
const kg=g=>g>=1000?(g/1000).toFixed(2):g.toFixed(0);
const stab=checks.find(c=>c.name==='stability');
const margin=stab?+stab.measured:0;

/* nav */
$('#figno').textContent='FIG-'+fig.figNum;
$('#figname').textContent=fig.name;
$('#pill').innerHTML='<span class="d"></span>'+(D.report.pass?'Verified':'Failed');
$('#herono').textContent='FIG-'+fig.figNum+' · '+D.spec.units;
$('#heroname').textContent=fig.name+' — toon render';
$('#footparts').textContent=fig.parts+' parts · '+fig.joints+' joints';
$('#footunits').textContent='attempt '+fig.attempts;

/* status tile */
$('#vtime').textContent='eval '+D.report.timingMs.toFixed(1)+'ms';
$('#verdict').innerHTML=`<div class="big">${D.report.pass?'PASS':'FAIL'}</div>
  <div class="sub"><b>${passed}/${checks.length}</b> checks passed<br>in <b>${D.report.timingMs.toFixed(1)} ms</b> · attempt ${D.attempts}</div>`;
$('#vfill').style.width=(passed/checks.length*100)+'%';

/* mass */
$('#massnum').innerHTML=kg(totalMass)+' <small>kg</small>';
$('#masssub').textContent=D.measures.length+' parts · heaviest: '+D.measures.reduce((a,b)=>a.massG>b.massG?a:b).id;
const pal=['#4f46e5','#818cf8','#a5b4fc','#c7d2fe','#ddd6fe'];
$('#massbar').innerHTML=D.measures.map((m,i)=>
  `<i style="width:${(m.massG/totalMass*100).toFixed(1)}%;background:${pal[i%pal.length]}" title="${esc(m.id)} ${kg(m.massG)}g"></i>`).join('');
$('#massleg').innerHTML=D.measures.map((m,i)=>
  `<span><span class="sw" style="background:${pal[i%pal.length]}"></span>${esc(m.id)} ${m.massG>=1000?(m.massG/1000).toFixed(2)+'kg':Math.round(m.massG)+'g'}</span>`).join('');

/* margin gauge */
$('#marginnum').innerHTML=margin.toFixed(1)+' <small>mm</small>';
$('#gfill').style.width=Math.min(100,margin/160*100)+'%';
$('#gmark').style.left=Math.min(100,D.spec.tests.min_clearance_mm/160*100+50)+'%';

/* checks */
$('#ckx').textContent=passed+'/'+checks.length+' passing';
$('#checks').innerHTML=checks.map(c=>`
  <div class="ck"><span class="ci">${c.status==='pass'?'✓':'✗'}</span>
    <div><div class="nm">${esc(c.name)} ${c.measured?`<span class="mv">${(+c.measured).toFixed(2)}</span>`:''}</div>
    <div class="dt">${esc(c.detail)}</div></div></div>`).join('');
$('#ckf').innerHTML=`<b>${D.report.pass?'PASS':'FAIL'}</b> · all geometry verified · thresholds: clearance ≥${D.spec.tests.min_clearance_mm}mm, tip ≤${D.spec.tests.max_tip_angle_deg}°`;

/* spec */
const sizeOf=p=>Array.isArray(p.size)?p.size.join('×'):'r'+p.size.r+' h'+p.size.h;
$('#specx').textContent=D.spec.parts.length+' parts · '+D.spec.joints.length+' joints';
$('#spec').innerHTML=D.spec.parts.map(p=>{
  const col=(D.spec.materials[p.material]||{}).color||'#999';
  return `<div class="srow"><span class="sw" style="background:${col}"></span>
    <span class="id">${esc(p.id)}</span><span class="sh">${esc(p.shape)}</span>
    <span class="sz">${sizeOf(p)}</span></div>`;
}).join('')+D.spec.joints.map(j=>`
  <div class="srow"><span class="sw" style="background:#e8e9ee;border:1px solid var(--line2)"></span>
    <span class="id" style="font-weight:450;color:var(--mut)">${esc(j.a)} ↔ ${esc(j.b)}</span>
    <span class="sh">${esc(j.type)}</span><span class="sz">rev</span></div>`).join('');

/* plan */
$('#planx').textContent=D.plan.filter(o=>o.kind==='place').length+' places';
$('#plan').innerHTML=D.plan.map(op=>op.kind==='place'?`
  <div class="pl"><span class="n">${String(op.step).padStart(2,'0')}</span>
    <span class="p">${op.glyph} ${esc(op.part)} <small>${Math.round(op.massG)}g</small></span>
    <span class="armchip ${op.arm==='A'?'a':op.arm==='B'?'b':'ab'}">${op.arm}</span></div>`:`
  <div class="pl joint"><span class="n">·</span>
    <span class="p">${esc(op.a)} ↔ ${esc(op.b)}</span>
    <span class="jtag">${esc(op.type)}</span></div>`).join('');

/* log */
const logEl=$('#loglines');
function logLine(t,cls){
  const d=document.createElement('div');if(cls)d.className=cls;
  d.innerHTML='<span class="ts">'+new Date().toTimeString().slice(0,8)+' </span>'+esc(t);
  logEl.appendChild(d);
}
D.log.slice(-5).forEach(l=>{
  let cls='';if(/pass|✓|verified/i.test(l))cls='g';else if(/▸/.test(l))cls='c';else if(/…/.test(l))cls='y';
  logLine(l,cls);
});

/* brief */
const brief=$('#brief'),go=$('#go');brief.value=D.brief;
function submit(){
  const v=brief.value.trim();if(!v)return;
  go.disabled=true;go.textContent='Queued…';
  logLine('brief ▸ '+v,'c');logLine('designing…','y');
  setTimeout(()=>{go.disabled=false;go.textContent='Generate'},1100);
}
go.addEventListener('click',submit);
brief.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});

/* view switch */
document.querySelectorAll('#hero .viewsw button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#hero .viewsw button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');$('#heroimg').src=b.dataset.img;
}));
</script>
</body>
</html>
