<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Exploded X-Ray</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1700px; height: 900px; overflow: hidden; }
  body {
    background: #060a10; color: #c9d2dd;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 12px; display: flex; flex-direction: column;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }

  /* ---------- top bar ---------- */
  #bar {
    height: 52px; flex: none; display: flex; align-items: center; gap: 16px;
    padding: 0 20px; background: linear-gradient(#0b1017, #080c12);
    border-bottom: 1px solid #16202c;
  }
  #bar .logo { font-size: 15px; font-weight: 800; letter-spacing: .12em; color: #eef2f7; }
  #bar .logo i { color: #fb923c; font-style: normal; }
  #bar .mode { font-size: 9px; letter-spacing: .3em; color: #fb923c; border: 1px solid #7c3f16; padding: 3px 9px; border-radius: 3px; }
  #briefwrap { flex: 1; display: flex; gap: 8px; max-width: 720px; margin: 0 auto; }
  #briefwrap input {
    flex: 1; background: #0d141d; border: 1px solid #22303f; border-radius: 4px;
    color: #e6edf4; font-size: 12px; padding: 8px 12px; outline: none; font-family: inherit;
  }
  #briefwrap input:focus { border-color: #fb923c; box-shadow: 0 0 0 1px #7c3f16; }
  #briefwrap button {
    background: #c2410c; border: none; color: #fff; font-size: 11px; letter-spacing: .14em;
    padding: 0 18px; border-radius: 4px; cursor: pointer; font-family: inherit; text-transform: uppercase;
  }
  #briefwrap button:hover { background: #ea580c; }
  #barStatus { font-size: 10px; letter-spacing: .18em; color: #6ee7b7; }

  /* ---------- middle split ---------- */
  #mid { flex: 1; display: flex; min-height: 0; }

  .rail {
    width: 252px; flex: none; background: #090e15; overflow: hidden auto;
    display: flex; flex-direction: column; z-index: 4;
  }
  .rail::-webkit-scrollbar { width: 6px; } .rail::-webkit-scrollbar-thumb { background: #1e2937; }
  #railL { border-right: 1px solid #16202c; }
  #railR { border-left: 1px solid #16202c; }
  .rsec { padding: 13px 15px; border-bottom: 1px solid #121a24; }
  .rsec h5 {
    font-size: 9px; letter-spacing: .26em; color: #fb923c; text-transform: uppercase;
    font-weight: 700; margin-bottom: 9px; display: flex; justify-content: space-between;
  }
  .rsec h5 .dim { color: #4b5a6b; letter-spacing: .1em; }
  .krow { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; padding: 3.5px 0; color: #93a1b3; }
  .krow .v { color: #e6edf4; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; text-align: right; }
  .matrow { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 4px 0; color: #b6c2cf; }
  .matrow:hover { background: #0e141d; }
  .matrow .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(255,255,255,.25); }
  .matrow .dn { margin-left: auto; font-size: 9.5px; color: #5c6b7c; font-family: ui-monospace, Menlo, monospace; }
  .chk {
    padding: 6px 0; border-bottom: 1px dashed #16202c; cursor: default;
  }
  .chk:hover { background: #0e141d; }
  .chk .l1 { display: flex; align-items: center; gap: 7px; font-size: 11px; }
  .chk .d { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 7px rgba(52,211,153,.7); }
  .chk .d.f { background: #f87171; box-shadow: 0 0 7px rgba(248,113,113,.7); }
  .chk .n { color: #dbe4ee; text-transform: capitalize; }
  .chk .m { margin-left: auto; font-size: 9px; color: #5c6b7c; font-family: ui-monospace, Menlo, monospace; }
  .chk .dt { font-size: 9px; color: #4b5a6b; margin-top: 3px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #logLines { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; line-height: 1.8; color: #5c6b7c; }
  #logLines div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #logLines div:last-child { color: #6ee7b7; }
  #logLines div:hover { color: #dbe4ee; }
  .verdict {
    display: flex; align-items: center; gap: 10px;
  }
  .verdict .vb {
    font-size: 18px; font-weight: 800; letter-spacing: .22em; padding: 5px 16px;
    border-radius: 4px; border: 1px solid #059669; color: #6ee7b7; background: rgba(5,150,105,.1);
  }
  .verdict .vm { font-size: 9.5px; color: #5c6b7c; line-height: 1.6; }

  /* ---------- hero stage ---------- */
  #stage { flex: 1; position: relative; overflow: hidden; min-width: 0; }
  #stage .halo {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 820px; height: 820px;
    background: radial-gradient(circle, rgba(251,146,60,.09), rgba(251,146,60,.03) 45%, transparent 68%);
  }
  #stage .vgrid {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(rgba(140,170,200,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140,170,200,.05) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  #hero {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    height: 810px; filter: drop-shadow(0 0 44px rgba(251,146,60,.14));
  }
  #axisLine {
    position: absolute; left: 50%; top: 26px; bottom: 26px; width: 0;
    border-left: 1px dashed rgba(251,146,60,.4); pointer-events: none;
  }
  #axisLine::after {
    content: "▼"; position: absolute; bottom: -4px; left: -6px; color: #fb923c; font-size: 10px;
  }
  #axisTag {
    position: absolute; left: calc(50% + 10px); top: 30px; font-size: 9px;
    letter-spacing: .16em; color: rgba(251,146,60,.75); font-family: ui-monospace, Menlo, monospace;
    writing-mode: vertical-rl;
  }
  #leadSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #leadSvg line { stroke: #3d4c5e; stroke-width: 1.2; }
  #leadSvg line.hot { stroke: #fb923c; }
  #leadSvg circle { fill: #fb923c; }
  #leadSvg text { fill: #4b5a6b; font-size: 9px; font-family: ui-monospace, Menlo, monospace; }

  .callout {
    position: absolute; width: 205px; background: rgba(10,17,25,.86);
    border: 1px solid #1f2d3d; border-left: 3px solid #fb923c;
    backdrop-filter: blur(4px); padding: 8px 11px; z-index: 5;
    transition: border-color .15s, background .15s;
  }
  .callout:hover { border-color: #fb923c; background: rgba(16,26,37,.95); }
  .callout .c1 { display: flex; align-items: baseline; gap: 7px; }
  .callout .num {
    font-size: 9px; color: #0b1017; background: #fb923c; font-weight: 800;
    padding: 1px 6px; border-radius: 2px; font-family: ui-monospace, Menlo, monospace;
  }
  .callout .pn { font-size: 12.5px; font-weight: 700; color: #f2f6fa; letter-spacing: .04em; }
  .callout .pg { font-size: 9px; color: #5c6b7c; margin-left: auto; font-family: ui-monospace, Menlo, monospace; }
  .callout .c2 { font-size: 9.5px; color: #93a1b3; margin-top: 4px; line-height: 1.55; }
  .callout .c2 .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; vertical-align: -1px; margin: 0 3px 0 0; }
  .callout .c3 { font-size: 8.5px; color: #4b5a6b; font-family: ui-monospace, Menlo, monospace; margin-top: 3px; }

  /* ---------- bottom plan strip ---------- */
  #planbar {
    height: 86px; flex: none; background: #090e15; border-top: 1px solid #16202c;
    display: flex; align-items: center; padding: 0 18px; gap: 10px; overflow: hidden;
  }
  #planbar .ph { font-size: 9px; letter-spacing: .26em; color: #fb923c; text-transform: uppercase; flex: none; margin-right: 8px; }
  .pchip {
    display: flex; align-items: center; gap: 8px; background: #0d141d;
    border: 1px solid #1f2d3d; border-radius: 4px; padding: 8px 12px; flex: none;
    cursor: default; transition: border-color .15s;
  }
  .pchip:hover { border-color: #fb923c; }
  .pchip .sn {
    width: 20px; height: 20px; border-radius: 50%; background: #1a2635; color: #fb923c;
    font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, Menlo, monospace;
  }
  .pchip .pt { font-size: 11.5px; color: #e6edf4; font-weight: 600; }
  .pchip .pm { font-size: 9px; color: #5c6b7c; font-family: ui-monospace, Menlo, monospace; }
  .pchip .at { font-size: 8.5px; font-weight: 800; padding: 2px 7px; border-radius: 9px; }
  .at.A { background: #0c2d42; color: #7dd3fc; } .at.B { background: #3d0f24; color: #f9a8d4; }
  .pchip.j { border-style: dashed; opacity: .8; }
  .pchip.j .pt { font-size: 9.5px; font-weight: 400; font-family: ui-monospace, Menlo, monospace; color: #8fa0b5; }
  .parrow { color: #2c3e52; font-size: 14px; flex: none; }
  #planmeta { margin-left: auto; font-size: 9.5px; color: #5c6b7c; text-align: right; line-height: 1.6; flex: none; }
  #planmeta b { color: #6ee7b7; letter-spacing: .14em; }
</style>
</head>
<body>
  <div id="bar">
    <div class="logo">INK<i>BENCH</i></div>
    <div class="mode">EXPLODED · X-RAY</div>
    <div id="briefwrap">
      <input id="briefIn" spellcheck="false">
      <button id="briefBtn">Submit ▸</button>
    </div>
    <div id="barStatus"></div>
  </div>

  <div id="mid">
    <div class="rail" id="railL">
      <div class="rsec"><h5>Spec <span class="dim" id="specDim"></span></h5><div id="specKv"></div></div>
      <div class="rsec"><h5>Materials <span class="dim" id="matCnt"></span></h5><div id="matRows"></div></div>
      <div class="rsec" style="flex:1"><h5>Explode Order <span class="dim">axis</span></h5><div id="expOrder"></div></div>
    </div>

    <div id="stage">
      <div class="vgrid"></div>
      <div class="halo"></div>
      <img id="hero" src="lamp_exploded.png" alt="exploded render">
      <div id="axisLine"></div>
      <div id="axisTag"></div>
      <svg id="leadSvg"></svg>
      <!-- callouts injected -->
    </div>

    <div class="rail" id="railR">
      <div class="rsec"><h5>Geometric Verify <span class="dim" id="vTime"></span></h5>
        <div class="verdict"><div class="vb" id="vBadge"></div><div class="vm" id="vMeta"></div></div>
      </div>
      <div class="rsec"><h5>Checks <span class="dim" id="chkCnt"></span></h5><div id="checks"></div></div>
      <div class="rsec" style="flex:1"><h5>Agent Log <span class="dim">tty</span></h5><div id="logLines"></div></div>
    </div>
  </div>

  <div id="planbar">
    <div class="ph">Build<br>Plan</div>
    <div id="planChips" style="display:flex;gap:8px;align-items:center"></div>
    <div id="planmeta"></div>
  </div>

<script src="data.js"></script>
<script>
(function(){
  const D = window.DATA, $ = s => document.querySelector(s);
  const fmtSize = s => Array.isArray(s) ? s.join('×') : ('⌀' + (s.r*2) + '×' + s.h);
  const massOf = id => { const m = D.measures.find(m=>m.id===id); return m ? m.massG : 0; };

  /* bar */
  $('#briefIn').value = D.brief;
  $('#barStatus').textContent = D.report.pass ? '● VERIFIED · ' + D.report.timingMs + 'ms' : '● FAILED';
  $('#briefBtn').onclick = () => {
    const l = document.createElement('div');
    l.textContent = 'brief ▸ ' + $('#briefIn').value;
    $('#logLines').appendChild(l); l.scrollIntoView();
  };

  /* left rail: spec */
  $('#specDim').textContent = D.spec.units;
  $('#specKv').innerHTML =
    '<div class="krow"><span>name</span><span class="v">' + D.spec.name + '</span></div>' +
    '<div class="krow"><span>parts</span><span class="v">' + D.spec.parts.length + '</span></div>' +
    '<div class="krow"><span>joints</span><span class="v">' + D.spec.joints.length + ' (' + D.spec.joints.filter(j=>j.type==='revolute').length + ' rev)</span></div>' +
    '<div class="krow"><span>min clearance</span><span class="v">' + D.spec.tests.min_clearance_mm + ' mm</span></div>' +
    '<div class="krow"><span>max tip</span><span class="v">' + D.spec.tests.max_tip_angle_deg + '°</span></div>' +
    '<div class="krow"><span>insert dir</span><span class="v">(' + D.spec.assembly[0].insert_from.join(',') + ')</span></div>';
  $('#matCnt').textContent = Object.keys(D.spec.materials).length + ' mats';
  $('#matRows').innerHTML = Object.entries(D.spec.materials).map(([k,m]) =>
    '<div class="matrow"><span class="sw" style="background:' + m.color + '"></span>' + k +
    '<span class="dn">' + m.density + ' kg/m³</span></div>').join('');
  $('#expOrder').innerHTML = D.report.explodedOrder.map((p,i) =>
    '<div class="krow"><span><b style="color:#fb923c;font-family:ui-monospace,Menlo,monospace">' + (i+1) + '</b>&nbsp;&nbsp;' + p + '</span><span class="v">' + massOf(p).toFixed(0) + 'g</span></div>').join('');

  /* right rail */
  $('#vTime').textContent = D.report.timingMs + 'ms';
  $('#vBadge').textContent = D.report.pass ? 'PASS' : 'FAIL';
  if (!D.report.pass) { const b=$('#vBadge'); b.style.borderColor='#dc2626'; b.style.color='#fca5a5'; b.style.background='rgba(220,38,38,.1)'; }
  $('#vMeta').innerHTML = D.report.checks.length + ' checks<br>' + D.report.failures.length + ' failures · attempt ' + D.attempts;
  $('#chkCnt').textContent = D.report.checks.length;
  $('#checks').innerHTML = D.report.checks.map(c =>
    '<div class="chk"><div class="l1"><span class="d' + (c.status==='pass'?'':' f') + '"></span>' +
    '<span class="n">' + c.name + '</span><span class="m">' + (c.measured ? c.measured.toFixed(2) : '—') + '</span></div>' +
    '<div class="dt">' + c.detail + '</div></div>').join('');
  $('#logLines').innerHTML = D.log.map(l => '<div>' + l + '</div>').join('');

  /* stage: axis tag */
  $('#axisTag').textContent = 'insert_from (' + D.spec.assembly[0].insert_from.join(', ') + ') · explode axis';

  /* ---------- callouts ----------
     exploded image is a vertical stack; anchor fractions measured on the render:
     shade ~0.12, upper_arm ~0.32, lower_arm ~0.50, post ~0.68, base ~0.86  */
  const stage = $('#stage'), svg = $('#leadSvg');
  const order = D.report.explodedOrder;
  const anchors = { shade: .12, upper_arm: .33, lower_arm: .50, post: .67, base: .87 };
  const sideOf   = { shade: 'L', upper_arm: 'R', lower_arm: 'L', post: 'R', base: 'L' };
  const coEls = [];

  function layout(){
    svg.innerHTML = '';
    coEls.forEach(el => el.remove());
    const sr = stage.getBoundingClientRect();
    const img = $('#hero').getBoundingClientRect();
    const cx = img.left - sr.left + img.width/2;
    const top = img.top - sr.top;
    const jointsByPart = {};
    D.spec.joints.forEach(j => { jointsByPart[j.b] = j; });

    order.forEach(pid => {
      const p = D.spec.parts.find(x=>x.id===pid);
      const m = D.measures.find(x=>x.id===pid);
      const side = sideOf[pid];
      const ay = top + img.height * anchors[pid];
      const ax = cx + (side==='L' ? -1 : 1) * img.width * .30;
      const cardX = side==='L' ? cx - img.width*.30 - 235 : cx + img.width*.30 + 30;
      const cardY = Math.min(Math.max(ay - 38, 10), sr.height - 110);

      const el = document.createElement('div');
      el.className = 'callout';
      el.style.left = cardX + 'px'; el.style.top = cardY + 'px';
      const j = jointsByPart[pid];
      el.innerHTML =
        '<div class="c1"><span class="num">' + (order.indexOf(pid)+1) + '</span>' +
        '<span class="pn">' + pid + '</span><span class="pg">' + p.shape + '</span></div>' +
        '<div class="c2"><span class="sw" style="background:' + D.spec.materials[p.material].color + '"></span>' +
        p.material + ' · ' + fmtSize(p.size) + ' ' + D.spec.units + '</div>' +
        '<div class="c3">' + m.massG.toFixed(0) + 'g · pos(' + p.position.join(',') + ')' +
        (j ? ' · ' + j.type + ' joint' : ' · root') + '</div>';
      stage.appendChild(el); coEls.push(el);

      const ns = 'http://www.w3.org/2000/svg';
      const edgeX = side==='L' ? cardX + 205 : cardX;
      const elbowX = ax + (side==='L' ? -46 : 46);
      const l1 = document.createElementNS(ns,'line');
      l1.setAttribute('x1', edgeX); l1.setAttribute('y1', cardY + 30);
      l1.setAttribute('x2', elbowX); l1.setAttribute('y2', cardY + 30);
      const l2 = document.createElementNS(ns,'line');
      l2.setAttribute('x1', elbowX); l2.setAttribute('y1', cardY + 30);
      l2.setAttribute('x2', ax); l2.setAttribute('y2', ay);
      const dot = document.createElementNS(ns,'circle');
      dot.setAttribute('cx', ax); dot.setAttribute('cy', ay); dot.setAttribute('r', 3.5);
      svg.appendChild(l1); svg.appendChild(l2); svg.appendChild(dot);
      el.addEventListener('mouseenter', () => { l1.classList.add('hot'); l2.classList.add('hot'); });
      el.addEventListener('mouseleave', () => { l1.classList.remove('hot'); l2.classList.remove('hot'); });
    });
  }
  /* wait for image to have size */
  const hero = $('#hero');
  if (hero.complete) layout(); else hero.onload = layout;
  /* image may already be laid out via css height — layout anyway */
  setTimeout(layout, 60);

  /* bottom plan */
  const chips = [];
  D.plan.forEach((s, i) => {
    if (s.kind === 'place') chips.push(
      '<div class="pchip" title="seat (' + s.seat.join(',') + ')"><span class="sn">' + s.step + '</span>' +
      '<span><div class="pt">' + s.part + '</div><div class="pm">' + s.glyph + ' ' + s.massG.toFixed(0) + 'g</div></span>' +
      '<span class="at ' + s.arm + '">' + s.arm + '</span></div>');
    else chips.push(
      '<div class="pchip j" title="@(' + s.anchor.join(',') + ') axis (' + s.axis.join(',') + ')">' +
      '<span><div class="pt">⚿ ' + s.type + '</div><div class="pm">' + s.a + '~' + s.b + '</div></span></div>');
  });
  $('#planChips').innerHTML = chips.join('<span class="parrow">›</span>');
  const places = D.plan.filter(s=>s.kind==='place').length;
  $('#planmeta').innerHTML = places + ' placements · ' + (D.plan.length - places) + ' joint ops<br>' +
    'arms <b>A</b>+<b>B</b> · ' + D.figures[0].name.toLowerCase();
})();
</script>
</body>
</html>
