<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Konstruktion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#cfc8b6}
  body{font-family:"Archivo","Helvetica Neue",Arial,sans-serif;color:#141210}
  #stage{position:absolute;left:50%;top:50%;width:1700px;height:900px;transform:translate(-50%,-50%);
    background:#efe7d3;overflow:hidden}
  /* diagonal black band */
  .diag{position:absolute;left:-160px;top:340px;width:2060px;height:170px;background:#141210;transform:rotate(-10.5deg);z-index:3;
    display:flex;align-items:center;padding:0 220px 0 340px;gap:26px}
  .diag .sq{width:74px;height:74px;background:#d01f1f;flex:none;display:flex;align-items:center;justify-content:center;
    color:#efe7d3;font-weight:900;font-size:30px}
  .diag .brief{color:#efe7d3;font-size:30px;font-weight:700;font-style:italic;letter-spacing:.5px;flex:1;line-height:1.15;min-width:0}
  .diag button{background:#d01f1f;color:#efe7d3;border:0;font:inherit;font-weight:900;font-size:17px;letter-spacing:3px;
    padding:16px 30px;cursor:pointer;flex:none;transition:.15s}
  .diag button:hover{background:#efe7d3;color:#d01f1f}
  /* circle render */
  .circ{position:absolute;left:96px;top:150px;width:500px;height:500px;border-radius:50%;overflow:hidden;
    border:16px solid #d01f1f;z-index:4;background:#efe7d3}
  .circ img{width:100%;height:100%;object-fit:cover;filter:contrast(1.08) saturate(.9)}
  .halfcirc{position:absolute;left:96px;top:664px;width:150px;height:60px;background:#141210;
    border-radius:0 0 150px 150px;z-index:2}
  .redbar{position:absolute;left:270px;top:700px;width:330px;height:14px;background:#d01f1f}
  /* masthead */
  .mast{position:absolute;left:660px;top:64px;z-index:5}
  .mast h1{font-size:96px;font-weight:900;letter-spacing:-3px;line-height:.9}
  .mast .sub{font-size:13px;font-weight:700;letter-spacing:9px;margin-top:10px;color:#d01f1f}
  .mast .obj{position:absolute;right:-330px;top:6px;text-align:right}
  .mast .obj .nm{font-size:42px;font-weight:900;color:#d01f1f;text-transform:uppercase;letter-spacing:1px;line-height:1}
  .mast .obj .mt{font-size:11px;font-weight:700;letter-spacing:4px;margin-top:8px}
  .tri{position:absolute;right:0;top:0;width:0;height:0;border-top:120px solid #141210;border-left:120px solid transparent;z-index:1}
  /* right data column */
  .col{position:absolute;right:60px;top:200px;width:452px;z-index:5}
  .blk{margin-bottom:18px}
  .blk .hd{background:#141210;color:#efe7d3;font-weight:900;font-size:13px;letter-spacing:5px;padding:8px 14px}
  .blk .hd.red{background:#d01f1f}
  .blk .bd{border:2px solid #141210;border-top:0;background:#efe7d3}
  .srow{display:grid;grid-template-columns:22px 1fr 150px 70px;gap:8px;font-size:12px;font-weight:700;
    padding:6px 12px;border-bottom:1px solid #141210;align-items:baseline}
  .srow:last-child{border-bottom:0}
  .srow .ix{color:#d01f1f;font-size:11px}
  .srow .dm{font-weight:500;font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
  .srow .ms{text-align:right;font-variant-numeric:tabular-nums}
  .srow:hover{background:rgba(208,31,31,.08)}
  .crow{display:flex;gap:10px;align-items:baseline;padding:6px 12px;border-bottom:1px solid #141210;font-size:12px}
  .crow:last-child{border-bottom:0}
  .crow .g{width:14px;height:14px;flex:none;transform:translateY(2px)}
  .crow .g.ok{border-radius:50%;background:#141210}
  .crow .g.no{background:#d01f1f;transform:translateY(2px) rotate(45deg)}
  .crow .nm{font-weight:900;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
  .crow .dt{font-weight:500;font-size:10.5px;color:#5c5544;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow .ms{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .prow{display:flex;gap:10px;align-items:center;padding:5px 12px;font-size:12px;border-bottom:1px dashed #141210}
  .prow:last-child{border-bottom:0}
  .prow .n{width:22px;height:22px;background:#141210;color:#efe7d3;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
  .prow .pt{font-weight:700}
  .prow .ar{margin-left:auto;font-weight:900;font-size:11px;letter-spacing:1px;color:#efe7d3;padding:2px 8px}
  .prow .ar.a{background:#d01f1f}.prow .ar.b{background:#141210}
  .prow.jt{font-weight:500;font-size:10.5px;color:#5c5544;font-style:italic}
  .bd.scroll{max-height:172px;overflow-y:auto;scrollbar-width:thin}
  /* log bottom-left */
  .proto{position:absolute;left:96px;top:740px;width:860px;z-index:5}
  .proto .hd{font-size:11px;font-weight:900;letter-spacing:6px;margin-bottom:6px}
  .proto .hd span{color:#d01f1f}
  .proto .lg{font-size:11.5px;font-weight:500;line-height:1.7;column-count:2;column-gap:40px}
  .proto .lg div::before{content:"■ ";color:#d01f1f;font-size:8px;vertical-align:2px}
  /* status + vertical motto */
  .stat{position:absolute;left:986px;bottom:44px;background:#141210;color:#efe7d3;padding:12px 22px;z-index:5;
    display:flex;align-items:baseline;gap:16px}
  .stat .v{font-size:34px;font-weight:900;color:#d01f1f;letter-spacing:2px}
  .stat .m{font-size:11px;font-weight:700;letter-spacing:3px}
  .vert{position:absolute;right:18px;top:200px;bottom:60px;writing-mode:vertical-rl;font-weight:900;
    letter-spacing:8px;font-size:13px;color:#141210;z-index:1}
  .vert i{font-style:normal;color:#d01f1f}
  .cross{position:absolute;font-weight:900;color:#141210;font-size:16px;z-index:1;opacity:.5}
</style>
</head>
<body>
<div id="stage">
  <div class="tri"></div>
  <div class="vert">BRIEF <i>→</i> SPEZIFIKATION <i>→</i> RENDER <i>→</i> PRÜFUNG <i>→</i> BAUPLAN</div>
  <div class="mast">
    <h1>INKBENCH</h1>
    <div class="sub">WERKBANK FÜR AGENTISCHE KONSTRUKTION</div>
    <div class="obj"><div class="nm" id="objName"></div><div class="mt" id="objMeta"></div></div>
  </div>
  <div class="circ"><img src="lamp_flat.png" alt="konstruktion"></div>
  <div class="halfcirc"></div><div class="redbar"></div>
  <div class="diag">
    <div class="sq">IB</div>
    <div class="brief" id="brief"></div>
    <button id="send">BAUEN ▸</button>
  </div>
  <div class="col">
    <div class="blk"><div class="hd">MASSE — SPEZIFIKATION</div><div class="bd" id="spec"></div></div>
    <div class="blk"><div class="hd red">PRÜFUNG — VERIFIKATION</div><div class="bd" id="checks"></div></div>
    <div class="blk"><div class="hd">BAUPLAN — ARM A / B</div><div class="bd scroll" id="plan"></div></div>
  </div>
  <div class="proto"><div class="hd"><span>■</span> PROTOKOLL</div><div class="lg" id="log"></div></div>
  <div class="stat"><span class="v" id="verdict"></span><span class="m" id="statMeta"></span></div>
  <span class="cross" style="left:640px;top:740px">+</span>
  <span class="cross" style="left:1040px;top:120px">+</span>
  <span class="cross" style="left:620px;top:520px">+</span>
</div>
<script src="data.js"></script>
<script>
const D=window.DATA,S=D.spec,R=D.report;
const $=id=>document.getElementById(id);
const f=(n,d=1)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const mass=g=>g>=1000?f(g/1000,2)+' kg':f(g,0)+' g';
const tot=D.measures.reduce((a,m)=>a+m.massG,0);

$('objName').textContent=S.name;
$('objMeta').textContent=`FIG.${D.figures[0].figNum} · ${S.parts.length} TEILE · ${S.joints.length} GELENKE · ${mass(tot)} · ${S.units.toUpperCase()}`;
$('brief').textContent='„'+D.brief+'“';
$('spec').innerHTML=D.measures.map((m,i)=>
  `<div class="srow"><span class="ix">${String(i+1).padStart(2,'0')}</span><span>${m.id.replace('_',' ')} — ${m.material}</span>
   <span class="dm">${m.dims.map(d=>f(d,0)).join(' × ')}</span><span class="ms">${mass(m.massG)}</span></div>`).join('');
$('checks').innerHTML=R.checks.map(c=>
  `<div class="crow" title="${c.detail.replace(/"/g,'')}"><span class="g ${c.status==='pass'?'ok':'no'}"></span>
   <span class="nm">${c.name}</span><span class="dt">${c.detail}</span><span class="ms">${c.measured?f(c.measured,1):''}</span></div>`).join('');

let ph='';
D.plan.forEach(s=>{
  ph+=s.kind==='place'
    ?`<div class="prow"><span class="n">${s.step}</span><span class="pt">${s.part.replace('_',' ')}</span>
      <span class="ar ${s.arm==='A'?'a':'b'}">ARM ${s.arm}</span></div>`
    :`<div class="prow jt"><span class="n" style="background:#d01f1f">⌖</span>${s.type} — ${s.a} ~ ${s.b} · z ${f(s.anchor[2],0)}</div>`;
});
$('plan').innerHTML=ph;
$('log').innerHTML=D.log.map(l=>`<div>${l}</div>`).join('');
$('verdict').textContent=R.pass?'PASS':'FAIL';
$('statMeta').innerHTML=`STATUS<br>${f(R.timingMs,0)} MS · ${D.attempts} VERSUCH`;

$('send').onclick=()=>{$('log').innerHTML+=`<div>neuer auftrag ▸ ${D.brief}</div>`};

const stage=document.getElementById('stage');
function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1700,innerHeight/900)})`}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
