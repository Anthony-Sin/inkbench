<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Boiler Room</title>
<style>
  :root{
    --steel:#1b1712; --steel2:#241e16; --edge:#0c0906;
    --brass:#c9a227; --brass2:#8a6a30; --copper:#b06a3b; --cream:#f2e6c8; --chalk:#ded9c8;
    --red:#a03a2e; --grn:#3f8a52;
    --serif:Georgia,"Times New Roman",serif; --mono:"Courier New",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;font-family:var(--mono);font-size:12px;color:var(--chalk);
    background:#0f0c08}
  .plant{height:100vh;display:grid;grid-template-rows:66px 1fr 134px;gap:10px;padding:12px;
    background:linear-gradient(#221b12,#120e08)}
  .riv{position:relative}
  .riv:before,.riv:after{content:"";position:absolute;left:6px;right:6px;height:4px;pointer-events:none;
    background-image:radial-gradient(circle 2.2px at 8px 2px,#4a4032 2.2px,transparent 2.6px);background-size:26px 4px;background-repeat:repeat-x}
  .riv:before{top:4px}.riv:after{bottom:4px}

  header{display:flex;align-items:center;gap:18px;background:linear-gradient(#2b241a,#1b1712);
    border:1px solid var(--edge);border-radius:6px;padding:0 20px;box-shadow:0 4px 0 #0c0906}
  .np{background:linear-gradient(#d4b03a,#a8842a);border:2px solid #6a5220;border-radius:3px;
    padding:6px 20px;color:#2e2410;text-align:center;box-shadow:inset 0 1px 0 #ffe89a88,0 2px 4px #0008}
  .np b{font-family:var(--serif);font-size:15px;letter-spacing:.3em}
  .np small{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.25em;font-weight:400}
  .pipe{flex:1;height:14px;background:linear-gradient(#8a5630,#5f3a1e 40%,#8a5630);border-radius:7px;
    border:1px solid #3a2410;position:relative;box-shadow:inset 0 3px 3px #ffffff22,0 3px 5px #0008}
  .pipe i{position:absolute;top:-3px;bottom:-3px;width:6px;background:#3a2410;border-radius:2px}
  .pipe i:nth-child(1){left:15%}.pipe i:nth-child(2){left:40%}.pipe i:nth-child(3){left:65%}.pipe i:nth-child(4){left:90%}
  .tags{display:flex;gap:8px}
  .tag{background:linear-gradient(#c9a227,#8a6a30);color:#2e2410;font-size:8px;letter-spacing:.15em;font-weight:700;
    padding:5px 10px;border-radius:2px;border:1px solid #6a5220;box-shadow:0 2px 3px #0008}
  .tag.pass{background:linear-gradient(#d4c06a,#a89048)}

  main{display:grid;grid-template-columns:360px 1fr 400px;gap:10px;min-height:0}
  .panel{background:linear-gradient(#241e16,#17130d);border:1px solid var(--edge);border-radius:8px;
    padding:14px 12px;display:flex;flex-direction:column;min-height:0;box-shadow:0 4px 0 #0c0906,inset 0 0 40px #0007;overflow:hidden}
  .pt{font-family:var(--serif);font-size:10px;letter-spacing:.35em;color:var(--brass);text-align:center;
    border-bottom:1px solid var(--brass2);padding-bottom:7px;margin:0 8px 10px}

  /* gauges */
  .gauge{display:flex;flex-direction:column;align-items:center;margin-bottom:4px}
  .gframe{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8c84a,#8a6a30 75%);
    border:3px solid #5a4518;display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 4px 10px #0008,0 4px 8px #0009;position:relative}
  .gframe:before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px dashed #6a5220}
  .gface{width:126px;height:126px;border-radius:50%;background:radial-gradient(circle at 50% 42%,#f6ecd0,#dccca0 80%);
    box-shadow:inset 0 2px 8px #0004;position:relative;overflow:hidden}
  .gface svg{width:100%;height:100%}
  .gval{margin-top:-30px;font-family:var(--serif);font-size:14px;color:#2e2410;font-weight:700;position:relative}
  .glabel{margin-top:4px;font-size:8px;letter-spacing:.25em;color:var(--brass);text-align:center}
  .nameplate{margin-top:auto;background:linear-gradient(#c9a227,#8a6a30);border:2px solid #5a4518;border-radius:3px;
    padding:8px 10px;color:#2e2410;font-size:9px;box-shadow:inset 0 1px 0 #ffe89a66}
  .nameplate .r{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted #6a5220}
  .nameplate .r:last-child{border-bottom:0}
  .nameplate b{font-weight:700}

  /* sight glass */
  .sight{flex:1;background:#0a0805;border:8px solid;border-image:linear-gradient(#4a3a20,#241c0e) 1;
    position:relative;overflow:hidden;min-height:0;box-shadow:inset 0 0 60px #000}
  .sight img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    filter:sepia(.35) brightness(.97) contrast(1.03)}
  .sight .lvl{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(#b06a3b22,#b06a3b44);
    border-top:2px solid #b06a3b;pointer-events:none}
  .sight .gl{position:absolute;font-size:8px;letter-spacing:.25em;color:var(--brass);background:#0f0c08cc;
    padding:3px 9px;border:1px solid var(--brass2)}
  .dialrow{display:flex;gap:10px;margin-top:10px}
  .small{flex:1;text-align:center}
  .small .gv{font-family:var(--serif);font-size:18px;color:var(--brass)}
  .small .gl2{font-size:7.5px;letter-spacing:.2em;color:#8a7455}

  /* valve board */
  .valves{flex:1;overflow:auto;min-height:0}
  .vl{display:grid;grid-template-columns:34px 1fr 44px;gap:10px;align-items:center;
    background:#201a10;border:1px solid #3a2e1c;border-radius:4px;padding:8px 10px;margin-bottom:8px}
  .vl:hover{border-color:var(--brass)}
  .wheel{width:30px;height:30px;border-radius:50%;border:4px solid var(--copper);position:relative;
    box-shadow:0 0 0 3px #3a2410,0 3px 5px #0008}
  .wheel:before,.wheel:after{content:"";position:absolute;background:var(--copper);left:50%;top:50%}
  .wheel:before{width:34px;height:3px;transform:translate(-50%,-50%)}
  .wheel:after{height:34px;width:3px;transform:translate(-50%,-50%)}
  .wheel.cw{transform:rotate(45deg)}
  .vl .tx{color:var(--chalk);font-size:10.5px}
  .vl .tx small{display:block;color:#8a7455;font-size:8.5px;margin-top:2px}
  .vl .ps{text-align:right}
  .vl .ps b{color:var(--brass);font-size:12px;font-family:var(--serif)}
  .vl .ps span{display:block;font-size:7.5px;color:#8a7455;letter-spacing:.1em}
  .vl.jt{background:#1a1610;border-style:dashed}
  .vl.jt .wheel{border-radius:2px}

  /* slate log */
  footer{display:grid;grid-template-columns:1fr 560px;gap:10px}
  .order{background:linear-gradient(#2b241a,#1b1712);border:1px solid var(--edge);border-radius:6px;
    padding:12px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 0 #0c0906}
  .order .ol{font-family:var(--serif);font-size:9px;letter-spacing:.3em;color:var(--brass);writing-mode:vertical-rl;
    transform:rotate(180deg)}
  .order input{flex:1;background:#0f0c08;border:1px solid #3a2e1c;border-radius:4px;color:var(--brass);
    font-family:var(--mono);font-size:12.5px;padding:9px 14px}
  .order input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 8px #c9a22733}
  .order button{background:linear-gradient(#c9a227,#8a6a30);color:#241c0e;border:1px solid #5a4518;border-radius:4px;
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;font-weight:700;padding:10px 20px;cursor:pointer;
    box-shadow:0 3px 0 #0c0906,inset 0 1px 0 #ffe89a66}
  .order button:hover{filter:brightness(1.1)}
  .order button:active{transform:translateY(2px)}
  .slate{background:linear-gradient(#20261f,#171c16);border:6px solid #4a3a24;border-radius:6px;padding:10px 14px;
    overflow:hidden;box-shadow:0 4px 0 #0c0906,inset 0 0 30px #0006;position:relative}
  .slate .sl{font-family:var(--serif);font-size:8.5px;letter-spacing:.3em;color:#8a9a80;margin-bottom:4px}
  .slate .rows{overflow:auto;max-height:84px;min-height:0}
  .slate .rows div{font-family:"Segoe Print","Comic Sans MS",cursive;font-size:11px;color:var(--chalk);
    padding:2px 0;white-space:nowrap}
  .slate .rows div:last-child{color:#9adf9a}
</style>
</head>
<body>
<div class="plant">
  <header class="riv">
    <div class="np"><b>INKBENCH STEAM WORKS</b><small>BOILER No. 1 · AGENTIC CAD PLANT</small></div>
    <div class="pipe"><i></i><i></i><i></i><i></i></div>
    <div class="tags" id="tags"></div>
  </header>
  <main>
    <div class="panel riv">
      <div class="pt">GAUGE BOARD</div>
      <div id="gauges" style="display:flex;flex-direction:column;align-items:center;gap:2px;overflow:auto;min-height:0"></div>
      <div class="nameplate" id="nplate"></div>
    </div>
    <div class="panel riv">
      <div class="pt">SIGHT GLASS — ASSEMBLED VESSEL</div>
      <div class="sight">
        <img src="lamp_flat.png" alt="render">
        <div class="lvl"></div>
        <span class="gl" style="top:10px;left:10px" id="gl1"></span>
        <span class="gl" style="top:10px;right:10px" id="gl2"></span>
        <span class="gl" style="bottom:10px;left:10px">WATER LINE · STEADY</span>
      </div>
      <div class="dialrow" id="dialrow"></div>
    </div>
    <div class="panel riv">
      <div class="pt">VALVE BOARD — BUILD SEQUENCE</div>
      <div class="valves" id="valves"></div>
    </div>
  </main>
  <footer>
    <div class="order">
      <div class="ol">WORK ORDER · BRIEF</div>
      <input id="brief" spellcheck="false">
      <button id="fire">STOKE ▸</button>
    </div>
    <div class="slate"><div class="sl">SHIFT LOG — CHALK BOARD</div><div class="rows" id="log"></div></div>
  </footer>
</div>
<script src="data.js"></script>
<script>
const D=window.DATA;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const f1=v=>(+v).toFixed(1),f2=v=>(+v).toFixed(2);
const totalMass=D.measures.reduce((s,m)=>s+m.massG,0);
const stab=D.report.checks.find(c=>c.name==='stability');
const clr=D.report.checks.find(c=>c.name==='clearance');

/* inspection tags = checks */
document.getElementById('tags').innerHTML=D.report.checks.map(c=>`
  <span class="tag ${c.status==='pass'?'pass':''}">${esc(c.name.split(' ')[0].toUpperCase())} ${c.status==='pass'?'✓':'✗'}</span>`).join('');

/* brass gauges */
function gauge(label,val,min,max,unit,redArc){
  const a=v=>-125+(v-min)/(max-min)*250;
  const pol=(d,r)=>{const t=(d-90)*Math.PI/180;return [63+r*Math.cos(t),63+r*Math.sin(t)];};
  let s='';
  for(let i=0;i<=10;i++){const v=min+(max-min)*i/10;const[x0,y0]=pol(a(v),50),[x1,y1]=pol(a(v),i%5===0?40:44);
    s+=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="#4a3a20" stroke-width="${i%5===0?1.6:1}"/>`;}
  if(redArc){const[x0,y0]=pol(a(redArc[0]),50),[x1,y1]=pol(a(redArc[1]),50);
    s+=`<path d="M ${x0} ${y0} A 50 50 0 ${(redArc[1]-redArc[0])/(max-min)*250>180?1:0} 1 ${x1} ${y1}" stroke="#a03a2e" stroke-width="4" fill="none"/>`;}
  const[nx,ny]=pol(a(Math.min(Math.max(val,min),max)),46);
  return `<div class="gauge"><div class="gframe"><div class="gface"><svg viewBox="0 0 126 126">
    ${s}<line x1="63" y1="63" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#8f1f18" stroke-width="2.5"/>
    <circle cx="63" cy="63" r="6" fill="#4a3a20" stroke="#2e2410"/>
    <text x="63" y="96" text-anchor="middle" font-size="8" fill="#6a5a30" letter-spacing="2">${unit}</text>
    </svg><div class="gval">${unit==='kg'?f2(val/1000):f1(val)}</div></div></div>
    <div class="glabel">${label}</div></div>`;
}
document.getElementById('gauges').innerHTML=
  gauge('STABILITY MARGIN — PRESSURE',stab.measured,0,110,'mm')+
  gauge('TOTAL MASS — LOAD',totalMass,0,6500,'kg')+
  gauge('CLEARANCE — STEAM',clr.measured,0,20,'mm',[0,D.spec.tests.min_clearance_mm]);

/* nameplate = spec */
document.getElementById('nplate').innerHTML=
  `<div class="r"><span>MFR</span><b>INKBENCH WORKS</b></div>
   <div class="r"><span>MODEL</span><b>${esc(D.spec.name.toUpperCase())}</b></div>`+
  D.spec.parts.map(p=>{const m=D.measures.find(x=>x.id===p.id);
    return `<div class="r"><span>${esc(p.id.toUpperCase())} · ${p.material.toUpperCase()}</span><b>${f1(m.massG)}g</b></div>`;}).join('');

/* sight glass labels + small dials */
document.getElementById('gl1').textContent='FIG.'+D.figures[0].figNum+' · '+D.spec.parts.length+' PTS';
document.getElementById('gl2').textContent=D.report.pass?'SOUND ✓':'LEAK ✗';
document.getElementById('dialrow').innerHTML=[
  [f1(D.report.timingMs),'VERIFY ms'],[D.attempts,'ATTEMPTS'],
  [D.spec.joints.length,'JOINTS'],[D.report.explodedOrder.length,'STACK']
].map(([v,l])=>`<div class="small"><div class="gv">${v}</div><div class="gl2">${l}</div></div>`).join('');

/* valve board */
document.getElementById('valves').innerHTML=D.plan.map(p=>{
  if(p.kind==='place')return `<div class="vl"><div class="wheel ${p.arm==='B'?'cw':''}"></div>
    <span class="tx">V${String(p.step).padStart(2,'0')} · ARM ${p.arm} — set ${esc(p.part)} ${p.glyph}
    <small>${f1(p.massG)}g · seat ${p.seat.map(v=>f1(v)).join(', ')}</small></span>
    <span class="ps"><b>${f1(p.massG)}</b><span>g</span></span></div>`;
  return `<div class="vl jt"><div class="wheel" style="border-style:dashed"></div>
    <span class="tx">PETCOCK · ${esc(p.type)} ${esc(p.a)}→${esc(p.b)}
    <small>axis ${p.axis.join(',')} @ ${p.anchor.map(v=>f1(v)).join(',')}</small></span>
    <span class="ps"><b>—</b><span>JNT</span></span></div>`;
}).join('');

/* order + slate */
const bi=document.getElementById('brief');bi.value=D.brief;
document.getElementById('fire').onclick=()=>bi.focus();
document.getElementById('log').innerHTML=D.log.map(l=>`<div>— ${esc(l)}</div>`).join('');
</script>
</body>
</html>
