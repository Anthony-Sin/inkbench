<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — The Oracle Spread</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(ellipse at 50% -10%,#3a2050 0%,transparent 55%),
      radial-gradient(ellipse at 12% 108%,#2a1240 0%,transparent 50%),
      radial-gradient(ellipse at 88% 108%,#2a1240 0%,transparent 50%),
      #0d0716;
    font-family:Georgia,"Times New Roman",serif;color:#e4d6a8;
    display:grid;grid-template-columns:370px 1fr 370px;
  }
  .cz{font-family:"Cinzel",serif}
  /* ---------- side columns ---------- */
  .col{padding:26px 24px;display:flex;flex-direction:column;gap:18px;min-height:0;overflow-y:auto}
  .panel{
    border:1px solid #5a4620;background:linear-gradient(#171024,#120b1e);
    padding:14px 16px;position:relative;flex:0 0 auto;
  }
  .panel::before{content:"";position:absolute;inset:4px;border:1px solid #33244d;pointer-events:none}
  .panel::after{content:"✦";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    background:#0d0716;padding:0 10px;color:#8a6f2f;font-size:11px}
  .panel.grow{flex:1;min-height:0;overflow-y:auto}
  .ph{font-family:"Cinzel",serif;font-size:12px;letter-spacing:4px;color:#c9a227;text-align:center;margin-bottom:12px}
  textarea{
    width:100%;background:rgba(0,0,0,.25);border:1px solid #4a3a22;color:#efe3b8;
    font-family:Georgia,serif;font-style:italic;font-size:13px;resize:none;height:64px;padding:8px;line-height:1.5;
  }
  textarea:focus{outline:none;border-color:#c9a227;box-shadow:0 0 14px rgba(201,162,39,.25)}
  .btn{
    width:100%;margin-top:10px;background:linear-gradient(#2a1a44,#1a0f30);border:1px solid #8a6f2f;
    color:#ecd88f;font-family:"Cinzel",serif;font-size:12px;letter-spacing:3px;padding:9px;cursor:pointer;
  }
  .btn:hover{border-color:#ecd88f;color:#fff;box-shadow:0 0 16px rgba(201,162,39,.35)}
  .btn:active{transform:translateY(1px)}
  .log{font-size:12px;font-style:italic;color:#9d8ec0;line-height:1.9}
  .log div{padding-left:16px;position:relative}
  .log div::before{content:"✧";position:absolute;left:0;color:#6a5590}
  .matline{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px dashed #33244d}
  .matline:last-child{border-bottom:none}
  .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;border:1px solid #000;vertical-align:-1px}
  .den{color:#8a7fb0;font-style:italic;font-size:11px}
  /* revelations (checks) */
  .rev{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #241838;font-size:12px}
  .rev:last-child{border-bottom:none}
  .rev .glyph{flex:0 0 22px;text-align:center;font-size:16px}
  .rev.up .glyph{color:#c9a44a}
  .rev.down .glyph{color:#a04a4a;transform:rotate(180deg)}
  .rev .nm{font-family:"Cinzel",serif;font-size:11px;letter-spacing:2px;color:#e8d48b;text-transform:uppercase}
  .rev .nm .meas{color:#8a7fb0;font-family:Georgia,serif;letter-spacing:0;font-style:italic;text-transform:none}
  .rev .dt{color:#9d8ec0;font-size:11px;font-style:italic;line-height:1.5;margin-top:3px}
  /* the working (plan) */
  .wk{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid #241838;font-size:12px}
  .wk:last-child{border-bottom:none}
  .wk .num{font-family:"Cinzel",serif;color:#8a6f2f;font-size:10px;letter-spacing:1px;flex:0 0 34px}
  .hand{font-family:"Cinzel",serif;font-size:9px;letter-spacing:2px;padding:2px 7px;border:1px solid #8a6f2f;color:#ecd88f;flex:0 0 auto}
  .hand.a{border-color:#c9a44a;color:#e8d48b}
  .hand.b{border-color:#7a5ac0;color:#bca8e8}
  .wk.j .hand{border-color:#4a3a66;color:#8a7fb0}
  .wk .wh{color:#c9bb96}
  .wk .det{color:#8a7fb0;font-size:10.5px;font-style:italic}
  /* ---------- center cloth ---------- */
  #cloth{
    position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;
    padding:18px 30px 14px;
    background:
      radial-gradient(ellipse at 50% 38%,rgba(90,50,140,.28) 0%,transparent 62%);
  }
  #cloth::before{
    content:"";position:absolute;inset:14px;border:1px solid #3a2a10;pointer-events:none;
  }
  #cloth::after{
    content:"";position:absolute;inset:20px;border:1px dashed #2a1f45;pointer-events:none;
  }
  #title{text-align:center;flex:0 0 auto;margin-top:2px}
  #title .t1{font-family:"Cinzel",serif;font-size:26px;letter-spacing:9px;color:#e8d48b;text-shadow:0 0 22px rgba(201,162,39,.45)}
  #title .t2{font-size:11px;letter-spacing:5px;color:#7a6898;margin-top:4px;font-style:italic}
  /* fanned part cards */
  #fanwrap{position:relative;flex:0 0 auto;width:100%;height:290px;margin-top:6px}
  .pcard{
    position:absolute;left:50%;bottom:6px;width:148px;height:238px;margin-left:-74px;
    transform-origin:50% 118%;
    background:linear-gradient(160deg,#241538 0%,#180e2c 60%,#120a20 100%);
    border:1px solid #8a6f2f;border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,.65),inset 0 0 0 4px #160d28,inset 0 0 0 5px #5a4620;
    padding:14px 10px 10px;text-align:center;cursor:pointer;
    transition:transform .25s,box-shadow .25s;
  }
  .pcard:hover{transform:rotate(0deg) translateY(-16px) !important;z-index:40;
    box-shadow:0 14px 34px rgba(0,0,0,.8),0 0 22px rgba(201,162,39,.35),inset 0 0 0 4px #160d28,inset 0 0 0 5px #c9a44a}
  .pcard .num{font-family:"Cinzel",serif;font-size:15px;letter-spacing:3px;color:#e8d48b}
  .pcard .suit{font-size:9px;letter-spacing:2px;color:#8a7fb0;font-style:italic;margin-top:2px}
  .pcard .sigil{font-size:44px;line-height:1.4;color:#c9a44a;text-shadow:0 0 14px rgba(201,162,39,.5);margin:10px 0 6px}
  .pcard .nm{font-family:"Cinzel",serif;font-size:11px;letter-spacing:2px;color:#efe3b8;text-transform:uppercase}
  .pcard .ep{font-size:9.5px;font-style:italic;color:#7a6898;margin-top:3px}
  .pcard .ft{position:absolute;bottom:8px;left:0;right:0;font-size:9px;color:#8a7fb0;letter-spacing:1px}
  .pcard .c{position:absolute;font-size:9px;color:#5a4620}
  .pcard .c.tl{top:5px;left:7px}.pcard .c.tr{top:5px;right:7px}
  .pcard .c.bl{bottom:5px;left:7px;transform:rotate(180deg)}.pcard .c.br{bottom:5px;right:7px;transform:rotate(180deg)}
  /* verdict card */
  #verdict{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
  #vcard{
    position:relative;width:340px;max-height:100%;display:flex;flex-direction:column;
    background:linear-gradient(170deg,#2a1a48,#150c26 70%);
    border:2px solid #c9a44a;border-radius:12px;
    box-shadow:0 0 0 6px #160d28,0 0 0 7px #5a4620,0 24px 60px rgba(0,0,0,.8),0 0 50px rgba(120,80,200,.25);
    padding:16px 16px 12px;text-align:center;
  }
  #vcard .num{font-family:"Cinzel",serif;font-size:13px;letter-spacing:4px;color:#e8d48b}
  #vcard .art{
    margin:10px 6px;border:1px solid #8a6f2f;box-shadow:inset 0 0 0 3px #160d28,inset 0 0 0 4px #c9a44a;
    overflow:hidden;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0a0614;
  }
  #vcard .art img{max-width:100%;max-height:100%;object-fit:contain;filter:saturate(.9) contrast(1.06)}
  #vcard .vline{font-family:"Cinzel",serif;font-size:12px;letter-spacing:3px;margin-top:4px}
  #vcard .vline.up{color:#e8d48b}
  #vcard .vline.down{color:#c05a5a}
  #vcard .vsub{font-size:10.5px;font-style:italic;color:#8a7fb0;margin-top:4px;line-height:1.5}
  /* status omen strip */
  #omen{
    flex:0 0 auto;margin-top:10px;padding:7px 26px;border:1px solid #5a4620;
    font-family:"Cinzel",serif;font-size:12px;letter-spacing:4px;color:#e8d48b;background:#120b1e;
    display:flex;gap:18px;align-items:center;
  }
  #omen .sm{font-size:10px;letter-spacing:2px;color:#7a6898}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#3a2a55}
</style>
</head>
<body>

<aside class="col">
  <div class="panel">
    <div class="ph">The Querent's Brief</div>
    <textarea id="brief" spellcheck="false"></textarea>
    <button class="btn" id="consult">✦ Consult the Spread ✦</button>
    <div class="log" style="margin-top:10px;font-size:11px">
      <div>querent seated — units: <span id="units"></span></div>
      <div>attempt № <span id="att"></span> upon the cloth</div>
    </div>
  </div>
  <div class="panel grow">
    <div class="ph">Whispers · Scribe's Log</div>
    <div class="log" id="log"></div>
  </div>
  <div class="panel">
    <div class="ph">Materia of the Working</div>
    <div id="mats"></div>
  </div>
</aside>

<main id="cloth">
  <div id="title">
    <div class="t1">INKBENCH</div>
    <div class="t2">the oracle of agentic fabrication · a spread is cast</div>
  </div>
  <div id="fanwrap"><div id="fan"></div></div>
  <div id="verdict">
    <div id="vcard">
      <div class="num" id="vnum"></div>
      <div class="art"><img src="lamp_flat.png" alt="the rendered omen"></div>
      <div class="vline" id="vline"></div>
      <div class="vsub" id="vsub"></div>
    </div>
  </div>
  <div id="omen"></div>
</main>

<aside class="col">
  <div class="panel grow">
    <div class="ph">Revelations — Five Trials</div>
    <div id="checks"></div>
  </div>
  <div class="panel grow">
    <div class="ph">The Working — Two Hands</div>
    <div id="plan"></div>
  </div>
</aside>

<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s);
const RN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const f=(a,d=0)=>a.map(x=>(+x).toFixed(d)).join(', ');
const mass=id=>{const m=D.measures.find(m=>m.id===id);return m?m.massG:0};
const SIGIL={cylinder:'◉',box:'▭',cone:'◮',sphere:'●'};
const EPITHET={base:'the foundation',post:'the pillar',lower_arm:'the reach',upper_arm:'the ascent',shade:'the veil'};

$('#brief').value='"'+D.brief+'"';
$('#units').textContent=D.spec.units;
$('#att').textContent=D.attempts;
$('#consult').onclick=()=>{
  const c=$('#consult');c.textContent='✦ the cards are cast again ✦';
  const l=$('#log');l.prepend(Object.assign(document.createElement('div'),
    {textContent:'re-cast: "'+$('#brief').value.slice(0,48)+'…"'}));
};

/* ---- fanned arcana: one card per part ---- */
const fan=$('#fan'),N=D.spec.parts.length;
D.spec.parts.forEach((p,i)=>{
  const m=D.measures.find(m=>m.id===p.id);
  const sz=Array.isArray(p.size)?p.size.join('×'):('r'+p.size.r+' h'+p.size.h);
  const ang=(i-(N-1)/2)*16;               /* spread ± around center */
  const lift=Math.abs(i-(N-1)/2)*10;      /* outer cards ride lower */
  const el=document.createElement('div');
  el.className='pcard';el.style.zIndex=10+i;
  el.style.transform='rotate('+ang+'deg) translateY('+lift+'px)';
  el.innerHTML=
    '<span class="c tl">✦</span><span class="c tr">✦</span><span class="c bl">✦</span><span class="c br">✦</span>'+
    '<div class="num">'+RN[i]+'</div>'+
    '<div class="suit">of '+p.material+'</div>'+
    '<div class="sigil">'+(SIGIL[p.shape]||'◇')+'</div>'+
    '<div class="nm">'+p.id.replace(/_/g,' ')+'</div>'+
    '<div class="ep">'+(EPITHET[p.id]||'of '+p.shape)+'</div>'+
    '<div class="ft">'+sz+' '+D.spec.units+' · '+(m?m.massG.toFixed(1):'—')+' g</div>';
  fan.appendChild(el);
});

/* ---- verdict card ---- */
const fig=D.figures[0]||{name:D.spec.name,parts:D.spec.parts.length,attempts:D.attempts};
$('#vnum').textContent='ARCANUM XVIII · “'+String(fig.name).toUpperCase()+'”';
const vl=$('#vline');
if(D.report.pass){
  vl.textContent='UPRIGHT — VERIFIED ✦';
  vl.classList.add('up');
}else{
  vl.textContent='REVERSED — DOOMED ⟲';
  vl.classList.add('down');
}
$('#vsub').textContent=D.report.checks.filter(c=>c.status==='pass').length+' of '+D.report.checks.length+
  ' trials endure · divination took '+D.report.timingMs+' ms · '+(D.report.failures||[]).length+' ill omens';

/* ---- omen strip ---- */
$('#omen').innerHTML=
  '<span>'+(D.report.pass?'THE AUGURIES ARE FAVOURABLE — BUILD MAY PROCEED':'DARK PORTENTS — THE FABRICATION IS HELD')+'</span>'+
  '<span class="sm">'+D.spec.parts.length+' cards · '+D.spec.joints.length+' bindings</span>';

/* ---- revelations ---- */
$('#checks').innerHTML=D.report.checks.map(k=>{
  const up=k.status==='pass';
  return '<div class="rev '+(up?'up':'down')+'"><div class="glyph">'+(up?'✦':'⟲')+'</div><div>'+
    '<div class="nm">'+k.name+(k.measured?' <span class="meas">— '+ (+k.measured).toFixed(2) +'</span>':'')+'</div>'+
    '<div class="dt">'+k.detail+'</div></div></div>';
}).join('');

/* ---- the working ---- */
let h='';
D.plan.forEach(s=>{
  if(s.kind==='place'){
    const cls=s.arm.indexOf('B')>-1?'b':'a';
    h+='<div class="wk"><span class="num">STEP '+RN[s.step-1]+'</span>'+
      '<span class="hand '+cls+'">'+(s.arm==='A'?'DEXTER ☛':'SINISTRA ☚')+'</span>'+
      '<span><span class="wh">'+s.part.replace(/_/g,' ')+' '+s.glyph+'</span><br>'+
      '<span class="det">seat ['+f(s.seat,1)+'] · '+s.massG.toFixed(0)+' g'+(s.heavy?' · burdensome':'')+'</span></span></div>';
  }else{
    h+='<div class="wk j"><span class="num">BIND</span>'+
      '<span class="hand">SIGIL</span>'+
      '<span><span class="wh">'+s.type+' binding</span><br>'+
      '<span class="det">'+s.a+' ~ '+s.b+' · anchored ['+f(s.anchor,1)+']'+(s.late?' · bound late':'')+'</span></span></div>';
  }
});
$('#plan').innerHTML=h;

/* ---- log + materials ---- */
$('#log').innerHTML=D.log.map(x=>'<div>'+x+'</div>').join('');
$('#mats').innerHTML=Object.entries(D.spec.materials).map(([n,m])=>
  '<div class="matline"><span><span class="sw" style="background:'+m.color+'"></span>'+n+'</span>'+
  '<span class="den">ρ '+m.density+' kg/m³</span></div>').join('');
</script>
</body>
</html>
