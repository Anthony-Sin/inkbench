<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Engineer's Notebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#3a332a}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:#1c2f6e}
  #stage{position:absolute;left:50%;top:50%;width:1700px;height:900px;transform:translate(-50%,-50%);
    background:radial-gradient(1200px 700px at 50% 40%,#55483a 0%,#40372b 70%);padding:26px}
  .spread{position:relative;width:100%;height:100%;display:flex;filter:drop-shadow(0 22px 45px rgba(0,0,0,.55))}
  .page{flex:1;position:relative;background:#f6f4e8;
    background-image:
      linear-gradient(rgba(63,101,167,.18) 1px,transparent 1px),
      linear-gradient(90deg,rgba(63,101,167,.18) 1px,transparent 1px),
      linear-gradient(rgba(63,101,167,.32) 1px,transparent 1px),
      linear-gradient(90deg,rgba(63,101,167,.32) 1px,transparent 1px);
    background-size:18px 18px,18px 18px,90px 90px,90px 90px;
    background-position:0 0,0 0,0 0,0 0}
  .page.left{border-radius:4px 0 0 4px;border-right:1px solid #d8d2b8}
  .page.right{border-radius:0 4px 4px 0}
  .page.left::before{content:"";position:absolute;top:0;bottom:0;left:74px;width:1.5px;background:rgba(203,78,66,.55)}
  .spine{width:46px;position:relative;background:linear-gradient(90deg,#e9e4cf,#c9c2a4 45%,#b3ab8d 55%,#e9e4cf)}
  .coil{position:absolute;left:9px;right:9px;height:14px;border:3px solid #8d8d95;border-top-width:4px;border-radius:50%;
    background:linear-gradient(#fdfdf6,#d9d4bd);box-shadow:inset 0 2px 2px rgba(0,0,0,.25)}
  .hand{font-family:"Caveat",cursive;font-weight:500;color:#1c2f6e}
  .inkred{color:#b33a2c}
  /* left page */
  .proj{position:absolute;left:100px;top:30px;font-size:34px;font-weight:700}
  .proj small{font-family:"Segoe UI",sans-serif;font-size:10px;letter-spacing:2.5px;color:#6a7290;display:block;margin-bottom:-6px}
  .datestamp{position:absolute;right:28px;top:34px;font-size:19px;color:#5a6486;transform:rotate(2deg)}
  .prob{position:absolute;left:100px;top:96px;width:660px}
  .prob .lbl{font-family:"Segoe UI",sans-serif;font-size:9.5px;letter-spacing:3px;color:#8a90a8;margin-bottom:4px}
  .prob .box{display:flex;align-items:center;gap:14px;border:2px solid #1c2f6e;border-radius:3px;padding:9px 14px;background:rgba(255,255,255,.35)}
  .prob .box .q{font-family:"Caveat",cursive;font-size:25px;line-height:1.05;flex:1}
  .run{font-family:"Caveat",cursive;font-size:20px;font-weight:700;color:#f6f4e8;background:#1c2f6e;border:0;border-radius:40% 55% 50% 60%/60% 45% 55% 40%;
    padding:6px 20px;cursor:pointer;transform:rotate(-2deg);box-shadow:2px 3px 0 rgba(28,47,110,.35);transition:.15s}
  .run:hover{background:#b33a2c;transform:rotate(1deg) scale(1.05)}
  .spec{position:absolute;left:100px;top:196px;width:660px}
  .spec .lbl{font-family:"Segoe UI",sans-serif;font-size:9.5px;letter-spacing:3px;color:#8a90a8;margin-bottom:4px}
  table.pt{width:100%;border-collapse:collapse;font-size:12px;color:#22303f}
  table.pt th{font-family:"Caveat",cursive;font-size:19px;font-weight:700;color:#1c2f6e;text-align:left;border-bottom:2px solid #1c2f6e;padding:2px 8px}
  table.pt td{border-bottom:1px dashed rgba(28,47,110,.4);padding:5px 8px;font-variant-numeric:tabular-nums}
  table.pt tr:hover td{background:rgba(28,47,110,.07)}
  table.pt .sw{display:inline-block;width:10px;height:10px;border:1px solid #22303f;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .jline{margin-top:8px;font-size:20px;line-height:1.35}
  .checks{position:absolute;left:100px;top:506px;width:430px}
  .checks .lbl{font-family:"Segoe UI",sans-serif;font-size:9.5px;letter-spacing:3px;color:#8a90a8;margin-bottom:4px}
  .ck{display:flex;gap:10px;align-items:baseline;padding:3px 0;border-bottom:1px dotted rgba(28,47,110,.3)}
  .ck .bx{width:15px;height:15px;border:2px solid #1c2f6e;border-radius:3px;flex:none;display:flex;align-items:center;justify-content:center;
    font-family:"Caveat",cursive;font-size:17px;font-weight:700;line-height:1;transform:translateY(2px)}
  .ck .nm{font-family:"Caveat",cursive;font-size:21px;white-space:nowrap}
  .ck .dt{font-size:9.5px;color:#5a6486;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .verdict{position:absolute;left:110px;bottom:44px;font-family:"Caveat",cursive;font-weight:700;font-size:64px;color:#b33a2c;
    border:4px solid #b33a2c;border-radius:50% 40% 55% 45%/45% 55% 40% 55%;padding:2px 34px;transform:rotate(-7deg);opacity:.9}
  .mnote{position:absolute;font-family:"Caveat",cursive;color:#b33a2c;font-size:19px;line-height:1.15;transform:rotate(-90deg);transform-origin:top left}
  .mn1{left:56px;top:470px}.mn2{left:56px;top:206px}
  /* right page */
  .photo{position:absolute;left:56px;top:34px;width:392px;background:#fff;padding:12px 12px 34px;transform:rotate(-2.4deg);
    box-shadow:0 8px 22px rgba(0,0,0,.28)}
  .photo img{display:block;width:100%;height:400px;object-fit:cover;filter:saturate(.92) contrast(1.05)}
  .photo .cap{font-family:"Caveat",cursive;font-size:21px;text-align:center;margin-top:8px;color:#333}
  .tape{position:absolute;width:96px;height:28px;background:rgba(240,228,168,.85);box-shadow:0 1px 3px rgba(0,0,0,.15);
    border-left:1px dashed rgba(0,0,0,.08);border-right:1px dashed rgba(0,0,0,.08)}
  .tape.t1{top:-14px;left:-30px;transform:rotate(-38deg)}
  .tape.t2{top:-14px;right:-30px;transform:rotate(38deg)}
  .plan{position:absolute;left:490px;top:34px;width:300px}
  .plan .lbl{font-family:"Segoe UI",sans-serif;font-size:9.5px;letter-spacing:3px;color:#8a90a8;margin-bottom:4px}
  .pl{display:flex;gap:10px;align-items:baseline;padding:4px 0;border-bottom:1px dotted rgba(28,47,110,.3);font-family:"Caveat",cursive;font-size:22px}
  .pl .no{width:24px;height:24px;border:2px solid #1c2f6e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;transform:translateY(3px)}
  .pl .arm{margin-left:auto;font-family:"Segoe UI",sans-serif;font-size:10px;letter-spacing:1px;border:1.5px solid #1c2f6e;border-radius:10px;padding:1px 8px;color:#1c2f6e}
  .pl .jt{font-size:16px;color:#5a6486;padding-left:34px;border-bottom:1px dotted rgba(28,47,110,.3);padding-bottom:4px;font-family:"Caveat",cursive}
  .arrow{font-family:"Caveat",cursive;font-size:30px;color:#b33a2c;transform:rotate(8deg)}
  .notes{position:absolute;left:490px;top:480px;right:30px;bottom:30px}
  .notes .lbl{font-family:"Segoe UI",sans-serif;font-size:9.5px;letter-spacing:3px;color:#8a90a8;margin-bottom:4px}
  .notes .nlog{font-family:"Caveat",cursive;font-size:20px;line-height:1.5;color:#22303f;height:calc(100% - 20px);overflow-y:auto;scrollbar-width:thin}
  .notes .nlog div::before{content:"— "}
  .todo{position:absolute;left:56px;bottom:36px;font-family:"Caveat",cursive;font-size:21px;color:#b33a2c;line-height:1.3}
</style>
</head>
<body>
<div id="stage"><div class="spread">
  <div class="page left">
    <div class="proj"><small>FIELD NOTEBOOK · INKBENCH</small><span id="pname"></span></div>
    <div class="datestamp" id="pdate"></div>
    <div class="prob">
      <div class="lbl">1 · PROBLEM STATEMENT — AS BRIEFED</div>
      <div class="box"><span class="q">“<span id="brief"></span>”</span><button class="run" id="run">run ▸</button></div>
    </div>
    <div class="spec">
      <div class="lbl">2 · GIVENS — SPEC SHEET (UNITS <span id="units"></span>)</div>
      <table class="pt" id="ptab"></table>
      <div class="jline hand" id="jline"></div>
    </div>
    <div class="checks">
      <div class="lbl">3 · VERIFY BEFORE COMMIT</div>
      <div id="cklist"></div>
    </div>
    <div class="mnote mn1">‹ verify all —</div>
    <div class="mnote mn2">‹ spec draft</div>
    <div class="verdict" id="verdict"></div>
  </div>
  <div class="spine" id="spine"></div>
  <div class="page right">
    <div class="photo"><span class="tape t1"></span><span class="tape t2"></span>
      <img src="lamp_flat.png" alt="render taped in">
      <div class="cap" id="pcap"></div>
    </div>
    <div class="plan">
      <div class="lbl">4 · ASSEMBLY — ARM A / ARM B</div>
      <div id="plan"></div>
    </div>
    <div class="notes">
      <div class="lbl">5 · SESSION NOTES</div>
      <div class="nlog" id="nlog"></div>
    </div>
    <div class="todo" id="todo"></div>
  </div>
</div></div>
<script src="data.js"></script>
<script>
const D=window.DATA,S=D.spec,R=D.report;
const $=id=>document.getElementById(id);
const f=(n,d=1)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const mass=g=>g>=1000?f(g/1000,2)+' kg':f(g,0)+' g';
const dims=p=>p.shape==='box'?p.size.join('×'):'⌀'+(p.size.r*2)+'×'+p.size.h;

$('pname').textContent='Δ '+S.name.toLowerCase();
$('pdate').textContent=`fig.${D.figures[0].figNum} · attempt ${D.attempts} · ${f(R.timingMs,0)}ms`;
$('brief').textContent=D.brief;
$('units').textContent=S.units.toUpperCase();
$('ptab').innerHTML='<tr><th>part</th><th>form</th><th>dims</th><th>matl</th><th>ρ kg/m³</th><th>mass</th></tr>'+
  D.measures.map(m=>`<tr><td><b>${m.id}</b></td><td>${m.shape}</td><td>${m.dims.map(d=>f(d,1)).join('×')}</td>
  <td><span class="sw" style="background:${S.materials[m.material].color}"></span>${m.material}</td>
  <td>${f(m.density,0)}</td><td>${mass(m.massG)}</td></tr>`).join('');
$('jline').textContent=`joints ⇒ ${S.joints.map(j=>`${j.a}~${j.b} (${j.type})`).join('  ·  ')}`;

$('cklist').innerHTML=R.checks.map(c=>
  `<div class="ck" title="${c.detail.replace(/"/g,'')}"><span class="bx">${c.status==='pass'?'✓':'✗'}</span>
   <span class="nm">${c.name}${c.measured?` = ${f(c.measured,2)}`:''}</span><span class="dt">${c.detail}</span></div>`).join('');

const v=$('verdict');v.textContent=R.pass?'PASS !':'FAIL — rework';
if(!R.pass)v.style.fontSize='44px';

$('pcap').textContent=`fig.${D.figures[0].figNum} — render, attempt ${D.attempts} · ${S.parts.length} parts`;

let planHtml='';
D.plan.forEach(s=>{
  if(s.kind==='place'){
    planHtml+=`<div class="pl"><span class="no">${s.step}</span><span>${s.part}</span><span class="arm">ARM ${s.arm}</span></div>`;
  }else{
    planHtml+=`<div class="jt"><span class="arrow">↳</span> ${s.type} · ${s.a}~${s.b} @ z ${f(s.anchor[2],0)}</div>`;
  }
});
$('plan').innerHTML=planHtml;
$('nlog').innerHTML=D.log.map(l=>`<div>${l}</div>`).join('');
$('todo').innerHTML=`∴ status — <b>${R.pass?'VERIFIED ✓':'REJECTED'}</b><br>${R.checks.length}/${R.checks.length} checks · ${R.failures.length} failures`;

const sp=$('spine');
for(let i=0;i<9;i++){const c=document.createElement('div');c.className='coil';c.style.top=(30+i*92)+'px';sp.appendChild(c)}
$('run').onclick=()=>{$('nlog').innerHTML+=`<div>brief re-run ▸ ${D.brief}</div>`;$('nlog').scrollTop=1e6};

const stage=document.getElementById('stage');
function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1700,innerHeight/900)})`}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
