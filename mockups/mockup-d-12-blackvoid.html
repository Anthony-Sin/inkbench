<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Void</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1700px; height: 900px; overflow: hidden; }
  body {
    background: #050505; color: rgba(255,255,255,.55);
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 10px; letter-spacing: .14em; position: relative;
  }
  ::selection { background: rgba(255,255,255,.85); color: #050505; }

  /* ---------- the render, sole light source ---------- */
  #void {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 900px; height: 840px; pointer-events: none;
  }
  #void .pool {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    width: 640px; height: 120px;
    background: radial-gradient(ellipse, rgba(255,244,214,.13), transparent 68%);
  }
  #void .glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 46%, rgba(255,238,200,.10), rgba(255,238,200,.03) 42%, transparent 66%);
  }
  #void img {
    position: absolute; left: 50%; top: 47%; transform: translate(-50%,-50%);
    height: 780px; filter: contrast(1.02);
  }
  /* corner brackets around render */
  .brk { position: absolute; width: 26px; height: 26px; border: 0 solid rgba(255,255,255,.34); }
  .brk.tl { top: 40px; left: 90px; border-top-width: 1px; border-left-width: 1px; }
  .brk.tr { top: 40px; right: 90px; border-top-width: 1px; border-right-width: 1px; }
  .brk.bl { bottom: 40px; left: 90px; border-bottom-width: 1px; border-left-width: 1px; }
  .brk.br { bottom: 40px; right: 90px; border-bottom-width: 1px; border-right-width: 1px; }
  .brkLbl { position: absolute; color: rgba(255,255,255,.3); font-size: 9px; letter-spacing: .3em; }

  /* viewport crop marks */
  .cm { position: absolute; background: rgba(255,255,255,.3); }
  .cm.h { width: 22px; height: 1px; } .cm.v { width: 1px; height: 22px; }

  /* ---------- generic wire UI ---------- */
  .sec { position: absolute; }
  .lbl { font-size: 9px; letter-spacing: .34em; color: rgba(255,255,255,.38); text-transform: uppercase; margin-bottom: 9px; }
  .lbl::before { content: "— "; color: rgba(255,255,255,.22); }
  .row { display: flex; justify-content: space-between; gap: 14px; padding: 3.5px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .row:hover { border-bottom-color: rgba(255,255,255,.35); }
  .row:hover .v, .row:hover .k { color: rgba(255,255,255,.85); }
  .k { color: rgba(255,255,255,.4); transition: color .15s; }
  .v { color: rgba(255,255,255,.66); text-align: right; transition: color .15s; }
  .v.hi { color: #fff; }

  /* left column */
  #brand { position: absolute; top: 34px; left: 40px; }
  #brand .n { font-size: 13px; letter-spacing: .5em; color: rgba(255,255,255,.85); }
  #brand .s { font-size: 8.5px; letter-spacing: .3em; color: rgba(255,255,255,.3); margin-top: 5px; }
  #sBrief { top: 116px; left: 40px; width: 268px; }
  #sBrief .btext { font-size: 10.5px; line-height: 1.8; color: rgba(255,255,255,.62); letter-spacing: .06em; }
  .brow { display: flex; gap: 8px; margin-top: 10px; }
  .brow input {
    flex: 1; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,.25);
    color: rgba(255,255,255,.8); font-family: inherit; font-size: 10px; letter-spacing: .06em;
    padding: 5px 0; outline: none;
  }
  .brow input:focus { border-bottom-color: rgba(255,255,255,.9); }
  .brow button {
    background: transparent; border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.6);
    font-family: inherit; font-size: 10px; padding: 0 12px; cursor: pointer; letter-spacing: .2em;
  }
  .brow button:hover { border-color: #fff; color: #fff; }
  #sSpec { top: 330px; left: 40px; width: 268px; }
  #sMat  { top: 566px; left: 40px; width: 268px; }
  .sw { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }

  /* right column */
  #sVerify { top: 116px; right: 40px; width: 268px; }
  #verdict { font-size: 20px; letter-spacing: .6em; color: #fff; padding: 4px 0 10px; }
  #verdict.fail { color: rgba(255,255,255,.9); }
  #verdictSub { font-size: 9px; color: rgba(255,255,255,.35); letter-spacing: .2em; margin-bottom: 8px; }
  .chk { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.07); cursor: default; }
  .chk:hover { border-bottom-color: rgba(255,255,255,.35); }
  .chk:hover .n { color: rgba(255,255,255,.85); }
  .chk .d { color: rgba(255,255,255,.75); }
  .chk .d.f { color: rgba(255,120,120,.9); }
  .chk .n { color: rgba(255,255,255,.5); text-transform: capitalize; transition: color .15s; }
  .chk .m { margin-left: auto; color: rgba(255,255,255,.35); }
  #sPlan { top: 470px; right: 40px; width: 268px; }
  .prow { display: flex; gap: 10px; padding: 3.5px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .prow:hover { border-bottom-color: rgba(255,255,255,.35); }
  .prow:hover .pp { color: rgba(255,255,255,.85); }
  .prow .sn { color: rgba(255,255,255,.3); width: 16px; }
  .prow .pp { color: rgba(255,255,255,.6); transition: color .15s; }
  .prow .pa { margin-left: auto; color: rgba(255,255,255,.4); }
  .prow.j { opacity: .55; }
  .prow.j .pp { color: rgba(255,255,255,.4); font-size: 9px; }
  #sLog { bottom: 40px; right: 40px; width: 268px; }
  #logL div { padding: 2px 0; color: rgba(255,255,255,.32); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 9px; letter-spacing: .08em; }
  #logL div:hover { color: rgba(255,255,255,.8); }
  #logL div:last-child { color: rgba(255,255,255,.7); }

  /* top-center status */
  #status {
    position: absolute; top: 34px; left: 50%; transform: translateX(-50%);
    font-size: 9px; letter-spacing: .4em; color: rgba(255,255,255,.45);
    display: flex; gap: 26px; align-items: center; text-transform: uppercase;
  }
  #status .on { color: rgba(255,255,255,.9); }

  /* bottom-center progress wire */
  #prog {
    position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: flex-start;
  }
  .pnode { position: relative; width: 92px; text-align: center; }
  .pnode::before {
    content: ""; display: block; width: 7px; height: 7px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.6); margin: 0 auto 8px; background: #050505;
  }
  .pnode.done::before { background: rgba(255,255,255,.85); }
  .pnode .pl { font-size: 8.5px; letter-spacing: .18em; color: rgba(255,255,255,.45); }
  .pnode .pa2 { font-size: 8px; color: rgba(255,255,255,.3); margin-top: 3px; }
  .pwire { width: 60px; height: 1px; background: rgba(255,255,255,.22); margin-top: 3px; }
  .pnode:hover .pl { color: rgba(255,255,255,.85); }

  /* bottom-left caption */
  #cap { position: absolute; bottom: 40px; left: 40px; font-size: 9px; letter-spacing: .24em; color: rgba(255,255,255,.3); line-height: 2; }
  #cap b { color: rgba(255,255,255,.6); font-weight: 400; }
</style>
</head>
<body>
  <!-- viewport crop marks -->
  <div class="cm h" style="top:18px;left:18px"></div><div class="cm v" style="top:18px;left:18px"></div>
  <div class="cm h" style="top:18px;right:18px"></div><div class="cm v" style="top:18px;right:18px"></div>
  <div class="cm h" style="bottom:18px;left:18px"></div><div class="cm v" style="bottom:18px;left:18px"></div>
  <div class="cm h" style="bottom:18px;right:18px"></div><div class="cm v" style="bottom:18px;right:18px"></div>

  <div id="void">
    <div class="glow"></div>
    <img src="lamp_flat.png" alt="render">
    <div class="pool"></div>
    <div class="brk tl"></div><div class="brk tr"></div><div class="brk bl"></div><div class="brk br"></div>
    <div class="brkLbl" style="top:44px;left:126px" id="capTL"></div>
    <div class="brkLbl" style="top:44px;right:126px" id="capTR"></div>
    <div class="brkLbl" style="bottom:44px;left:126px" id="capBL"></div>
    <div class="brkLbl" style="bottom:44px;right:126px" id="capBR"></div>
  </div>

  <div id="brand"><div class="n">INKBENCH</div><div class="s">AGENTIC CAD · VOID SESSION</div></div>

  <div id="status"></div>

  <div class="sec" id="sBrief">
    <div class="lbl">01 — brief</div>
    <div class="btext" id="briefText"></div>
    <div class="brow"><input id="briefIn" spellcheck="false"><button id="briefBtn">→</button></div>
  </div>

  <div class="sec" id="sSpec">
    <div class="lbl">02 — spec</div>
    <div id="specRows"></div>
  </div>

  <div class="sec" id="sMat">
    <div class="lbl">03 — materials</div>
    <div id="matRows"></div>
  </div>

  <div class="sec" id="sVerify">
    <div class="lbl">04 — verify</div>
    <div id="verdict"></div>
    <div id="verdictSub"></div>
    <div id="checks"></div>
  </div>

  <div class="sec" id="sPlan">
    <div class="lbl">05 — two-arm plan</div>
    <div id="planRows"></div>
  </div>

  <div class="sec" id="sLog">
    <div class="lbl">06 — agent log</div>
    <div id="logL"></div>
  </div>

  <div id="prog"></div>

  <div id="cap"></div>

<script src="data.js"></script>
<script>
(function(){
  const D = window.DATA, $ = s => document.querySelector(s);
  const fmtSize = s => Array.isArray(s) ? s.join('×') : ('⌀' + (s.r*2) + '×' + s.h);
  const massOf = id => { const m = D.measures.find(m=>m.id===id); return m ? m.massG : 0; };

  /* corner labels of the frame */
  $('#capTL').textContent = 'FIG ' + D.figures[0].figNum + ' · ' + D.spec.name.toUpperCase();
  $('#capTR').textContent = 'UNITS ' + D.spec.units.toUpperCase();
  $('#capBL').textContent = D.spec.parts.length + ' PARTS / ' + D.spec.joints.length + ' JOINTS';
  $('#capBR').textContent = (D.measures.reduce((a,m)=>a+m.massG,0)/1000).toFixed(2) + ' KG';

  /* status */
  $('#status').innerHTML =
    '<span>brief</span><span>→</span><span>spec</span><span>→</span><span>render</span><span>→</span>' +
    '<span>verify</span><span>→</span><span>arms</span><span class="on">' +
    (D.report.pass ? '● ' + D.report.timingMs + 'ms · ok' : '● fault') + '</span>';

  /* brief */
  $('#briefText').textContent = '“' + D.brief + '”';
  $('#briefIn').value = D.brief;
  $('#briefBtn').onclick = () => {
    const l = document.createElement('div');
    l.textContent = 'brief ▸ ' + $('#briefIn').value;
    $('#logL').appendChild(l);
  };

  /* spec */
  $('#specRows').innerHTML = D.spec.parts.map(p =>
    '<div class="row"><span class="k">' + p.id + '</span><span class="v">' + p.shape + ' · ' + fmtSize(p.size) + '</span></div>').join('') +
    '<div class="row"><span class="k">mass</span><span class="v hi">' + (D.measures.reduce((a,m)=>a+m.massG,0)/1000).toFixed(2) + ' kg</span></div>';

  /* materials */
  $('#matRows').innerHTML = Object.entries(D.spec.materials).map(([k,m]) =>
    '<div class="row"><span class="k"><span class="sw" style="background:' + m.color + '"></span>' + k + '</span>' +
    '<span class="v">' + m.density + ' kg/m³</span></div>').join('');

  /* verify */
  const vd = $('#verdict');
  vd.textContent = D.report.pass ? 'PASS' : 'FAIL';
  if (!D.report.pass) vd.classList.add('fail');
  $('#verdictSub').textContent = D.report.checks.length + ' CHECKS · ' + D.report.failures.length + ' FAILURES · ATTEMPT ' + D.attempts;
  $('#checks').innerHTML = D.report.checks.map(c =>
    '<div class="chk" title="' + c.detail.replace(/"/g,'&quot;') + '">' +
    '<span class="d' + (c.status==='pass'?'':' f') + '">' + (c.status==='pass' ? '✓' : '✗') + '</span>' +
    '<span class="n">' + c.name + '</span><span class="m">' + (c.measured ? c.measured.toFixed(1) : '·') + '</span></div>').join('');

  /* plan */
  $('#planRows').innerHTML = D.plan.map(s => {
    if (s.kind === 'place') return '<div class="prow" title="seat (' + s.seat.join(',') + ') · ' + s.massG.toFixed(0) + 'g">' +
      '<span class="sn">' + String(s.step).padStart(2,'0') + '</span><span class="pp">' + s.part + '</span>' +
      '<span class="pa">' + s.glyph + ' arm ' + s.arm.toLowerCase() + '</span></div>';
    return '<div class="prow j" title="@(' + s.anchor.join(',') + ') axis (' + s.axis.join(',') + ')">' +
      '<span class="sn">··</span><span class="pp">' + s.type + ' ' + s.a + '~' + s.b + '</span></div>';
  }).join('');

  /* log */
  $('#logL').innerHTML = D.log.map(l => '<div>' + l + '</div>').join('');

  /* progress wire = pipeline stages */
  const stages = [
    {l:'brief', d:true, s:'“' + D.brief.slice(0,16) + '…”'},
    {l:'spec', d:true, s:D.spec.parts.length + ' parts'},
    {l:'render', d:true, s:'toon · iso'},
    {l:'verify', d:D.report.pass, s:D.report.timingMs + 'ms'},
    {l:'arms', d:D.report.pass, s:D.plan.filter(s=>s.kind==='place').length + ' seats'}
  ];
  $('#prog').innerHTML = stages.map((s,i) =>
    (i ? '<div class="pwire"></div>' : '') +
    '<div class="pnode' + (s.d ? ' done' : '') + '"><div class="pl">' + s.l + '</div><div class="pa2">' + s.s + '</div></div>').join('');

  /* caption */
  $('#cap').innerHTML = 'RENDER <b>ISO-35MM</b> · TOON<br>LIGHT <b>SOLE SOURCE</b><br>SESSION <b>ATTEMPT ' + D.attempts + '</b>';
})();
</script>
</body>
</html>
