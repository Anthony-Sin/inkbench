<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Commemorative Issue</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0e1f1a}
  body{font-family:Georgia,"Times New Roman",serif;color:#173f34}
  #stage{position:absolute;left:50%;top:50%;width:1700px;height:900px;transform:translate(-50%,-50%);
    background:radial-gradient(1000px 700px at 50% 30%,#17453a 0%,#0e1f1a 75%)}
  .sheet{position:absolute;inset:38px;background:#ece4cb;box-shadow:0 22px 60px rgba(0,0,0,.55);padding:0}
  /* selvage */
  .selv{position:absolute;color:#4d6356;font-size:10.5px;letter-spacing:3px;text-transform:uppercase}
  .selv.top{top:14px;left:56px;right:56px;display:flex;justify-content:space-between}
  .selv.left{top:50%;left:-190px;width:420px;transform:rotate(-90deg);transform-origin:center;text-align:center}
  .selv.right{top:50%;right:-190px;width:420px;transform:rotate(90deg);transform-origin:center;text-align:center}
  .selv.bot{bottom:12px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:center;gap:20px}
  .selv.bot .br{font-style:italic;text-transform:none;letter-spacing:.5px;font-size:13px;color:#173f34;flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .selv button{font:inherit;letter-spacing:2px;font-size:10.5px;background:#173f34;color:#ece4cb;border:0;
    padding:7px 16px;cursor:pointer;text-transform:uppercase;transition:.15s;flex:none}
  .selv button:hover{background:#b3402e}
  .inner{position:absolute;inset:52px 56px 64px;display:grid;grid-template-columns:792px 1fr;gap:26px}
  /* stamps */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:14px}
  .stamp{--p:6px;position:relative;background:#f9f5e6;padding:10px;cursor:default;transition:transform .15s;
    -webkit-mask:radial-gradient(var(--p),#0000 97%,#fff) 0 0/calc(var(--p)*2) calc(var(--p)*2) round,
      linear-gradient(#fff 0 0) 50%/calc(100% - var(--p)*2) calc(100% - var(--p)*2) no-repeat;
    mask:radial-gradient(var(--p),#0000 97%,#fff) 0 0/calc(var(--p)*2) calc(var(--p)*2) round,
      linear-gradient(#fff 0 0) 50%/calc(100% - var(--p)*2) calc(100% - var(--p)*2) no-repeat;
    box-shadow:0 4px 10px rgba(0,0,0,.2)}
  .stamp:hover{transform:translateY(-4px) rotate(-1deg)}
  .stamp .in{height:100%;border:1px solid #8fa393;display:flex;flex-direction:column;padding:7px 9px;
    background:repeating-linear-gradient(45deg,rgba(23,63,52,.045) 0 3px,transparent 3px 6px)}
  .stamp .ctry{font-size:9px;letter-spacing:3.5px;text-align:center;color:#173f34;font-weight:700}
  .stamp .denom{position:absolute;top:14px;right:16px;font-size:22px;font-weight:700;color:#173f34;font-variant-numeric:tabular-nums}
  .stamp .denom small{font-size:9px;display:block;text-align:right;letter-spacing:1px}
  .stamp .art{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 0}
  .stamp .nm{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;text-align:center}
  .stamp .dd{font-size:8.5px;text-align:center;color:#4d6356;letter-spacing:.5px;margin-top:2px}
  .stamp.big{grid-column:span 3;padding:12px}
  .stamp.big .in{flex-direction:row;align-items:stretch;padding:0;overflow:hidden}
  .stamp.big img{width:62%;object-fit:cover;filter:sepia(.2) contrast(1.05)}
  .stamp.big .side{flex:1;padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
  .stamp.big .side .ctry{font-size:10px}
  .stamp.big .side h4{font-size:21px;text-transform:uppercase;letter-spacing:2px;margin:6px 0}
  .stamp.big .side p{font-size:10.5px;line-height:1.55;color:#35504a}
  .stamp.big .denom{font-size:30px;top:16px;right:20px;color:#f9f5e6;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  /* postmark */
  .postmark{position:absolute;left:560px;top:96px;width:230px;height:230px;border:5px double #173f34;border-radius:50%;
    z-index:5;transform:rotate(-14deg);opacity:.85;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#173f34;text-align:center;
    background:radial-gradient(circle,rgba(236,228,203,.25),rgba(236,228,203,0) 70%)}
  .postmark .w1{font-size:11px;letter-spacing:4px}
  .postmark .w2{font-size:34px;font-weight:700;letter-spacing:3px;margin:2px 0}
  .postmark .w3{font-size:10px;letter-spacing:2.5px}
  .cancel{position:absolute;left:520px;top:150px;width:330px;height:150px;z-index:4;pointer-events:none;opacity:.55;
    background:repeating-linear-gradient(0deg,transparent 0 14px,#173f34 14px 18px);
    transform:rotate(-14deg);clip-path:polygon(0 0,78% 0,78% 100%,0 100%);border-radius:50%}
  /* right panel */
  .panel{display:flex;flex-direction:column;gap:14px;min-height:0}
  .card{border:1.5px solid #4d6356;background:#f2ecd8;padding:12px 16px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .card h5{font-size:10px;letter-spacing:3.5px;color:#173f34;font-variant:small-caps;border-bottom:1.5px solid #173f34;
    padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between}
  .card h5 .tag{font-size:9px;letter-spacing:1px;color:#8a5a3b;font-variant:normal}
  .paid{display:flex;gap:10px;align-items:baseline;font-size:11.5px;padding:4px 0;border-bottom:1px dotted #8fa393}
  .paid:last-of-type{border:0}
  .paid .stk{width:40px;flex:none;font-size:9px;letter-spacing:1px;border:1px solid #b3402e;color:#b3402e;
    text-align:center;padding:2px 0;transform:rotate(-4deg)}
  .paid .nm{text-transform:capitalize;white-space:nowrap}
  .paid .ms{margin-left:auto;font-variant-numeric:tabular-nums;font-size:10px;color:#4d6356}
  .verdline{margin-top:8px;font-size:11px;font-style:italic;color:#173f34;border-top:1.5px solid #173f34;padding-top:7px}
  .route{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
  .route .leg{display:flex;gap:10px;font-size:11px;padding:4px 0;border-bottom:1px dotted #8fa393;align-items:baseline}
  .route .leg .st{font-weight:700;color:#b3402e;font-variant-numeric:tabular-nums;flex:none;width:46px}
  .route .leg .arm{margin-left:auto;font-size:9px;letter-spacing:1px;border:1.5px solid #173f34;padding:1px 7px;border-radius:8px;flex:none}
  .route .jleg{font-size:10px;font-style:italic;color:#4d6356;padding:3px 0 3px 56px;border-bottom:1px dotted #8fa393}
  .marks{max-height:150px;overflow-y:auto;scrollbar-width:thin;font-size:10px;line-height:1.8;color:#35504a;font-style:italic}
  .marks div::before{content:"✉ " ;font-style:normal;color:#b3402e}
</style>
</head>
<body>
<div id="stage"><div class="sheet">
  <div class="selv top"><span>INKBENCH PHILATELIC WORKS — COMMEMORATIVE ISSUE № <span id="iss"></span></span>
    <span id="plt"></span><span>SHEET OF 6 · PERF 12</span></div>
  <div class="selv left">※ GEOMETRICALLY VERIFIED — HANDLE WITH PRECISION ※</div>
  <div class="selv right">PRINTED BY THE INKBENCH BENCH · AGENTIC INTAGLIO</div>
  <div class="selv bot">
    <span class="br">“<span id="brief"></span>”</span>
    <span id="paid"></span>
    <button id="post">Post brief ▸</button>
  </div>
  <div class="inner">
    <div class="grid" id="grid"></div>
    <div class="panel">
      <div class="card"><h5>Registered Receipt — Verification <span class="tag">KEEP THIS SLIP</span></h5>
        <div id="paidlist"></div>
        <div class="verdline" id="verdline"></div>
      </div>
      <div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column">
        <h5>Airmail Routing — Arms A / B <span class="tag">VIA WORKBENCH</span></h5>
        <div class="route" id="route"></div>
      </div>
      <div class="card"><h5>Service Markings</h5><div class="marks" id="marks"></div></div>
    </div>
  </div>
  <div class="cancel"></div>
  <div class="postmark"><span class="w1">INKBENCH</span><span class="w2" id="pm"></span><span class="w3" id="pmd"></span></div>
</div></div>
<script src="data.js"></script>
<script>
const D=window.DATA,S=D.spec,R=D.report;
const $=id=>document.getElementById(id);
const f=(n,d=1)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const mass=g=>g>=1000?f(g/1000,2)+'kg':f(g,0)+'g';
const dims=p=>p.shape==='box'?p.size.join('×'):'⌀'+(p.size.r*2)+'×'+p.size.h;
const G='#173f34';
const ico={
 cylinder:`<svg width="86" height="70" viewBox="0 0 86 70"><ellipse cx="43" cy="16" rx="34" ry="11" fill="${G}"/><path d="M9 16v38a34 11 0 0 0 68 0V16" fill="${G}" opacity=".82"/><ellipse cx="43" cy="54" rx="34" ry="11" fill="${G}"/></svg>`,
 box:`<svg width="86" height="70" viewBox="0 0 86 70"><path d="M18 26h40v38H18z" fill="${G}"/><path d="M18 26l12-14h40L58 26z" fill="${G}" opacity=".7"/><path d="M58 26l12-14v38L58 64z" fill="${G}" opacity=".45"/></svg>`,
 cone:`<svg width="86" height="70" viewBox="0 0 86 70"><path d="M43 6L12 54h62z" fill="${G}"/><ellipse cx="43" cy="54" rx="31" ry="10" fill="${G}" opacity=".8"/></svg>`};

$('iss').textContent=`IB-${D.figures[0].figNum}`;
$('plt').textContent=`PLATE № ${S.parts.length}·${S.joints.length}·${D.attempts}`;
$('brief').textContent=D.brief;
$('paid').textContent=`POSTAGE PAID BY AGENT — ${f(R.timingMs,0)} MS`;

const grid=$('grid');
S.parts.forEach((p,i)=>{
  const st=document.createElement('div');st.className='stamp';
  st.innerHTML=`<span class="denom">${i+1}<small>STEP</small></span><div class="in">
    <div class="ctry">INKBENCH</div><div class="art">${ico[p.shape]||ico.box}</div>
    <div class="nm">${p.id.replace('_',' ')}</div>
    <div class="dd">${p.shape} · ${dims(p)} ${S.units} · ${p.material}</div></div>`;
  grid.appendChild(st);
});
const big=document.createElement('div');big.className='stamp big';
big.innerHTML=`<span class="denom">${mass(D.measures.reduce((a,m)=>a+m.massG,0))}<small>TOTAL</small></span>
  <div class="in"><img src="lamp_flat.png" alt="souvenir stamp"><div class="side">
  <div class="ctry">INKBENCH — FIRST DAY OF ISSUE</div>
  <h4>${S.name}</h4>
  <p>${S.parts.length} parts · ${S.joints.length} joints · ${S.units}<br>
  Attempt ${D.attempts} · ${R.checks.length} frankings applied.<br>
  <i>“${D.brief}”</i></p></div></div>`;
grid.appendChild(big);

$('pm').textContent=R.pass?'VERIFIED':'VOID';
$('pmd').textContent=`FIG.${D.figures[0].figNum} · ${f(R.timingMs,0)}MS · ATT.${D.attempts}`;

$('paidlist').innerHTML=R.checks.map(c=>
  `<div class="paid" title="${c.detail.replace(/"/g,'')}"><span class="stk">${c.status==='pass'?'PAID':'DUE'}</span>
   <span class="nm">${c.name}</span><span class="ms">${c.measured?f(c.measured,2)+' '+S.units:'—'}</span></div>`).join('');
$('verdline').textContent=R.pass
  ?`All ${R.checks.length} frankings honored — article cleared for delivery.`
  :`Insufficient postage — returned to sender for rework.`;

let rt='';
D.plan.forEach(s=>{
  rt+=s.kind==='place'
    ?`<div class="leg"><span class="st">LEG ${s.step}</span><span><b>${s.part.replace('_',' ')}</b> — ${mass(s.massG)}</span><span class="arm">ARM ${s.arm}</span></div>`
    :`<div class="jleg">✈ transfer — ${s.type} joint · ${s.a} ~ ${s.b}</div>`;
});
$('route').innerHTML=rt;
$('marks').innerHTML=D.log.map(l=>`<div>${l}</div>`).join('');
$('post').onclick=()=>{$('marks').innerHTML+=`<div>brief posted ▸ ${D.brief}</div>`;$('marks').scrollTop=1e6};

const stage=document.getElementById('stage');
function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1700,innerHeight/900)})`}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
