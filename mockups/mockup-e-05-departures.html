<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH INT'L — DEPARTURES</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#0a0a0a;font-family:"Arial Narrow","Helvetica Neue Condensed",Arial,sans-serif;
    color:#f5d90a;display:flex;flex-direction:column;
  }
  /* header */
  #hd{
    flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:10px 22px;
    background:linear-gradient(#2e2e2e,#141414);border-bottom:3px solid #3d3d3d;
  }
  #hd .logo{font-size:34px;font-weight:900;letter-spacing:3px;color:#fff}
  #hd .logo em{color:#f5d90a;font-style:normal}
  #hd .sub{color:#8a8a8a;letter-spacing:4px;font-size:13px}
  #hd .clock{margin-left:auto;text-align:right}
  #hd .clock .t{font-size:30px;font-weight:700;color:#f5d90a;font-variant-numeric:tabular-nums}
  #hd .clock .tz{color:#8a8a8a;font-size:11px;letter-spacing:3px}
  /* main */
  main{flex:1;display:grid;grid-template-columns:1fr 420px;gap:14px;padding:14px;min-height:0}
  .board{
    background:#161616;border:2px solid #3a3a3a;border-radius:6px;
    box-shadow:inset 0 0 40px #000;overflow:hidden;display:flex;flex-direction:column;min-height:0;
  }
  .btitle{
    flex:0 0 auto;padding:8px 18px;color:#fff;font-size:16px;letter-spacing:5px;font-weight:700;
    background:#202020;border-bottom:2px solid #333;display:flex;justify-content:space-between;
  }
  .btitle .amber{color:#f5d90a}
  .rows{flex:1;overflow:auto;min-height:0;padding:4px 0}
  .colhead,.rowline{display:grid;gap:6px;padding:3px 18px;align-items:center}
  .colhead{color:#666;font-size:11px;letter-spacing:3px;position:sticky;top:0;background:#161616}
  /* split flap cell */
  .flapline{display:flex;gap:2px}
  .fc{
    display:inline-flex;align-items:center;justify-content:center;
    background:linear-gradient(#262626 48%,#000 48% 52%,#1c1c1c 52%);
    color:#f5d90a;font-weight:700;border-radius:2px;
    font-family:"Arial Narrow",Arial,sans-serif;font-size:17px;
    height:26px;width:17px;box-shadow:inset 0 -1px 0 #000;
  }
  .fc.w{color:#fff}.fc.dim{color:#8a6d00}.fc.r{color:#ff5a4e}.fc.g{color:#6fe07a}.fc.b{color:#5aa8ff}
  .fc.space{background:none;box-shadow:none;width:8px}
  /* row coloring */
  .rowline{border-bottom:1px solid #222}
  .rowline:hover{background:#1e1e00}
  /* side column */
  aside{display:flex;flex-direction:column;gap:14px;min-height:0}
  /* CRT monitor */
  #crt{
    flex:1;min-height:0;background:#0d1b0d;border:2px solid #3a3a3a;border-radius:6px;
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  }
  #crt img{max-height:100%;max-width:96%;object-fit:contain;filter:brightness(.9) contrast(1.1) sepia(.2) hue-rotate(60deg) saturate(.7)}
  #crt::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(rgba(0,0,0,.35) 0 1px,transparent 1px 3px);
  }
  #crt .cap{position:absolute;bottom:6px;left:10px;color:#7fff7f;font-size:11px;letter-spacing:2px;z-index:2;
    font-family:"Courier New",monospace}
  .panel{background:#161616;border:2px solid #3a3a3a;border-radius:6px;padding:10px 14px;overflow:auto}
  .panel h3{color:#fff;font-size:13px;letter-spacing:4px;margin-bottom:6px}
  .panel .txt{color:#f5d90a;font-size:14px;letter-spacing:1px}
  #briefline{width:100%;background:#0a0a0a;border:1px solid #3a3a3a;color:#f5d90a;font-family:inherit;
    font-size:14px;padding:6px;letter-spacing:1px}
  #briefline:focus{outline:1px solid #f5d90a}
  #go{background:#f5d90a;color:#000;border:none;font-weight:900;letter-spacing:2px;padding:7px 16px;cursor:pointer;font-family:inherit;font-size:13px}
  #go:hover{background:#fff}
  #loglines{font-family:"Courier New",monospace;font-size:11px;color:#c9b400;line-height:1.7;max-height:110px;overflow:auto}
  #loglines div::before{content:"» "}
  /* status banner */
  #banner{
    flex:0 0 auto;display:flex;align-items:center;gap:20px;padding:8px 22px;
    background:#141414;border-top:3px solid #3d3d3d;
  }
  #banner .big{font-size:22px;font-weight:900;letter-spacing:4px}
  .pass{color:#6fe07a}.fail{color:#ff5a4e}
  ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#3a3a3a}
</style>
</head>
<body>
<header id="hd">
  <div class="logo">INKBENCH <em>INT'L</em></div>
  <div class="sub">AGENTIC FABRICATION TERMINAL · CONCOURSE CAD</div>
  <div class="clock"><div class="t" id="clock">--:--</div><div class="tz" id="statustxt">…</div></div>
</header>
<main>
  <div class="board">
    <div class="btitle"><span>ASSEMBLY <span class="amber">DEPARTURES</span></span><span id="gateinfo"></span></div>
    <div class="rows" id="depboard"></div>
    <div class="btitle" style="border-top:2px solid #333"><span>VERIFICATION <span class="amber">ARRIVALS</span></span><span>ON-TIME RECORD</span></div>
    <div class="rows" id="arrboard" style="max-height:220px"></div>
  </div>
  <aside>
    <div id="crt"><img src="lamp_flat.png"><div class="cap" id="crtcap"></div></div>
    <div class="panel">
      <h3>MANIFEST — TODAY'S BUILD</h3>
      <input id="briefline"><button id="go" style="margin-top:8px;width:100%">FILE FLIGHT PLAN ▸</button>
    </div>
    <div class="panel" style="flex:1;min-height:0">
      <h3>TOWER ANNOUNCEMENTS</h3>
      <div id="loglines"></div>
    </div>
  </aside>
</main>
<footer id="banner"></footer>
<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s);
const mass=id=>{const m=D.measures.find(m=>m.id===id);return m?m.massG:0};
const f=a=>a.map(x=>(+x).toFixed(0)).join(',');

/* split-flap text → cells */
function flaps(str,cls){
  str=String(str).toUpperCase();let h='<span class="flapline">';
  for(const ch of str){
    if(ch===' '){h+='<span class="fc space"></span>';continue}
    h+='<span class="fc '+(cls||'')+'">'+ch+'</span>';
  }
  return h+'</span>';
}

/* departures: plan rows — cols: STEP | OPERATION | GATE | MASS | STATUS */
const dep=$('#depboard');
dep.appendChild(Object.assign(document.createElement('div'),{className:'colhead',
  innerHTML:'<span>STEP</span><span>OPERATION</span><span>GATE</span><span>MASS</span><span>STATUS</span>',
  style:'grid-template-columns:70px 1fr 150px 130px 200px'}));
const gridCols='70px 1fr 150px 130px 200px';
D.plan.forEach(s=>{
  const r=document.createElement('div');r.className='rowline';r.style.gridTemplateColumns=gridCols;
  if(s.kind==='place'){
    const gateCls=s.arm==='A'?'g':(s.arm==='B'?'b':'w');
    r.innerHTML=
      '<span>'+flaps(String(s.step).padStart(2,'0'),'w')+'</span>'+
      '<span>'+flaps('PLACE '+s.part.replace(/_/g,' '))+'</span>'+
      '<span>'+flaps('ARM '+s.arm,gateCls)+'</span>'+
      '<span>'+flaps(s.massG.toFixed(0)+' G','dim')+'</span>'+
      '<span>'+flaps(D.report.pass?'DEPARTED':'HOLD',D.report.pass?'g':'r')+'</span>';
  }else{
    r.innerHTML=
      '<span>'+flaps('⌁','dim')+'</span>'+
      '<span>'+flaps(s.type+' JOINT '+s.a+'~'+s.b,'dim')+'</span>'+
      '<span>'+flaps('--','dim')+'</span>'+
      '<span>'+flaps('','')+'</span>'+
      '<span>'+flaps(D.report.pass?'SECURED':'PENDING',D.report.pass?'w':'r')+'</span>';
  }
  dep.appendChild(r);
});
$('#gateinfo').textContent='GATES A · B SHARED USE — '+(D.report.pass?'ALL CLEAR':'DELAYS');

/* arrivals: checks */
const arr=$('#arrboard');
arr.appendChild(Object.assign(document.createElement('div'),{className:'colhead',
  innerHTML:'<span>CHECK</span><span>MEASURED</span><span>REMARK</span><span>RESULT</span>',
  style:'grid-template-columns:170px 110px 1fr 130px'}));
D.report.checks.forEach(k=>{
  const ok=k.status==='pass';
  const r=document.createElement('div');r.className='rowline';r.style.gridTemplateColumns='170px 110px 1fr 130px';
  r.innerHTML='<span>'+flaps(k.name,'w')+'</span>'+
    '<span>'+flaps(k.measured?(+k.measured).toFixed(1):'—','dim')+'</span>'+
    '<span>'+flaps(k.detail.slice(0,52),'dim')+'</span>'+
    '<span>'+flaps(ok?'ARRIVED':'CANCELLED',ok?'g':'r')+'</span>';
  arr.appendChild(r);
});

/* CRT caption + brief + log */
$('#crtcap').textContent='CAM 04 · '+(D.figures[0].name||'').toUpperCase()+' · '+(D.figures[0].parts||'')+' PARTS';
$('#briefline').value=D.brief.toUpperCase();
$('#go').onclick=()=>{const l=$('#loglines');const d=document.createElement('div');d.textContent='re-filed: '+$('#briefline').value.slice(0,40);l.prepend(d)};
$('#loglines').innerHTML=D.log.map(x=>'<div>'+x+'</div>').join('');

/* banner */
$('#banner').innerHTML=
  '<span class="big '+(D.report.pass?'pass':'fail')+'">'+(D.report.pass?'▸ ALL CHECKS PASS — CLEARED FOR FABRICATION':'▸ DELAYS — SEE DISPATCHER')+'</span>'+
  '<span style="color:#666;letter-spacing:2px">ATTEMPT '+D.attempts+' · VERIFY '+D.report.timingMs+'MS · '+D.spec.parts.length+' PARTS / '+D.spec.joints.length+' JOINTS</span>';
$('#statustxt').textContent=D.report.pass?'BOARDING COMPLETE':'IRREG OPS';

/* clock */
function tick(){const d=new Date();$('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
tick();setInterval(tick,15000);
</script>
</body>
</html>
