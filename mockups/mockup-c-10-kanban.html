<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1700">
<title>FIG-1 · Build pipeline — inkbench</title>
<style>
:root{
  --bg:#eaeef3; --col:#f4f6f9; --card:#ffffff;
  --line:#d9dee6; --line2:#c9d0db;
  --txt:#1f2733; --mut:#5d6a7d; --dim:#8b95a5;
  --purple:#7c5cd6; --blue:#2f7fe0; --green:#1e9e6a; --orange:#e0762d;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);overflow:hidden;display:flex;flex-direction:column;
  font:13px/1.5 "Inter","SF Pro Text",-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
::selection{background:#d9e4f5}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c3cbd6;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
#top{height:52px;flex:0 0 52px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 16px}
.mark{width:24px;height:24px;border-radius:7px;background:#1f2733;color:#fff;display:grid;place-items:center;
  font-size:11px;font-weight:800}
#top .bt{font-size:14px;font-weight:650;display:flex;align-items:center;gap:9px}
#top .bt .cr{color:var(--dim);font-weight:400}
.stagepill{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);background:var(--col);
  border:1px solid var(--line);border-radius:99px;padding:3px 11px}
.stagepill .d{width:7px;height:7px;border-radius:50%}
#top .r{margin-left:auto;display:flex;align-items:center;gap:9px}
#brief{width:300px;height:32px;border:1px solid var(--line2);border-radius:7px;padding:0 11px;
  font-size:12.5px;background:#fafbfd;transition:all .13s}
#brief::placeholder{color:var(--dim)}
#brief:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(47,127,224,.15)}
#go{height:32px;padding:0 14px;border-radius:7px;background:#1f2733;color:#fff;font-weight:600;font-size:12.5px;transition:background .13s}
#go:hover{background:#33405a}
#go:disabled{opacity:.45;cursor:not-allowed}
.verdpill{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:99px;
  font-size:12px;font-weight:650;background:#e4f5ec;color:var(--green)}
.verdpill .d{width:8px;height:8px;border-radius:50%;background:var(--green)}

/* ---------- board ---------- */
#board{flex:1;display:flex;gap:12px;padding:12px 14px;min-height:0}
.kcol{flex:1;min-width:0;background:var(--col);border:1px solid var(--line);border-radius:12px;
  display:flex;flex-direction:column;min-height:0}
.khead{display:flex;align-items:center;gap:8px;padding:12px 12px 9px;font-size:11.5px;font-weight:700;
  letter-spacing:.05em;color:var(--mut)}
.khead .d{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.khead .cnt{font:600 10px var(--mono);color:var(--dim);background:#e7ebf1;border-radius:9px;padding:1px 7px}
.khead .x{margin-left:auto;color:var(--dim);display:flex;gap:2px}
.khead .x button{width:22px;height:22px;border-radius:5px;color:var(--dim);font-size:13px;display:grid;place-items:center}
.khead .x button:hover{background:#e7ebf1;color:var(--txt)}
.kbody{flex:1;overflow-y:auto;min-height:0;padding:0 9px 12px;display:flex;flex-direction:column;gap:9px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 12px;
  box-shadow:0 1px 2px rgba(31,39,51,.06);transition:box-shadow .15s,transform .15s,border-color .15s;cursor:default}
.card:hover{box-shadow:0 6px 18px rgba(31,39,51,.11);transform:translateY(-1px);border-color:#cdd5df}
.card .ct{font-size:12.5px;font-weight:650;display:flex;align-items:center;gap:7px}
.card .ct .ic{font-size:12px}
.card .tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.tag{font:600 9.5px var(--mono);border-radius:4px;padding:2px 6px;letter-spacing:.02em}
.tag.pu{background:#efe9fd;color:var(--purple)}
.tag.bl{background:#e3effd;color:var(--blue)}
.tag.gr{background:#e4f5ec;color:var(--green)}
.tag.or{background:#fdeee1;color:var(--orange)}
.tag.gy{background:#edf0f4;color:var(--mut)}
.card .cd{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.5}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:8px;border-top:1px solid #eef1f5;
  font-size:10.5px;color:var(--dim)}
.card .foot .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.avatar{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:8.5px;font-weight:700;color:#fff}
.av-a{background:var(--blue)}.av-b{background:var(--purple)}.av-bot{background:#1f2733}

/* spec hero card */
.speccard{border-left:3px solid var(--purple)}
.speccard.st1{border-left-color:var(--blue)}
.speccard.st2{border-left-color:var(--green)}
.speccard.st3{border-left-color:var(--orange)}
.prow{display:flex;align-items:center;gap:7px;padding:3.5px 2px;font-size:11.5px;border-radius:5px}
.prow:hover{background:#f5f7fa}
.prow .sw{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.prow .id{flex:1;font-weight:550}
.prow .sz{font:10px var(--mono);color:var(--dim)}
.prow .ms{font:10px var(--mono);color:var(--mut)}
.adv{width:100%;height:30px;margin-top:9px;border-radius:7px;border:1px dashed var(--line2);
  color:var(--mut);font-size:11.5px;font-weight:600;transition:all .13s}
.adv:hover{border-style:solid;border-color:var(--blue);color:var(--blue);background:#f0f6fe}
.adv:disabled{border-style:solid;color:var(--green);border-color:#bfe6d2;background:#f2faf6;cursor:default}

/* render card */
.rcard{padding:7px}
.rcard img{display:block;width:100%;border-radius:6px}
.rcard .cap{display:flex;align-items:center;gap:7px;padding:7px 4px 2px;font-size:11px;color:var(--mut)}
.rcard .cap b{color:var(--txt);font-weight:600}
.rcard .vs{margin-left:auto;display:flex;gap:3px}
.rcard .vs button{font:600 9.5px var(--mono);padding:2px 7px;border-radius:4px;color:var(--dim);border:1px solid var(--line)}
.rcard .vs button.on{background:#1f2733;color:#fff;border-color:#1f2733}
.rcard .vs button:hover:not(.on){color:var(--txt);border-color:var(--line2)}

/* check rows */
.crow{display:flex;align-items:center;gap:8px;padding:4.5px 2px;font-size:11.5px;border-radius:5px}
.crow:hover{background:#f5f7fa}
.crow .ci{width:16px;height:16px;border-radius:50%;flex:0 0 16px;display:grid;place-items:center;
  font-size:9.5px;background:#e4f5ec;color:var(--green)}
.crow .nm{flex:1;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .mv{font:10px var(--mono);color:var(--blue)}
.crow .ps{font:600 9px var(--mono);color:var(--green);background:#e4f5ec;border-radius:4px;padding:1.5px 6px}

/* arm cards */
.oprow{display:flex;align-items:center;gap:8px;padding:4.5px 2px;font-size:11.5px;border-radius:5px}
.oprow:hover{background:#f5f7fa}
.oprow .n{font:600 9.5px var(--mono);color:var(--dim);width:15px;flex:0 0 15px}
.oprow .g{color:var(--mut);flex:0 0 12px;text-align:center}
.oprow .p{flex:1;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oprow .m{font:10px var(--mono);color:var(--dim)}
.oprow.joint .p{font-weight:450;color:var(--mut);font-size:10.5px}
.oprow.joint .g{color:var(--orange)}

/* log card */
.logl{font:10.5px/1.7 var(--mono);color:var(--mut);padding-top:6px}
.logl div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logl .g{color:var(--green)}.logl .c{color:var(--blue)}

/* column drop hint */
.kcol.hot{border-color:var(--blue);background:#eef4fc}
</style>
</head>
<body>

<div id="top">
  <div class="mark">IK</div>
  <div class="bt">inkbench <span class="cr">/</span> FIG-1 pipeline <span class="cr" id="bname"></span></div>
  <span class="stagepill"><span class="d" style="background:var(--green)"></span><span id="stagetxt"></span></span>
  <div class="r">
    <input id="brief" spellcheck="false" placeholder="New brief — describe a mechanism…">
    <button id="go">Submit</button>
    <span class="verdpill"><span class="d"></span><span id="verd"></span></span>
  </div>
</div>

<div id="board">
  <div class="kcol" data-stage="0">
    <div class="khead"><span class="d" style="background:var(--purple)"></span>DESIGNED
      <span class="cnt" data-cnt></span>
      <div class="x"><button title="Add card">＋</button><button title="Column options">···</button></div></div>
    <div class="kbody" id="col0"></div>
  </div>
  <div class="kcol" data-stage="1">
    <div class="khead"><span class="d" style="background:var(--blue)"></span>BUILT
      <span class="cnt" data-cnt></span>
      <div class="x"><button title="Add card">＋</button><button title="Column options">···</button></div></div>
    <div class="kbody" id="col1"></div>
  </div>
  <div class="kcol" data-stage="2">
    <div class="khead"><span class="d" style="background:var(--green)"></span>VERIFIED
      <span class="cnt" data-cnt></span>
      <div class="x"><button title="Add card">＋</button><button title="Column options">···</button></div></div>
    <div class="kbody" id="col2"></div>
  </div>
  <div class="kcol" data-stage="3">
    <div class="khead"><span class="d" style="background:var(--orange)"></span>ARMS-READY
      <span class="cnt" data-cnt></span>
      <div class="x"><button title="Add card">＋</button><button title="Column options">···</button></div></div>
    <div class="kbody" id="col3"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const checks=D.report.checks,passed=checks.filter(c=>c.status==='pass').length;
const fig=D.figures[0];
const v3=v=>'('+v.map(n=>(+n).toFixed(0)).join(',')+')';
const sizeOf=p=>Array.isArray(p.size)?p.size.join('×'):'r'+p.size.r+' h'+p.size.h;
const totalMass=D.measures.reduce((s,m)=>s+m.massG,0);
const stab=checks.find(c=>c.name==='stability');

$('#bname').textContent='· '+fig.name;
$('#stagetxt').textContent='spec → verify → build · '+D.report.timingMs.toFixed(0)+'ms';
$('#verd').textContent=D.report.pass?'VERIFIED':'FAILED';

/* ---- cards ---- */
const briefCard=document.createElement('div');briefCard.className='card';
briefCard.innerHTML=`<div class="ct"><span class="ic">✎</span>brief.txt</div>
  <div class="cd" id="briefcard-txt">“${esc(D.brief)}”</div>
  <div class="tags"><span class="tag pu">natural-language</span><span class="tag gy">1 attempt</span></div>
  <div class="foot"><span class="avatar av-bot">AG</span> agent-authored
    <span class="r"><span style="font-family:var(--mono)">${D.spec.units}</span></span></div>`;
$('#col0').appendChild(briefCard);

/* spec hero card — moves between columns */
const STAGES=['DESIGNED','BUILT','VERIFIED','ARMS-READY'];
const specCard=document.createElement('div');specCard.className='card speccard';specCard.id='speccard';
specCard.innerHTML=`
  <div class="ct"><span class="ic">⬡</span>${esc(D.spec.name).toLowerCase()}.spec
    <span class="tag pu" id="stagetag" style="margin-left:auto">${STAGES[0]}</span></div>
  <div class="tags"><span class="tag gy">${D.spec.parts.length} parts</span>
    <span class="tag gy">${D.spec.joints.length} joints</span>
    <span class="tag bl">${(totalMass/1000).toFixed(2)} kg</span></div>
  <div style="margin-top:6px">${D.spec.parts.map(p=>{
    const m=D.measures.find(x=>x.id===p.id);
    const col=(D.spec.materials[p.material]||{}).color||'#aaa';
    return `<div class="prow"><span class="sw" style="background:${col}"></span>
      <span class="id">${esc(p.id)}</span><span class="sz">${esc(p.shape)} · ${sizeOf(p)}</span>
      <span class="ms">${m?Math.round(m.massG)+'g':''}</span></div>`}).join('')}</div>
  <button class="adv" id="adv">advance → BUILT</button>`;
$('#col0').appendChild(specCard);
let stage=0;
const tagCol=['pu','bl','gr','or'];
$('#adv').addEventListener('click',()=>{
  if(stage>=3)return;
  stage++;
  $('#col'+stage).prepend(specCard);
  specCard.className='card speccard st'+stage;
  const tag=$('#stagetag');tag.textContent=STAGES[stage];tag.className='tag '+tagCol[stage];
  const adv=$('#adv');
  if(stage===3){adv.disabled=true;adv.textContent='✓ pipeline complete — arms ready'}
  else adv.textContent='advance → '+STAGES[stage+1];
  recount();
});

/* materials card */
const matCard=document.createElement('div');matCard.className='card';
matCard.innerHTML=`<div class="ct"><span class="ic">◆</span>materials</div>
  ${Object.entries(D.spec.materials).map(([n,m])=>`
    <div class="prow"><span class="sw" style="background:${m.color}"></span>
    <span class="id" style="text-transform:capitalize">${esc(n)}</span>
    <span class="sz">ρ</span><span class="ms">${m.density} kg/m³</span></div>`).join('')}
  <div class="foot">spec.materials<span class="r">${Object.keys(D.spec.materials).length} defined</span></div>`;
$('#col0').appendChild(matCard);

/* render card */
const rCard=document.createElement('div');rCard.className='card rcard';
rCard.innerHTML=`<img src="lamp_flat.png" alt="render" id="rcimg">
  <div class="cap"><span class="ic">▣</span><b>${esc(fig.name)}</b> toon render
    <div class="vs"><button class="on" data-i="lamp_flat.png">asm</button><button data-i="lamp_exploded.png">xpl</button></div></div>`;
$('#col1').appendChild(rCard);

/* assembly order card */
const asmCard=document.createElement('div');asmCard.className='card';
asmCard.innerHTML=`<div class="ct"><span class="ic">⇣</span>assembly order</div>
  ${D.spec.assembly.map((a,i)=>`<div class="oprow"><span class="n">${i+1}</span>
    <span class="g">↑</span><span class="p">${esc(a.part)}</span>
    <span class="m">from ${v3(a.insert_from)}</span></div>`).join('')}
  <div class="foot"><span class="avatar av-bot">AG</span> inserts verified clean
    <span class="r">${D.spec.assembly.length} ops</span></div>`;
$('#col1').appendChild(asmCard);

/* verified report card */
const repCard=document.createElement('div');repCard.className='card';
repCard.innerHTML=`<div class="ct"><span class="ic">✓</span>report.checks
    <span class="tag ${D.report.pass?'gr':'or'}" style="margin-left:auto">${D.report.pass?'PASS':'FAIL'}</span></div>
  ${checks.map(c=>`<div class="crow"><span class="ci">${c.status==='pass'?'✓':'✗'}</span>
    <span class="nm" title="${esc(c.detail)}">${esc(c.name)}</span>
    ${c.measured?`<span class="mv">${(+c.measured).toFixed(2)}</span>`:''}
    <span class="ps">${c.status==='pass'?'PASS':'FAIL'}</span></div>`).join('')}
  <div class="foot">${passed}/${checks.length} green<span class="r">${D.report.timingMs.toFixed(1)}ms</span></div>`;
$('#col2').appendChild(repCard);

/* metrics card */
const metCard=document.createElement('div');metCard.className='card';
metCard.innerHTML=`<div class="ct"><span class="ic">◷</span>metrics</div>
  <div class="prow"><span class="sw" style="background:var(--blue)"></span><span class="id">total mass</span><span class="ms">${(totalMass/1000).toFixed(2)} kg</span></div>
  <div class="prow"><span class="sw" style="background:var(--green)"></span><span class="id">tip margin</span><span class="ms">${stab?(+stab.measured).toFixed(1)+' mm':'—'}</span></div>
  <div class="prow"><span class="sw" style="background:var(--orange)"></span><span class="id">eval time</span><span class="ms">${D.report.timingMs.toFixed(1)} ms</span></div>
  <div class="prow"><span class="sw" style="background:var(--purple)"></span><span class="id">thresholds</span><span class="ms">≥${D.spec.tests.min_clearance_mm}mm · ≤${D.spec.tests.max_tip_angle_deg}°</span></div>
  <div class="tags"><span class="tag gr">within limits</span></div>`;
$('#col2').appendChild(metCard);

/* arm cards */
[['A','av-a'],['B','av-b']].forEach(([arm,avc])=>{
  const ops=D.plan.filter(o=>o.kind==='place'&&o.arm===arm||(o.kind==='place'&&o.arm==='A+B'));
  const jointsAfter={};
  let last='';
  D.plan.forEach(o=>{if(o.kind==='place')last=o.part;else jointsAfter[last]=o});
  const c=document.createElement('div');c.className='card';
  let rows='';
  D.plan.forEach(o=>{
    if(o.kind==='place'&&(o.arm===arm||o.arm==='A+B')){
      rows+=`<div class="oprow"><span class="n">${o.step}</span><span class="g">${o.glyph}</span>
        <span class="p">${esc(o.part)}</span><span class="m">${Math.round(o.massG)}g</span></div>`;
      const j=jointsAfter[o.part];
      if(j)rows+=`<div class="oprow joint"><span class="n">·</span><span class="g">◇</span>
        <span class="p">${esc(j.type)} ${esc(j.a)}↔${esc(j.b)}</span><span class="m">${v3(j.anchor)}</span></div>`;
    }
  });
  c.innerHTML=`<div class="ct"><span class="avatar ${avc}" style="width:20px;height:20px;font-size:9px">${arm}</span>
      ARM ${arm} <span class="tag ${arm==='A'?'bl':'pu'}" style="margin-left:auto">${ops.length} picks</span></div>
    <div style="margin-top:4px">${rows}</div>
    <div class="foot"><span class="avatar ${avc}">${arm}</span> calibrated
      <span class="r">${(ops.reduce((s,o)=>s+o.massG,0)/1000).toFixed(2)} kg payload</span></div>`;
  $('#col3').appendChild(c);
});

/* log card */
const logCard=document.createElement('div');logCard.className='card';
logCard.innerHTML=`<div class="ct"><span class="ic">▸</span>agent.log</div>
  <div class="logl" id="logl"></div>`;
$('#col3').appendChild(logCard);
const logl=logCard.querySelector('#logl');
function logLine(t,cls){
  const d=document.createElement('div');if(cls)d.className=cls;
  d.textContent=new Date().toTimeString().slice(0,8)+' '+t;logl.appendChild(d);
}
D.log.slice(-5).forEach(l=>logLine(l,/pass|✓|verified/i.test(l)?'g':/▸/.test(l)?'c':''));

/* counts */
function recount(){
  document.querySelectorAll('.kcol').forEach(c=>{
    c.querySelector('[data-cnt]').textContent=c.querySelectorAll('.card').length;
  });
}
recount();

/* brief submit */
const brief=$('#brief'),go=$('#go');brief.value=D.brief;
function submit(){
  const v=brief.value.trim();if(!v)return;
  go.disabled=true;go.textContent='Queued…';
  $('#briefcard-txt').textContent='“'+v+'”';
  logLine('brief ▸ '+v,'c');logLine('designing…');
  setTimeout(()=>{go.disabled=false;go.textContent='Submit'},1000);
}
go.addEventListener('click',submit);
brief.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});

/* render switch */
rCard.querySelectorAll('.vs button').forEach(b=>b.addEventListener('click',e=>{
  e.stopPropagation();
  rCard.querySelectorAll('.vs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');document.getElementById('rcimg').src=b.dataset.i;
}));
</script>
</body>
</html>
