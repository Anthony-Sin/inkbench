<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Wayfinding</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#cfcdc6;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#111;
    display:flex;flex-direction:column;
  }
  /* faint concrete seams */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(90deg,transparent 0 calc(33.3% - 1px),rgba(0,0,0,.05) calc(33.3% - 1px) 33.3%,transparent 33.3%),
               linear-gradient(90deg,transparent 0 calc(66.6% - 1px),rgba(0,0,0,.05) calc(66.6% - 1px) 66.6%,transparent 66.6%);}
  /* ================= masthead totem ================= */
  #mast{
    flex:0 0 auto;display:flex;align-items:stretch;background:#111;color:#fff;
    border-bottom:6px solid #d8000f;
  }
  #mast .blk{display:flex;align-items:center;padding:10px 26px;border-right:1px solid #333}
  #mast .logo{font-size:40px;font-weight:800;letter-spacing:-1px}
  #mast .logo .arw{color:#d8000f}
  #mast .where{font-size:12px;letter-spacing:3px;color:#999;line-height:1.7;text-transform:uppercase}
  #mast .where b{color:#fff;font-weight:700}
  #mast .stat{margin-left:auto;text-align:right;justify-content:center;border-right:none;border-left:1px solid #333}
  #mast .stat .s1{font-size:20px;font-weight:700;letter-spacing:2px}
  #mast .stat .s1.on{color:#4ade4a}#mast .stat .s1.hold{color:#ff5a4e}
  #mast .stat .s2{font-size:11px;letter-spacing:3px;color:#999;margin-top:3px;text-transform:uppercase}
  /* ================= sign wall ================= */
  #wall{flex:1;min-height:0;display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:16px;padding:16px 20px}
  .col{display:flex;flex-direction:column;gap:16px;min-height:0}
  /* hanging sign */
  .sign{
    background:#151517;color:#fff;position:relative;flex:0 0 auto;
    box-shadow:0 8px 0 -4px rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.25);
    display:flex;flex-direction:column;min-height:0;
  }
  .sign::before{content:"";position:absolute;top:-8px;left:14%;width:2px;height:8px;background:#555}
  .sign::after{content:"";position:absolute;top:-8px;right:14%;width:2px;height:8px;background:#555}
  .sign .stripe{height:10px;flex:0 0 auto}
  .sign .head{display:flex;align-items:baseline;gap:14px;padding:14px 20px 8px;flex:0 0 auto}
  .sign .head .h{font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
  .sign .head .ar{font-size:26px;font-weight:800}
  .sign .head .tag{margin-left:auto;font-size:11px;letter-spacing:3px;color:#888;text-transform:uppercase;text-align:right}
  .sign .body{flex:1;min-height:0;overflow-y:auto;padding:0 20px 14px}
  .sign.grow{flex:1;min-height:0}
  /* zone colors */
  .z-blue .stripe{background:#0072c6}.z-blue .ar{color:#4aa8ff}
  .z-green .stripe{background:#0fa44a}.z-green .ar{color:#4ade4a}
  .z-orange .stripe{background:#f07d00}.z-orange .ar{color:#ffab4a}
  .z-violet .stripe{background:#6a3aa8}.z-violet .ar{color:#b48ae8}
  .z-red .stripe{background:#d8000f}.z-red .ar{color:#ff5a4e}
  .z-gray .stripe{background:#666}.z-gray .ar{color:#aaa}
  /* directory rows — parts as destinations */
  .drow{
    display:grid;grid-template-columns:64px 1fr auto auto;gap:14px;align-items:center;
    padding:8px 0;border-bottom:1px solid #2a2a2e;cursor:default;
  }
  .drow:hover{background:#1e1e22;padding-left:6px}
  .drow .no{font-size:20px;font-weight:700;color:#4aa8ff;font-variant-numeric:tabular-nums}
  .drow .dst{font-size:17px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
  .drow .dst small{display:block;font-size:10.5px;font-weight:400;color:#888;letter-spacing:2px;text-transform:uppercase}
  .drow .mas{font-size:13px;color:#bbb;font-variant-numeric:tabular-nums;text-align:right}
  .drow .arw{font-size:22px;font-weight:800;color:#4aa8ff}
  .junc{padding:7px 0;border-bottom:1px dashed #2a2a2e;display:flex;gap:12px;font-size:13px;color:#999}
  .junc:last-child{border-bottom:none}
  .junc .ty{color:#fff;font-weight:600;text-transform:uppercase;letter-spacing:1px}
  .junc .x{color:#666}
  /* fare-zone swatches */
  .zone{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;color:#ccc}
  .zone .sw{width:16px;height:16px;flex:0 0 auto}
  .zone .rho{margin-left:auto;color:#888;font-variant-numeric:tabular-nums}
  /* render platform */
  #render .body{padding:0;display:flex;flex-direction:column}
  #render .imgw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden}
  #render img{max-width:100%;max-height:100%;object-fit:contain;filter:contrast(1.04)}
  #render .plat{
    flex:0 0 auto;display:flex;justify-content:space-between;padding:8px 20px;
    font-size:11px;letter-spacing:3px;color:#888;text-transform:uppercase;border-top:1px solid #2a2a2e;
  }
  /* verification board */
  .vrow{display:grid;grid-template-columns:1fr 90px 60px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #2a2a2e}
  .vrow:last-child{border-bottom:none}
  .vrow .nm{font-size:15px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
  .vrow .nm small{display:block;font-size:10px;font-weight:400;color:#888;letter-spacing:1px}
  .vrow .ms{font-size:13px;color:#bbb;text-align:right;font-variant-numeric:tabular-nums}
  .vrow .rs{font-size:18px;font-weight:800;text-align:right}
  .vrow .rs.p{color:#4ade4a}.vrow .rs.f{color:#ff5a4e}
  /* route request (brief) */
  #route textarea{
    width:100%;background:#0b0b0d;border:2px solid #333;color:#fff;font-family:inherit;
    font-size:14px;font-weight:600;letter-spacing:.5px;resize:none;height:58px;padding:9px;
  }
  #route textarea:focus{outline:none;border-color:#d8000f}
  #route .go{
    margin-top:8px;width:100%;background:#d8000f;color:#fff;border:none;
    font-family:inherit;font-size:15px;font-weight:800;letter-spacing:3px;padding:10px;cursor:pointer;text-align:left;
  }
  #route .go::after{content:" →";float:right}
  #route .go:hover{background:#ff2030}
  #route .go:active{transform:translateY(1px)}
  /* arms plan */
  .arow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid #2a2a2e}
  .arow:last-child{border-bottom:none}
  .arow .gl{font-size:24px;font-weight:800;color:#ffab4a;text-align:center}
  .arow .op{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .arow .op small{display:block;font-size:10px;font-weight:400;color:#888;letter-spacing:1px}
  .arow .ln{font-size:11px;font-weight:800;letter-spacing:2px;padding:3px 8px;color:#000}
  .arow .ln.a{background:#ffab4a}.arow .ln.b{background:#4aa8ff}
  .arow.j .gl{color:#666}.arow.j .op{color:#999;font-weight:400}
  .arow.j .ln{background:#333;color:#aaa}
  /* arrow-grid deco strip */
  #arrows{
    flex:0 0 auto;display:flex;align-items:center;gap:0;background:#111;color:#d8000f;
    font-size:26px;font-weight:800;letter-spacing:6px;padding:4px 26px;overflow:hidden;white-space:nowrap;
  }
  #arrows .lbl{color:#fff;font-size:13px;letter-spacing:4px;margin-left:auto;font-weight:600}
  /* logbook */
  #logbook .body{font-family:"Courier New",monospace;font-size:11.5px;color:#9a9a9a;line-height:1.8}
  #logbook .body div::before{content:"▸ ";color:#666}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#333}
</style>
</head>
<body>

<header id="mast">
  <div class="blk"><span class="logo">INKBENCH<span class="arw">→</span></span></div>
  <div class="blk"><div class="where">Level <b>-1</b> · Fabrication Concourse<br><b id="mstat">…</b></div></div>
  <div class="blk stat">
    <div class="s1" id="stat1"></div>
    <div class="s2" id="stat2"></div>
  </div>
</header>

<div id="wall">
  <!-- ================= COLUMN 1 ================= -->
  <div class="col">
    <section class="sign grow z-blue">
      <div class="stripe"></div>
      <div class="head"><span class="h">Parts</span><span class="ar">→</span><span class="tag" id="dirtag"></span></div>
      <div class="body" id="dir"></div>
    </section>
    <section class="sign z-violet">
      <div class="stripe"></div>
      <div class="head"><span class="h">Junctions</span><span class="ar">↔</span><span class="tag">interchange</span></div>
      <div class="body" id="junc" style="max-height:150px"></div>
    </section>
    <section class="sign z-gray">
      <div class="stripe"></div>
      <div class="head"><span class="h">Fare Zones</span><span class="ar">⇄</span><span class="tag">materials</span></div>
      <div class="body" id="zones"></div>
    </section>
  </div>

  <!-- ================= COLUMN 2 ================= -->
  <div class="col">
    <section class="sign grow z-green" id="render">
      <div class="stripe"></div>
      <div class="head"><span class="h">Render</span><span class="ar">↑</span><span class="tag">viewing platform</span></div>
      <div class="body">
        <div class="imgw"><img src="lamp_flat.png" alt="render"></div>
        <div class="plat"><span id="platl"></span><span id="platr"></span></div>
      </div>
    </section>
    <section class="sign z-green">
      <div class="stripe"></div>
      <div class="head"><span class="h">Verification</span><span class="ar">→</span><span class="tag" id="vtag"></span></div>
      <div class="body" id="veri" style="max-height:220px"></div>
    </section>
  </div>

  <!-- ================= COLUMN 3 ================= -->
  <div class="col">
    <section class="sign z-red" id="route">
      <div class="stripe"></div>
      <div class="head"><span class="h">Route Request</span><span class="ar">➤</span><span class="tag">information desk</span></div>
      <div class="body" style="flex:0 0 auto">
        <textarea id="brief" spellcheck="false"></textarea>
        <button class="go" id="submit">Route it</button>
      </div>
    </section>
    <section class="sign grow z-orange">
      <div class="stripe"></div>
      <div class="head"><span class="h">Robot Arms</span><span class="ar">→</span><span class="tag">tracks A · B</span></div>
      <div class="body" id="plan"></div>
    </section>
    <section class="sign z-gray" id="logbook">
      <div class="stripe"></div>
      <div class="head"><span class="h">Logbook</span><span class="ar">↓</span><span class="tag">control room</span></div>
      <div class="body" style="max-height:150px" id="log"></div>
    </section>
  </div>
</div>

<footer id="arrows"><span id="arrowrun"></span><span class="lbl" id="flr"></span></footer>

<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s);
const f=(a,d=0)=>a.map(x=>(+x).toFixed(d)).join(', ');
const mass=id=>{const m=D.measures.find(m=>m.id===id);return m?m.massG:0};

/* ---- masthead status ---- */
$('#stat1').textContent=D.report.pass?'ON TIME — ALL LINES CLEAR':'DELAYS — HOLD AT GATE';
$('#stat1').className='s1 '+(D.report.pass?'on':'hold');
$('#stat2').textContent='ATTEMPT '+D.attempts+' · VERIFIED IN '+D.report.timingMs+' MS';
$('#mstat').textContent=D.report.pass?'service normal':'irregular operations';

/* ---- directory: parts as destinations ---- */
let h='';
D.spec.parts.forEach((p,i)=>{
  const m=D.measures.find(m=>m.id===p.id);
  const sz=Array.isArray(p.size)?p.size.join('×'):('r'+p.size.r+' h'+p.size.h);
  h+='<div class="drow"><span class="no">'+String(i+1).padStart(2,'0')+'</span>'+
     '<span class="dst">'+p.id.replace(/_/g,' ')+'<small>'+p.shape+' · '+sz+' '+D.spec.units+' · '+p.material+'</small></span>'+
     '<span class="mas">'+(m?m.massG.toFixed(0):'—')+' g</span><span class="arw">→</span></div>';
});
$('#dir').innerHTML=h;
$('#dirtag').textContent=D.spec.parts.length+' stops · '+D.spec.units;

/* ---- junctions ---- */
$('#junc').innerHTML=D.spec.joints.map(j=>
  '<div class="junc"><span class="ty">'+j.type+'</span><span>'+j.a+' ↔ '+j.b+'</span>'+
  '<span class="x">axis ['+f(j.axis)+']</span></div>').join('');

/* ---- fare zones (materials) ---- */
$('#zones').innerHTML=Object.entries(D.spec.materials).map(([n,m])=>
  '<div class="zone"><span class="sw" style="background:'+m.color+'"></span>'+n.toUpperCase()+
  '<span class="rho">ρ '+m.density+' kg/m³</span></div>').join('');

/* ---- render platform ---- */
$('#platl').textContent=(D.figures[0].name||'model')+' — platform view';
$('#platr').textContent='exploded order: '+(D.report.explodedOrder||[]).join('·');

/* ---- verification ---- */
$('#veri').innerHTML=D.report.checks.map(k=>{
  const p=k.status==='pass';
  return '<div class="vrow"><span class="nm">'+k.name+'<small>'+k.detail.slice(0,58)+'</small></span>'+
    '<span class="ms">'+(k.measured?(+k.measured).toFixed(1):'—')+'</span>'+
    '<span class="rs '+(p?'p':'f')+'">'+(p?'PASS→':'HELD')+'</span></div>';
}).join('');
$('#vtag').textContent=D.report.checks.filter(c=>c.status==='pass').length+'/'+D.report.checks.length+' cleared';

/* ---- arms plan ---- */
h='';
D.plan.forEach(s=>{
  if(s.kind==='place'){
    const cls=s.arm.indexOf('B')>-1?'b':'a';
    h+='<div class="arow"><span class="gl">'+s.glyph+'</span>'+
      '<span class="op">Place '+s.part.replace(/_/g,' ')+'<small>seat ['+f(s.seat,0)+'] · '+s.massG.toFixed(0)+' g</small></span>'+
      '<span class="ln '+cls+'">ARM '+s.arm+'</span></div>';
  }else{
    h+='<div class="arow j"><span class="gl">↔</span>'+
      '<span class="op">'+s.type+' junction '+s.a+'~'+s.b+'<small>anchor ['+f(s.anchor,0)+']'+(s.late?' · late bind':'')+'</small></span>'+
      '<span class="ln">LOCK</span></div>';
  }
});
$('#plan').innerHTML=h;

/* ---- brief / submit / log ---- */
$('#brief').value=D.brief.toUpperCase();
$('#submit').onclick=()=>{
  const l=$('#log');l.prepend(Object.assign(document.createElement('div'),
    {textContent:'route re-filed: "'+$('#brief').value.slice(0,42)+'…"'}));
};
$('#log').innerHTML=D.log.map(x=>'<div>'+x+'</div>').join('');

/* ---- arrow grid footer ---- */
$('#arrowrun').textContent='→ '.repeat(60);
$('#flr').textContent='INKBENCH CONCOURSE · YOU ARE HERE ◎ · ALL ROUTES VERIFIED';
</script>
</body>
</html>
