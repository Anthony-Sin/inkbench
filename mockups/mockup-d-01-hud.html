<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Holo HUD</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1700px; height: 900px; overflow: hidden; }
  body {
    background: #04090c;
    color: #bfe8e2;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    position: relative;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }

  /* ---------- full-bleed render stage ---------- */
  #stage { position: absolute; inset: 0; }
  #stage .glow {
    position: absolute; left: 50%; top: 50%;
    width: 760px; height: 860px; transform: translate(-50%,-50%);
    background: radial-gradient(ellipse at 50% 55%, rgba(45,212,191,.14), rgba(45,212,191,.04) 55%, transparent 75%);
  }
  #stage img {
    position: absolute; left: 50%; top: 50%;
    height: 872px; transform: translate(-50%,-50%);
    filter: drop-shadow(0 0 26px rgba(45,212,191,.22)) saturate(1.05);
  }

  /* ---------- crosshair overlay ---------- */
  .xline { position: absolute; background: rgba(94,234,212,.14); pointer-events: none; }
  .xline.h { left: 0; right: 0; top: 50%; height: 1px; }
  .xline.v { top: 0; bottom: 0; left: 50%; width: 1px; }
  .xring {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    border: 1px solid rgba(94,234,212,.28); border-radius: 50%; pointer-events: none;
  }
  .xtick { position: absolute; background: rgba(94,234,212,.4); pointer-events: none; }
  .xlabel {
    position: absolute; font-size: 10px; letter-spacing: .18em;
    color: rgba(94,234,212,.55); pointer-events: none;
  }

  /* ---------- glass panels ---------- */
  .panel {
    position: absolute;
    background: linear-gradient(160deg, rgba(10,28,32,.72), rgba(7,18,22,.62));
    border: 1px solid rgba(94,234,212,.35);
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 10px 34px rgba(0,0,0,.5), inset 0 0 22px rgba(45,212,191,.05);
    padding: 12px 14px;
  }
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 12px; height: 12px;
    border-color: rgba(94,234,212,.9); border-style: solid;
  }
  .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .panel::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .phead {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 10px; letter-spacing: .3em; color: #5eead4;
    border-bottom: 1px solid rgba(94,234,212,.22);
    padding-bottom: 7px; margin-bottom: 9px; text-transform: uppercase;
  }
  .phead .dim { color: rgba(191,232,226,.45); letter-spacing: .12em; }

  /* brief (top-left) */
  #pBrief { top: 22px; left: 24px; width: 342px; }
  #briefText { font-size: 13.5px; line-height: 1.55; color: #e6fffa; }
  .briefrow { display: flex; gap: 8px; margin-top: 11px; }
  .briefrow input {
    flex: 1; background: rgba(4,12,14,.8); border: 1px solid rgba(94,234,212,.4);
    color: #ccfbf1; font-size: 12px; padding: 8px 10px; outline: none;
    font-family: inherit;
  }
  .briefrow input:focus { border-color: #5eead4; box-shadow: 0 0 10px rgba(94,234,212,.3); }
  .briefrow button {
    background: rgba(45,212,191,.16); border: 1px solid #5eead4; color: #99f6e4;
    font-size: 11px; letter-spacing: .14em; padding: 0 14px; cursor: pointer;
    text-transform: uppercase; font-family: inherit;
  }
  .briefrow button:hover { background: rgba(45,212,191,.34); color: #04100e; }

  /* verify (top-right) */
  #pVerify { top: 22px; right: 24px; width: 372px; }
  .verdict {
    display: flex; align-items: center; gap: 10px; margin-bottom: 9px;
  }
  .verdict .badge {
    font-size: 17px; letter-spacing: .3em; padding: 5px 14px 5px 17px;
    border: 1px solid #34d399; color: #6ee7b7;
    background: rgba(52,211,153,.1); text-shadow: 0 0 12px rgba(110,231,183,.7);
  }
  .verdict .meta { font-size: 10.5px; color: rgba(191,232,226,.6); line-height: 1.5; }
  .chk {
    display: grid; grid-template-columns: 14px 104px 1fr; gap: 8px; align-items: center;
    padding: 4.5px 0; border-top: 1px dashed rgba(94,234,212,.14); font-size: 11.5px;
    cursor: default;
  }
  .chk:hover { background: rgba(94,234,212,.07); }
  .chk .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; }
  .chk .nm { color: #a7f3d0; text-transform: uppercase; font-size: 10px; letter-spacing: .12em; }
  .chk .dt { color: rgba(191,232,226,.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* spec (bottom-left) */
  #pSpec { bottom: 24px; left: 24px; width: 430px; }
  .mats { display: flex; gap: 8px; margin-bottom: 9px; }
  .mat {
    display: flex; align-items: center; gap: 6px; font-size: 10.5px;
    border: 1px solid rgba(94,234,212,.25); padding: 4px 9px; color: rgba(191,232,226,.8);
  }
  .mat .sw { width: 10px; height: 10px; border: 1px solid rgba(255,255,255,.4); }
  .partsT { width: 100%; border-collapse: collapse; font-size: 11px; }
  .partsT th {
    text-align: left; font-size: 9px; letter-spacing: .2em; color: rgba(94,234,212,.6);
    font-weight: 400; padding: 3px 6px 5px; border-bottom: 1px solid rgba(94,234,212,.2);
    text-transform: uppercase;
  }
  .partsT td { padding: 4px 6px; border-bottom: 1px solid rgba(94,234,212,.08); color: rgba(224,255,250,.85); }
  .partsT tr:hover td { background: rgba(94,234,212,.06); }
  .partsT .id { color: #5eead4; }
  .partsT .num { text-align: right; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; }

  /* plan dock (bottom-center) */
  #pPlan { bottom: 24px; left: 50%; transform: translateX(-50%); width: 560px; padding-bottom: 10px; }
  .planrow { display: flex; gap: 7px; }
  .step {
    flex: 1; border: 1px solid rgba(94,234,212,.3); background: rgba(6,16,19,.6);
    padding: 7px 6px 6px; text-align: center; position: relative; cursor: default;
  }
  .step:hover { border-color: #5eead4; background: rgba(45,212,191,.1); }
  .step .g { font-size: 15px; color: #99f6e4; }
  .step .pt { font-size: 9.5px; margin-top: 3px; color: #e6fffa; letter-spacing: .05em; }
  .step .ar {
    position: absolute; top: -7px; right: -4px; font-size: 8.5px; padding: 1px 5px;
    border: 1px solid; letter-spacing: .08em;
  }
  .armA { color: #7dd3fc; border-color: #7dd3fc; background: #04121a; }
  .armB { color: #f9a8d4; border-color: #f9a8d4; background: #1a0a14; }
  .armAB { color: #fcd34d; border-color: #fcd34d; background: #171204; }
  .step.joint { border-style: dashed; opacity: .8; }
  .step.joint .g { font-size: 11px; padding-top: 2px; }

  /* log (bottom-right) */
  #pLog { bottom: 24px; right: 24px; width: 330px; }
  #pLog .lines { font-size: 10.8px; line-height: 1.75; font-family: ui-monospace, Menlo, monospace; }
  #pLog .lines div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(191,232,226,.72); }
  #pLog .lines div:last-child { color: #5eead4; }
  #pLog .lines div:hover { color: #e6fffa; }

  /* top status strip */
  #status {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    display: flex; gap: 26px; align-items: center;
    font-size: 10px; letter-spacing: .26em; color: rgba(153,246,228,.85);
    border: 1px solid rgba(94,234,212,.35); border-top: none;
    background: rgba(6,16,19,.7); backdrop-filter: blur(8px);
    padding: 7px 26px 8px; text-transform: uppercase;
  }
  #status .ok { color: #6ee7b7; }
  #status b { color: #5eead4; font-weight: 600; }
  .scanline {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.09) 3px 4px);
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="glow"></div>
    <img src="lamp_flat.png" alt="render">
    <!-- crosshair overlay -->
    <div class="xline h"></div><div class="xline v"></div>
    <div class="xring" style="width:340px;height:340px"></div>
    <div class="xring" style="width:520px;height:520px;border-style:dashed;opacity:.6"></div>
    <div id="xticks"></div>
    <div class="xlabel" style="left:calc(50% + 14px);top:calc(50% - 20px)">FOCUS · Z+590mm</div>
    <div class="xlabel" id="coordLabel" style="left:calc(50% - 130px);top:calc(50% + 14px)">TRACKING</div>
  </div>

  <div id="status"></div>

  <div class="panel" id="pBrief">
    <div class="phead"><span>Brief · Input</span><span class="dim">CH-01</span></div>
    <div id="briefText"></div>
    <div class="briefrow">
      <input id="briefIn" spellcheck="false">
      <button id="briefBtn">Submit ▸</button>
    </div>
  </div>

  <div class="panel" id="pVerify">
    <div class="phead"><span>Geometric Verify</span><span class="dim" id="vTime"></span></div>
    <div class="verdict"><div class="badge" id="vBadge"></div><div class="meta" id="vMeta"></div></div>
    <div id="checks"></div>
  </div>

  <div class="panel" id="pSpec">
    <div class="phead"><span>Spec · <span id="specName"></span></span><span class="dim" id="specUnits"></span></div>
    <div class="mats" id="mats"></div>
    <table class="partsT"><thead><tr>
      <th>Part</th><th>Shape</th><th>Size</th><th>Material</th><th style="text-align:right">Mass g</th>
    </tr></thead><tbody id="partsBody"></tbody></table>
  </div>

  <div class="panel" id="pPlan">
    <div class="phead"><span>Two-Arm Build Plan</span><span class="dim" id="planMeta"></span></div>
    <div class="planrow" id="planRow"></div>
  </div>

  <div class="panel" id="pLog">
    <div class="phead"><span>Agent Log</span><span class="dim">TTY</span></div>
    <div class="lines" id="logLines"></div>
  </div>

  <div class="scanline"></div>

<script src="data.js"></script>
<script>
(function(){
  const D = window.DATA;
  const $ = s => document.querySelector(s);
  const fmtSize = s => Array.isArray(s) ? s.join('×') : ('⌀' + (s.r*2) + '×' + s.h);
  const massOf = id => { const m = D.measures.find(m=>m.id===id); return m ? m.massG : 0; };

  /* status strip */
  $('#status').innerHTML =
    '<span><b>INKBENCH</b> · AGENTIC CAD</span>' +
    '<span>FIG ' + D.figures[0].figNum + ' · ' + D.figures[0].name.toUpperCase() + '</span>' +
    '<span class="ok">' + (D.report.pass ? '● VERIFIED' : '● FAILED') + '</span>' +
    '<span>' + D.report.timingMs + 'ms · ATTEMPT ' + D.attempts + '</span>';

  /* crosshair ticks along axes */
  const xt = $('#xticks');
  let html = '';
  for (let i=-4;i<=4;i++){ if(!i) continue;
    html += '<div class="xtick" style="left:calc(50% + ' + (i*90) + 'px);top:calc(50% - 5px);width:1px;height:10px"></div>';
    html += '<div class="xtick" style="top:calc(50% + ' + (i*90) + 'px);left:calc(50% - 5px);height:1px;width:10px"></div>';
  }
  xt.innerHTML = html;

  /* brief */
  $('#briefText').textContent = '“' + D.brief + '”';
  $('#briefIn').value = D.brief;
  $('#briefBtn').onclick = () => {
    const l = document.createElement('div');
    l.textContent = 'brief ▸ ' + $('#briefIn').value;
    $('#logLines').appendChild(l); l.scrollIntoView();
    $('#coordLabel').textContent = 'QUEUED · ' + D.report.timingMs + 'ms';
  };

  /* verify */
  $('#vBadge').textContent = D.report.pass ? 'PASS' : 'FAIL';
  if (!D.report.pass) { $('#vBadge').style.borderColor='#f87171'; $('#vBadge').style.color='#fca5a5'; }
  $('#vTime').textContent = D.report.timingMs + 'ms';
  $('#vMeta').innerHTML = D.report.checks.length + ' CHECKS · ' +
    (D.report.failures.length ? D.report.failures.length + ' FAIL' : '0 FAIL') +
    '<br>ATTEMPT ' + D.attempts + ' OF ∞';
  $('#checks').innerHTML = D.report.checks.map(c =>
    '<div class="chk" title="' + c.detail.replace(/"/g,'&quot;') + '">' +
      '<span class="dot" style="' + (c.status!=='pass' ? 'background:#f87171;box-shadow:0 0 8px #f87171' : '') + '"></span>' +
      '<span class="nm">' + c.name + '</span><span class="dt">' + c.detail + '</span></div>').join('');

  /* spec */
  $('#specName').textContent = D.spec.name;
  $('#specUnits').textContent = D.spec.units.toUpperCase() + ' · ' + D.spec.joints.length + ' JOINTS';
  $('#mats').innerHTML = Object.entries(D.spec.materials).map(([k,m]) =>
    '<span class="mat"><span class="sw" style="background:' + m.color + '"></span>' + k +
    ' · ' + m.density + '</span>').join('');
  $('#partsBody').innerHTML = D.spec.parts.map(p =>
    '<tr><td class="id">' + p.id + '</td><td>' + p.shape + '</td><td class="num">' + fmtSize(p.size) +
    '</td><td>' + p.material + '</td><td class="num">' + massOf(p.id).toFixed(0) + '</td></tr>').join('');

  /* plan */
  const places = D.plan.filter(s => s.kind === 'place');
  $('#planMeta').textContent = places.length + ' SEATS · ' + D.plan.filter(s=>s.kind==='joint').length + ' JOINT OPS';
  $('#planRow').innerHTML = D.plan.map(s => {
    if (s.kind === 'place') {
      const cls = s.arm === 'A' ? 'armA' : s.arm === 'B' ? 'armB' : 'armAB';
      return '<div class="step" title="seat (' + s.seat.join(', ') + ') · ' + s.massG.toFixed(0) + 'g">' +
        '<span class="ar ' + cls + '">' + s.arm + '</span>' +
        '<div class="g">' + s.glyph + '</div><div class="pt">' + s.part + '</div></div>';
    }
    return '<div class="step joint" title="' + s.type + ' joint ' + s.a + '~' + s.b + '">' +
      '<div class="g">⚿ ' + s.type.slice(0,3).toUpperCase() + '</div><div class="pt">' + s.a + '~' + s.b + '</div></div>';
  }).join('');

  /* log */
  $('#logLines').innerHTML = D.log.map(l => '<div>' + l + '</div>').join('');
})();
</script>
</body>
</html>
