<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH 95</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,"MS Sans Serif",Geneva,sans-serif;font-size:11px}
  html,body{height:100%;overflow:hidden}
  body{background:#008080;position:relative}
  /* desktop icon */
  .dicon{position:absolute;top:18px;left:18px;width:74px;text-align:center;color:#fff;cursor:default;z-index:1}
  .dicon .img{width:42px;height:42px;margin:0 auto 4px;background:#c0c0c0;border:2px outset #fff;display:flex;align-items:center;justify-content:center;font-size:22px}
  .dicon span{background:rgba(0,0,128,.0);padding:1px 3px}
  .dicon:hover span{background:#000080}
  /* ===== window ===== */
  .win{
    position:absolute;background:#c0c0c0;padding:3px;
    border:2px outset #fff;box-shadow:2px 2px 0 rgba(0,0,0,.55);
    display:flex;flex-direction:column;min-width:180px;
  }
  .win.focus{box-shadow:3px 3px 0 rgba(0,0,0,.65)}
  .tbar{
    height:20px;display:flex;align-items:center;padding:0 3px;gap:4px;
    background:#808080;color:#dfdfdf;font-weight:bold;cursor:grab;user-select:none;flex:0 0 auto;
  }
  .win.focus .tbar{background:linear-gradient(90deg,#000080,#1084d0);color:#fff}
  .tbar .icn{width:14px;height:14px;background:#c0c0c0;border:1px outset #fff;display:flex;align-items:center;justify-content:center;font-size:9px;color:#000;flex:0 0 auto}
  .tbar .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbtn{width:16px;height:14px;background:#c0c0c0;border:1px outset #fff;color:#000;font-size:9px;font-weight:bold;line-height:1;cursor:pointer;flex:0 0 auto}
  .tbtn:active{border-style:inset}
  .menu{display:flex;gap:2px;padding:2px 2px 4px;flex:0 0 auto}
  .menu span{padding:1px 6px;cursor:default}
  .menu span:hover{background:#000080;color:#fff}
  .wbody{
    flex:1;min-height:0;overflow:auto;background:#fff;border:2px inset #fff;padding:4px;
  }
  .sbar{display:flex;gap:3px;padding-top:3px;flex:0 0 auto}
  .sbar .cell{border:1px inset #fff;padding:1px 6px;color:#333;white-space:nowrap}
  .sbar .cell.grow{flex:1}
  /* widgets */
  .btn{background:#c0c0c0;border:2px outset #fff;padding:3px 14px;font-size:11px;cursor:pointer;font-family:inherit}
  .btn:active{border-style:inset}
  .btn:focus{outline:1px dotted #000;outline-offset:-4px}
  textarea{width:100%;height:64px;border:2px inset #fff;font-family:"Courier New",monospace;font-size:11px;padding:3px;resize:none}
  textarea:focus{outline:none}
  table{border-collapse:collapse;width:100%;font-size:11px}
  td,th{border:1px solid #808080;padding:2px 5px;text-align:left}
  th{background:#000080;color:#fff;font-weight:normal}
  tr:nth-child(even) td{background:#f0f0f0}
  .imgwin{background:#808080;display:flex;align-items:center;justify-content:center}
  .imgwin img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:auto;border:1px solid #000}
  .ok{color:#008000;font-weight:bold}
  .bad{color:#c00000;font-weight:bold}
  ul.log{list-style:none;font-family:"Courier New",monospace;font-size:11px}
  ul.log li{padding:1px 3px;white-space:pre-wrap}
  ul.log li:hover{background:#000080;color:#fff}
  .mat{display:inline-block;width:10px;height:10px;border:1px solid #000;vertical-align:-1px;margin-right:4px}
  .prog{border:2px inset #fff;height:14px;background:#fff;position:relative;margin-top:4px}
  .prog i{position:absolute;inset:1px auto 1px 1px;background:repeating-linear-gradient(90deg,#000080 0 8px,transparent 8px 10px);width:calc(100% - 2px)}
  /* ===== taskbar ===== */
  #taskbar{
    position:absolute;left:0;right:0;bottom:0;height:32px;background:#c0c0c0;
    border-top:2px outset #fff;display:flex;align-items:center;gap:4px;padding:2px 4px;z-index:9999;
  }
  #start{display:flex;align-items:center;gap:4px;font-weight:bold;background:#c0c0c0;border:2px outset #fff;padding:2px 8px;cursor:pointer}
  #start:active{border-style:inset}
  #start .logo{width:16px;height:16px;background:conic-gradient(#f00 0 25%,#0a0 0 50%,#00f 0 75%,#ff0 0);border:1px solid #000}
  .task{min-width:120px;max-width:170px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:2px outset #fff;padding:3px 8px;background:#c0c0c0;cursor:pointer}
  .task.on{border-style:inset;background:#dfdfdf;font-weight:bold}
  #tray{margin-left:auto;border:2px inset #fff;padding:3px 8px;display:flex;gap:8px;align-items:center;white-space:nowrap}
</style>
</head>
<body>
<div class="dicon"><div class="img">🖥</div><span>My Workbench</span></div>
<div class="dicon" style="top:96px"><div class="img">🗑</div><span>Recycle Bin</span></div>
<div class="dicon" style="top:174px"><div class="img">💡</div><span>lamp.step</span></div>

<div id="taskbar">
  <div id="start"><div class="logo"></div>Start</div>
  <div id="tasks" style="display:flex;gap:4px;flex:1;overflow:hidden"></div>
  <div id="tray"><span id="traypass">…</span><span id="clock">--:--</span></div>
</div>

<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s);
const dim=p=>Array.isArray(p.size)?p.size.join('×'):(p.size&&p.size.r!==undefined?'r'+p.size.r+' h'+p.size.h:'—');
const mass=id=>{const m=D.measures.find(m=>m.id===id);return m?m.massG:0};
const f=a=>a.map(x=>(+x).toFixed(1).replace(/\.0$/,'')).join(', ');
let z=10;const taskbar=$('#tasks');

function mkWin(title,icon,x,y,w,h,build,sbarTxt){
  const win=document.createElement('div');win.className='win';
  win.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;z-index:'+(++z);
  win.innerHTML=
    '<div class="tbar"><div class="icn">'+icon+'</div><div class="tt">'+title+'</div>'+
    '<button class="tbtn" title="Minimize">_</button><button class="tbtn" title="Maximize">□</button><button class="tbtn" title="Close">✕</button></div>'+
    '<div class="menu"><span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>V</u>iew</span><span><u>H</u>elp</span></div>'+
    '<div class="wbody"></div>'+
    '<div class="sbar"><div class="cell grow">'+(sbarTxt||'Ready')+'</div></div>';
  document.body.appendChild(win);
  const body=win.querySelector('.wbody');
  build(body);
  /* focus + taskbar button */
  const t=document.createElement('div');t.className='task on';t.textContent=title;
  t.onclick=()=>{win.style.zIndex=++z;focus()};
  taskbar.appendChild(t);
  function focus(){document.querySelectorAll('.win').forEach(w=>w.classList.remove('focus'));
    document.querySelectorAll('.task').forEach(x=>x.classList.remove('on'));
    win.classList.add('focus');t.classList.add('on');}
  win.addEventListener('mousedown',()=>{win.style.zIndex=++z;focus()},true);
  focus();
  /* drag */
  const bar=win.querySelector('.tbar');
  bar.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('tbtn'))return;
    const ox=e.clientX-win.offsetLeft,oy=e.clientY-win.offsetTop;
    const mv=ev=>{win.style.left=Math.max(-w+60,Math.min(innerWidth-60,ev.clientX-ox))+'px';
                  win.style.top=Math.max(0,Math.min(innerHeight-60,ev.clientY-oy))+'px'};
    const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
    addEventListener('mousemove',mv);addEventListener('mouseup',up);
  });
  win.querySelectorAll('.tbtn')[2].onclick=()=>{win.remove();t.remove()};
  return win;
}
const passTxt=D.report.pass?'✓ PASS':'✗ FAIL';

/* ---- windows ---- */
mkWin('brief.txt — Notepad','📝',40,30,430,225,(b)=>{
  b.innerHTML='<textarea id="brief"></textarea>'+
   '<div style="display:flex;gap:8px;margin-top:6px;align-items:center">'+
   '<button class="btn" id="go">Submit to Agent</button>'+
   '<span style="color:#555">units: '+D.spec.units+' · attempt '+D.attempts+'</span></div>';
  b.querySelector('#brief').value=D.brief;
  b.querySelector('#go').onclick=()=>alert('Brief submitted. ('+D.attempts+' attempt(s) so far)');
},'Ln 1, Col 1');

mkWin('lamp_flat.png — Paint','🖌',500,26,330,430,(b)=>{
  b.classList.add('imgwin');b.style.padding='6px';
  b.innerHTML='<img src="lamp_flat.png">';
},'560 × 956 · 8-bit RGB · render output');

mkWin('spec.dat — Specification','📊',170,180,450,300,(b)=>{
  let h='<table><tr><th>id</th><th>shape</th><th>material</th><th>size</th><th>mass g</th></tr>';
  D.spec.parts.forEach(p=>{const c=(D.spec.materials[p.material]||{}).color;
    h+='<tr><td><b>'+p.id+'</b></td><td>'+p.shape+'</td><td><span class="mat" style="background:'+c+'"></span>'+p.material+'</td><td>'+dim(p)+'</td><td>'+mass(p.id).toFixed(1)+'</td></tr>'});
  h+='</table><div style="margin-top:6px;font-weight:bold">Joints ('+D.spec.joints.length+')</div><table><tr><th>a</th><th>type</th><th>b</th></tr>';
  D.spec.joints.forEach(j=>h+='<tr><td>'+j.a+'</td><td>'+j.type+'</td><td>'+j.b+'</td></tr>');
  b.innerHTML=h+'</table>';
},D.spec.parts.length+' object(s)');

mkWin('C:\\INKBENCH\\verify.exe','🖥',680,140,420,320,(b)=>{
  b.style.background='#000';b.style.color='#c0c0c0';b.style.fontFamily='"Courier New",monospace';
  let h='<div style="font-family:Courier New,monospace;font-size:11px;line-height:1.55">';
  h+='C:\\INKBENCH&gt; verify --all<br><br>';
  D.report.checks.forEach(k=>{h+='['+(k.status==='pass'?'<span class="ok">PASS</span>':'<span class="bad">FAIL</span>')+'] '+k.name+'<br>&nbsp;&nbsp;'+k.detail+'<br>'});
  h+='<br>'+(D.report.failures||[]).length+' failure(s). done in '+D.report.timingMs+'ms.<br>C:\\INKBENCH&gt;<span id="cur">▮</span></div>';
  b.innerHTML=h;const c=b.querySelector('#cur');setInterval(()=>c.style.opacity=c.style.opacity==='0'?1:0,530);
},'exit code '+(D.report.pass?'0':'1'));

mkWin('Robot Cell — arms.exe','🤖',1130,60,520,470,(b)=>{
  let h='<div style="font-weight:bold;margin-bottom:4px">Build sequence (dual-arm cell):</div>';
  D.plan.forEach(s=>{ if(s.kind==='place'){
    h+='<div style="border:1px solid #808080;background:#fff;margin-bottom:3px;padding:3px 5px;display:flex;gap:6px;align-items:center">'+
     '<b style="width:20px">'+s.step+'</b>'+
     '<span style="border:1px solid #000;padding:0 5px;background:'+(s.arm==='A'?'#9f9':'#9cf')+'">arm '+s.arm+'</span>'+
     '<span><b>'+s.part+'</b> '+s.glyph+' seat ['+f(s.seat)+'] · '+s.massG.toFixed(0)+'g</span></div>';
  } else {
    h+='<div style="color:#555;font-style:italic;padding:1px 5px 4px 26px">⌁ '+s.type+' joint '+s.a+' ~ '+s.b+'</div>';
  }});
  h+='<div class="prog"><i style="width:'+(D.report.pass?100:40)+'%"></i></div>';
  h+='<div style="margin-top:3px">'+(D.report.pass?'Build plan ready — 0 collisions expected.':'Plan blocked by failures.')+'</div>';
  b.innerHTML=h;
},'ARM A+B cell online');

mkWin('agent.log','📄',900,470,430,180,(b)=>{
  b.innerHTML='<ul class="log">'+D.log.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
},D.log.length+' line(s)');

mkWin('System Status','ℹ',420,560,430,100,(b)=>{
  b.innerHTML='<div style="display:flex;gap:14px;align-items:center;height:100%">'+
   '<div style="font-size:30px">'+(D.report.pass?'✅':'⚠️')+'</div>'+
   '<div>Verification: <span class="'+(D.report.pass?'ok':'bad')+'">'+passTxt+'</span><br>'+
   'Attempts: '+D.attempts+' · Parts: '+D.spec.parts.length+' · Joints: '+D.spec.joints.length+'<br>'+
   'Pipeline: brief → spec → render → verify → plan</div></div>';
},'All systems nominal');

/* taskbar tray */
$('#traypass').textContent=passTxt;
$('#traypass').className=D.report.pass?'ok':'bad';
function tick(){const d=new Date();$('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
tick();setInterval(tick,30000);
</script>
</body>
</html>
