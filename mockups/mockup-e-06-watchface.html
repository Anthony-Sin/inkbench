<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Chronometer</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(ellipse at 50% 30%,#1a1a20 0%,#060608 75%);
    font-family:"Didot","Bodoni MT","Times New Roman",serif;color:#d8c9a3;
    display:grid;grid-template-columns:430px 1fr 430px;
  }
  /* ============ side panels ============ */
  .side{padding:34px 30px;display:flex;flex-direction:column;gap:22px;min-height:0;overflow:auto}
  .plaque{
    border:1px solid #6b5a33;padding:16px 18px;position:relative;
    background:linear-gradient(#12121a,#0c0c12);
  }
  .plaque::before{content:"";position:absolute;inset:4px;border:1px solid #3a3044;pointer-events:none}
  .ptitle{font-size:11px;letter-spacing:5px;color:#8a7a55;text-transform:uppercase;text-align:center;margin-bottom:10px}
  .ptitle::before,.ptitle::after{content:"—";color:#4a3f28;margin:0 8px}
  .serif{font-size:13px;line-height:1.8;color:#c9bb96}
  .eng{font-style:italic;color:#9a8b68;font-size:12px}
  .tiny{font-size:10px;letter-spacing:2px;color:#7a6c4d;text-transform:uppercase}
  textarea{
    width:100%;background:transparent;border:none;border-bottom:1px solid #6b5a33;color:#e8dcb8;
    font-family:inherit;font-style:italic;font-size:14px;resize:none;height:52px;padding:4px 2px;
  }
  textarea:focus{outline:none;border-bottom-color:#d8c9a3}
  .btn{
    align-self:center;background:none;border:1px solid #8a7a55;color:#d8c9a3;letter-spacing:4px;
    font-family:inherit;font-size:11px;padding:7px 26px;cursor:pointer;text-transform:uppercase;
  }
  .btn:hover{background:#d8c9a3;color:#0c0c12}
  .btn:active{transform:translateY(1px)}
  .calibre td{padding:4px 6px;font-size:12px;border-bottom:1px solid #2a2430}
  .calibre td:first-child{color:#7a6c4d;letter-spacing:1px;font-size:10px;text-transform:uppercase}
  .calibre td:last-child{text-align:right;color:#dccda5}
  .matline{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:#c9bb96}
  .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;border:1px solid #000}
  .cert .check{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #241f2c;font-size:12px}
  .cert .sig{flex:0 0 16px;color:#c9a44a;text-align:center}
  .cert .nm{letter-spacing:1px;text-transform:uppercase;font-size:11px;color:#d8c9a3}
  .cert .dt{color:#8d7f60;font-size:10.5px;font-style:italic;line-height:1.5;margin-top:2px}
  .planline{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid #221e2a;font-size:12px}
  .planline .n{color:#6b5a33;font-size:10px;letter-spacing:1px;flex:0 0 30px}
  .planline .armtag{color:#0c0c12;background:#c9a44a;padding:0 7px;font-size:10px;letter-spacing:2px}
  .planline.j .armtag{background:#3a3044;color:#c9bb96}
  .log{font-family:"Times New Roman",serif;font-style:italic;font-size:11px;color:#7d7050;line-height:1.9}
  .log div::before{content:"· "}
  /* ============ the watch ============ */
  #watchcol{display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
  #case{
    width:640px;height:640px;border-radius:50%;position:relative;flex:0 0 auto;
    background:
      conic-gradient(#3b3b40,#101014,#3b3b40,#101014,#3b3b40,#101014,#3b3b40);
    box-shadow:0 30px 80px rgba(0,0,0,.9),inset 0 2px 4px #555,inset 0 -4px 8px #000;
  }
  #bezel{
    position:absolute;inset:16px;border-radius:50%;
    background:conic-gradient(#5a5a62,#2a2a30,#4a4a52,#202028,#5a5a62,#30303a,#5a5a62);
    box-shadow:inset 0 3px 6px rgba(255,255,255,.25),inset 0 -6px 12px #000;
  }
  /* bezel minute track */
  #dial{
    position:absolute;inset:40px;border-radius:50%;
    background:radial-gradient(circle at 50% 42%,#1d2b45 0%,#101a2e 45%,#0a1020 100%);
    box-shadow:inset 0 0 60px #000,0 0 0 1px #000;
    overflow:hidden;
  }
  .index{position:absolute;left:50%;top:50%;width:4px;height:26px;background:linear-gradient(#e8ddb8,#a8955f);
    box-shadow:0 0 4px rgba(0,0,0,.8);transform-origin:50% 0}
  .index.min{height:12px;width:2px;background:#7a6c4d}
  #brand{position:absolute;top:19%;width:100%;text-align:center;pointer-events:none}
  #brand .b1{font-size:21px;letter-spacing:7px;color:#e8dcb8}
  #brand .b2{font-size:9px;letter-spacing:4px;color:#8a7a55;margin-top:3px}
  #brand .b3{font-size:8.5px;letter-spacing:3px;color:#5aa0c8;margin-top:2px}
  /* subdials */
  .sub{
    position:absolute;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 45% 40%,#16223a,#0b1322 70%);
    box-shadow:inset 0 2px 8px #000,0 1px 0 rgba(255,255,255,.08);
    border:1px solid #2a3550;
  }
  .sub .lbl{position:absolute;width:100%;text-align:center;top:66%;font-size:7.5px;letter-spacing:2px;color:#8a9ab8}
  .sub .tickring{position:absolute;inset:0}
  .sub .tk{position:absolute;left:50%;top:50%;width:1.5px;height:7px;background:#6a7a98;transform-origin:50% 0}
  .needle{
    position:absolute;left:50%;top:50%;width:3px;height:44px;margin-left:-1.5px;
    background:linear-gradient(#5aa0c8,#2a5a8a);transform-origin:50% 100%;transform:rotate(0deg) translateY(-44px);
    border-radius:2px;box-shadow:0 0 4px #000;
  }
  .sub .val{position:absolute;width:100%;text-align:center;top:80%;font-size:9px;color:#e8dcb8}
  .pip{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#c9a44a;transform:translate(-50%,-50%);box-shadow:0 0 4px #000}
  /* center aperture: render under glass */
  #aperture{
    position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);
    width:300px;height:300px;border-radius:50%;overflow:hidden;
    border:6px solid #0a0a10;box-shadow:inset 0 0 30px #000,0 0 0 2px #3a3044;
    background:#0a0a10;
  }
  #aperture img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.85) contrast(1.05)}
  #aperture img.top{transition:opacity .1s}
  #glass{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(ellipse at 32% 22%,rgba(255,255,255,.16) 0%,transparent 45%);}
  /* running seconds hand */
  #sec{position:absolute;left:50%;top:50%;width:1.5px;height:270px;margin-left:-.75px;
    background:linear-gradient(#c9a44a 60%,transparent 60%);transform-origin:50% 50%;
    animation:sweep 60s linear infinite}
  @keyframes sweep{to{transform:rotate(360deg)}}
  #datewin{
    position:absolute;right:14%;top:50%;transform:translateY(-50%);
    background:#0a0a10;border:1px solid #3a3044;color:#e8dcb8;font-size:11px;padding:2px 10px;letter-spacing:1px;
  }
  /* crown */
  #crown{
    position:absolute;right:-46px;top:50%;transform:translateY(-50%);
    width:34px;height:64px;cursor:ns-resize;
    background:repeating-linear-gradient(#7a6a40 0 4px,#4a3f22 4px 8px);
    border-radius:8px;box-shadow:2px 2px 8px #000,inset 0 0 4px #000;
  }
  #crown::after{content:"";position:absolute;inset:0;border-radius:8px;
    background:linear-gradient(90deg,rgba(255,255,255,.3),transparent 40%,rgba(0,0,0,.4))}
  #crownlbl{position:absolute;right:-40px;top:calc(50% + 48px);font-size:8px;letter-spacing:2px;color:#6b5a33;writing-mode:vertical-rl}
  /* status ribbon */
  #certSeal{
    position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
    text-align:center;
  }
  .seal{
    display:inline-block;padding:6px 22px;border:1px solid #6b5a33;color:#c9a44a;
    font-size:10px;letter-spacing:5px;background:#0c0c12;
  }
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#3a3044}
</style>
</head>
<body>
<aside class="side">
  <div class="plaque">
    <div class="ptitle">Commission № IB-001</div>
    <textarea id="brief"></textarea>
    <div style="text-align:center;margin-top:8px"><button class="btn" id="submit">Commission</button></div>
    <div class="eng" style="margin-top:8px;text-align:center">Units — millimetres · Attempt № <span id="att"></span></div>
  </div>
  <div class="plaque" style="flex:1;overflow:auto">
    <div class="ptitle">Calibre IB-01 — Movement</div>
    <table class="calibre" id="mov"></table>
    <div class="ptitle" style="margin-top:14px">Mainspring Metals</div>
    <div id="mats"></div>
  </div>
</aside>

<div id="watchcol">
  <div id="case">
    <div id="bezel"></div>
    <div id="dial">
      <div id="brand"><div class="b1">INKBENCH</div><div class="b2">GENÈVE · AGENTIC WORKBENCH</div><div class="b3" id="b3"></div></div>
      <div id="aperture">
        <img src="lamp_flat.png">
        <img class="top" id="expl" src="lamp_exploded.png" style="opacity:0">
      </div>
      <div class="sub" id="sd-mass" style="left:50%;top:71%;transform:translateX(-50%)">
        <div class="tickring"></div><div class="needle"></div><div class="lbl">MASSE · KG</div><div class="val"></div><div class="pip"></div>
      </div>
      <div class="sub" id="sd-clr" style="left:16%;top:44%">
        <div class="tickring"></div><div class="needle"></div><div class="lbl">JEU · MM</div><div class="val"></div><div class="pip"></div>
      </div>
      <div class="sub" id="sd-tip" style="right:16%;top:44%">
        <div class="tickring"></div><div class="needle"></div><div class="lbl">MARGE · MM</div><div class="val"></div><div class="pip"></div>
      </div>
      <div id="sec"></div>
      <div id="datewin"></div>
      <div id="glass"></div>
    </div>
    <div id="crown" title="wind crown — drag to explode view"></div>
    <div id="crownlbl">EXPLODE</div>
    <div id="certSeal"><span class="seal" id="seal"></span></div>
  </div>
</div>

<aside class="side">
  <div class="plaque cert" style="flex:1.2;overflow:auto">
    <div class="ptitle">Bulletin de Marche</div>
    <div id="checks"></div>
  </div>
  <div class="plaque" style="flex:1;overflow:auto">
    <div class="ptitle">Ordre d'Assemblage — Bras A & B</div>
    <div id="plan"></div>
  </div>
  <div class="plaque">
    <div class="ptitle">Registre d'Atelier</div>
    <div class="log" id="log"></div>
  </div>
</aside>
<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s);
const f=(a,d=0)=>a.map(x=>(+x).toFixed(d)).join(', ');
const TOT=D.measures.reduce((s,m)=>s+m.massG,0);
$('#brief').value='“'+D.brief+'”';
$('#att').textContent=D.attempts;
$('#submit').onclick=()=>{const l=$('#log');l.prepend(Object.assign(document.createElement('div'),{textContent:'recommissioned — '+new Date().toLocaleTimeString()}))};
$('#b3').textContent=(D.figures[0].parts||D.spec.parts.length)+' PARTS · '+D.spec.joints.length+' JOINTS · CHRONOMETER';
$('#datewin').textContent=D.report.timingMs.toFixed(0)+'ms';
$('#seal').textContent=D.report.pass?'✦ OFFICIALLY CERTIFIED — PASS ✦':'✗ RATE NOT WITHIN LIMITS';
if(!D.report.pass)$('#seal').style.color='#c85a4a';

/* indices */
const dial=$('#dial');
for(let i=0;i<60;i++){
  const t=document.createElement('div');t.className='index'+(i%5?' min':'');
  const ang=i*6;const R=i%5?278:272;
  t.style.transform='rotate('+ang+'deg) translateY(-'+(290)+'px)';
  dial.appendChild(t);
}
/* subdial ticks + needle set */
function subdial(sel,frac,label){
  const el=$(sel);
  for(let i=0;i<11;i++){const t=document.createElement('div');t.className='tk';
    t.style.transform='rotate('+(-120+i*24)+'deg) translateY(-54px)';el.querySelector('.tickring').appendChild(t)}
  const ang=-120+Math.max(0,Math.min(1,frac))*240;
  el.querySelector('.needle').style.transform='rotate('+ang+'deg) translateY(-44px)';
  el.querySelector('.val').textContent=label;
}
const clr=D.report.checks.find(c=>c.name==='clearance'),stb=D.report.checks.find(c=>c.name==='stability');
subdial('#sd-mass',(TOT/1000)/6,(TOT/1000).toFixed(2));
subdial('#sd-clr',clr?clr.measured/20:0,clr?clr.measured.toFixed(1):'—');
subdial('#sd-tip',stb?stb.measured/120:0,stb?stb.measured.toFixed(1):'—');

/* movement table */
let h='';
D.spec.parts.forEach(p=>{
  const m=D.measures.find(m=>m.id===p.id);
  const sz=Array.isArray(p.size)?p.size.join('×'):('r'+p.size.r+' h'+p.size.h);
  h+='<tr><td>'+p.id+'</td><td>'+p.shape+' · '+sz+'</td><td>'+(m?m.massG.toFixed(1):'—')+' g</td></tr>';
});
h+='<tr><td>total</td><td>'+D.spec.parts.length+' jewels</td><td>'+(TOT/1000).toFixed(3)+' kg</td></tr>';
$('#mov').innerHTML=h;
$('#mats').innerHTML=Object.entries(D.spec.materials).map(([n,m])=>
  '<div class="matline"><span><span class="sw" style="background:'+m.color+'"></span>'+n+'</span><span>'+m.density+' kg/m³</span></div>').join('');

/* checks */
$('#checks').innerHTML=D.report.checks.map(k=>
 '<div class="check"><div class="sig">'+(k.status==='pass'?'✦':'✗')+'</div><div><div class="nm">'+k.name+'</div><div class="dt">'+k.detail+'</div></div></div>').join('');

/* plan */
$('#plan').innerHTML=D.plan.map(s=>{
  if(s.kind==='place')return '<div class="planline"><span class="n">Nº '+String(s.step).padStart(2,'0')+'</span><span class="armtag">BRAS '+s.arm+'</span><span>'+s.part+' '+s.glyph+' · '+s.massG.toFixed(0)+' g</span></div>';
  return '<div class="planline j"><span class="n">⌁</span><span class="armtag">RIVET</span><span class="eng">'+s.type+' — '+s.a+' ~ '+s.b+'</span></div>';
}).join('');
$('#log').innerHTML=D.log.map(x=>'<div>'+x+'</div>').join('');

/* crown drag → explode crossfade */
const cr=$('#crown');let cur=0;
cr.addEventListener('mousedown',e=>{
  const y0=e.clientY,c0=cur;
  const mv=ev=>{cur=Math.max(0,Math.min(1,c0+(ev.clientY-y0)/160));
    $('#expl').style.opacity=cur;cr.style.transform='translateY(-50%) rotate('+cur*270+'deg)'};
  const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
  addEventListener('mousemove',mv);addEventListener('mouseup',up);
});
</script>
</body>
</html>
