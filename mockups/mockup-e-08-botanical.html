<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Hortus Mechanicus, Tab. VII</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"IM Fell English",Georgia,serif;color:#3a2e1a;
    background:
      radial-gradient(ellipse at 18% 12%,rgba(120,90,40,.10),transparent 40%),
      radial-gradient(ellipse at 82% 88%,rgba(110,80,30,.12),transparent 45%),
      radial-gradient(ellipse at 70% 20%,rgba(90,60,20,.06),transparent 30%),
      repeating-linear-gradient(0deg,rgba(90,70,30,.018) 0 2px,transparent 2px 5px),
      #e9dfc4;
    display:grid;grid-template-columns:330px 1fr 330px;gap:20px;padding:22px;
  }
  /* faint foxing spots */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle at 8% 60%,rgba(150,110,50,.14) 0 6px,transparent 8px),
      radial-gradient(circle at 93% 30%,rgba(150,110,50,.12) 0 8px,transparent 10px),
      radial-gradient(circle at 60% 95%,rgba(140,100,45,.10) 0 5px,transparent 7px),
      radial-gradient(circle at 35% 8%,rgba(140,100,45,.10) 0 4px,transparent 6px);}
  /* ---------- parchment side cards ---------- */
  aside{display:flex;flex-direction:column;gap:16px;min-height:0;overflow-y:auto;z-index:1}
  .card{
    background:linear-gradient(#f2e9d2,#eadfc3);border:1px solid #a89468;
    box-shadow:2px 3px 10px rgba(60,45,15,.25),inset 0 0 30px rgba(160,130,70,.10);
    padding:12px 16px 14px;flex:0 0 auto;position:relative;
  }
  .card.grow{flex:1;min-height:0;overflow-y:auto}
  .card::before,.card::after{content:"";position:absolute;left:0;right:0;height:1px;background:#a89468}
  .card::before{top:3px}.card::after{bottom:3px}
  .ct{font-size:15px;letter-spacing:2px;text-align:center;color:#5a4520;margin-bottom:8px;font-variant:small-caps}
  .ct::before,.ct::after{content:"❧";color:#9a7f4e;margin:0 8px;font-size:11px}
  .sub{font-style:italic;text-align:center;color:#7a6438;font-size:11.5px;margin-top:-6px;margin-bottom:8px}
  /* brief */
  textarea{
    width:100%;background:rgba(255,250,235,.5);border:1px solid #b09a6c;color:#3a2e1a;
    font-family:inherit;font-style:italic;font-size:13.5px;line-height:1.5;resize:none;height:70px;padding:7px;
  }
  textarea:focus{outline:1px solid #7a5f2e;background:rgba(255,252,240,.8)}
  .btn{
    width:100%;margin-top:9px;background:none;border:1px solid #7a5f2e;color:#4a3a18;
    font-family:inherit;font-size:14px;letter-spacing:2px;padding:7px;cursor:pointer;font-variant:small-caps;
  }
  .btn:hover{background:#4a3a18;color:#efe6cc}
  .btn:active{transform:translateY(1px)}
  /* mensurae table */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td,th{border-bottom:1px dotted #9a7f4e;padding:3.5px 4px;vertical-align:bottom}
  th{font-variant:small-caps;letter-spacing:1px;color:#6a5426;font-size:11.5px;text-align:left}
  td.r{text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  tr.tot td{border-top:1px solid #7a5f2e;font-weight:bold}
  .lat{font-style:italic;color:#6a5426}
  /* observationes */
  .obs{padding:7px 0;border-bottom:1px dotted #9a7f4e;font-size:12.5px}
  .obs:last-child{border-bottom:none}
  .obs .hd{display:flex;justify-content:space-between;align-items:baseline}
  .obs .nm{font-variant:small-caps;letter-spacing:1px;font-size:13px}
  .obs .verd{font-style:italic}
  .obs .verd.p{color:#2f5d2a}.obs .verd.f{color:#8a2f22}
  .obs .dt{color:#6a5630;font-size:11.5px;font-style:italic;line-height:1.45;margin-top:2px}
  /* ordinatio */
  .ord{padding:6px 0;border-bottom:1px dotted #9a7f4e;font-size:12.5px;display:flex;gap:8px}
  .ord:last-child{border-bottom:none}
  .ord .st{flex:0 0 34px;color:#7a5f2e;font-variant:small-caps}
  .ord .mn{flex:0 0 56px;text-align:center;border:1px solid #9a7f4e;font-size:10.5px;letter-spacing:1px;padding:0 3px;height:fit-content}
  .ord.j .mn{border-style:dashed;color:#6a5630}
  .ord .wh b{font-weight:normal;font-variant:small-caps;letter-spacing:.5px}
  .ord .sm{display:block;font-style:italic;color:#6a5630;font-size:11px}
  /* adnotata log */
  .ann{font-size:12px;font-style:italic;color:#5a4a28;line-height:1.85}
  .ann div::before{content:"⁕ ";color:#9a7f4e}
  .matline{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:4px 0;border-bottom:1px dotted #9a7f4e}
  .matline:last-child{border-bottom:none}
  .sw{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #5a4520;margin-right:7px;vertical-align:-1px}
  /* ---------- the plate ---------- */
  #platecol{display:flex;min-width:0;z-index:1}
  #plate{
    flex:1;display:flex;flex-direction:column;position:relative;
    background:linear-gradient(#f4ecd6,#ecdfc0);
    border:1px solid #8a744a;box-shadow:0 6px 26px rgba(60,45,15,.3),inset 0 0 50px rgba(160,130,70,.12);
    padding:20px 30px 14px;min-height:0;
  }
  #plate::before{content:"";position:absolute;inset:7px;border:1px solid #a89468;pointer-events:none}
  #plate::after{content:"";position:absolute;inset:10px;border:1px solid #c4b088;pointer-events:none}
  #phead{display:flex;justify-content:space-between;font-size:12px;color:#6a5426;flex:0 0 auto;padding:0 6px}
  #phead .tab{font-variant:small-caps;letter-spacing:3px;font-size:14px}
  #phead .eng{font-style:italic;font-size:11px}
  /* specimen with lettered keys */
  #spec{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;margin:4px 0}
  #spec img{max-height:100%;max-width:88%;object-fit:contain;
    filter:sepia(.35) contrast(.96) brightness(1.03) saturate(.8);
    mix-blend-mode:multiply}
  .key{
    position:absolute;display:flex;align-items:center;gap:6px;
    font-style:italic;font-size:13px;color:#3a2e1a;white-space:nowrap;
  }
  .key .lt{
    width:17px;height:17px;border:1px solid #5a4520;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-style:italic;background:#f4ecd6;
  }
  .key .ln{display:block;height:1px;background:#5a4520}
  .key .nm{font-size:11.5px}
  /* caption block */
  #cap{flex:0 0 auto;text-align:center;padding-top:8px}
  #cap .fig{font-variant:small-caps;letter-spacing:2px;font-size:15px}
  #cap .fig b{font-weight:normal}
  #cap .sciname{font-style:italic;font-size:16.5px;margin-top:2px}
  #cap .keyline{font-size:11.5px;color:#5a4a28;line-height:1.55;margin-top:5px;font-style:italic}
  #colophon{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid #a89468;margin-top:8px;padding-top:6px;
    font-size:11.5px;color:#6a5426;font-style:italic;
  }
  #colophon .stamp{
    font-variant:small-caps;letter-spacing:2px;font-style:normal;border:1.5px solid #7a3a22;color:#7a3a22;
    padding:2px 12px;transform:rotate(-3deg);font-size:11px;background:rgba(255,250,235,.4);
  }
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#b09a6c}
</style>
</head>
<body>

<aside>
  <div class="card">
    <div class="ct">Descriptio</div>
    <div class="sub">— the querent's own words —</div>
    <textarea id="brief" spellcheck="false"></textarea>
    <button class="btn" id="submit">Nova Descriptio · Delinea</button>
    <table style="margin-top:10px">
      <tr><td class="lat">Mensura</td><td class="r" id="units"></td></tr>
      <tr><td class="lat">Conatus</td><td class="r" id="att"></td></tr>
      <tr><td class="lat">Tempus verific.</td><td class="r" id="tim"></td></tr>
    </table>
  </div>
  <div class="card grow">
    <div class="ct">Mensurae Partium</div>
    <table id="mens"></table>
  </div>
  <div class="card">
    <div class="ct">Materiae</div>
    <div id="mats"></div>
  </div>
</aside>

<div id="platecol">
  <div id="plate">
    <div id="phead">
      <span class="eng">INKBENCH, del.</span>
      <span class="tab">Tab. <span id="tabnum"></span>.</span>
      <span class="eng">Duobrachi sculp.</span>
    </div>
    <div id="spec">
      <img src="lamp_flat.png" alt="specimen">
    </div>
    <div id="cap">
      <div class="sciname"><span id="sciname"></span> <span style="font-style:normal;font-size:12px">gen. et sp. nov.</span></div>
      <div class="fig" id="figcap"></div>
      <div class="keyline" id="keyline"></div>
    </div>
    <div id="colophon">
      <span id="verdLine"></span>
      <span class="stamp" id="stamp"></span>
    </div>
  </div>
</div>

<aside>
  <div class="card grow">
    <div class="ct">Observationes</div>
    <div class="sub">quinque probationes institutae</div>
    <div id="checks"></div>
  </div>
  <div class="card grow">
    <div class="ct">Ordinatio Fabricae</div>
    <div class="sub">manibus geminis A &amp; B agenda</div>
    <div id="plan"></div>
  </div>
  <div class="card">
    <div class="ct">Adnotata</div>
    <div class="ann" id="log"></div>
  </div>
</aside>

<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s);
const RN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const LT=['a','b','c','d','e','f','g','h'];
const f=(a,d=0)=>a.map(x=>(+x).toFixed(d)).join(', ');
const LAT={
  base:'Basis rotunda gravida',post:'Columella erecta',lower_arm:'Brachium inferius',
  upper_arm:'Brachium superius',shade:'Umbraculum inclinabile'};
const KEYS={  /* letter tag positions over the specimen (approx. anatomy of the render) */
  base:{left:'56%',top:'82%',ln:'right'},post:{left:'57%',top:'66%',ln:'right'},
  lower_arm:{left:'58%',top:'47%',ln:'right'},upper_arm:{left:'57%',top:'27%',ln:'right'},
  shade:{left:'60%',top:'7%',ln:'right'}};
const FORMAE={cylinder:'cylindrica',box:'orthogonala',cone:'conica',sphere:'sphaerica'};

$('#brief').value='“'+D.brief+'”';
$('#units').textContent=D.spec.units+'m';           /* millimetra, playfully */
$('#att').textContent='№ '+D.attempts;
$('#tim').textContent=D.report.timingMs+' ms';
$('#tabnum').textContent=RN[(D.figures[0].figNum||1)-1+6]||'VII';
$('#sciname').textContent='Lucerna articulata inkbenchensis';
$('#submit').onclick=()=>{
  const l=$('#log');l.prepend(Object.assign(document.createElement('div'),
    {textContent:'descriptio iterata — “'+$('#brief').value.slice(0,44)+'…”'}));
};

/* ---- specimen lettered keys ---- */
const spec=$('#spec');
D.spec.parts.forEach((p,i)=>{
  const k=KEYS[p.id];if(!k)return;
  const el=document.createElement('div');el.className='key';
  el.style.left=k.left;el.style.top=k.top;
  el.innerHTML='<span class="lt">'+LT[i]+'.</span><span class="ln" style="width:34px"></span>'+
    '<span class="nm">'+(LAT[p.id]||p.id)+'</span>';
  spec.appendChild(el);
});

/* ---- caption ---- */
$('#figcap').innerHTML='Fig. I. — <b>'+D.spec.name+'</b>, e conspectu laterali delineata.';
$('#keyline').textContent=D.spec.parts.map((p,i)=>LT[i]+'. '+(LAT[p.id]||p.id)).join('  ·  ');

/* ---- mensurae ---- */
let h='<tr><th>Pars</th><th>Forma</th><th style="text-align:right">Dimens. ('+D.spec.units+')</th><th style="text-align:right">Massa (g)</th></tr>';
let TOT=0;
D.measures.forEach((m,i)=>{TOT+=m.massG;
  h+='<tr><td><i>'+LT[i]+'.</i> '+m.id+'</td><td class="lat">'+(FORMAE[m.shape]||m.shape)+'</td>'+
     '<td class="r">'+m.dims.map(d=>(+d).toFixed(0)).join(' × ')+'</td><td class="r">'+m.massG.toFixed(1)+'</td></tr>';});
h+='<tr class="tot"><td colspan="3">Massa tota</td><td class="r">'+(TOT/1000).toFixed(3)+' kg</td></tr>';
$('#mens').innerHTML=h;
$('#mats').innerHTML=Object.entries(D.spec.materials).map(([n,m])=>
  '<div class="matline"><span><span class="sw" style="background:'+m.color+'"></span><i>'+n+'</i></span>'+
  '<span class="lat">dens. '+m.density+'</span></div>').join('');

/* ---- observationes ---- */
$('#checks').innerHTML=D.report.checks.map(k=>{
  const p=k.status==='pass';
  return '<div class="obs"><div class="hd"><span class="nm">'+k.name+'</span>'+
    '<span class="verd '+(p?'p':'f')+'">'+(p?'probatur ✓':'reprobatur ✗')+'</span></div>'+
    '<div class="dt">'+(k.measured?'mens. '+ (+k.measured).toFixed(2)+' — ':'')+k.detail+'</div></div>';
}).join('');

/* ---- ordinatio ---- */
h='';
D.plan.forEach(s=>{
  if(s.kind==='place'){
    h+='<div class="ord"><span class="st">§ '+s.step+'</span>'+
      '<span class="mn">MANUS '+(s.arm==='A'?'A':'B')+'</span>'+
      '<span class="wh"><b>'+(LAT[s.part]||s.part)+'</b> '+s.glyph+
      '<span class="sm">sedes ['+f(s.seat,1)+'] · pond. '+s.massG.toFixed(0)+' g</span></span></div>';
  }else{
    h+='<div class="ord j"><span class="st">—</span>'+
      '<span class="mn">JUNCT.</span>'+
      '<span class="wh"><b>'+s.type+'</b>'+
      '<span class="sm">'+(LAT[s.a]||s.a)+' ~ '+(LAT[s.b]||s.b)+' · anc. ['+f(s.anchor,1)+']</span></span></div>';
  }
});
$('#plan').innerHTML=h;

/* ---- adnotata + verdict ---- */
$('#log').innerHTML=D.log.map(x=>'<div>'+x+'</div>').join('');
$('#verdLine').textContent=D.report.pass
  ? 'Verificata est — omnes probationes transierunt, conatu ' + D.attempts + '.'
  : 'Non verificata — specimen retinetur.';
$('#stamp').textContent=D.report.pass?'PROBATA · VERIFICATA':'REIECTA';
if(!D.report.pass){$('#stamp').style.color='#8a2f22';$('#stamp').style.borderColor='#8a2f22'}
</script>
</body>
</html>
