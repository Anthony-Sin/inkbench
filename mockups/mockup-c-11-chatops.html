<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1700">
<title>#fig-1-desk-lamp — inkbench ops</title>
<style>
:root{
  --aub:#3f0e40; --aub2:#350d36; --aubhi:#52275a;
  --page:#fff; --side-txt:#d8ccd9; --side-mut:#ab9bab;
  --txt:#1d1c1d; --mut:#616061; --dim:#868686;
  --line:#dddddd; --line2:#e8e8e8; --hover:#f6f6f6;
  --link:#1264a3; --green:#007a5a; --greenbg:#e8f5f0; --red:#e01e5a;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--page);color:var(--txt);overflow:hidden;display:flex;
  font:14px/1.5 "Lato","SF Pro Text",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
::selection{background:#cce0f0}
:focus-visible{outline:2px solid var(--link);outline-offset:1px}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:#c9c9c9;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- workspace sidebar ---------- */
#wside{width:70px;flex:0 0 70px;background:var(--aub2);display:flex;flex-direction:column;align-items:center;
  padding-top:12px;gap:10px}
.ws{width:36px;height:36px;border-radius:9px;background:var(--aubhi);color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:13px;cursor:pointer;position:relative;transition:border-radius .15s}
.ws:hover{border-radius:6px}
.ws.on{background:#fff;color:var(--aub);border-radius:9px}
.ws.on::before{content:"";position:absolute;left:-14px;top:6px;bottom:6px;width:4px;border-radius:2px;background:#fff}
.ws.mut{background:transparent;border:1px dashed #6d4370;color:var(--side-mut)}
#wside .bot{margin:auto auto 14px;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e01e5a,#ecb22e);
  display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}

/* ---------- channel sidebar ---------- */
#cside{width:264px;flex:0 0 264px;background:var(--aub);color:var(--side-txt);display:flex;flex-direction:column;min-height:0}
#wsteam{padding:14px 16px;font-weight:800;font-size:16px;color:#fff;display:flex;align-items:center;border-bottom:1px solid var(--aubhi);cursor:pointer}
#wsteam:hover{background:var(--aubhi)}
#wsteam .car{margin-left:auto;font-size:11px;color:var(--side-mut)}
#cscroll{flex:1;overflow-y:auto;padding:10px 0 20px}
.csec{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;font-size:13px;color:var(--side-mut);cursor:pointer}
.csec:hover{color:#fff}
.csec .car{font-size:9px}
.chan{display:flex;align-items:center;gap:8px;height:28px;padding:0 16px;font-size:14px;color:var(--side-txt);
  cursor:pointer;user-select:none}
.chan:hover{background:var(--aubhi)}
.chan.on{background:var(--link);color:#fff;font-weight:600}
.chan .h{color:var(--side-mut);flex:0 0 14px}
.chan.on .h{color:#cfe1f0}
.chan .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .b{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  display:grid;place-items:center;padding:0 5px}
.dm{display:flex;align-items:center;gap:8px;height:28px;padding:0 16px;font-size:14px;color:var(--side-txt);cursor:pointer}
.dm:hover{background:var(--aubhi)}
.dm .pr{width:8px;height:8px;border-radius:50%;background:#2bac76;flex:0 0 8px;margin-left:3px}
.dm .pr.off{background:transparent;border:1.5px solid var(--side-mut)}
.dm .bot-ic{width:16px;text-align:center;font-size:11px;flex:0 0 16px}
#cside .me{margin-top:auto;padding:10px 16px;display:flex;align-items:center;gap:9px;border-top:1px solid var(--aubhi);color:#fff;font-size:13px}
#cside .me .av{width:26px;height:26px;border-radius:6px;background:#e01e5a;display:grid;place-items:center;font-size:11px;font-weight:700}
#cside .me small{display:block;color:var(--side-mut);font-size:11px}

/* ---------- main ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line)}
#chhead{height:50px;flex:0 0 50px;display:flex;align-items:center;gap:10px;padding:0 18px;
  border-bottom:1px solid var(--line)}
#chhead .t{font-weight:800;font-size:16px;display:flex;align-items:center;gap:7px}
#chhead .t .h{color:var(--mut);font-weight:500}
#chhead .topic{color:var(--mut);font-size:13px;border-left:1px solid var(--line);padding-left:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chhead .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.hbtn{height:30px;min-width:30px;padding:0 9px;border-radius:6px;color:var(--mut);display:flex;align-items:center;
  gap:6px;font-size:13px;transition:background .12s}
.hbtn:hover{background:var(--hover);color:var(--txt)}
.hbtn .cnt{font-size:11px}

#thread{flex:1;overflow-y:auto;min-height:0;padding:12px 0 8px}
.daydiv{display:flex;align-items:center;gap:12px;padding:8px 18px;color:var(--dim);font-size:12.5px}
.daydiv::before,.daydiv::after{content:"";flex:1;height:1px;background:var(--line2)}
.msg{display:flex;gap:10px;padding:6px 18px;position:relative;transition:background .1s}
.msg:hover{background:var(--hover)}
.msg:hover .mact{opacity:1}
.msg .av{width:36px;height:36px;border-radius:8px;flex:0 0 36px;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:13px;margin-top:2px}
.msg .av.u{background:#4a90c4}.msg .av.b{background:#1d1c1d}
.msg .mc{flex:1;min-width:0}
.msg .mh{display:flex;align-items:baseline;gap:8px}
.msg .mh .n{font-weight:800;font-size:14.5px}
.msg .mh .n .bot{font-size:10px;font-weight:600;color:var(--mut);background:var(--hover);border:1px solid var(--line);
  border-radius:3px;padding:1px 4px;margin-left:5px;vertical-align:1px}
.msg .mh .ts{font-size:11.5px;color:var(--dim)}
.msg .mt{font-size:14.5px;line-height:1.5;color:#1d1c1d}
.msg .mt code{font:12.5px var(--mono);background:var(--hover);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;color:#e01e5a}
.msg .mt .lk{color:var(--link);cursor:pointer}
.msg .mt .lk:hover{text-decoration:underline}
.mact{position:absolute;top:-14px;right:18px;display:flex;border:1px solid var(--line);border-radius:7px;
  background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);opacity:0;transition:opacity .12s;z-index:3}
.mact button{width:30px;height:28px;display:grid;place-items:center;font-size:13px;color:var(--mut);border-radius:6px}
.mact button:hover{background:var(--hover);color:var(--txt)}
.reacts{display:flex;gap:4px;margin-top:5px}
.rxn{display:flex;align-items:center;gap:4px;border:1px solid var(--line2);border-radius:11px;padding:1px 7px;
  font-size:11.5px;cursor:pointer;transition:all .12s;background:#fff}
.rxn:hover{border-color:var(--link)}
.rxn.mine{background:#e8f0f9;border-color:var(--link);color:var(--link)}

/* attachments / artifacts */
.att{margin-top:7px;max-width:640px;border:1px solid var(--line);border-left:4px solid #36c5f0;border-radius:8px;
  padding:11px 14px;background:#fff}
.att.ok{border-left-color:#2bac76}
.att.pu{border-left-color:#611f69}
.att .at{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px}
.att .at .fi{color:var(--mut)}
.att .asub{font-size:12px;color:var(--mut);margin-top:1px}
.att .arows{margin-top:7px}
.arow{display:flex;align-items:center;gap:8px;padding:3.5px 4px;border-radius:5px;font-size:12.5px}
.arow:hover{background:var(--hover)}
.arow .sw{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.arow .id{flex:0 0 96px;font-weight:600}
.arow .sh{color:var(--mut);flex:0 0 70px}
.arow .mt2{color:var(--mut);flex:0 0 74px}
.arow .sz{font:11px var(--mono);color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .ms{font:11px var(--mono);color:var(--mut)}
.ckrow{display:flex;align-items:flex-start;gap:8px;padding:4px 4px;border-radius:5px;font-size:12.5px}
.ckrow:hover{background:var(--hover)}
.ckrow .ci{color:var(--green);font-weight:700;flex:0 0 16px}
.ckrow .nm{flex:0 0 112px;font-weight:600}
.ckrow .dt{color:var(--mut);font-size:12px;flex:1}
.ckrow .mv{font:11px var(--mono);color:var(--link)}
.oprow{display:flex;align-items:center;gap:8px;padding:3.5px 4px;border-radius:5px;font-size:12.5px}
.oprow:hover{background:var(--hover)}
.oprow .n{font:600 10px var(--mono);color:var(--dim);width:16px}
.oprow .p{flex:1;font-weight:600}
.oprow .p small{font-weight:400;color:var(--mut)}
.oprow .a{font:700 9.5px var(--mono);border-radius:4px;padding:2px 7px}
.oprow .a.A{background:#e8f0f9;color:var(--link)}
.oprow .a.B{background:#f3ebf6;color:#611f69}
.attimg{margin-top:7px;max-width:420px}
.attimg img{display:block;width:100%;border-radius:8px;border:1px solid var(--line)}
.attimg .cap{font-size:11.5px;color:var(--mut);padding-top:5px}
.att .abtns{display:flex;gap:6px;margin-top:9px}
.abtn{height:27px;padding:0 11px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-weight:600;
  color:var(--txt);transition:all .12s;background:#fff}
.abtn:hover{border-color:var(--link);color:var(--link)}
.abtn.pri{background:var(--green);border-color:var(--green);color:#fff}
.abtn.pri:hover{background:#148a62;color:#fff}
.abtn:disabled{opacity:.5;cursor:not-allowed}

/* composer */
#composer{padding:0 18px 16px}
#cbox{border:1px solid #9a9a9a;border-radius:9px;overflow:hidden;transition:border-color .13s,box-shadow .13s}
#cbox:focus-within{border-color:#1d1c1d;box-shadow:0 0 0 1px #1d1c1d}
#cin{width:100%;border:0;padding:12px 14px 8px;font-size:14.5px;resize:none;display:block;max-height:120px}
#cin:focus{outline:none}
#cin::placeholder{color:var(--dim)}
#cbar{display:flex;align-items:center;gap:2px;padding:6px 10px;background:#f8f8f8}
.cbtn{width:28px;height:26px;border-radius:5px;color:var(--mut);display:grid;place-items:center;font-size:13px}
.cbtn:hover{background:#ececec;color:var(--txt)}
#send{margin-left:auto;height:26px;padding:0 11px;border-radius:5px;background:var(--green);color:#fff;
  font-weight:700;font-size:12px;display:flex;align-items:center;gap:5px;transition:background .12s}
#send:hover{background:#148a62}
#send:disabled{background:#dddddd;color:#9a9a9a;cursor:not-allowed}

/* details rail */
#rail{width:320px;flex:0 0 320px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#railh{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:14.5px;display:flex;align-items:center}
#railh .x{margin-left:auto;color:var(--mut);cursor:pointer;border-radius:5px;padding:2px 6px}
#railh .x:hover{background:var(--hover)}
#railbody{flex:1;overflow-y:auto;padding:14px 16px}
.rsec{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin:16px 0 7px}
.rsec:first-child{margin-top:0}
.filerow{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;font-size:13px;cursor:pointer}
.filerow:hover{background:var(--hover)}
.filerow .fi{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:11px;flex:0 0 26px}
.filerow .fn{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filerow .fs{font:10.5px var(--mono);color:var(--dim)}
.statline{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 8px}
.statline .k{flex:1;color:var(--mut)}
.statline .v{font:12px var(--mono);font-weight:600}
.member{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:7px;font-size:13px}
.member:hover{background:var(--hover)}
.member .av{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
.member .nm{flex:1}
.member .pr2{font-size:10.5px;color:var(--dim)}
</style>
</head>
<body>

<!-- workspace rail -->
<div id="wside">
  <div class="ws on">IK</div>
  <div class="ws">F2</div>
  <div class="ws mut">＋</div>
  <div class="bot">DV</div>
</div>

<!-- channel sidebar -->
<div id="cside">
  <div id="wsteam">inkbench ops <span class="car">⌄</span></div>
  <div id="cscroll">
    <div class="csec"><span class="car">▾</span> Channels</div>
    <div id="chans"></div>
    <div class="csec"><span class="car">▾</span> Direct messages</div>
    <div class="dm"><span class="pr"></span><span class="bot-ic">🤖</span><span class="lbl">inkbench-agent</span></div>
    <div class="dm"><span class="pr off"></span><span class="bot-ic">🦾</span><span class="lbl">fabricator</span></div>
    <div class="dm"><span class="pr off"></span><span class="bot-ic">◇</span><span class="lbl">verifier</span></div>
  </div>
  <div class="me"><span class="av">DV</span><div><b>devin</b><small>active</small></div></div>
</div>

<!-- main -->
<div id="main">
  <div id="chhead">
    <span class="t"><span class="h">#</span><span id="chname"></span></span>
    <span class="topic" id="chtopic"></span>
    <div class="r">
      <button class="hbtn">⌕</button>
      <button class="hbtn">◷</button>
      <button class="hbtn"><span class="cnt" id="members"></span>👤</button>
    </div>
  </div>
  <div id="thread"></div>
  <div id="composer">
    <div id="cbox">
      <textarea id="cin" rows="2" spellcheck="false"></textarea>
      <div id="cbar">
        <button class="cbtn">＋</button><button class="cbtn"><b>B</b></button><button class="cbtn"><i>I</i></button>
        <button class="cbtn">‹›</button><button class="cbtn">@</button>
        <button id="send" disabled>➤ Send</button>
      </div>
    </div>
  </div>
</div>

<!-- details rail -->
<div id="rail">
  <div id="railh"># <span id="railname"></span><span class="x">✕</span></div>
  <div id="railbody"></div>
</div>

<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const checks=D.report.checks,passed=checks.filter(c=>c.status==='pass').length;
const fig=D.figures[0];
const v3=v=>'('+v.map(n=>(+n).toFixed(0)).join(',')+')';
const sizeOf=p=>Array.isArray(p.size)?p.size.join('×'):'r'+p.size.r+' h'+p.size.h;
const totalMass=D.measures.reduce((s,m)=>s+m.massG,0);
const stab=checks.find(c=>c.name==='stability');
const T=(i)=>new Date(Date.now()-(40-i)*60000).toTimeString().slice(0,5);

/* channels */
const chslug=fig.name.toLowerCase().replace(/\s/g,'-');
$('#chans').innerHTML=`
  <div class="chan on"><span class="h">#</span><span class="lbl">fig-1-${chslug}</span></div>
  <div class="chan"><span class="h">#</span><span class="lbl">verify-feed</span><span class="b">2</span></div>
  <div class="chan"><span class="h">#</span><span class="lbl">build-floor</span></div>
  <div class="chan"><span class="h">#</span><span class="lbl">briefs</span><span class="b">1</span></div>
  <div class="chan"><span class="h">#</span><span class="lbl">general</span></div>`;
$('#chname').textContent='fig-1-'+chslug;
$('#railname').textContent='fig-1-'+chslug;
$('#chtopic').textContent='pipeline · brief → spec → verify → arm plan · '+D.spec.units;
$('#members').textContent='4';

/* thread */
const th=$('#thread');
let html=`<div class="daydiv"><b>Today</b></div>`;
/* user brief msg */
html+=`<div class="msg"><div class="av u">DV</div><div class="mc">
  <div class="mh"><span class="n">devin</span><span class="ts">${T(38)}</span></div>
  <div class="mt">${esc(D.brief)}</div>
  <div class="mact"><button>👍</button><button>↩</button><button>⋯</button></div></div></div>`;
/* agent: designing */
html+=`<div class="msg"><div class="av b">IK</div><div class="mc">
  <div class="mh"><span class="n">inkbench-agent<span class="bot">APP</span></span><span class="ts">${T(37)}</span></div>
  <div class="mt">on it — parsing brief → LLM spec synthesis <code>fig/${fig.figNum}</code></div>
  <div class="reacts"><span class="rxn">👀 2</span><span class="rxn mine">⚙️ 1</span></div>
  <div class="mact"><button>👍</button><button>↩</button><button>⋯</button></div></div></div>`;
/* agent: spec artifact */
html+=`<div class="msg"><div class="av b">IK</div><div class="mc">
  <div class="mh"><span class="n">inkbench-agent<span class="bot">APP</span></span><span class="ts">${T(36)}</span></div>
  <div class="mt">spec synthesized — <b>${D.spec.parts.length} parts</b>, ${D.spec.joints.length} joints:</div>
  <div class="att">
    <div class="at"><span class="fi">{ }</span>${esc(D.spec.name).toLowerCase().replace(/\s/g,'-')}.spec.json</div>
    <div class="asub">${JSON.stringify(D.spec).length} bytes · units ${D.spec.units} · materials: ${Object.keys(D.spec.materials).join(', ')}</div>
    <div class="arows">${D.spec.parts.map(p=>{
      const m=D.measures.find(x=>x.id===p.id);const col=(D.spec.materials[p.material]||{}).color||'#999';
      return `<div class="arow"><span class="sw" style="background:${col}"></span><span class="id">${esc(p.id)}</span>
        <span class="sh">${esc(p.shape)}</span><span class="mt2">${esc(p.material)}</span>
        <span class="sz">${sizeOf(p)}mm</span><span class="ms">${m?Math.round(m.massG)+'g':''}</span></div>`}).join('')}
    ${D.spec.joints.map(j=>`<div class="arow"><span class="sw" style="background:#eee;border:1px solid var(--line)"></span>
        <span class="id" style="font-weight:400;color:var(--mut)">${esc(j.a)}↔${esc(j.b)}</span>
        <span class="sh">${esc(j.type)}</span><span class="mt2"></span>
        <span class="sz">axis ${v3(j.axis)} @ ${v3(j.anchor)}</span></div>`).join('')}</div>
    <div class="abtns"><button class="abtn">Open spec</button><button class="abtn">Copy JSON</button></div>
  </div>
  <div class="mact"><button>👍</button><button>↩</button><button>⋯</button></div></div></div>`;
/* agent: render */
html+=`<div class="msg"><div class="av b">IK</div><div class="mc">
  <div class="mh"><span class="n">inkbench-agent<span class="bot">APP</span></span><span class="ts">${T(34)}</span></div>
  <div class="mt">render complete — toon pipeline, assembled view:</div>
  <div class="attimg"><img src="lamp_flat.png" alt="render"><div class="cap">fig-${fig.figNum}-assembled.png · lamp_flat · ${fig.parts} parts</div></div>
  <div class="reacts"><span class="rxn">💡 3</span><span class="rxn">🔥 1</span></div>
  <div class="mact"><button>👍</button><button>↩</button><button>⋯</button></div></div></div>`;
/* agent: verification */
html+=`<div class="msg"><div class="av b">IK</div><div class="mc">
  <div class="mh"><span class="n">inkbench-agent<span class="bot">APP</span></span><span class="ts">${T(31)}</span></div>
  <div class="mt">geometric verification → <b style="color:var(--green)">${D.report.pass?'PASS':'FAIL'}</b> (${passed}/${checks.length}, ${D.report.timingMs.toFixed(1)}ms)</div>
  <div class="att ok">
    <div class="at"><span class="fi">✓</span>report.checks — all green</div>
    <div class="arows">${checks.map(c=>`
      <div class="ckrow"><span class="ci">${c.status==='pass'?'✓':'✗'}</span>
        <span class="nm">${esc(c.name)}</span>
        <span class="dt" title="${esc(c.detail)}">${esc(c.detail).slice(0,88)}${c.detail.length>88?'…':''}</span>
        ${c.measured?`<span class="mv">${(+c.measured).toFixed(2)}</span>`:''}</div>`).join('')}</div>
  </div>
  <div class="reacts"><span class="rxn mine">✅ 4</span></div>
  <div class="mact"><button>👍</button><button>↩</button><button>⋯</button></div></div></div>`;
/* agent: plan */
html+=`<div class="msg"><div class="av b">IK</div><div class="mc">
  <div class="mh"><span class="n">inkbench-agent<span class="bot">APP</span></span><span class="ts">${T(28)}</span></div>
  <div class="mt">build plan emitted — two-arm choreography, <span class="lk">@fabricator</span> ready:</div>
  <div class="att pu">
    <div class="at"><span class="fi">⚒</span>build.plan — ${D.plan.length} ops</div>

        <span class="a" style="background:#f0f0f0;color:var(--dim)">joint</span></div>`).join('')}</div>

/* composer */
const cin=$('#cin'),send=$('#send');
cin.value='';
cin.placeholder='Message #fig-1-'+chslug+' — describe a new brief';
function upd(){send.disabled=!cin.value.trim()}
cin.addEventListener('input',upd);upd();
function post(){
  const v=cin.value.trim();if(!v)return;
  send.disabled=true;
  const t=new Date().toTimeString().slice(0,5);
  th.insertAdjacentHTML('beforeend',
    `<div class="msg"><div class="av u">DV</div><div class="mc">
      <div class="mh"><span class="n">devin</span><span class="ts">${t}</span></div>
      <div class="mt">${esc(v)}</div></div></div>`);
  cin.value='';
  setTimeout(()=>{
    th.insertAdjacentHTML('beforeend',
      `<div class="msg"><div class="av b">IK</div><div class="mc">
        <div class="mh"><span class="n">inkbench-agent<span class="bot">APP</span></span><span class="ts">${t}</span></div>
        <div class="mt">brief received — queued for spec synthesis <code>fig/${fig.figNum+1}</code></div>
        <div class="reacts"><span class="rxn mine">⚙️ 1</span></div></div></div>`);
    th.scrollTop=th.scrollHeight;upd();
  },700);
  th.scrollTop=th.scrollHeight;
}
send.addEventListener('click',post);
cin.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();post()}});
</script>
