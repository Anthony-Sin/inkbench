<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Ham Shack</title>
<style>
  :root{
    --wood:#3a2a1c; --wood2:#2b1f14; --face:#1b1712; --face2:#241f18; --edge:#0f0c08;
    --amb:#ffb454; --amb2:#ffd9a0; --ice:#9adcff; --grn:#5ad97a; --red:#ff5348;
    --paper:#f2ecd8; --pencil:#4a4438;
    --mono:"SF Mono",ui-monospace,Consolas,monospace; --serif:Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;font-family:var(--mono);font-size:12px;
    color:var(--amb2);background:#171008}
  .shack{height:100vh;display:grid;grid-template-rows:56px 1fr 96px;gap:10px;padding:12px;
    background:linear-gradient(#3a2a1c,#241a10);
    background-image:repeating-linear-gradient(90deg,#00000014 0 90px,#ffffff08 90px 92px)}
  header{display:flex;align-items:center;gap:16px;padding:0 18px;background:linear-gradient(#241f18,#1b1712);
    border:1px solid var(--edge);border-radius:6px;box-shadow:0 4px 0 #0f0c08,inset 0 1px 0 #ffffff10}
  .call{font-size:17px;letter-spacing:.3em;color:var(--amb);font-weight:700}
  .call small{display:block;font-size:8px;letter-spacing:.22em;color:#8a7455;font-weight:400}
  .qth{margin-left:auto;display:flex;gap:20px}
  .qth .c{text-align:center}
  .qth .v{font-size:13px;color:var(--amb2)}
  .qth .l{font-size:8px;letter-spacing:.25em;color:#8a7455}
  .pwr{width:11px;height:11px;border-radius:50%;background:var(--grn);box-shadow:0 0 9px var(--grn);align-self:center}

  main{display:grid;grid-template-columns:1fr 430px;gap:10px;min-height:0}
  /* radio stack */
  .stack{display:flex;flex-direction:column;gap:10px;min-height:0}
  .rig{background:linear-gradient(#241f18,#161310);border:1px solid var(--edge);border-radius:8px;
    padding:12px 16px;display:grid;grid-template-columns:1fr 220px;gap:14px;box-shadow:0 4px 0 #0f0c08}
  .vfo{display:flex;flex-direction:column;gap:8px}
  .digits{background:#0a0805;border:1px solid #000;border-radius:5px;padding:10px 16px;
    display:flex;align-items:baseline;gap:10px;box-shadow:inset 0 0 24px #000}
  .digits .mhz{font-size:34px;color:var(--amb);letter-spacing:.14em;font-weight:700;
    text-shadow:0 0 14px #ffb45488;font-variant-numeric:tabular-nums}
  .digits .sub{font-size:11px;color:#8a7455;letter-spacing:.15em}
  .digits .mode{margin-left:auto;text-align:right;font-size:9px;color:var(--ice);letter-spacing:.15em;line-height:1.8}
  .bands{display:flex;gap:6px;flex-wrap:wrap}
  .band{flex:1;background:linear-gradient(#2e2820,#1b1712);border:1px solid #000;border-radius:4px;
    color:var(--amb2);font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:6px 4px;text-align:center;
    cursor:pointer;box-shadow:0 2px 0 #0f0c08}
  .band:hover{border-color:#5a4a30}
  .band.on{background:linear-gradient(#4a3418,#2e1f0c);color:var(--amb);border-color:#8a6a30;box-shadow:0 0 10px #ffb45433}
  .knobrow{display:flex;gap:14px;align-items:center}
  .knob{display:flex;flex-direction:column;align-items:center;gap:2px}
  .knob .k{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4032,#1b1712 70%);
    border:1px solid #000;position:relative;box-shadow:0 2px 4px #000}
  .knob .k i{position:absolute;left:50%;top:3px;width:2px;height:10px;background:var(--amb2);transform-origin:50% 12px}
  .knob span{font-size:7px;color:#8a7455;letter-spacing:.1em}
  .meterbox{display:flex;flex-direction:column;gap:6px}
  .smeter{height:64px;background:linear-gradient(#f2ecd8,#ddd2b0);border:2px solid #3a2e1c;border-radius:5px;
    position:relative;overflow:hidden}
  .smeter .sc{position:absolute;inset:0}
  .smeter .nd{position:absolute;left:50%;bottom:-8px;width:2px;height:76px;background:#8f1f18;transform-origin:bottom center}
  .smeter .cp{position:absolute;left:50%;bottom:-10px;width:15px;height:15px;border-radius:50%;background:#241f18;transform:translateX(-50%)}
  .smeter .lb{position:absolute;top:3px;width:100%;text-align:center;font-size:7px;letter-spacing:.25em;color:#6a5a3a}
  .mtxt{font-size:8px;color:#8a7455;letter-spacing:.2em;text-align:center}
  .ptt{display:flex;gap:8px;margin-top:2px}
  .ptt button{flex:1;background:linear-gradient(#3a2e1c,#241a10);border:1px solid #000;border-radius:4px;
    color:var(--amb2);font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;padding:6px 0;cursor:pointer}
  .ptt button:hover{color:var(--amb);border-color:#5a4a30}
  .ptt button:active{transform:translateY(1px)}

  /* monitor shelf */
  .monshelf{flex:1;display:grid;grid-template-columns:1fr 300px;gap:10px;min-height:0}
  .mon{background:linear-gradient(#241f18,#161310);border:1px solid var(--edge);border-radius:8px;padding:10px;
    display:flex;flex-direction:column;box-shadow:0 4px 0 #0f0c08;min-height:0}
  .mon .mt{font-size:8.5px;letter-spacing:.3em;color:#8a7455;margin-bottom:6px}
  .monscr{flex:1;background:#e9e4d8;border:4px solid #0f0c08;border-radius:4px;overflow:hidden;position:relative;min-height:0}
  .monscr img{width:100%;height:100%;object-fit:contain}
  .monscr .osdt{position:absolute;top:8px;left:8px;background:#0a0805cc;color:var(--grn);font-size:9px;
    letter-spacing:.15em;padding:2px 8px;border-radius:2px}
  .antbox{background:linear-gradient(#241f18,#161310);border:1px solid var(--edge);border-radius:8px;padding:12px;
    box-shadow:0 4px 0 #0f0c08;overflow:auto}
  .antbox .mt{font-size:8.5px;letter-spacing:.3em;color:#8a7455;margin-bottom:8px}
  .jr{display:flex;justify-content:space-between;font-size:10px;padding:5px 4px;border-bottom:1px dashed #ffffff12;color:var(--amb2)}
  .jr span{color:#8a7455}
  .jr b{color:var(--amb);font-weight:400}

  /* logbook */
  .book{background:var(--paper);border:1px solid #b8a988;border-radius:3px;box-shadow:0 5px 0 #0f0c08;
    display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .bhead{background:linear-gradient(#e2d8bc,#d4c9a8);padding:8px 14px;border-bottom:1px solid #b8a988;
    font-size:9px;letter-spacing:.3em;color:#6a5a3a;display:flex;justify-content:space-between}
  .bbody{flex:1;overflow:auto;padding:8px 16px;min-height:0;
    background-image:repeating-linear-gradient(0deg,transparent 0 21px,#8aa8c855 21px 22px);background-position:0 8px}
  .le{display:flex;gap:10px;font-size:10px;color:#3a3428;padding:5px 0;min-height:22px;align-items:baseline}
  .le .tm{color:#8a7a55;font-size:8.5px;width:34px;flex:none}
  .le .tx{flex:1}
  .le.qsl .tx{color:var(--pencil);font-style:italic;font-family:var(--serif)}
  .le .ok{color:#2e7a4a;font-weight:700;font-size:8.5px;letter-spacing:.1em}
  .le .fl{color:var(--red);font-weight:700;font-size:8.5px}
  .roster{border-top:2px solid #b8a988;background:linear-gradient(#f2ecd8,#e6dcc0);padding:8px 14px;max-height:230px;overflow:auto}
  .roster .rt{font-size:8px;letter-spacing:.3em;color:#6a5a3a;margin-bottom:4px}
  .ri{display:grid;grid-template-columns:22px 34px 1fr;gap:6px;font-size:9.5px;color:#3a3428;padding:3px 0;
    border-bottom:1px dotted #b8a988;align-items:baseline}
  .ri .n{color:#8a6a30;font-weight:700}
  .ri .cs{color:#7a3a2e}
  .ri small{color:#8a7a55}

  /* bottom msg */
  footer{display:flex;align-items:center;gap:14px;background:linear-gradient(#241f18,#1b1712);
    border:1px solid var(--edge);border-radius:6px;padding:0 16px;box-shadow:0 4px 0 #0f0c08}
  footer .ml{font-size:8.5px;letter-spacing:.3em;color:#8a7455}
  footer input{flex:1;background:#0a0805;border:1px solid #000;border-radius:4px;color:var(--amb);
    font-family:var(--mono);font-size:12px;padding:9px 14px;letter-spacing:.03em;caret-color:var(--amb)}
  footer input:focus{outline:none;border-color:#5a4a30;box-shadow:0 0 8px #ffb45422}
  footer button{background:linear-gradient(#3a2e1c,#241a10);border:1px solid #000;border-radius:4px;color:var(--amb);
    font-family:var(--mono);font-size:10px;letter-spacing:.25em;padding:9px 24px;cursor:pointer;box-shadow:0 2px 0 #0f0c08}
  footer button:hover{box-shadow:0 0 10px #ffb45433}
  footer button:active{transform:translateY(1px)}
</style>
</head>
<body>
<div class="shack">
  <header>
    <span class="pwr"></span>
    <div class="call">INKBENCH · KX-1<small>AMATEUR CAD BAND — ALL MODES</small></div>
    <div class="qth" id="qth"></div>
  </header>
  <main>
    <div class="stack">
      <div class="rig">
        <div class="vfo">
          <div class="digits">
            <span class="mhz" id="vfo">---.--</span>
            <span class="sub" id="vfosub"></span>
            <span class="mode" id="vfomode"></span>
          </div>
          <div class="bands" id="bands"></div>
          <div class="knobrow" id="knobs"></div>
        </div>
        <div class="meterbox">
          <div class="smeter"><div class="sc" id="sc"></div><div class="nd" id="ndl"></div><div class="cp"></div>
            <div class="lb">S-METER · TIP MARGIN</div></div>
          <div class="mtxt" id="sval"></div>
          <div class="ptt"><button id="ptt">PTT · TRANSMIT</button><button id="tune">TUNE</button></div>
        </div>
      </div>
      <div class="monshelf">
        <div class="mon">
          <div class="mt">SHACK MONITOR — ASSEMBLED STATION MODEL</div>
          <div class="monscr"><img src="lamp_flat.png" alt="render"><span class="osdt" id="osd"></span></div>
        </div>
        <div class="antbox">
          <div class="mt">JUNCTION BOX — JOINTS</div>
          <div id="joints"></div>
        </div>
      </div>
    </div>
    <div class="book">
      <div class="bhead"><span>STATION LOG — INKBENCH SHACK</span><span id="pg"></span></div>
      <div class="bbody" id="logbook"></div>
      <div class="roster"><div class="rt">NET ROSTER — BUILD CHECK-INS (ARM A / ARM B)</div><div id="rost"></div></div>
    </div>
  </main>
  <footer>
    <span class="ml">MSG ▸</span>
    <input id="brief" spellcheck="false">
    <button id="cq">CQ CQ ▸</button>
  </footer>
</div>
<script src="data.js"></script>
<script>
const D=window.DATA;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const f1=v=>(+v).toFixed(1),f2=v=>(+v).toFixed(2);
const totalMass=D.measures.reduce((s,m)=>s+m.massG,0);
const stab=D.report.checks.find(c=>c.name==='stability');
const clr=D.report.checks.find(c=>c.name==='clearance');

document.getElementById('qth').innerHTML=[
  ['QTH','FIG-'+D.figures[0].figNum],['MASS',f2(totalMass/1000)+'kg'],
  ['ATTEMPTS',D.attempts],['RST',D.report.pass?'599':'---']
].map(([l,v])=>`<div class="c"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
document.getElementById('pg').textContent='PAGE 1 · '+D.log.length+' ENTRIES';
document.getElementById('osd').textContent='● '+D.spec.name.toUpperCase();

/* VFO: band buttons = parts; digits = dims */
const vfo=document.getElementById('vfo'),sub=document.getElementById('vfosub'),mode=document.getElementById('vfomode');
const bands=document.getElementById('bands');
function sel(i){
  const p=D.spec.parts[i],m=D.measures.find(x=>x.id===p.id);
  const dm=m.dims;
  vfo.textContent=Math.max(...dm).toFixed(2);
  sub.textContent=dm.map(d=>f1(d)).join('·')+' mm';
  mode.innerHTML=`${p.shape.toUpperCase()} · ${p.material.toUpperCase()}<br>${f1(m.massG)} g · CH-${i+1}`;
  bands.querySelectorAll('.band').forEach((b,j)=>b.classList.toggle('on',j===i));
}
bands.innerHTML=D.spec.parts.map((p,i)=>`<button class="band" data-i="${i}">${esc(p.id.toUpperCase())}</button>`).join('');
bands.querySelectorAll('.band').forEach(b=>b.onclick=()=>sel(+b.dataset.i));
sel(4); // shade selected

/* knobs: decorative for joints */
document.getElementById('knobs').innerHTML=D.spec.joints.map((j,i)=>{
  const ang=j.type==='fixed'?-60:-30+i*30;
  return `<div class="knob"><div class="k"><i style="transform:translateX(-50%) rotate(${ang}deg)"></i></div>
    <span>J${i+1} ${j.type.slice(0,3).toUpperCase()}</span></div>`;
}).join('')+`<div class="knob"><div class="k"><i style="transform:translateX(-50%) rotate(40deg)"></i></div><span>AF GAIN</span></div>
  <div class="knob" style="margin-left:auto"><div class="k" style="width:44px;height:44px"><i style="transform:translateX(-50%) rotate(15deg);height:15px;transform-origin:50% 19px"></i></div><span>VFO</span></div>`;

/* S-meter → tip margin (0..110mm → needle -44..44deg) */
document.getElementById('sc').innerHTML=`<svg width="100%" height="100%" viewBox="0 0 100 56" preserveAspectRatio="none">
  <path d="M 6 52 A 46 46 0 0 1 94 52" fill="none" stroke="#6a5a3a"/>
  <path d="M 70 20 A 46 46 0 0 1 94 52" fill="none" stroke="#a03a2e" stroke-width="3"/>
  <text x="12" y="30" font-size="7" fill="#6a5a3a">1 3 5 7 9</text>
  <text x="76" y="16" font-size="6" fill="#a03a2e">+mm</text></svg>`;
document.getElementById('ndl').style.transform=`rotate(${-44+Math.min(1,stab.measured/110)*88}deg)`;
document.getElementById('sval').textContent='TIP-MARGIN '+f2(stab.measured)+' mm · CLR '+f2(clr.measured)+' mm';

/* junction box */
document.getElementById('joints').innerHTML=D.spec.joints.map((j,i)=>`
  <div class="jr"><b>J${i+1} ${esc(j.type)}</b><span>${esc(j.a)}→${esc(j.b)} · ax ${j.axis.join(',')} @ ${j.anchor.map(v=>f1(v)).join(',')}</span></div>`).join('');

/* logbook: log entries + checks as QSL */
const lb=document.getElementById('logbook');
lb.innerHTML=D.log.map((l,i)=>`<div class="le"><span class="tm">${String(9+i).padStart(2,'0')}:0${i}</span>
  <span class="tx">${esc(l)}</span></div>`).join('')
  +D.report.checks.map(c=>`<div class="le qsl"><span class="tm">QSL</span>
  <span class="tx">${esc(c.name)} — ${esc(c.detail).slice(0,70)}</span>
  <span class="${c.status==='pass'?'ok':'fl'}">${c.status==='pass'?'CFM 599':'NIL'}</span></div>`).join('');
lb.scrollTop=1e6;

/* roster */
document.getElementById('rost').innerHTML=D.plan.map(p=>{
  if(p.kind==='place')return `<div class="ri"><span class="n">${String(p.step).padStart(2,'0')}</span>
    <span class="cs">ARM-${p.arm}</span><span>${esc(p.part)} ${p.glyph} <small>${f1(p.massG)}g → ${p.seat.map(v=>f1(v)).join(',')}</small></span></div>`;
  return `<div class="ri"><span class="n">·</span><span class="cs" style="color:#2e7a4a">JNT</span>
    <span>${esc(p.type)} ${esc(p.a)}→${esc(p.b)} <small>@${p.anchor.map(v=>f1(v)).join(',')}</small></span></div>`;
}).join('');

const bi=document.getElementById('brief');bi.value=D.brief;
document.getElementById('cq').onclick=()=>{const d=document.createElement('div');d.className='le';
  d.innerHTML='<span class="tm">NOW</span><span class="tx">CQ — '+esc(bi.value)+'</span>';lb.appendChild(d);lb.scrollTop=1e6;};
document.getElementById('ptt').onclick=()=>document.getElementById('cq').click();
</script>
</body>
</html>
