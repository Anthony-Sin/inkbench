<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Gallery of Verified Artefacts</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#141210}
  body{font-family:Georgia,"Times New Roman",serif;color:#e8e0cd}
  #stage{position:absolute;left:50%;top:50%;width:1700px;height:900px;transform:translate(-50%,-50%);
    background:
      radial-gradient(900px 620px at 30% 30%,rgba(232,198,106,.10),transparent 65%),
      radial-gradient(700px 500px at 52% 45%,rgba(232,198,106,.06),transparent 60%),
      #221f1b}
  .walltop{position:absolute;top:0;left:0;right:0;height:64px;background:#191613;border-bottom:1px solid #322d25;
    display:flex;align-items:center;justify-content:space-between;padding:0 44px}
  .walltop .wing{font-size:12px;letter-spacing:5px;text-transform:uppercase;color:#c9a34e}
  .walltop .hour{font-size:11px;letter-spacing:2px;color:#8d8674}
  /* pedestal scene */
  .spot{position:absolute;top:64px;left:60px;width:520px;height:660px;pointer-events:none;
    background:linear-gradient(rgba(255,220,140,.22),rgba(255,220,140,.02) 85%);
    clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
  .floor{position:absolute;left:0;right:0;bottom:0;height:132px;background:linear-gradient(#2b2620,#1b1813);border-top:1px solid #3a342a}
  .shadowline{position:absolute;left:0;right:0;bottom:132px;height:6px;background:#0e0c0a}
  .art{position:absolute;left:150px;top:150px;width:320px;height:470px;z-index:2}
  .art img{width:100%;height:100%;object-fit:contain;filter:brightness(1.12) drop-shadow(0 18px 30px rgba(0,0,0,.7))}
  .plinth{position:absolute;left:135px;top:620px;width:350px;height:160px;background:linear-gradient(#cfc9bd,#a9a294);z-index:1;
    box-shadow:0 26px 50px rgba(0,0,0,.6)}
  .plinth::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#e2ddd2}
  .brass{position:absolute;left:50%;top:66px;transform:translateX(-50%);width:210px;background:linear-gradient(#caa64f,#a5833a);
    color:#241f14;font-size:10.5px;letter-spacing:1.5px;text-align:center;padding:8px 6px;line-height:1.5;
    border:1px solid #6e5925;box-shadow:0 2px 5px rgba(0,0,0,.4)}
  .rope{position:absolute;left:40px;top:786px;width:640px;height:8px;z-index:3}
  .rope .post{position:absolute;width:10px;height:54px;background:linear-gradient(#8a7130,#5e4c1e);top:-54px;border-radius:3px}
  .rope .post::before{content:"";position:absolute;top:-8px;left:-4px;width:18px;height:14px;border-radius:50%;background:#b3933f}
  .rope .line{position:absolute;top:-38px;left:5px;right:5px;height:34px;border-bottom:5px solid #7a1f1a;border-radius:0 0 50% 50%/0 0 100% 100%}
  /* wall placard */
  .placard{position:absolute;left:640px;top:110px;width:600px;background:#efe9da;padding:44px 48px 34px;
    box-shadow:0 14px 34px rgba(0,0,0,.55);border:1px solid #b9b09a}
  .placard .no{font-size:11px;letter-spacing:3px;color:#8a7f63;margin-bottom:10px}
  .placard h1{font-size:44px;font-style:italic;font-weight:400;color:#221d14;line-height:1.05;margin-bottom:6px}
  .placard .att{font-size:14px;color:#5c5442;margin-bottom:20px;letter-spacing:.5px}
  .placard .rule{height:1px;background:#8a7f63;margin-bottom:16px}
  .placard p.desc{font-size:13.5px;line-height:1.68;color:#3a3424;text-align:justify;margin-bottom:14px}
  .placard .med{font-size:12.5px;line-height:1.9;color:#3a3424}
  .placard .med b{letter-spacing:2px;font-variant:small-caps;color:#221d14}
  .commission{margin-top:18px;display:flex;gap:12px;align-items:center}
  .commission .line{flex:1;border-bottom:1.5px solid #5c5442;height:22px;font-size:13px;font-style:italic;color:#5c5442;padding:0 4px;outline:none}
  .commission .line:focus{border-bottom-color:#a5833a}
  .commission button{background:#221d14;color:#efe9da;border:0;font-family:inherit;font-size:11px;letter-spacing:2.5px;
    padding:9px 18px;cursor:pointer;transition:.15s}
  .commission button:hover{background:#a5833a;color:#1b1813}
  .accession{margin-top:14px;font-size:10.5px;letter-spacing:1.5px;color:#8a7f63}
  /* right rail */
  .rail{position:absolute;left:1290px;top:110px;width:370px;bottom:170px;display:flex;flex-direction:column;gap:18px}
  .card{background:#292520;border:1px solid #3c362b;padding:18px 22px;box-shadow:0 10px 26px rgba(0,0,0,.4)}
  .card h5{font-size:10.5px;letter-spacing:3.5px;color:#c9a34e;font-weight:400;text-transform:uppercase;margin-bottom:12px;
    border-bottom:1px solid #3c362b;padding-bottom:8px}
  .cond{font-size:12px;line-height:1.55;color:#d8d0bd}
  .cond .row{display:flex;gap:10px;padding:5px 0;border-bottom:1px dotted #3c362b;align-items:baseline}
  .cond .row:last-child{border:0}
  .cond .dot{width:9px;height:9px;border-radius:50%;background:#8fae6b;flex:none;transform:translateY(1px)}
  .cond .dot.bad{background:#b0553f}
  .cond .nm{text-transform:capitalize;white-space:nowrap}
  .cond .ms{margin-left:auto;font-size:10.5px;color:#8d8674;font-variant-numeric:tabular-nums}
  .cond .verd{margin-top:10px;font-size:12px;font-style:italic;color:#c9a34e}
  .prov{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#5c5442 transparent;min-height:0}
  .prov .ev{display:flex;gap:12px;font-size:11.5px;line-height:1.45;padding:5px 0;border-bottom:1px dotted #3c362b}
  .prov .ev:last-child{border:0}
  .prov .yr{color:#c9a34e;font-variant-numeric:tabular-nums;flex:none;width:44px}
  .guide{max-height:196px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#5c5442 transparent}
  .guide .tr{display:flex;gap:10px;font-size:11.5px;padding:5px 0;border-bottom:1px dotted #3c362b;color:#d8d0bd;align-items:baseline}
  .guide .tr:last-child{border:0}
  .guide .tr::before{content:"▶";color:#c9a34e;font-size:9px}
  .guide .num{color:#8d8674;font-variant-numeric:tabular-nums;font-size:10px;flex:none}
  .footer{position:absolute;left:0;right:0;bottom:0;height:44px;background:#191613;border-top:1px solid #322d25;
    display:flex;align-items:center;justify-content:space-between;padding:0 44px;font-size:10.5px;letter-spacing:2px;color:#8d8674}
  .footer .st{color:#c9a34e;letter-spacing:3px}
</style>
</head>
<body>
<div id="stage">
  <div class="walltop">
    <span class="wing">INKBENCH · Gallery of Verified Artefacts — Hall IB</span>
    <span class="hour" id="hours"></span>
  </div>
  <div class="spot"></div>
  <div class="art"><img src="lamp_flat.png" alt="the artefact"></div>
  <div class="plinth"><div class="brass" id="brass"></div></div>
  <div class="rope"><span class="post" style="left:0"></span><span class="post" style="right:0"></span><span class="line"></span></div>
  <div class="floor"></div><div class="shadowline"></div>

  <div class="placard">
    <div class="no" id="accNo"></div>
    <h1 id="title"></h1>
    <div class="att">Agent-generated assembly, resolved geometry · INKBENCH WORKBENCH</div>
    <div class="rule"></div>
    <p class="desc" id="desc"></p>
    <div class="med" id="med"></div>
    <div class="commission">
      <span class="line" id="briefline" contenteditable="true" spellcheck="false"></span>
      <button id="comm">COMMISSION ▸</button>
    </div>
    <div class="accession" id="accession"></div>
  </div>

  <div class="rail">
    <div class="card"><h5>Condition Report</h5><div class="cond" id="cond"></div></div>
    <div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column"><h5>Provenance — Assembly Order</h5>
      <div class="prov" id="prov"></div></div>
    <div class="card"><h5>Audio Guide — Bench Transcript</h5><div class="guide" id="guide"></div></div>
  </div>

  <div class="footer"><span>Please do not touch the artefact · docent available via brief</span>
    <span class="st" id="status"></span><span id="stamp"></span></div>
</div>
<script src="data.js"></script>
<script>
const D=window.DATA,S=D.spec,R=D.report;
const $=id=>document.getElementById(id);
const f=(n,d=1)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const mass=g=>g>=1000?f(g/1000,2)+' kg':f(g,0)+' g';
const dims=p=>p.shape==='box'?p.size.join(' × ')+' '+S.units:'⌀'+(p.size.r*2)+' × '+p.size.h+' '+S.units;
const tot=D.measures.reduce((a,m)=>a+m.massG,0);

$('hours').textContent=`OPEN 09:00–${18+Math.round(R.timingMs/100)}:${String(Math.round(R.timingMs)%60).padStart(2,'0')} · ADMISSION: ONE BRIEF`;
$('brass').innerHTML=`${S.name.toUpperCase()}<br>${S.parts.length} PARTS · ${mass(tot)} · ${S.units.toUpperCase()}`;
$('accNo').textContent=`ACCESSION № IB-${D.figures[0].figNum}${S.parts.length}.${D.attempts} · GALLERY ${D.figures[0].figNum}`;
$('title').textContent=S.name;
$('desc').textContent=`Conceived from the single line “${D.brief},” this work was designed, rendered and geometrically verified by the resident agent in ${f(R.timingMs,0)} milliseconds — ${S.parts.length} resolved parts held by ${S.joints.length} joints, ${R.failures.length} defects recorded.`;
$('med').innerHTML=
  `<b>Medium</b> — ${Object.entries(S.materials).map(([k,m])=>`${k} (ρ ${f(m.density,0)} kg/m³)`).join(', ')}<br>`+
  `<b>Dimensions</b> — ${D.measures.map(m=>`${m.id.replace('_',' ')}: ${m.dims.map(d=>f(d,1)).join('×')}`).join('; ')} ${S.units}<br>`+
  `<b>Credit line</b> — Commissioned by the visitor's brief; verified ${D.attempts} attempt(s), min clearance ${S.tests.min_clearance_mm} ${S.units}.`;
$('briefline').textContent=D.brief;
$('accession').textContent=`On view courtesy of the INKBENCH verification bench — certificate of soundness ${R.pass?'issued':'withheld'}.`;

$('cond').innerHTML=R.checks.map(c=>
  `<div class="row" title="${c.detail.replace(/"/g,'')}"><span class="dot${c.status==='pass'?'':' bad'}"></span>
   <span class="nm">${c.name}</span><span class="ms">${c.measured?f(c.measured,2)+' '+S.units:'—'}</span></div>`).join('')+
  `<div class="verd">Overall condition: ${R.pass?'SOUND — cleared for display':'UNSOUND — returned to bench'}.</div>`;

$('prov').innerHTML=D.plan.map(s=>s.kind==='place'
  ?`<div class="ev"><span class="yr">STEP ${s.step}</span><span><b>${s.part.replace('_',' ')}</b> acquired by Arm ${s.arm} — placed ${s.glyph} from +z, ${mass(s.massG)}, seated at z ${f(s.seat[2],0)} ${S.units}.</span></div>`
  :`<div class="ev"><span class="yr">JOIN</span><span>${s.type} union effected — <i>${s.a.replace('_',' ')}</i> to <i>${s.b.replace('_',' ')}</i>, axis ${s.axis.join(',')}.</span></div>`).join('');

$('guide').innerHTML=D.log.map((l,i)=>`<div class="tr"><span class="num">${String(i+1).padStart(2,'0')}</span>${l}</div>`).join('');
$('status').textContent=R.pass?'STATUS · VERIFIED — ON PERMANENT VIEW':'STATUS · REJECTED — OFF VIEW';
$('stamp').textContent=`VERIFIED IN ${f(R.timingMs,0)} MS · ${R.checks.length}/${R.checks.length} CHECKS SOUND`;

$('comm').onclick=()=>{
  const b=$('briefline').textContent.trim()||D.brief;
  $('guide').innerHTML+=`<div class="tr"><span class="num">${String(D.log.length+1).padStart(2,'0')}</span>commission received ▸ ${b}</div>`;
  $('guide').scrollTop=1e6;
};
$('briefline').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('comm').click()}});

const stage=document.getElementById('stage');
function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1700,innerHeight/900)})`}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
