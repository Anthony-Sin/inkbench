<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Dome Control</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1700px; height: 900px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 38% 40%, #0d1826 0%, #070d16 55%, #04070c 100%);
    color: #b9c6d8; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 12px; position: relative;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
  .star { position: absolute; background: #dfe9f5; border-radius: 50%; opacity: .5; }

  /* ---------- dome ---------- */
  #domeWrap { position: absolute; left: 130px; top: 128px; width: 660px; height: 660px; }
  #ticks { position: absolute; inset: -34px; }
  .tick {
    position: absolute; left: 50%; top: 50%; width: 1px; background: #2b3d55;
    transform-origin: 0 0;
  }
  .tick.major { background: #54708f; }
  .tlabel {
    position: absolute; font-size: 9px; letter-spacing: .2em; color: #54708f;
    font-family: ui-monospace, Menlo, monospace; transform: translate(-50%,-50%);
  }
  #dome {
    position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 68%, #12233a 0%, #0a1524 55%, #060d18 100%);
    border: 2px solid #2b3d55;
    box-shadow: 0 0 0 8px #0a111c, 0 0 0 9px #223349, 0 0 60px rgba(120,170,255,.08), inset 0 0 90px rgba(0,0,0,.55);
  }
  #dome .grid {
    position: absolute; inset: 0; opacity: .5; pointer-events: none;
    background:
      radial-gradient(circle at 50% 50%, transparent 31%, rgba(120,170,255,.06) 31.5%, transparent 32%),
      radial-gradient(circle at 50% 50%, transparent 62%, rgba(120,170,255,.06) 62.5%, transparent 63%),
      linear-gradient(rgba(120,170,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,170,255,.06) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%;
  }
  #dome img {
    position: absolute; left: 50%; top: 50%; height: 86%;
    transform: translate(-50%,-50%) rotate(0deg) scale(1);
    filter: brightness(1) saturate(1) drop-shadow(0 0 30px rgba(140,180,255,.12));
    transition: transform .25s ease;
  }
  #dome .dlabel {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 9px; letter-spacing: .3em; color: #54708f; text-transform: uppercase;
    font-family: ui-monospace, Menlo, monospace; white-space: nowrap;
  }
  #dome .crossh { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(120,170,255,.1); }
  #dome .crossv { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(120,170,255,.1); }
  /* ring controls */
  .rbtn {
    position: absolute; width: 40px; height: 40px; border-radius: 50%;
    background: #0d1723; border: 1px solid #2b3d55; color: #8fb4dd;
    font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .15s; z-index: 6; font-family: inherit;
  }
  .rbtn:hover { border-color: #8fb4dd; color: #dcebfb; box-shadow: 0 0 14px rgba(140,180,255,.25); }
  .rbtn:active { transform: scale(.92); }
  .rbtn small { position: absolute; top: 42px; left: 50%; transform: translateX(-50%); font-size: 8px; letter-spacing: .14em; color: #54708f; white-space: nowrap; }

  /* ---------- console card (brief) ---------- */
  #console {
    position: absolute; left: 34px; top: 30px; width: 430px;
    background: rgba(10,17,28,.82); border: 1px solid #223349; border-radius: 8px;
    backdrop-filter: blur(6px); padding: 13px 16px; z-index: 10;
  }
  #console .ch { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: .26em; color: #8fb4dd; text-transform: uppercase; margin-bottom: 8px; }
  #console .ch .ok { color: #6ee7b7; }
  #console .btext { font-size: 12px; color: #dcebfb; font-style: italic; line-height: 1.5; }
  #console .row { display: flex; gap: 8px; margin-top: 9px; }
  #console input {
    flex: 1; background: #060d18; border: 1px solid #223349; border-radius: 4px;
    color: #dcebfb; font-size: 11px; padding: 7px 10px; outline: none; font-family: inherit;
  }
  #console input:focus { border-color: #8fb4dd; }
  #console button {
    background: #1d4e79; border: 1px solid #3b82b8; color: #cfe6fb; font-size: 10px;
    letter-spacing: .14em; padding: 0 14px; border-radius: 4px; cursor: pointer;
    font-family: inherit; text-transform: uppercase;
  }
  #console button:hover { background: #2a6ea8; }

  /* ---------- right: telescope panel ---------- */
  #panel {
    position: absolute; right: 30px; top: 30px; width: 350px; bottom: 118px;
    background: rgba(10,17,28,.85); border: 1px solid #223349; border-radius: 8px;
    backdrop-filter: blur(6px); overflow: hidden auto; z-index: 10;
    display: flex; flex-direction: column;
  }
  #panel::-webkit-scrollbar { width: 6px; } #panel::-webkit-scrollbar-thumb { background: #223349; }
  .psec { padding: 13px 16px; border-bottom: 1px solid #15203300; border-bottom: 1px solid #141f30; }
  .psec h5 { font-size: 9px; letter-spacing: .28em; color: #8fb4dd; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .psec h5 .dim { color: #47607f; letter-spacing: .1em; }
  .srow { margin-bottom: 12px; }
  .srow .sl { display: flex; justify-content: space-between; font-size: 10px; color: #93a7c2; margin-bottom: 5px; }
  .srow .sl .v { font-family: ui-monospace, Menlo, monospace; color: #dcebfb; }
  input[type=range] {
    width: 100%; -webkit-appearance: none; height: 3px; border-radius: 2px;
    background: #223349; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #8fb4dd; border: 2px solid #0a111c; box-shadow: 0 0 8px rgba(140,180,255,.5);
  }
  .rd { display: flex; justify-content: space-between; font-size: 10.5px; padding: 3px 0; color: #93a7c2; }
  .rd .v { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #dcebfb; }
  .stat { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 3.5px 0; cursor: default; }
  .stat:hover { background: rgba(140,180,255,.05); }
  .stat .lamp { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; flex: none; }
  .stat .lamp.f { background: #f87171; box-shadow: 0 0 8px #f87171; }
  .stat .n { color: #c3d1e4; text-transform: capitalize; }
  .stat .m { margin-left: auto; font-size: 9px; color: #47607f; font-family: ui-monospace, Menlo, monospace; }
  #obsLog { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; line-height: 1.85; color: #5d7492; }
  #obsLog div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #obsLog div:last-child { color: #6ee7b7; }
  #obsLog div:hover { color: #dcebfb; }
  .verdict {
    display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
  }
  .verdict .vb {
    font-size: 15px; font-weight: 800; letter-spacing: .24em; padding: 4px 14px;
    border-radius: 4px; border: 1px solid #059669; color: #6ee7b7; background: rgba(5,150,105,.1);
  }
  .verdict .vm { font-size: 9px; color: #47607f; line-height: 1.6; }

  /* ---------- bottom: manipulator sequence ---------- */
  #seqbar {
    position: absolute; left: 34px; right: 30px; bottom: 22px; height: 78px;
    background: rgba(10,17,28,.85); border: 1px solid #223349; border-radius: 8px;
    backdrop-filter: blur(6px); display: flex; align-items: center; gap: 9px;
    padding: 0 16px; z-index: 10;
  }
  #seqbar .sh { font-size: 9px; letter-spacing: .24em; color: #8fb4dd; text-transform: uppercase; flex: none; margin-right: 6px; text-align: center; }
  .scell {
    display: flex; align-items: center; gap: 8px; padding: 7px 11px;
    background: #0a1524; border: 1px solid #1d2f47; border-radius: 6px; flex: none; cursor: default;
  }
  .scell:hover { border-color: #8fb4dd; }
  .scell .sn { font-size: 9px; color: #54708f; font-family: ui-monospace, Menlo, monospace; }
  .scell .gl { color: #8fb4dd; font-size: 13px; }
  .scell .pt { font-size: 11px; color: #dcebfb; font-weight: 600; }
  .scell .ms { font-size: 8.5px; color: #47607f; font-family: ui-monospace, Menlo, monospace; }
  .scell .at { font-size: 8px; font-weight: 800; padding: 1.5px 7px; border-radius: 9px; }
  .at.A { background: #123a52; color: #7dd3fc; } .at.B { background: #45132b; color: #f9a8d4; }
  .scell.j { border-style: dashed; opacity: .75; }
  .scell.j .pt { font-size: 9px; font-weight: 400; font-family: ui-monospace, Menlo, monospace; color: #8fa0b5; }
  .arr { color: #223349; flex: none; }
  #seqbar .st { margin-left: auto; font-size: 9.5px; color: #47607f; text-align: right; line-height: 1.6; flex: none; }
  #seqbar .st b { color: #6ee7b7; letter-spacing: .14em; }
</style>
</head>
<body>
  <div id="stars"></div>

  <!-- dome -->
  <div id="domeWrap">
    <div id="ticks"></div>
    <div id="dome">
      <div class="grid"></div>
      <div class="crossh"></div><div class="crossv"></div>
      <img id="optics" src="lamp_flat.png" alt="render">
      <div class="dlabel" id="domeLabel"></div>
    </div>
    <button class="rbtn" id="rotL" style="left:-58px;top:310px" title="rotate −5°">⟲<small>SLEW −</small></button>
    <button class="rbtn" id="rotR" style="right:-58px;top:310px" title="rotate +5°">⟳<small>SLEW +</small></button>
    <button class="rbtn" id="zin"  style="left:310px;top:-58px" title="zoom in">＋<small>ZOOM+</small></button>
    <button class="rbtn" id="zout" style="left:310px;bottom:-58px" title="zoom out">－<small>ZOOM−</small></button>
  </div>

  <!-- brief console -->
  <div id="console">
    <div class="ch"><span>OBS Console · Target Brief</span><span class="ok" id="conStatus"></span></div>
    <div class="btext" id="briefText"></div>
    <div class="row"><input id="briefIn" spellcheck="false"><button id="briefBtn">Slew ▸</button></div>
  </div>

  <!-- telescope panel -->
  <div id="panel">
    <div class="psec">
      <h5>Telescope Settings <span class="dim">optics</span></h5>
      <div class="srow"><div class="sl"><span>EXPOSURE</span><span class="v" id="vExp">1.00</span></div>
        <input type="range" id="sExp" min="60" max="140" value="100"></div>
      <div class="srow"><div class="sl"><span>COLOR GAIN</span><span class="v" id="vGain">1.00</span></div>
        <input type="range" id="sGain" min="40" max="160" value="100"></div>
      <div class="srow" style="margin-bottom:0"><div class="sl"><span>FIELD SCALE</span><span class="v" id="vFov">1.00×</span></div>
        <input type="range" id="sFov" min="70" max="130" value="100"></div>
    </div>
    <div class="psec">
      <h5>Target Acquired <span class="dim" id="tgtUnits"></span></h5>
      <div id="targetRows"></div>
    </div>
    <div class="psec">
      <h5>Instrument Status <span class="dim" id="vTime"></span></h5>
      <div class="verdict"><div class="vb" id="vBadge"></div><div class="vm" id="vMeta"></div></div>
      <div id="checks"></div>
    </div>
    <div class="psec" style="flex:1">
      <h5>Observation Log <span class="dim">tty</span></h5>
      <div id="obsLog"></div>
    </div>
  </div>

  <!-- sequence bar -->
  <div id="seqbar">
    <div class="sh">Manipulator<br>Sequence</div>
    <div id="seqCells" style="display:flex;gap:7px;align-items:center"></div>
    <div class="st" id="seqStatus"></div>
  </div>

<script src="data.js"></script>
<script>
(function(){
  const D = window.DATA, $ = s => document.querySelector(s);

  /* starfield */
  const stars = $('#stars'); let sh = '';
  for (let i=0;i<120;i++){
    const x = Math.random()*1700, y = Math.random()*900, r = Math.random()*1.6+0.4;
    sh += '<div class="star" style="left:'+x.toFixed(0)+'px;top:'+y.toFixed(0)+'px;width:'+r.toFixed(1)+'px;height:'+r.toFixed(1)+'px;opacity:'+(0.15+Math.random()*0.5).toFixed(2)+'"></div>';
  }
  stars.innerHTML = sh;

  /* horizon ring ticks */
  const tk = $('#ticks'); const R = 360; let th='';
  for (let i=0;i<72;i++){
    const a = i*5*Math.PI/180, len = i%6===0 ? 16 : 9;
    const x1 = Math.sin(a)*R, y1 = -Math.cos(a)*R;
    const x2 = Math.sin(a)*(R-len), y2 = -Math.cos(a)*(R-len);
    th += '<div class="tick' + (i%6===0?' major':'') + '" style="height:' + Math.hypot(x2-x1,y2-y1) + 'px;' +
      'transform:translate(' + x1 + 'px,' + y1 + 'px) rotate(' + (i*5) + 'deg)"></div>';
  }
  /* rotate-transform trick: instead place labels */
  tk.innerHTML = th;
  ['0°','90°','180°','270°'].forEach((t,i)=>{
    const a = i*90*Math.PI/180;
    const el = document.createElement('div');
    el.className = 'tlabel'; el.textContent = t;
    el.style.left = 'calc(50% + ' + (Math.sin(a)*330).toFixed(0) + 'px)';
    el.style.top  = 'calc(50% + ' + (-Math.cos(a)*330).toFixed(0) + 'px)';
    tk.appendChild(el);
  });

  /* dome label */
  $('#domeLabel').textContent = 'DOME-1 · ' + D.spec.name.toUpperCase() + ' · FIG ' + D.figures[0].figNum;

  /* ring controls: rotate & zoom the render */
  let rot = 0, zoom = 1;
  const optics = $('#optics');
  function apply(){ optics.style.transform = 'translate(-50%,-50%) rotate(' + rot + 'deg) scale(' + zoom + ')'; }
  $('#rotL').onclick = () => { rot -= 5; apply(); };
  $('#rotR').onclick = () => { rot += 5; apply(); };
  $('#zin').onclick  = () => { zoom = Math.min(1.6, zoom + 0.08); apply(); };
  $('#zout').onclick = () => { zoom = Math.max(0.6, zoom - 0.08); apply(); };

  /* telescope sliders → live image filter */
  const sExp=$('#sExp'), sGain=$('#sGain'), sFov=$('#sFov');
  function filt(){
    const e=sExp.value/100, g=sGain.value/100, f=sFov.value/100;
    $('#vExp').textContent=e.toFixed(2); $('#vGain').textContent=g.toFixed(2); $('#vFov').textContent=f.toFixed(2)+'×';
    optics.style.filter='brightness('+e+') saturate('+g+') drop-shadow(0 0 30px rgba(140,180,255,.12))';
    zoom = f; apply();
  }
  [sExp,sGain,sFov].forEach(s=>s.oninput=filt);

  /* console */
  $('#conStatus').textContent = D.report.pass ? '● LOCKED' : '● LOST';
  $('#briefText').textContent = '“' + D.brief + '”';
  $('#briefIn').value = D.brief;
  $('#briefBtn').onclick = () => {
    const l = document.createElement('div');
    l.textContent = 'slew ▸ ' + $('#briefIn').value.slice(0,30);
    $('#obsLog').appendChild(l); l.scrollIntoView();
  };

  /* target readouts — derived from spec */
  $('#tgtUnits').textContent = D.spec.units;
  const maxZ = Math.max(...D.spec.parts.map(p=>p.position[2]));
  const stab = D.report.checks.find(c=>c.name==='stability');
  const clr  = D.report.checks.find(c=>c.name==='clearance');
  $('#targetRows').innerHTML =
    '<div class="rd"><span>object</span><span class="v">' + D.spec.name + '</span></div>' +
    '<div class="rd"><span>catalog</span><span class="v">FIG-' + D.figures[0].figNum + ' · attempt ' + D.attempts + '</span></div>' +
    '<div class="rd"><span>altitude (z-max)</span><span class="v">' + maxZ + ' ' + D.spec.units + '</span></div>' +
    '<div class="rd"><span>mass</span><span class="v">' + (D.measures.reduce((a,m)=>a+m.massG,0)/1000).toFixed(2) + ' kg</span></div>' +
    '<div class="rd"><span>focus margin</span><span class="v">' + (stab?stab.measured.toFixed(1):'—') + ' mm</span></div>' +
    '<div class="rd"><span>seeing (clr)</span><span class="v">' + (clr?clr.measured.toFixed(1):'—') + ' mm</span></div>';

  /* instrument status */
  $('#vTime').textContent = D.report.timingMs + 'ms';
  $('#vBadge').textContent = D.report.pass ? 'PASS' : 'FAIL';
  if (!D.report.pass) { const b=$('#vBadge'); b.style.borderColor='#dc2626'; b.style.color='#fca5a5'; }
  $('#vMeta').innerHTML = D.report.checks.length + ' sensors<br>' + D.report.failures.length + ' faults';
  $('#checks').innerHTML = D.report.checks.map(c =>
    '<div class="stat" title="' + c.detail.replace(/"/g,'&quot;') + '">' +
    '<span class="lamp' + (c.status==='pass'?'':' f') + '"></span><span class="n">' + c.name + '</span>' +
    '<span class="m">' + (c.measured ? c.measured.toFixed(1) : 'ok') + '</span></div>').join('');

  /* log */
  $('#obsLog').innerHTML = D.log.map(l => '<div>' + l + '</div>').join('');

  /* sequence */
  const cells = [];
  D.plan.forEach(s => {
    if (s.kind === 'place') cells.push(
      '<div class="scell" title="seat (' + s.seat.join(',') + ')"><span class="sn">' + s.step + '</span>' +
      '<span class="gl">' + s.glyph + '</span><span><div class="pt">' + s.part + '</div>' +
      '<div class="ms">' + s.massG.toFixed(0) + 'g</div></span><span class="at ' + s.arm + '">' + s.arm + '</span></div>');
    else cells.push('<div class="scell j" title="axis (' + s.axis.join(',') + ') @(' + s.anchor.join(',') + ')">' +
      '<span><div class="pt">⚿ ' + s.type + '</div><div class="ms">' + s.a + '~' + s.b + '</div></span></div>');
  });
  $('#seqCells').innerHTML = cells.join('<span class="arr">›</span>');
  $('#seqStatus').innerHTML = (D.report.pass ? '<b>● GO</b> for build<br>' : '<b style="color:#f87171">● HOLD</b><br>') +
    D.plan.filter(s=>s.kind==='place').length + ' placements · ' + D.plan.filter(s=>s.kind==='joint').length + ' joints';
})();
</script>
</body>
</html>
