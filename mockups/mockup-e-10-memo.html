<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Inter-Office Memo</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(ellipse at 50% 30%,#5a4630 0%,#3a2c1c 60%,#241a10 100%);
    font-family:"Special Elite","Courier New",monospace;color:#222;
    display:flex;padding:22px 26px;gap:26px;
  }
  .red{font-family:"Segoe Script","Bradley Hand","Comic Sans MS",cursive;color:#b32020}
  /* ================= desk misc ================= */
  #pencil{
    position:fixed;left:30px;bottom:40px;width:190px;height:12px;transform:rotate(-8deg);
    background:linear-gradient(#e8a820 0 70%,#c07f10 70%);border-radius:3px 0 0 3px;
    box-shadow:3px 4px 8px rgba(0,0,0,.5);z-index:1;pointer-events:none;
  }
  #pencil::before{content:"";position:absolute;right:-16px;top:0;border-left:16px solid #e8cf9a;border-top:6px solid transparent;border-bottom:6px solid transparent}
  #pencil::after{content:"";position:absolute;right:-16px;top:3px;border-left:16px solid #333;border-top:3px solid transparent;border-bottom:3px solid transparent}
  #pencil .band{position:absolute;left:0;top:0;bottom:0;width:14px;background:#b0b0b0;border-radius:3px 0 0 3px;border-right:1px solid #888}
  /* ================= memo sheet ================= */
  #memostack{flex:0 0 800px;position:relative;min-height:0;z-index:2}
  #carbon{
    position:absolute;inset:0;transform:rotate(-2.6deg) translateX(-14px);
    background:#e6dff0;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:40px;
    font-size:12px;color:#5a4a8a;opacity:.9;
  }
  #carbon .ccmark{position:absolute;top:14px;left:40px;letter-spacing:4px;font-size:10px}
  #carbon::after{content:"CARBON";position:absolute;bottom:26px;right:50px;font-size:34px;color:rgba(90,70,150,.18);letter-spacing:10px;transform:rotate(-4deg)}
  #memo{
    position:absolute;inset:0;transform:rotate(.7deg);
    background:linear-gradient(#fdfbf4,#f6f1e2);
    box-shadow:0 12px 34px rgba(0,0,0,.55),inset 0 0 60px rgba(120,90,40,.06);
    display:flex;flex-direction:column;padding:34px 44px 26px;
  }
  /* staples */
  .staple{position:absolute;width:26px;height:5px;background:linear-gradient(#d8d8d8,#8a8a8a 60%,#c0c0c0);
    border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.4);z-index:3}
  .staple.s1{top:16px;left:52px;transform:rotate(-38deg)}
  .staple.s2{top:30px;left:40px;transform:rotate(-38deg)}
  #mhead{flex:0 0 auto;text-align:center;border-bottom:2px solid #222;padding-bottom:8px;position:relative}
  #mhead .org{font-size:17px;letter-spacing:6px}
  #mhead .doc{font-size:13px;letter-spacing:3px;margin-top:2px}
  #mhead .conf{position:absolute;right:0;top:0;font-size:10px;color:#b32020;border:1.5px solid #b32020;padding:2px 8px;transform:rotate(6deg)}
  #fields{flex:0 0 auto;padding:10px 0 6px;border-bottom:1px solid #999;font-size:13.5px;line-height:1.9;position:relative}
  #fields .fl{display:flex;gap:8px}
  #fields .k{flex:0 0 58px;font-weight:bold}
  #fields input{
    flex:1;background:transparent;border:none;border-bottom:1px dotted #777;font-family:inherit;
    font-size:13.5px;color:#222;padding:0 4px;
  }
  #fields input:focus{outline:none;border-bottom:1px solid #b32020;background:rgba(179,32,32,.04)}
  .redline{position:relative;display:inline-block}
  .redline::after{content:"";position:absolute;left:-4px;right:-4px;top:55%;height:2px;background:#b32020;transform:rotate(-1.4deg)}
  #mbody{flex:1;min-height:0;overflow-y:auto;padding:12px 4px 0;font-size:12.5px;line-height:1.75}
  #mbody p{margin-bottom:9px}
  #mbody .sec{font-weight:bold;letter-spacing:1px;margin:14px 0 6px;border-bottom:1px dotted #888}
  /* typed table */
  .ttab{width:100%;border-collapse:collapse;font-size:11.5px}
  .ttab td,.ttab th{border:1px solid #555;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttab th{border-bottom:2px solid #222;text-align:left;letter-spacing:1px}
  .ttab td.r{text-align:right}
  .chk{display:flex;gap:8px;padding:5px 0;border-bottom:1px dotted #aaa;align-items:baseline}
  .chk .bx{flex:0 0 18px;height:18px;border:2px solid #222;display:flex;align-items:center;justify-content:center;font-size:14px;transform:rotate(-1deg)}
  .chk .bx.ok{color:#1a5d1a}.chk .bx.no{color:#b32020;border-color:#b32020}
  .chk .txt{flex:1}
  .chk .txt .nm{font-weight:bold;letter-spacing:1px}
  .chk .txt .dt{font-size:11px;color:#555}
  .chk .verdict{flex:0 0 auto;font-weight:bold;letter-spacing:2px}
  .chk .verdict.p{color:#1a5d1a}.chk .verdict.f{color:#b32020;text-decoration:underline}
  .marg{position:absolute;font-size:13px;transform:rotate(-4deg)}
  .step{padding:2.5px 0;font-size:12px;display:flex;gap:10px}
  .step .sn{flex:0 0 56px}
  .step .arm{flex:0 0 62px;font-weight:bold}
  .step.j{color:#444;padding-left:66px}
  .strike{position:relative}
  .strike::after{content:"XXXXXXXXX";position:absolute;left:0;top:0;color:rgba(30,30,30,.75);letter-spacing:1px}
  .u2{border-bottom:2px solid #222}
  /* action footer */
  #mfoot{flex:0 0 auto;border-top:2px solid #222;padding-top:8px;margin-top:8px;font-size:12px}
  #mfoot .ccl{line-height:1.8}
  #retype{
    float:right;background:none;border:2px solid #b32020;color:#b32020;font-family:inherit;
    font-size:13px;letter-spacing:2px;padding:7px 18px;cursor:pointer;transform:rotate(-1.5deg);
  }
  #retype:hover{background:#b32020;color:#f6f1e2}
  #stamp{
    position:absolute;right:60px;bottom:120px;border:3px double #1a5d1a;color:#1a5d1a;
    font-size:22px;letter-spacing:5px;padding:6px 20px;transform:rotate(-8deg);opacity:.85;
    background:rgba(255,255,255,.35);pointer-events:none;
  }
  #stamp.bad{border-color:#b32020;color:#b32020}
  /* ================= right column attachments ================= */
  #atts{flex:1;min-width:420px;display:flex;flex-direction:column;gap:20px;min-height:0;z-index:2}
  .slip{
    background:linear-gradient(#f8f3e4,#efe7d0);box-shadow:0 8px 22px rgba(0,0,0,.5);
    padding:16px 20px;position:relative;
  }
  .slip .cap{font-size:11px;letter-spacing:3px;color:#666;border-bottom:1px solid #999;padding-bottom:4px;margin-bottom:8px}
  .slip.grow{flex:1;min-height:0;overflow-y:auto}
  /* photo attachment w/ clip */
  #photo{transform:rotate(1.4deg);align-self:center;width:auto;background:#fff;padding:10px 10px 30px;box-shadow:0 10px 26px rgba(0,0,0,.55);position:relative;flex:0 0 auto}
  #photo img{display:block;width:auto;max-width:100%;height:min(400px,48vh);object-fit:contain;filter:grayscale(.5) sepia(.15) contrast(1.05)}
  #photo .lbl{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:#333}
  .clip{
    position:absolute;top:-14px;left:50%;margin-left:-11px;width:22px;height:44px;z-index:4;
    border:2.5px solid #9a9a9a;border-radius:10px 10px 4px 4px;border-bottom:none;
    background:transparent;
  }
  .clip::before{content:"";position:absolute;top:8px;left:3px;right:3px;height:26px;
    border:2px solid #9a9a9a;border-radius:8px 8px 0 0;border-bottom:none}
  /* routing slip log */
  .route{font-size:11.5px;line-height:1.8;color:#333}
  .route div{display:flex;gap:8px;padding:2px 0;border-bottom:1px dotted #bbb}
  .route div::before{content:"→";color:#888}
  .route .init{margin-left:auto;color:#b32020;font-family:"Segoe Script","Bradley Hand",cursive}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#b0a888}
</style>
</head>
<body>
<div id="pencil"><span class="band"></span></div>

<div id="memostack">
  <div id="carbon">
    <div class="ccmark">· CARBON COPY · RETAIN IN FILE IB ·</div>
    <div id="carbonbody" style="margin-top:10px"></div>
  </div>
  <div id="memo">
    <span class="staple s1"></span><span class="staple s2"></span>
    <div id="mhead">
      <div class="conf">CONFIDENTIAL</div>
      <div class="org">INKBENCH FABRICATION DIVISION</div>
      <div class="doc">— INTER-OFFICE MEMORANDUM —</div>
    </div>
    <div id="fields">
      <div class="fl"><span class="k">TO:</span><span>Fabrication Pool — Two-Arm Cell (A &amp; B)</span></div>
      <div class="fl"><span class="k">FROM:</span><span>INKBENCH Agent, Desk 07</span></div>
      <div class="fl"><span class="k">DATE:</span><span id="date"></span><span style="margin-left:30px" class="k">FILE:</span><span id="file"></span></div>
      <div class="fl"><span class="k">RE:</span>
        <input id="brief" spellcheck="false">
        <span class="red marg" style="right:24px;top:6px">rush job!!</span>
      </div>
    </div>
    <div id="mbody"></div>
    <div id="mfoot">
      <button id="retype">RE-TYPE &amp; RE-FILE →</button>
      <div class="ccl" id="cclist"></div>
      <div style="margin-top:6px">/ib &nbsp;·&nbsp; dictated but not read</div>
    </div>
    <div id="stamp"></div>
  </div>
</div>

<div id="atts">
  <div id="photo">
    <span class="clip"></span>
    <img src="lamp_flat.png" alt="render proof">
    <div class="lbl" id="photolbl"></div>
  </div>
  <div class="slip grow">
    <div class="cap">ATTACHMENT B — ROUTE SLIP / SHOP RECORD</div>
    <div class="route" id="log"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s);
const f=(a,d=0)=>a.map(x=>(+x).toFixed(d)).join(', ');
const mass=id=>{const m=D.measures.find(m=>m.id===id);return m?m.massG:0};
const TOT=D.measures.reduce((s,m)=>s+m.massG,0);
const today=new Date();
$('#date').textContent=today.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
$('#file').textContent='IB-'+String(D.attempts).padStart(4,'0');
$('#brief').value=D.brief;
$('#photolbl').textContent='ATTACH. A — '+D.figures[0].name+', render proof ('+D.figures[0].parts+' pcs)';

/* ================= memo body ================= */
let h='';
h+='<p>&nbsp;&nbsp;&nbsp;&nbsp;Pursuant to the above request, the undersigned has caused a '
  +'specification to be drafted and subjected the resulting geometry to the standard '
  +'battery of <span class="strike">four</span> five proofs. Findings are enumerated below. '
  +'Kindly <span class="u2">route to the shop floor</span> upon approval.</p>';

h+='<div class="sec">1. SPECIFICATION AS DRAFTED ('+D.spec.units+')</div>';
h+='<table class="ttab"><tr><th>PART</th><th>SHAPE</th><th>DIMENSIONS</th><th>MATERIAL</th><th style="text-align:right">WT.(g)</th></tr>';
D.spec.parts.forEach(p=>{
  const m=D.measures.find(m=>m.id===p.id);
  const sz=Array.isArray(p.size)?p.size.join(' × '):('r'+p.size.r+' × h'+p.size.h);
  h+='<tr><td>'+p.id+'</td><td>'+p.shape+'</td><td>'+sz+'</td><td>'+p.material+'</td><td class="r">'+(m?m.massG.toFixed(1):'—')+'</td></tr>';
});
h+='<tr><td colspan="4"><b>total, '+D.spec.parts.length+' parts / '+D.spec.joints.length+' joints</b></td><td class="r"><b>'+TOT.toFixed(1)+'</b></td></tr></table>';

h+='<div class="sec">2. VERIFICATION — OFFICE COPY '+
  '<span class="red" style="font-size:12px">(initial each box!)</span></div>';
D.report.checks.forEach(k=>{
  const p=k.status==='pass';
  h+='<div class="chk"><span class="bx '+(p?'ok':'no')+'">'+(p?'✓':'✗')+'</span>'+
    '<span class="txt"><span class="nm">'+k.name.toUpperCase()+'</span>'+
    (k.measured?' <i>['+(+k.measured).toFixed(2)+']</i>':'')+
    '<br><span class="dt">'+k.detail.slice(0,110)+'</span></span>'+
    '<span class="verdict '+(p?'p':'f')+'">'+(p?'PASS':'FAIL')+'</span></div>';
});

h+='<div class="sec">3. WORK ORDER — DUAL-ARM CELL</div>';
D.plan.forEach(s=>{
  if(s.kind==='place'){
    h+='<div class="step"><span class="sn">STEP '+String(s.step).padStart(2,'0')+'</span>'+
      '<span class="arm">ARM '+s.arm+'</span>'+
      '<span>place <b>'+s.part+'</b> '+s.glyph+' — seat ['+f(s.seat,0)+'], '+s.massG.toFixed(0)+' g'+(s.heavy?', LIFT WITH CARE':'')+'</span></div>';
  }else{
    h+='<div class="step j"><span class="sn"></span><span class="arm"></span>'+
      '<span>— secure '+s.type+' joint '+s.a+'~'+s.b+' @ ['+f(s.anchor,0)+']</span></div>';
  }
});

h+='<div class="sec">4. REMARKS</div>';
h+='<p>&nbsp;&nbsp;&nbsp;&nbsp;'+(D.report.pass
  ? 'All proofs satisfactory. Mass '+ (TOT/1000).toFixed(3) +' kg concentrated in the base, as briefed. '
    +'Verification consumed '+D.report.timingMs+' ms of the typing pool\'s time. The Pool is reminded that '
    +'Arm A is <span class="u2">not</span> to touch Arm B\'s sandwich in the icebox.'
  : 'Proofs NOT satisfactory — '+ (D.report.failures||[]).length +' failure(s) noted. Hold fabrication pending redesign.')+'</p>';
$('#mbody').innerHTML=h;

/* red marginalia appended into body */
const circ=document.createElement('div');
circ.className='red';circ.style.cssText='margin:-6px 0 8px 40px;transform:rotate(-2deg);font-size:13px';
circ.textContent='← clearance 11.12 mm — DOUBLE CHECK before Friday';
$('#mbody').appendChild(circ);

/* ================= cc list / stamp / carbon ================= */
$('#cclist').innerHTML='cc:&nbsp; Arm A · Arm B · Verification Unit · Render Desk · File<br>'+
  'enc:&nbsp; Attachment A (render proof), B (route slip)';
const st=$('#stamp');
st.textContent=D.report.pass?'✓ VERIFIED':'REJECTED';
if(!D.report.pass)st.classList.add('bad');

/* carbon copy sheet gets a faint summary */
$('#carbonbody').innerHTML=
  '<p>COPY — '+D.spec.name.toUpperCase()+' — '+D.spec.parts.length+' PARTS / '+D.spec.joints.length+' JOINTS</p><br>'+
  D.report.checks.map(k=>'<p>'+(k.status==='pass'?'[✓]':'[✗]')+' '+k.name+'</p>').join('')+
  '<br><p>'+(D.report.pass?'STATUS: APPROVED FOR FABRICATION':'STATUS: HELD')+'</p>';

/* ================= route slip log ================= */
const inits=['ib','qa','fx','mm','zz'];
$('#log').innerHTML=D.log.map((x,i)=>'<div><span>'+x+'</span><span class="init">'+inits[i%inits.length]+'</span></div>').join('');

$('#retype').onclick=()=>{
  const l=$('#log');l.prepend(Object.assign(document.createElement('div'),
    {innerHTML:'<span>re-typed: "'+$('#brief').value.slice(0,40)+'…" — re-filed</span><span class="init">ib</span>'}));
};
</script>
</body>
</html>
