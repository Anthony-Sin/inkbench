<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Journal &amp; Ledger</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#221a12}
  body{font-family:Georgia,"Times New Roman",serif;color:#1a1408}
  #stage{position:absolute;left:50%;top:50%;width:1700px;height:900px;transform:translate(-50%,-50%);
    background:radial-gradient(1100px 700px at 50% 38%,#37291a 0%,#221a12 72%);padding:26px}
  .book{position:relative;width:100%;height:100%;display:flex;filter:drop-shadow(0 24px 55px rgba(0,0,0,.6))}
  .page{flex:1;position:relative;overflow:hidden;
    background:#f3ecd8;
    background-image:
      repeating-linear-gradient(0deg,transparent 0 25px,rgba(62,110,170,.4) 25px 26px),
      linear-gradient(90deg,transparent 70px,rgba(180,40,40,.55) 70px 71.5px,transparent 71.5px,transparent 76px,rgba(180,40,40,.55) 76px 77.5px,transparent 77.5px);
    background-position:0 60px,0 0;
    box-shadow:inset 0 0 60px rgba(120,90,40,.18)}
  .page.l{border-radius:6px 0 0 6px;box-shadow:inset -30px 0 40px -20px rgba(60,40,10,.4),inset 0 0 60px rgba(120,90,40,.18)}
  .page.r{border-radius:0 6px 6px 0;box-shadow:inset 30px 0 40px -20px rgba(60,40,10,.4),inset 0 0 60px rgba(120,90,40,.18)}
  .gutter{width:30px;background:linear-gradient(90deg,#d8cdb0,#b3a482 45%,#8f805f 55%,#d8cdb0)}
  .stitch{position:absolute;left:14px;top:0;bottom:0;width:2px;
    background:repeating-linear-gradient(0deg,#6d5c3a 0 14px,transparent 14px 34px)}
  /* page furniture */
  .phead{position:absolute;top:14px;left:96px;right:24px;display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:2px solid #1a1408;padding-bottom:4px}
  .phead .t{font-size:21px;font-weight:700;font-variant:small-caps;letter-spacing:4px}
  .phead .f{font-size:11.5px;font-style:italic}
  .memo{position:absolute;top:56px;left:96px;right:24px;font-size:13px;font-style:italic;display:flex;gap:12px;align-items:center}
  .memo .ent{border:2px solid #8f1d1d;color:#8f1d1d;font-size:10px;letter-spacing:2px;padding:2px 10px;transform:rotate(-4deg);
    font-style:normal;font-family:Georgia,serif;flex:none}
  .memo button{margin-left:auto;font:inherit;font-size:11px;letter-spacing:1.5px;font-variant:small-caps;background:none;
    border:1.5px solid #1a1408;padding:4px 12px;cursor:pointer;transition:.15s;flex:none}
  .memo button:hover{background:#1a1408;color:#f3ecd8}
  .rows{position:absolute;top:96px;left:96px;right:10px;bottom:34px;font-size:12.5px;overflow:hidden}
  .r2{top:88px}
  .cols-h{display:grid;line-height:26px;font-size:10px;letter-spacing:1.5px;font-variant:small-caps;color:#4a3c1c;
    border-bottom:1.5px solid #1a1408;font-weight:700}
  .erow{display:grid;line-height:26px;border-bottom:1px dotted rgba(90,70,30,.3);align-items:baseline}
  .erow:hover{background:rgba(143,29,29,.06)}
  .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:8px}
  .c{text-align:center}
  .ref{color:#4a3c1c;font-size:11px}
  .cr{font-style:italic;color:#4a3c1c}
  .dr{color:#1a1408}
  .red{color:#8f1d1d;font-weight:700}
  .tot{display:grid;line-height:30px;border-top:2px solid #1a1408;font-weight:700}
  .tot .n{color:#8f1d1d}
  .footline{position:absolute;bottom:8px;left:96px;right:24px;display:flex;justify-content:space-between;font-size:10.5px;
    font-style:italic;color:#6b5a34}
  .stamp{position:absolute;right:60px;bottom:70px;transform:rotate(-6deg);border:3px double #8f1d1d;color:#8f1d1d;
    font-size:26px;font-weight:700;letter-spacing:5px;font-variant:small-caps;padding:6px 22px;opacity:.85}
  .vrow{display:grid;line-height:26px;border-bottom:1px dotted rgba(90,70,30,.3);align-items:baseline}
  .vrow:hover{background:rgba(143,29,29,.06)}
  .vok{font-variant:small-caps;font-weight:700;letter-spacing:1px}
  .vok.p{color:#1a1408}.vok.f{color:#8f1d1d}
  .lrow{display:grid;line-height:26px;border-bottom:1px dotted rgba(90,70,30,.3);font-size:12px;align-items:baseline}
  .lrow .j{font-style:italic;color:#4a3c1c}
  .sec{margin-top:2px;line-height:26px;font-size:10.5px;letter-spacing:2.5px;font-variant:small-caps;font-weight:700;
    border-bottom:1px solid #1a1408;color:#1a1408}
  .memos{font-size:11.5px;font-style:italic;line-height:26px;color:#4a3c1c}
  .memos div{border-bottom:1px dotted rgba(90,70,30,.3)}
  .memos div::before{content:"NB — ";font-style:normal;font-size:9px;letter-spacing:1px;color:#8f1d1d}
  .stock{position:absolute;left:110px;bottom:52px;width:230px;background:#fbf7ea;padding:8px 8px 26px;
    transform:rotate(2.4deg);box-shadow:0 6px 18px rgba(60,40,10,.35);border:1px solid rgba(90,70,30,.35)}
  .stock::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2deg);width:86px;height:20px;
    background:rgba(220,205,160,.75);border-left:1px dashed rgba(90,70,30,.25);border-right:1px dashed rgba(90,70,30,.25)}
  .stock img{display:block;width:100%;height:190px;object-fit:cover;filter:sepia(.35) contrast(1.05)}
  .stock .cap{font-size:10.5px;font-style:italic;text-align:center;color:#4a3c1c;margin-top:5px;line-height:1.3}
</style>
</head>
<body>
<div id="stage"><div class="book">
  <div class="page l">
    <div class="phead"><span class="t">Journal</span><span class="f" id="folioL"></span></div>
    <div class="memo"><span class="ent">ENTERED</span><span id="brief"></span><button id="post">Post brief ▸</button></div>
    <div class="rows">
      <div class="cols-h" style="grid-template-columns:56px 1fr 90px 150px 110px 110px">
        <span>Ref</span><span style="padding-left:6px">Particulars</span><span class="c">Shape</span>
        <span class="n">Dims mm</span><span class="n">Dr. g</span><span class="n">Cr. g</span></div>
      <div id="jrows"></div>
      <div class="stock"><img src="lamp_exploded.png" alt="goods as itemized">
        <div class="cap" id="stockcap"></div></div>
    </div>
    <div class="footline"><span>— brought forward —</span><span id="ftL"></span></div>
  </div>
  <div class="gutter"><div class="stitch"></div></div>
  <div class="page r">
    <div class="phead"><span class="t">Ledger — Verification &amp; Assembly</span><span class="f" id="folioR"></span></div>
    <div class="rows r2">
      <div class="sec">Verification vouchers — measured values posted</div>
      <div class="cols-h" style="grid-template-columns:56px 1fr 130px 120px">
        <span>Vch. №</span><span style="padding-left:6px">Examination</span><span class="n">Amount</span><span class="c">Posted</span></div>
      <div id="vrows"></div>
      <div class="sec" style="margin-top:10px">Assembly labour — arms A / B</div>
      <div class="cols-h" style="grid-template-columns:56px 1fr 110px 130px 90px">
        <span>Step</span><span style="padding-left:6px">Labour account</span><span class="c">Arm</span><span class="n">Mass handled</span><span class="c">Glyph</span></div>
      <div id="lrows"></div>
      <div class="sec" style="margin-top:10px">Memoranda — machine log</div>
      <div class="memos" id="mrows"></div>
    </div>
    <div class="stamp" id="stamp"></div>
    <div class="footline"><span id="ftR"></span><span>— carried forward —</span></div>
  </div>
</div></div>
<script src="data.js"></script>
<script>
const D=window.DATA,S=D.spec,R=D.report;
const $=id=>document.getElementById(id);
const f=(n,d=1)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d});
const tot=D.measures.reduce((a,m)=>a+m.massG,0);
const GC='56px 1fr 90px 150px 110px 110px';

$('folioL').textContent=`Folio ${D.figures[0].figNum} · ${S.name}`;
$('folioR').textContent=`Fig. ${D.figures[0].figNum} · ${S.units} · attempt ${D.attempts}`;
$('brief').textContent=`For: “${D.brief}”`;

/* journal: double entry — Dr assembly WIP / Cr material stock */
let jr='';
D.measures.forEach((m,i)=>{
  jr+=`<div class="erow" style="grid-template-columns:${GC}"><span class="ref">J${i+1}a</span>
    <span class="dr" style="padding-left:6px">${m.id.replace('_',' ')} — assembly WIP <span class="ref">(${m.material})</span></span>
    <span class="c ref">${m.shape}</span><span class="n">${m.dims.map(d=>f(d,1)).join('×')}</span>
    <span class="n">${f(m.massG,2)}</span><span class="n">—</span></div>`;
  jr+=`<div class="erow" style="grid-template-columns:${GC}"><span class="ref">J${i+1}b</span>
    <span class="cr" style="padding-left:26px">to ${m.material} stock — consumed @ ρ ${f(m.density,0)}</span>
    <span class="c ref">vol</span><span class="n">${f(m.volMM3,0)} mm³</span>
    <span class="n">—</span><span class="n">${f(m.massG,2)}</span></div>`;
});
jr+=`<div class="tot" style="grid-template-columns:${GC}"><span></span>
  <span style="padding-left:6px" class="red">Totals — accounts balance</span><span></span><span></span>
  <span class="n">${f(tot,2)}</span><span class="n">${f(tot,2)}</span></div>`;
$('jrows').innerHTML=jr;
$('ftL').textContent=`mass posted: ${f(tot,2)} g · ${S.parts.length} parts · ${S.joints.length} joints`;
$('stockcap').textContent=`Plate — goods as itemized (exploded), Fig. ${D.figures[0].figNum}. Pasted herein by the agent.`;

$('vrows').innerHTML=R.checks.map((c,i)=>
  `<div class="vrow" style="grid-template-columns:56px 1fr 130px 120px" title="${c.detail.replace(/"/g,'')}">
   <span class="ref">V${String(i+1).padStart(2,'0')}</span><span style="padding-left:6px">${c.name}</span>
   <span class="n">${c.measured?f(c.measured,3)+' '+S.units:'—'}</span>
   <span class="c vok ${c.status==='pass'?'p':'f'}">${c.status}</span></div>`).join('')+
  `<div class="tot" style="grid-template-columns:56px 1fr 130px 120px"><span></span>
   <span style="padding-left:6px" class="red">Verification elapsed</span><span class="n red">${f(R.timingMs,2)} ms</span><span></span></div>`;

$('lrows').innerHTML=D.plan.map(s=>s.kind==='place'
  ?`<div class="lrow" style="grid-template-columns:56px 1fr 110px 130px 90px"><span class="ref">${s.step}</span>
    <span style="padding-left:6px">place <b>${s.part.replace('_',' ')}</b>, seat z ${f(s.seat[2],0)}</span>
    <span class="c"><b>ARM ${s.arm}</b></span><span class="n">${f(s.massG,1)} g</span><span class="c">${s.glyph}</span></div>`
  :`<div class="lrow" style="grid-template-columns:56px 1fr 110px 130px 90px"><span class="ref">—</span>
    <span class="j" style="padding-left:26px">↳ effect ${s.type} joint · ${s.a} ~ ${s.b} @ z ${f(s.anchor[2],0)}</span>
    <span class="c j">contra</span><span class="n j">—</span><span class="c j">⌖</span></div>`).join('');

$('mrows').innerHTML=D.log.map(l=>`<div>${l}</div>`).join('');
$('stamp').textContent=R.pass?'BALANCED':'OUT OF BALANCE';
$('ftR').textContent=`status: ${R.pass?'books closed — verified ✓':'suspense account open'} · failures ${R.failures.length}`;

$('post').onclick=()=>{$('mrows').innerHTML+=`<div>brief re-posted ▸ ${D.brief}</div>`};

const stage=document.getElementById('stage');
function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1700,innerHeight/900)})`}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
