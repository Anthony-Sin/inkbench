<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1700px; height: 900px; overflow: hidden; }
  body {
    background: #1e1e1e; color: #c8c8c8;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 12px; display: flex; flex-direction: column;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }

  /* ---------- title & menu ---------- */
  #titlebar {
    height: 30px; background: #2b2b2b; display: flex; align-items: center;
    padding: 0 12px; gap: 10px; border-bottom: 1px solid #141414; flex: none;
  }
  #titlebar .logo {
    width: 16px; height: 16px; border: 2px solid #5eead4; border-radius: 3px;
    display: inline-block; position: relative;
  }
  #titlebar .logo::after { content:""; position:absolute; inset:3px; background:#5eead4; }
  #titlebar .t { color: #9a9a9a; font-size: 11.5px; }
  #titlebar .t b { color: #e8e8e8; font-weight: 600; }
  #titlebar .dirty { color: #5eead4; }
  #titlebar .right { margin-left: auto; display: flex; gap: 14px; font-size: 11px; color:#8a8a8a; }
  #titlebar .right .ok { color: #6ee7b7; }

  #toolbar {
    height: 38px; background: #252526; border-bottom: 1px solid #141414;
    display: flex; align-items: center; padding: 0 10px; gap: 4px; flex: none;
  }
  .tbtn {
    padding: 5px 12px; color: #bdbdbd; border: 1px solid transparent;
    border-radius: 4px; cursor: pointer; font-size: 11.5px; background: none; font-family: inherit;
  }
  .tbtn:hover { background: #383838; }
  .tbtn.on { background: #3a3d41; border-color: #4b4f54; color: #fff; }
  #toolbar .sp { flex: 1; }
  #toolbar .play {
    display: flex; gap: 6px; align-items: center; margin: 0 10px;
  }
  #toolbar .play span {
    width: 26px; height: 26px; border-radius: 4px; display: flex; align-items: center;
    justify-content: center; background: #313134; color: #ccc; cursor: pointer; font-size: 11px;
  }
  #toolbar .play span.go { background: #2f6f4f; color: #a7f3d0; }
  #toolbar .play span:hover { filter: brightness(1.25); }

  /* ---------- main grid ---------- */
  #main { flex: 1; display: grid; grid-template-columns: 262px 1fr 332px; min-height: 0; }
  .dock { background: #252526; display: flex; flex-direction: column; min-height: 0; }
  .dock + .dock { border-left: 1px solid #141414; }
  .tabhead {
    height: 28px; flex: none; display: flex; align-items: center; gap: 6px;
    background: #2d2d30; border-bottom: 1px solid #1b1b1b; padding: 0 10px;
    font-size: 11px; color: #d4d4d4;
  }
  .tabhead .sub { color: #7a7a7a; font-size: 10px; margin-left: auto; }
  .dockbody { flex: 1; overflow: hidden auto; padding: 6px; }
  .dockbody::-webkit-scrollbar { width: 9px; }
  .dockbody::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 5px; }

  /* hierarchy tree */
  .tree { font-size: 12px; }
  .tnode {
    display: flex; align-items: center; gap: 6px; padding: 3.5px 6px;
    border-radius: 3px; cursor: pointer; white-space: nowrap;
  }
  .tnode:hover { background: #333337; }
  .tnode.sel { background: #094771; color: #fff; }
  .tnode .ico { width: 14px; text-align: center; color: #8ab4f8; font-size: 11px; }
  .tnode.j { color: #9a9a9a; }
  .tnode.j .ico { color: #c586c0; }
  .tnode .tag { margin-left: auto; font-size: 9.5px; color: #7a7a7a; }
  .tnode.sel .tag { color: #bfe8ff; }
  .tindent { padding-left: 20px; }
  .tsep { margin: 8px 4px 4px; font-size: 9.5px; letter-spacing: .14em; color: #6a6a6a; text-transform: uppercase; }

  /* scene view */
  #scene { position: relative; background: #1b1b1c; overflow: hidden; }
  #scene .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  #scene .axisX, #scene .axisY { position: absolute; pointer-events: none; }
  #scene img {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    height: 94%; filter: drop-shadow(0 8px 30px rgba(0,0,0,.6));
  }
  #scene .ovltl {
    position: absolute; top: 8px; left: 10px; display: flex; gap: 4px;
  }
  #scene .ovltl span {
    background: rgba(45,45,48,.85); border: 1px solid #3c3c40; border-radius: 3px;
    color: #bdbdbd; font-size: 10.5px; padding: 3px 9px; cursor: pointer;
  }
  #scene .ovltl span:hover { color: #fff; border-color: #5eead4; }
  #scene .stats {
    position: absolute; top: 8px; right: 10px; background: rgba(30,30,32,.88);
    border: 1px solid #3c3c40; border-radius: 3px; padding: 8px 12px;
    font-size: 10.5px; line-height: 1.7; color: #9a9a9a; min-width: 150px;
  }
  #scene .stats b { color: #d4d4d4; font-weight: 600; }
  #scene .gizmo {
    position: absolute; right: 14px; bottom: 12px; width: 66px; height: 66px;
    border-radius: 50%; border: 1px solid #3c3c40; background: rgba(30,30,32,.85);
  }
  #scene .selbox {
    position: absolute; border: 1px dashed #5eead4; pointer-events: none;
    left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 560px; height: 96%; opacity: .55;
  }
  #scene .selbox span {
    position: absolute; top: -18px; left: 0; font-size: 10px; color: #5eead4;
    letter-spacing: .1em;
  }
  /* brief bar inside scene bottom */
  #briefBar {
    position: absolute; left: 12px; bottom: 12px; right: 96px;
    display: flex; gap: 8px; align-items: center;
    background: rgba(37,37,38,.92); border: 1px solid #3c3c40; border-radius: 4px;
    padding: 8px 10px;
  }
  #briefBar .lbl { font-size: 10px; letter-spacing: .16em; color: #5eead4; }
  #briefBar input {
    flex: 1; background: #1b1b1c; border: 1px solid #3c3c40; border-radius: 3px;
    color: #e8e8e8; font-size: 12px; padding: 6px 9px; outline: none; font-family: inherit;
  }
  #briefBar input:focus { border-color: #5eead4; }
  #briefBar button {
    background: #0e639c; border: none; color: #fff; border-radius: 3px;
    font-size: 11.5px; padding: 7px 16px; cursor: pointer; font-family: inherit;
  }
  #briefBar button:hover { background: #1177bb; }

  /* inspector */
  .comp {
    border: 1px solid #1b1b1b; border-radius: 3px; margin-bottom: 8px;
    background: #2d2d30;
  }
  .comp > h4 {
    font-size: 11px; font-weight: 600; color: #e0e0e0; padding: 6px 9px;
    background: #333336; display: flex; align-items: center; gap: 7px; cursor: pointer;
  }
  .comp > h4 .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; }
  .comp .body { padding: 7px 9px 9px; }
  .row3 { display: grid; grid-template-columns: 64px 1fr 1fr 1fr; gap: 4px; align-items: center; margin-bottom: 4px; }
  .row3 label { font-size: 10.5px; color: #9a9a9a; }
  .row3 .v {
    background: #1b1b1c; border: 1px solid #3c3c40; border-radius: 2px;
    font-size: 10.5px; padding: 3px 6px; color: #d4d4d4; font-family: ui-monospace, Menlo, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kv { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #26262a; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: #9a9a9a; } .kv .v { color: #e0e0e0; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; }
  .matsw { display: inline-block; width: 11px; height: 11px; border: 1px solid #555; vertical-align: -1px; margin-right: 5px; }
  .chkrow { display: flex; gap: 8px; align-items: center; padding: 3.5px 0; font-size: 11px; cursor: default; }
  .chkrow:hover { background: #333; }
  .chkrow .st { width: 15px; height: 15px; border-radius: 3px; background: #2f6f4f; color: #a7f3d0; font-size: 10px; display: flex; align-items: center; justify-content: center; flex: none; }
  .chkrow .dt { color: #8a8a8a; font-size: 10px; margin-left: auto; max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* bottom strip: project / console */
  #bottom {
    height: 208px; flex: none; border-top: 1px solid #141414;
    background: #252526; display: flex; flex-direction: column;
  }
  #btabs { height: 28px; flex: none; display: flex; background: #2d2d30; border-bottom: 1px solid #1b1b1b; }
  #btabs .bt {
    padding: 0 18px; display: flex; align-items: center; font-size: 11px; color: #9a9a9a;
    border-right: 1px solid #1b1b1b; cursor: pointer;
  }
  #btabs .bt.on { background: #252526; color: #fff; box-shadow: inset 0 2px 0 #5eead4; }
  #btabs .bt:hover { color: #ddd; }
  #bbody { flex: 1; overflow: hidden; position: relative; }
  .bpane { position: absolute; inset: 0; display: none; padding: 8px 10px; overflow: auto; }
  .bpane.on { display: block; }
  .bpane::-webkit-scrollbar { width: 9px; height: 9px; }
  .bpane::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 5px; }

  /* console pane */
  #paneConsole { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; line-height: 1.9; }
  #paneConsole div { white-space: nowrap; }
  #paneConsole .pfx { color: #5eead4; margin-right: 8px; }

  /* project pane cards */
  .assets { display: flex; gap: 12px; }
  .asset {
    width: 170px; border: 1px solid #3c3c40; border-radius: 4px; background: #2d2d30;
    padding: 8px; cursor: pointer;
  }
  .asset:hover { border-color: #5eead4; }
  .asset .th {
    height: 96px; border-radius: 3px; margin-bottom: 7px; background: #1b1b1c;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .asset .th img { height: 100%; }
  .asset .nm { font-size: 11px; color: #e0e0e0; }
  .asset .mt { font-size: 9.5px; color: #7a7a7a; margin-top: 2px; }

  /* build plan pane: gantt-ish rows */
  .planT { width: 100%; border-collapse: collapse; font-size: 11px; }
  .planT th { text-align: left; font-weight: 400; color: #7a7a7a; font-size: 10px; padding: 2px 8px 6px; border-bottom: 1px solid #3c3c40; }
  .planT td { padding: 4px 8px; border-bottom: 1px solid #2a2a2e; color: #d4d4d4; }
  .planT tr:hover td { background: #2f2f33; }
  .armchip { font-size: 9.5px; padding: 1px 8px; border-radius: 8px; border: 1px solid; }
  .aA { color: #7dd3fc; border-color: #7dd3fc; } .aB { color: #f9a8d4; border-color: #f9a8d4; }
</style>
</head>
<body>
  <div id="titlebar">
    <span class="logo"></span>
    <span class="t"><b>INKBENCH</b> — desklamp.ink — SampleScene<span class="dirty">*</span></span>
    <div class="right">
      <span id="titleFig"></span><span class="ok" id="titlePass"></span><span>⬜ Layout: Workbench</span>
    </div>
  </div>

  <div id="toolbar">
    <button class="tbtn">File</button><button class="tbtn">Edit</button>
    <button class="tbtn">Assets</button><button class="tbtn">GameObject</button>
    <button class="tbtn on">Inkbench</button><button class="tbtn">Window</button>
    <div class="play"><span>▶</span><span class="go" title="run verification">✓</span><span>⏸</span></div>
    <div class="sp"></div>
    <button class="tbtn">Layers ▾</button><button class="tbtn">Default ▾</button>
  </div>

  <div id="main">
    <div class="dock">
      <div class="tabhead">Hierarchy <span class="sub">SampleScene</span></div>
      <div class="dockbody"><div class="tree" id="tree"></div></div>
    </div>

    <div class="dock" style="background:#1b1b1c">
      <div class="tabhead">Scene <span class="sub">shaded · toon</span></div>
      <div id="scene">
        <div class="grid"></div>
        <img src="lamp_flat.png" alt="scene render">
        <div class="selbox" id="selbox"><span id="selboxLabel"></span></div>
        <div class="ovltl"><span>↖ Move</span><span>⟲ Rotate</span><span>⤢ Scale</span><span>▦ Ortho</span></div>
        <div class="stats" id="sceneStats"></div>
        <div class="gizmo" id="gizmo"></div>
        <div id="briefBar">
          <span class="lbl">BRIEF</span>
          <input id="briefIn" spellcheck="false">
          <button id="briefBtn">Generate</button>
        </div>
      </div>
    </div>

    <div class="dock">
      <div class="tabhead">Inspector <span class="sub" id="inspSub"></span></div>
      <div class="dockbody" id="inspector"></div>
    </div>
  </div>

  <div id="bottom">
    <div id="btabs">
      <div class="bt on" data-p="paneConsole">Console</div>
      <div class="bt" data-p="paneBuild">Build Plan</div>
      <div class="bt" data-p="paneProject">Project</div>
    </div>
    <div id="bbody">
      <div class="bpane on" id="paneConsole"></div>
      <div class="bpane" id="paneBuild"></div>
      <div class="bpane" id="paneProject"></div>
    </div>
  </div>

<script src="data.js"></script>
<script>
(function(){
  const D = window.DATA, $ = s => document.querySelector(s);
  const fmtSize = s => Array.isArray(s) ? s.join(' × ') : ('r ' + s.r + ' · h ' + s.h);
  const massOf = id => { const m = D.measures.find(m=>m.id===id); return m ? m.massG : 0; };
  const shapeIco = s => ({cylinder:'⬤', box:'▮', cone:'▲'}[s] || '◆');

  $('#titleFig').textContent = 'fig ' + D.figures[0].figNum + ' · ' + D.attempts + ' attempt';
  $('#titlePass').textContent = D.report.pass ? '● verify PASS' : '● verify FAIL';

  /* ---------- hierarchy tree ---------- */
  const jointFor = id => D.spec.joints.filter(j => j.a === id);
  let tree = '<div class="tnode"><span class="ico">▣</span>SampleScene</div>';
  tree += '<div class="tnode tindent sel" data-part=""><span class="ico">🗲</span>' + D.spec.name + ' <span class="tag">root</span></div>';
  D.spec.parts.forEach(p => {
    tree += '<div class="tnode" style="padding-left:36px" data-part="' + p.id + '"><span class="ico">' + shapeIco(p.shape) + '</span>' + p.id + '<span class="tag">' + p.material + '</span></div>';
    jointFor(p.id).forEach(j => {
      tree += '<div class="tnode j" style="padding-left:52px"><span class="ico">⚿</span>' + j.type + ' → ' + j.b + '<span class="tag">axis ' + j.axis.join(',') + '</span></div>';
    });
  });
  tree += '<div class="tsep">Environment</div>';
  tree += '<div class="tnode"><span class="ico">✦</span>Directional Light</div>';
  tree += '<div class="tnode"><span class="ico">▣</span>Verify Runner <span class="tag">' + D.report.checks.length + ' checks</span></div>';
  $('#tree').innerHTML = tree;

  /* ---------- inspector ---------- */
  function renderInspector(pid){
    const p = D.spec.parts.find(x => x.id === pid);
    if (!p) {
      $('#inspSub').textContent = D.spec.name;
      $('#inspector').innerHTML =
        comp(D.spec.name + ' (Assembly)', '<div class="kv"><span class="k">Units</span><span class="v">' + D.spec.units + '</span></div>' +
          '<div class="kv"><span class="k">Parts</span><span class="v">' + D.spec.parts.length + '</span></div>' +
          '<div class="kv"><span class="k">Joints</span><span class="v">' + D.spec.joints.length + '</span></div>' +
          '<div class="kv"><span class="k">Total mass</span><span class="v">' + (D.measures.reduce((a,m)=>a+m.massG,0)/1000).toFixed(3) + ' kg</span></div>') +
        comp('Tests', '<div class="kv"><span class="k">min_clearance_mm</span><span class="v">' + D.spec.tests.min_clearance_mm + '</span></div>' +
          '<div class="kv"><span class="k">max_tip_angle_deg</span><span class="v">' + D.spec.tests.max_tip_angle_deg + '</span></div>') +
        verifyComp();
      return;
    }
    const m = D.measures.find(x => x.id === pid);
    const mat = D.spec.materials[p.material];
    $('#inspSub').textContent = p.id;
    $('#inspector').innerHTML =
      comp('Transform',
        '<div class="row3"><label>Position</label>' + p.position.map(v=>'<span class="v">'+v+'</span>').join('') + '</div>' +
        '<div class="row3"><label>Rotation</label>' + p.rotation.map(v=>'<span class="v">'+v+'°</span>').join('') + '</div>') +
      comp('Mesh · ' + p.shape,
        '<div class="kv"><span class="k">Size</span><span class="v">' + fmtSize(p.size) + ' ' + D.spec.units + '</span></div>' +
        '<div class="kv"><span class="k">Volume</span><span class="v">' + (m ? m.volMM3.toFixed(0) : '—') + ' mm³</span></div>' +
        '<div class="kv"><span class="k">Dims (bbox)</span><span class="v">' + (m ? m.dims.map(d=>d.toFixed(0)).join('×') : '—') + '</span></div>') +
      comp('Material',
        '<div class="kv"><span class="k">Name</span><span class="v"><span class="matsw" style="background:' + mat.color + '"></span>' + p.material + '</span></div>' +
        '<div class="kv"><span class="k">Density</span><span class="v">' + mat.density + ' kg/m³</span></div>' +
        '<div class="kv"><span class="k">Mass</span><span class="v">' + (m ? m.massG.toFixed(1) : '—') + ' g</span></div>') +
      verifyComp();
  }
  function comp(title, body){ return '<div class="comp"><h4>' + title + '</h4><div class="body">' + body + '</div></div>'; }
  function verifyComp(){
    return '<div class="comp"><h4><span class="dot"></span>Verification — ' + (D.report.pass?'PASS':'FAIL') + ' · ' + D.report.timingMs + 'ms</h4><div class="body">' +
      D.report.checks.map(c => '<div class="chkrow" title="' + c.detail.replace(/"/g,'&quot;') + '"><span class="st">' + (c.status==='pass'?'✓':'✗') + '</span>' + c.name + '<span class="dt">' + c.detail + '</span></div>').join('') +
      '</div></div>';
  }
  renderInspector('');

  /* tree selection */
  $('#tree').addEventListener('click', e => {
    const n = e.target.closest('[data-part]'); if (!n) return;
    document.querySelectorAll('.tnode.sel').forEach(x => x.classList.remove('sel'));
    n.classList.add('sel');
    renderInspector(n.dataset.part);
    $('#selboxLabel').textContent = n.dataset.part ? '▸ ' + n.dataset.part : '';
  });

  /* scene stats + gizmo */
  $('#sceneStats').innerHTML =
    '<b>Statistics</b><br>parts: <b>' + D.spec.parts.length + '</b> · joints: <b>' + D.spec.joints.length + '</b>' +
    '<br>mass: <b>' + (D.measures.reduce((a,m)=>a+m.massG,0)/1000).toFixed(2) + ' kg</b>' +
    '<br>render: <b>' + D.report.timingMs + 'ms</b><br>checks: <b>' + D.report.checks.filter(c=>c.status==='pass').length + '/' + D.report.checks.length + '</b>';
  $('#gizmo').innerHTML = '<svg width="66" height="66"><g transform="translate(33,33)">' +
    '<line x1="0" y1="0" x2="22" y2="0" stroke="#f87171" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="-22" stroke="#34d399" stroke-width="2"/>' +
    '<line x1="0" y1="0" x2="-14" y2="12" stroke="#60a5fa" stroke-width="2"/>' +
    '<text x="24" y="3" fill="#f87171" font-size="9">x</text><text x="3" y="-24" fill="#34d399" font-size="9">y</text><text x="-24" y="18" fill="#60a5fa" font-size="9">z</text></g></svg>';

  /* bottom panes */
  document.querySelectorAll('#btabs .bt').forEach(t => t.onclick = () => {
    document.querySelectorAll('#btabs .bt').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.bpane').forEach(x => x.classList.remove('on'));
    t.classList.add('on'); document.getElementById(t.dataset.p).classList.add('on');
  });
  $('#paneConsole').innerHTML = D.log.map((l,i) =>
    '<div><span class="pfx">[' + String(i).padStart(2,'0') + ']</span>' + l + '</div>').join('');

  $('#paneBuild').innerHTML = '<table class="planT"><thead><tr><th>#</th><th>Op</th><th>Part</th><th>Arm</th><th>Insert</th><th>Seat</th><th style="text-align:right">Mass g</th></tr></thead><tbody>' +
    D.plan.map((s,i) => {
      if (s.kind === 'place') return '<tr><td>' + s.step + '</td><td>' + s.glyph + ' place</td><td>' + s.part + '</td>' +
        '<td><span class="armchip ' + (s.arm==='A'?'aA':s.arm==='B'?'aB':'') + '">' + s.arm + '</span></td>' +
        '<td class="mono">(' + s.insert_from.join(',') + ')</td><td class="mono">(' + s.seat.join(',') + ')</td><td style="text-align:right">' + s.massG.toFixed(0) + '</td></tr>';
      return '<tr><td>—</td><td>⚿ ' + s.type + '</td><td>' + s.a + ' → ' + s.b + '</td><td><span class="armchip" style="color:#c586c0;border-color:#c586c0">JIG</span></td>' +
        '<td class="mono">axis(' + s.axis.join(',') + ')</td><td class="mono">(' + s.anchor.join(',') + ')</td><td></td></tr>';
    }).join('') + '</tbody></table>';

  $('#paneProject').innerHTML = '<div class="assets">' +
    '<div class="asset"><div class="th"><img src="lamp_flat.png"></div><div class="nm">lamp_flat.render</div><div class="mt">fig ' + D.figures[0].figNum + ' · assembled</div></div>' +
    '<div class="asset"><div class="th"><img src="lamp_exploded.png"></div><div class="nm">lamp_exploded.render</div><div class="mt">75% explode · ' + D.report.explodedOrder.join(' → ') + '</div></div>' +
    '<div class="asset"><div class="th mono" style="font-size:10px;color:#7a7a7a;padding:8px">' + D.spec.parts.length + ' parts<br>' + D.spec.joints.length + ' joints<br>' + D.spec.units + '</div><div class="nm">desklamp.spec</div><div class="mt">' + (D.report.pass?'verified ✓':'failed') + ' · attempt ' + D.attempts + '</div></div>' +
    '</div>';

  /* brief */
  $('#briefIn').value = D.brief;
  $('#briefBtn').onclick = () => {
    $('#paneConsole').innerHTML += '<div><span class="pfx">[' + D.log.length + ']</span>brief ▸ ' + $('#briefIn').value + '</div>';
    document.querySelector('[data-p="paneConsole"]').click();
    $('#paneConsole').scrollTop = 1e6;
  };
})();
</script>
</body>
</html>
