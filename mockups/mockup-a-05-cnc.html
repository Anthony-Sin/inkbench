<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — CNC Controller</title>
<style>
  :root{
    --body:#3a4148; --body2:#2e343a; --panel:#22272c; --edge:#171b1f;
    --lcd:#0e1a12; --lcd2:#12231a; --grn:#5cff9d; --amber:#ffbf47; --red:#ff5040;
    --key:#d7d3c8; --key2:#bdb9ae; --mono:"SF Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
    --seg:"SF Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#23272b;color:#d7dde3;
    font-family:var(--mono);font-size:12px}
  .ctl{height:100vh;padding:10px;display:grid;grid-template-rows:46px 1fr 204px;gap:8px;
    background:linear-gradient(#4a5158,#31373d);}

  header{display:flex;align-items:center;gap:14px;background:linear-gradient(#565e66,#3d434a);
    border:1px solid var(--edge);border-radius:6px;padding:0 14px;box-shadow:inset 0 1px 0 #ffffff22}
  .brand{font-size:14px;font-weight:700;letter-spacing:.25em;color:#eef2f5}
  .brand small{display:block;font-size:8px;color:#9aa3ab;letter-spacing:.18em;font-weight:400}
  .mode{margin-left:auto;display:flex;gap:6px}
  .mode span{font-size:9px;letter-spacing:.15em;padding:4px 10px;border-radius:3px;background:#22272c;color:#7d858d;border:1px solid #171b1f}
  .mode span.on{background:#0e1a12;color:var(--grn);border-color:#2a4a38;box-shadow:inset 0 0 8px #5cff9d22}
  .estop{margin-left:12px;width:44px;height:34px;border-radius:6px;background:radial-gradient(circle at 40% 30%,#e8564a,#8f1f18 75%);
    border:2px solid #ffb400;display:flex;align-items:center;justify-content:center;color:#fff;font-size:7px;
    font-weight:700;letter-spacing:.05em;box-shadow:0 3px 6px #0007;cursor:pointer}
  .estop:active{transform:translateY(1px)}

  main{display:grid;grid-template-columns:430px 330px 1fr;gap:8px;min-height:0}
  .mod{background:var(--body2);border:1px solid var(--edge);border-radius:6px;padding:8px;
    display:flex;flex-direction:column;min-height:0;box-shadow:inset 0 1px 0 #ffffff12}
  .mh{font-size:9px;letter-spacing:.28em;color:#9aa3ab;margin-bottom:6px;display:flex;justify-content:space-between}

  /* LCD */
  .lcd{flex:1;background:linear-gradient(#16281e,#0e1a12);border:3px solid #10150f;border-radius:4px;
    position:relative;overflow:hidden;min-height:0;box-shadow:inset 0 0 30px #000}
  .lcd img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    filter:invert(.93) brightness(1.1) sepia(1) saturate(4) hue-rotate(95deg)}
  .lcd .hud{position:absolute;top:6px;left:8px;color:var(--grn);font-size:9.5px;letter-spacing:.08em;
    text-shadow:0 0 6px #5cff9d88;line-height:1.7}
  .softkeys{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
  .softkeys div{background:#22272c;border:1px solid #171b1f;border-top:2px solid #4a5158;color:var(--grn);
    font-size:8.5px;text-align:center;padding:5px 0;letter-spacing:.1em;cursor:pointer}
  .softkeys div:hover{background:#2c3238}
  .softkeys div:active{background:#0e1a12}

  /* position readouts */
  .posrow{display:grid;grid-template-columns:34px 1fr auto;align-items:baseline;gap:8px;
    background:var(--lcd);border:1px solid #0a140e;border-radius:4px;padding:7px 10px;margin-bottom:6px}
  .posrow .ax{color:#7d9a87;font-size:15px;font-weight:700}
  .posrow .val{font-family:var(--seg);font-size:21px;color:var(--grn);letter-spacing:.12em;text-align:right;
    text-shadow:0 0 8px #5cff9d77}
  .posrow .un{color:#4a5c50;font-size:9px}
  .poshead{font-size:8.5px;color:#7d9a87;letter-spacing:.2em;margin:2px 0 6px}
  .alarms{flex:1;overflow:auto;min-height:0}
  .al{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid #ffffff08;font-size:10px}
  .al .dl{width:9px;height:9px;border-radius:1px;background:#2fae62;box-shadow:0 0 6px #2fae6288}
  .al .n{flex:1;color:#c4ccd2}
  .al .s{color:#2fae62;font-size:9px;letter-spacing:.15em}

  /* program */
  .prog{flex:1;background:var(--lcd);border:1px solid #0a140e;border-radius:4px;overflow:auto;
    padding:8px 10px;font-size:11px;line-height:1.85;min-height:0;color:var(--grn)}
  .prog::-webkit-scrollbar{width:5px}.prog::-webkit-scrollbar-thumb{background:#2a4a38}
  .prog .cm{color:#3d6b52}
  .prog .n{color:#7d9a87}
  .prog .hl{background:#5cff9d14;outline:1px solid #5cff9d33}
  .prog .w{color:#ffbf47}

  /* bottom keypad */
  .bottom{display:grid;grid-template-columns:1fr 380px;gap:8px}
  .keypad{background:var(--body2);border:1px solid var(--edge);border-radius:6px;padding:10px;
    display:grid;grid-template-rows:auto 1fr;gap:8px;min-height:0}
  .mdi{display:flex;gap:8px;align-items:center}
  .mdi .lab{font-size:9px;letter-spacing:.2em;color:#9aa3ab}
  .mdi input{flex:1;background:var(--lcd);border:1px solid #0a140e;border-radius:3px;color:var(--grn);
    font-family:var(--mono);font-size:12px;padding:8px 12px;letter-spacing:.05em;text-shadow:0 0 6px #5cff9d66}
  .mdi input:focus{outline:none;box-shadow:0 0 0 2px #5cff9d33}
  .keys{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;min-height:0}
  .key{background:linear-gradient(#e6e2d7,#c4c0b5);border:1px solid #8f8b80;border-radius:4px;
    color:#2b2e33;font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;
    box-shadow:0 3px 0 #8f8b80,inset 0 1px 0 #fff;display:flex;align-items:center;justify-content:center}
  .key:hover{filter:brightness(1.05)}
  .key:active{transform:translateY(2px);box-shadow:0 1px 0 #8f8b80,inset 0 1px 0 #fff}
  .key.fn{background:linear-gradient(#4a5158,#31373d);color:#d7dde3;box-shadow:0 3px 0 #171b1f,inset 0 1px 0 #ffffff22}
  .cyc{background:var(--body2);border:1px solid var(--edge);border-radius:6px;padding:12px;
    display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;gap:10px}
  .bigbtn{border-radius:8px;font-family:var(--mono);font-weight:700;letter-spacing:.15em;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;
    box-shadow:0 4px 0 #00000088,inset 0 2px 0 #ffffff33;border:1px solid #00000066}
  .bigbtn small{font-size:8px;font-weight:400;letter-spacing:.2em;opacity:.8;margin-top:3px}
  .bigbtn.start{background:linear-gradient(#3fae62,#247a42);color:#fff}
  .bigbtn.start:hover{filter:brightness(1.1)}
  .bigbtn.start:active{transform:translateY(3px);box-shadow:0 1px 0 #00000088,inset 0 2px 0 #ffffff33}
  .bigbtn.hold{background:linear-gradient(#e8c547,#b39428);color:#2b2410}
  .bigbtn.hold:hover{filter:brightness(1.05)}
  .bigbtn.hold:active{transform:translateY(3px);box-shadow:0 1px 0 #00000088}
  .statusline{grid-column:1/3;background:var(--lcd);border:1px solid #0a140e;border-radius:4px;
    color:var(--grn);font-size:10.5px;padding:7px 12px;letter-spacing:.1em;display:flex;justify-content:space-between;
    text-shadow:0 0 6px #5cff9d66}
</style>
</head>
<body>
<div class="ctl">
  <header>
    <div class="brand">INKBENCH MC-1<small>AGENTIC CAD · MACHINING-CENTER UI</small></div>
    <div class="mode" id="modes"></div>
    <div class="estop">E-STOP</div>
  </header>
  <main>
    <div class="mod">
      <div class="mh">GRAPHIC DISPLAY — WORKPIECE <span>PATH: VERIFIED</span></div>
      <div class="lcd"><img src="lamp_flat.png" alt="render"><div class="hud" id="hud"></div></div>
      <div class="softkeys"><div>POS</div><div>PROG</div><div>GRAPH</div><div>CHECK</div><div>SETUP</div></div>
    </div>
    <div class="mod">
      <div class="mh">COORDINATES / ALARMS <span>ABS · mm</span></div>
      <div class="poshead">CENTER OF MASS (WORK)</div>
      <div id="posrows"></div>
      <div class="poshead" style="margin-top:8px">CHECK STATUS — <span id="alcount"></span></div>
      <div class="alarms" id="alarms"></div>
    </div>
    <div class="mod">
      <div class="mh">PROGRAM O9001 — TWO-ARM BUILD <span id="progmeta"></span></div>
      <div class="prog" id="prog"></div>
    </div>
  </main>
  <div class="bottom">
    <div class="keypad">
      <div class="mdi"><span class="lab">MDI ▸</span><input id="mdi" spellcheck="false"><span class="lab" style="color:var(--grn)">BRIEF</span></div>
      <div class="keys" id="keys"></div>
    </div>
    <div class="cyc">
      <button class="bigbtn start" id="cyc">CYCLE START<small>RUN BUILD</small></button>
      <button class="bigbtn hold" id="hold">FEED HOLD<small>PAUSE</small></button>
      <div class="statusline"><span id="stl"></span><span id="str"></span></div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script>
const D=window.DATA;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const f1=v=>(+v).toFixed(1),f2=v=>(+v).toFixed(2),f3=v=>(+v).toFixed(3);
const totalMass=D.measures.reduce((s,m)=>s+m.massG,0);
const stab=D.report.checks.find(c=>c.name==='stability');
const clr=D.report.checks.find(c=>c.name==='clearance');
const com=(stab.detail.match(/CoM=\(([^)]*)\)/)||['','0,0,0'])[1].split(',').map(parseFloat);

document.getElementById('modes').innerHTML=['AUTO','MDI','EDIT','VERIFY·DONE','JOG']
  .map(m=>`<span class="${m==='VERIFY·DONE'?'on':''}">${m}</span>`).join('');

document.getElementById('hud').innerHTML=
  `O9001 &nbsp;${esc(D.spec.name.toUpperCase())}<br>`+
  `PARTS ${D.spec.parts.length} &nbsp;JOINTS ${D.spec.joints.length} &nbsp;MASS ${f3(totalMass/1000)}KG<br>`+
  `TIP-MARGIN ${f2(stab.measured)}MM &nbsp;CLR ${f2(clr.measured)}MM`;

document.getElementById('posrows').innerHTML=['X','Y','Z'].map((a,i)=>
  `<div class="posrow"><span class="ax">${a}</span><span class="val">${com[i].toFixed(3).padStart(9,' ')}</span><span class="un">mm</span></div>`).join('')
  +`<div class="poshead" style="margin-top:6px">PART SEAT POSITIONS</div>`
  +D.spec.parts.slice(0,3).map(p=>`<div class="posrow" style="padding:4px 10px">
     <span class="ax" style="font-size:11px">${esc(p.id.slice(0,2).toUpperCase())}</span>
     <span class="val" style="font-size:13px">${p.position.map(v=>f1(v).padStart(6)).join(' ')}</span><span class="un">${esc(p.id)}</span></div>`).join('');

document.getElementById('alcount').textContent=D.report.checks.filter(c=>c.status==='pass').length+'/'+D.report.checks.length+' CLEAR';
document.getElementById('alarms').innerHTML=D.report.checks.map(c=>`
  <div class="al"><span class="dl" style="${c.status!=='pass'?'background:var(--red);box-shadow:0 0 6px #ff504088':''}"></span>
  <span class="n">${esc(c.name.toUpperCase())} <span style="color:#68737b">${c.measured?'= '+f2(c.measured):''}</span></span>
  <span class="s">${c.status==='pass'?'CLEAR':'ALARM'}</span></div>`).join('')
  +`<div class="al" style="color:#68737b">CLR LIMIT ${D.spec.tests.min_clearance_mm}mm · TIP LIMIT ${D.spec.tests.max_tip_angle_deg}°</div>`;

/* G-code style program */
let n=10,prog=`%<br><span class="cm">(INKBENCH O9001 — ${esc(D.spec.name.toUpperCase())})</span><br>`+
 `<span class="cm">(MASS ${f3(totalMass/1000)}KG · VERIFY ${f1(D.report.timingMs)}MS · ATTEMPT ${D.attempts})</span><br>`;
D.plan.forEach(p=>{
  if(p.kind==='place'){
    prog+=`<div class="hl"><span class="n">N${String(n).padStart(3,'0')}</span> `+
      `<span class="w">M${p.arm==='A'?'21':'22'}</span> PLACE ${esc(p.part.toUpperCase())} `+
      `X${f1(p.seat[0])} Y${f1(p.seat[1])} Z${f1(p.seat[2])} `+
      `<span class="cm">(${f1(p.massG)}g ${p.glyph}${p.insert_from.join(',')})</span></div>`;
  }else{
    prog+=`<div><span class="n">N${String(n).padStart(3,'0')}</span> `+
      `DRESS ${esc(p.type.toUpperCase())} ${esc(p.a.toUpperCase())}~${esc(p.b.toUpperCase())} `+
      `<span class="cm">(ax ${p.axis.join(',')} @ ${p.anchor.map(v=>f1(v)).join(',')}${p.late?' LATE':''})</span></div>`;
  }
  n+=10;
});
prog+=`<span class="n">N${n}</span> M30 <span class="cm">(END — ${D.report.pass?'PART ACCEPTED':'REWORK'})</span><br>%`;
document.getElementById('prog').innerHTML=prog;
document.getElementById('progmeta').textContent=D.plan.length+' BLOCKS';
document.getElementById('prog').scrollTop=0;

/* keypad */
const keymap=['7','8','9','G','M','F','4','5','6','POS','PROG','OFS','1','2','3','SET','CAN','ALM','0','.','-','INS','ALT','EOB'];
document.getElementById('keys').innerHTML=keymap.map(k=>
  `<button class="key ${isNaN(k[0])&&k.length>1?'fn':''}">${k}</button>`).join('');

/* mdi + status */
const mdi=document.getElementById('mdi');mdi.value='BRIEF="'+D.brief+'"';
document.getElementById('cyc').onclick=function(){this.textContent='RUNNING…';setTimeout(()=>this.innerHTML='CYCLE START<small>RUN BUILD</small>',900);
  document.getElementById('stl').textContent='S9001 BUILD START REQUESTED — '+D.plan.length+' BLOCKS QUEUED';};
document.getElementById('hold').onclick=()=>{document.getElementById('stl').textContent='FEED HOLD — PROGRAM PAUSED';};
document.getElementById('stl').textContent='READY — '+D.spec.name.toUpperCase()+' '+(D.report.pass?'VERIFIED ✓':'FAILED ✗');
document.getElementById('str').textContent='ATTEMPT '+D.attempts+' · '+f1(D.report.timingMs)+'ms';
</script>
</body>
</html>
