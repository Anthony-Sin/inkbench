<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — HUD</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1700px; height: 900px; overflow: hidden; }
  body {
    background: #0c0f14; color: #e8e6df;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    position: relative;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }

  /* full-screen scene */
  #scene { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #1a2029 0%, #0c0f14 70%); }
  #scene img {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    height: 96%; filter: drop-shadow(0 0 40px rgba(255,214,120,.10));
  }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }

  /* reticle */
  .ret { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); pointer-events: none; }
  .ret .ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); border-radius: 50%; }
  .r1 { width: 90px; height: 90px; border: 1.5px solid rgba(255,214,120,.85); }
  .r2 { width: 130px; height: 130px; border: 1px dashed rgba(255,214,120,.4); }
  .rbr { width: 200px; height: 200px; }
  .rbr i { position: absolute; width: 18px; height: 18px; border: 2px solid rgba(255,214,120,.8); }
  .rbr i:nth-child(1){ top:0; left:0; border-width: 2px 0 0 2px; }
  .rbr i:nth-child(2){ top:0; right:0; border-width: 2px 2px 0 0; }
  .rbr i:nth-child(3){ bottom:0; left:0; border-width: 0 0 2px 2px; }
  .rbr i:nth-child(4){ bottom:0; right:0; border-width: 0 2px 2px 0; }
  .retag {
    position: absolute; left: 108px; top: -6px; font-size: 10px; letter-spacing: .2em;
    color: rgba(255,214,120,.9); white-space: nowrap;
  }
  .retag .sub { color: rgba(232,230,223,.55); letter-spacing: .1em; }

  /* corner panel base */
  .hud { position: absolute; font-size: 12px; }
  .hh {
    font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: #ffd678;
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .hh::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,214,120,.6), transparent); }
  .card {
    background: linear-gradient(160deg, rgba(16,20,28,.86), rgba(10,13,18,.8));
    border: 1px solid rgba(255,214,120,.3);
    box-shadow: 0 6px 24px rgba(0,0,0,.55), inset 0 0 18px rgba(255,214,120,.04);
    padding: 12px 14px; position: relative;
  }
  .card::before { content:""; position:absolute; top:-1px; left:-1px; width:10px; height:10px; border-top:2px solid #ffd678; border-left:2px solid #ffd678; }
  .card::after { content:""; position:absolute; bottom:-1px; right:-1px; width:10px; height:10px; border-bottom:2px solid #ffd678; border-right:2px solid #ffd678; }

  /* objective (top-left) */
  #hBrief { top: 24px; left: 24px; width: 360px; }
  #hBrief .q { font-size: 13.5px; line-height: 1.55; color: #fff; }
  #hBrief .q::before { content: "◈ "; color: #ffd678; }
  #hBrief .row { display: flex; gap: 8px; margin-top: 10px; }
  #hBrief input {
    flex: 1; background: rgba(0,0,0,.5); border: 1px solid rgba(255,214,120,.4);
    color: #ffe9b8; font-size: 11.5px; padding: 7px 9px; outline: none; font-family: inherit;
  }
  #hBrief input:focus { border-color: #ffd678; }
  #hBrief button {
    background: rgba(255,214,120,.15); border: 1px solid #ffd678; color: #ffd678;
    font-size: 10.5px; letter-spacing: .12em; padding: 0 13px; cursor: pointer; font-family: inherit;
  }
  #hBrief button:hover { background: #ffd678; color: #131007; }

  /* party = checks (top-right) */
  #hChecks { top: 24px; right: 24px; width: 400px; }
  .pchk { display: grid; grid-template-columns: 30px 90px 1fr 56px; gap: 9px; align-items: center; padding: 5px 0; border-top: 1px dashed rgba(255,214,120,.15); }
  .pchk:first-of-type { border-top: none; }
  .pchk .av {
    width: 28px; height: 28px; border: 1px solid rgba(255,214,120,.5); border-radius: 4px;
    display: flex; align-items: center; justify-content: center; font-size: 13px; color: #a7f3d0;
    background: rgba(52,211,153,.12);
  }
  .pchk .nm { font-size: 10px; letter-spacing: .1em; color: #d8d5c9; text-transform: uppercase; }
  .pchk .bar { height: 7px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,214,120,.25); }
  .pchk .bar i { display: block; height: 100%; background: linear-gradient(90deg,#34d399,#a7f3d0); }
  .pchk .mv { font-size: 10px; text-align: right; color: #9a97b0; font-family: ui-monospace, Menlo, monospace; }
  .pchk:hover { background: rgba(255,214,120,.05); }
  #hChecks .verdict { font-size: 10px; letter-spacing: .2em; color: #6ee7b7; margin-top: 9px; text-align: right; }

  /* minimap = log (bottom-left) */
  #hMap { bottom: 24px; left: 24px; width: 330px; }
  #mapWrap { display: flex; gap: 12px; }
  #minimap {
    width: 118px; height: 118px; flex: none; border-radius: 50%;
    border: 1px solid rgba(255,214,120,.5); position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,214,120,.08), transparent 70%),
      conic-gradient(from 0deg, transparent 0deg, rgba(255,214,120,.22) 40deg, transparent 80deg);
  }
  #minimap::before, #minimap::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(255,214,120,.18); transform: scale(.66);
  }
  #minimap::after { transform: scale(.33); }
  #minimap .blip { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #ffd678; }
  #minimap .n { position: absolute; top: 3px; left: 50%; transform: translateX(-50%); font-size: 8.5px; color: #ffd678; letter-spacing: .1em; }
  #mapLog { flex: 1; font-size: 10px; line-height: 1.65; font-family: ui-monospace, Menlo, monospace; color: rgba(232,230,223,.7); overflow: hidden; }
  #mapLog div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mapLog div:last-child { color: #ffd678; }

  /* action bar = plan (bottom-center) */
  #hPlan { bottom: 24px; left: 50%; transform: translateX(-50%); }
  #hPlan .slots { display: flex; gap: 8px; }
  .slot {
    width: 76px; height: 80px; position: relative; text-align: center;
    background: linear-gradient(180deg, rgba(20,24,33,.9), rgba(10,12,17,.9));
    border: 1px solid rgba(255,214,120,.4); padding-top: 8px; cursor: pointer;
  }
  .slot:hover { border-color: #ffd678; background: rgba(255,214,120,.1); transform: translateY(-3px); }
  .slot .key { position: absolute; top: -7px; left: -5px; font-size: 9px; background: #1a1e28; border: 1px solid rgba(255,214,120,.5); color: #ffd678; padding: 1px 5px; }
  .slot .glyph { font-size: 21px; color: #ffe9b8; }
  .slot .pt { font-size: 9.5px; color: #d8d5c9; margin-top: 4px; letter-spacing: .04em; }
  .slot .arm { position: absolute; bottom: 5px; left: 0; right: 0; font-size: 8.5px; letter-spacing: .14em; }
  .slot.aA .arm { color: #7dd3fc; } .slot.aB .arm { color: #f9a8d4; }
  .slot.joint { border-style: dashed; opacity: .75; width: 62px; }
  .slot.joint .glyph { font-size: 12px; padding-top: 6px; }

  /* spec bar (left edge mid) */
  #hSpec { top: 50%; left: 24px; transform: translateY(-50%); width: 210px; }
  .srow { display: flex; justify-content: space-between; font-size: 10.5px; padding: 3.5px 0; border-bottom: 1px dotted rgba(255,214,120,.15); color: #d8d5c9; }
  .srow:last-child { border-bottom: none; }
  .srow .v { color: #9a97b0; font-family: ui-monospace, Menlo, monospace; }
  .srow .id { color: #ffe9b8; }
  #hSpec .mats { display: flex; gap: 6px; margin-top: 8px; }
  #hSpec .mat { font-size: 9px; border: 1px solid rgba(255,214,120,.3); padding: 2px 7px; color: #d8d5c9; display: flex; gap: 5px; align-items: center; }
  #hSpec .mat i { width: 8px; height: 8px; display: inline-block; }

  /* status (bottom-right) */
  #hStat { bottom: 24px; right: 24px; text-align: right; }
  #hStat .xp { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 8px; }
  #hStat .xpbar { width: 220px; height: 9px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,214,120,.4); }
  #hStat .xpbar i { display: block; height: 100%; background: linear-gradient(90deg,#ffd678,#ffe9b8); }
  #hStat .lvl { font-size: 10px; letter-spacing: .18em; color: #ffd678; }
</style>
</head>
<body>
  <div id="scene">
    <img src="lamp_flat.png" alt="render">
    <div class="vignette"></div>
    <div class="ret">
      <div class="ring r2"></div>
      <div class="ring r1"></div>
      <div class="ring rbr"><i></i><i></i><i></i><i></i></div>
      <div class="retag" id="retag"></div>
    </div>
  </div>

  <div class="hud" id="hBrief"><div class="card">
    <div class="hh">Objective · New Brief</div>
    <div class="q" id="briefQ"></div>
    <div class="row"><input id="briefIn" spellcheck="false"><button id="briefBtn">Accept</button></div>
  </div></div>

  <div class="hud" id="hChecks"><div class="card">
    <div class="hh">Party · Verifiers</div>
    <div id="party"></div>
    <div class="verdict" id="vline"></div>
  </div></div>

  <div class="hud" id="hSpec"><div class="card">
    <div class="hh">Inventory · Spec</div>
    <div id="specRows"></div>
    <div class="mats" id="mats"></div>
  </div></div>

  <div class="hud" id="hMap"><div class="card">
    <div class="hh">Field Log</div>
    <div id="mapWrap">
      <div id="minimap"><span class="n">N</span></div>
      <div id="mapLog"></div>
    </div>
  </div></div>

  <div class="hud" id="hPlan"><div class="card">
    <div class="hh" style="justify-content:center">Build Order · Two Arms</div>
    <div class="slots" id="slots"></div>
  </div></div>

  <div class="hud" id="hStat"><div class="card" style="padding:10px 14px">
    <div class="hh" style="justify-content:flex-end">Status</div>
    <div class="mono" style="font-size:10px;color:#9a97b0" id="statLine"></div>
    <div class="xp"><span class="lvl" id="lvl"></span><div class="xpbar"><i id="xpfill"></i></div></div>
  </div></div>

<script src="data.js"></script>
<script>
(function(){
  const D = window.DATA, $ = s => document.querySelector(s);
  const massOf = id => { const m = D.measures.find(m=>m.id===id); return m ? m.massG : 0; };

  $('#briefQ').textContent = D.brief;
  $('#briefIn').value = D.brief;
  $('#retag').innerHTML = D.spec.name.toUpperCase() + '<br><span class="sub">Z 590mm · ' + D.spec.parts.length + ' TARGETS</span>';

  /* party */
  const ico = { 'spec sanity':'◈', 'collision':'✥', 'stability':'⚖', 'assembly order':'⛭', 'clearance':'⇄' };
  $('#party').innerHTML = D.report.checks.map(c =>
    '<div class="pchk" title="' + c.detail.replace(/"/g,'&quot;') + '">' +
      '<div class="av">' + (ico[c.name] || '✦') + '</div>' +
      '<div class="nm">' + c.name + '</div>' +
      '<div class="bar"><i style="width:' + (c.status==='pass'?100:30) + '%;' + (c.status!=='pass'?'background:linear-gradient(90deg,#f87171,#fca5a5)':'') + '"></i></div>' +
      '<div class="mv">' + (c.measured ? c.measured.toFixed(1) : 'ok') + '</div></div>').join('');
  $('#vline').textContent = (D.report.pass ? '✓ RAID CLEARED — ' : '✗ WIPE — ') + D.report.timingMs + 'ms · ATTEMPT ' + D.attempts;

  /* spec inventory */
  $('#specRows').innerHTML = D.spec.parts.map(p =>
    '<div class="srow"><span class="id">' + p.id + '</span><span>' + p.shape + '</span><span class="v">' + massOf(p.id).toFixed(0) + 'g</span></div>').join('') +
    '<div class="srow"><span>joints</span><span></span><span class="v">' + D.spec.joints.length + '</span></div>';
  $('#mats').innerHTML = Object.entries(D.spec.materials).map(([k,m]) =>
    '<span class="mat"><i style="background:' + m.color + '"></i>' + k + '</span>').join('');

  /* minimap blips from part positions (x,z projected) */
  const mm = $('#minimap');
  D.spec.parts.forEach(p => {
    const b = document.createElement('div'); b.className = 'blip'; b.title = p.id;
    b.style.left = (59 + p.position[0]*0.35 - 2) + 'px';
    b.style.top  = (108 - p.position[2]*0.13) + 'px';
    mm.appendChild(b);
  });

  /* log */
  $('#mapLog').innerHTML = D.log.map(l => '<div>' + l + '</div>').join('');

  /* action bar */
  let k = 1;
  $('#slots').innerHTML = D.plan.map(s => {
    if (s.kind === 'place') {
      const cls = s.arm === 'A' ? 'aA' : s.arm === 'B' ? 'aB' : '';
      return '<div class="slot ' + cls + '" title="' + s.part + ' · ' + s.massG.toFixed(0) + 'g · seat (' + s.seat.join(',') + ')">' +
        '<span class="key">' + (k++) + '</span><div class="glyph">' + s.glyph + '</div>' +
        '<div class="pt">' + s.part + '</div><div class="arm">ARM ' + s.arm + '</div></div>';
    }
    return '<div class="slot joint" title="' + s.type + ' ' + s.a + '~' + s.b + '">' +
      '<div class="glyph">⚿</div><div class="pt">' + s.type + '</div><div class="arm" style="color:#9a97b0">JIG</div></div>';
  }).join('');

  /* status */
  const passed = D.report.checks.filter(c=>c.status==='pass').length;
  $('#statLine').textContent = 'FIG ' + D.figures[0].figNum + ' · ' + D.figures[0].name.toUpperCase() + ' · ' + D.spec.units;
  $('#lvl').textContent = D.report.pass ? 'PASS ' + passed + '/' + D.report.checks.length : 'FAIL';
  $('#xpfill').style.width = (passed / D.report.checks.length * 100) + '%';
  if (!D.report.pass) $('#xpfill').style.background = '#f87171';

  $('#briefBtn').onclick = () => {
    const d = document.createElement('div'); d.textContent = 'brief ▸ ' + $('#briefIn').value;
    $('#mapLog').appendChild(d);
  };
})();
</script>
</body>
</html>
