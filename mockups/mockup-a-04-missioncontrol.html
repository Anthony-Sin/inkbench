<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Mission Control</title>
<style>
  :root{
    --floor:#8f8b82; --desk:#c7c3b9; --desk2:#b3afa5; --board:#0d1526; --board2:#131d33;
    --blue:#0b3d91; --red:#b33327; --crt:#0e2218; --phos:#8fe3b0; --amber:#ffc069;
    --ink:#23251f; --mono:"SF Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--floor);color:var(--ink);
    font-family:var(--mono);font-size:12px}
  .room{height:100vh;display:grid;grid-template-rows:400px 1fr 44px;gap:10px;padding:12px}

  /* ============ BIG BOARD ============ */
  .board{display:grid;grid-template-columns:340px 1fr 330px;gap:2px;background:#060a14;border-radius:8px;
    overflow:hidden;border:1px solid #3a4149;box-shadow:0 10px 30px #0005;color:#cfe0d8}
  .bcell{background:var(--board);padding:14px;overflow:hidden;position:relative;min-height:0}
  .bcell+.bcell{border-left:1px solid #1d2a44}
  .bh{font-size:9px;letter-spacing:.35em;color:#5a6f95;border-bottom:1px solid #1d2a44;padding-bottom:6px;margin-bottom:10px}
  .mission{font-size:22px;color:#fff;letter-spacing:.12em;margin:4px 0}
  .patch{width:96px;height:96px;border-radius:50%;margin:12px auto;position:relative;
    background:radial-gradient(circle at 50% 35%,#1d3f7d,#0b1e40 75%);border:3px solid var(--red);
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #0d1526,0 0 0 4px #d8c56a}
  .patch b{color:#f5e9c8;font-size:11px;letter-spacing:.15em;text-align:center;line-height:1.5;text-shadow:0 1px 2px #000}
  .mtable{width:100%;border-collapse:collapse;font-size:10.5px}
  .mtable td{padding:4.5px 0;border-bottom:1px solid #1d2a44;color:#a9bdd3}
  .mtable td:last-child{text-align:right;color:#fff}
  .boardmid{display:flex;flex-direction:column}
  .boardimg{flex:1;position:relative;overflow:hidden;border-radius:4px;min-height:0;
    background:#e9e4d8}
  .boardimg img{width:100%;height:100%;object-fit:contain}
  .boardimg .frame{position:absolute;inset:0;border:1px solid #00000040;box-shadow:inset 0 0 80px #00000026;pointer-events:none}
  .boardimg .ov{position:absolute;left:10px;bottom:10px;font-size:9px;letter-spacing:.2em;color:#123;background:#e9e4d8cc;padding:3px 8px;border:1px solid #0003}
  .bigverdict{position:absolute;top:12px;left:50%;transform:translateX(-50%);
    padding:8px 26px;font-size:15px;letter-spacing:.4em;font-weight:700;border-radius:4px;
    background:#0f3a1e;color:#57e389;border:2px solid #57e389;box-shadow:0 0 24px #57e38944;text-shadow:0 0 8px #57e389}
  .statusboard{display:grid;grid-template-rows:repeat(5,1fr);gap:8px;min-height:0}
  .sb{display:flex;align-items:center;gap:10px;background:var(--board2);border:1px solid #1d2a44;border-radius:4px;padding:0 12px}
  .sb .bl{width:12px;height:12px;border-radius:2px;background:#3fff8a;box-shadow:0 0 10px #3fff8a;border:1px solid #1a5c34}
  .sb .nm{font-size:10px;letter-spacing:.12em;color:#cfe0d8;flex:1}
  .sb .vl{font-size:9px;color:#5a6f95;text-align:right}

  /* ============ CONSOLES ============ */
  .consoles{display:grid;grid-template-columns:1.15fr 1fr 1.1fr 1.2fr;gap:10px;min-height:0}
  .console{background:linear-gradient(#d3cfc5,#bab6ab);border:1px solid #8f8b82;border-radius:6px 6px 4px 4px;
    display:flex;flex-direction:column;min-height:0;box-shadow:0 4px 0 #6f6b62,0 8px 16px #0003}
  .chead{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:2px groove #8f8b82}
  .chead .role{font-size:10px;letter-spacing:.25em;font-weight:700;color:#3a3830}
  .chead .sub{font-size:8px;color:#6f6b62;letter-spacing:.12em}
  .chead .cl{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#4ac26b;box-shadow:0 0 5px #4ac26b}
  .crt{flex:1;margin:10px;background:var(--crt);border-radius:5px;border:1px solid #0a140e;
    box-shadow:inset 0 0 30px #000;overflow:auto;padding:9px 11px;color:var(--phos);min-height:0;
    font-size:10.5px}
  .crt::-webkit-scrollbar{width:4px}.crt::-webkit-scrollbar-thumb{background:#2a4a38}
  .crt .dim{color:#4a7a5f}
  .crt .amb{color:var(--amber)}
  .briefcrt{display:flex;flex-direction:column;gap:8px}
  .briefcrt textarea{flex:1;background:transparent;border:none;resize:none;color:var(--phos);
    font-family:var(--mono);font-size:11px;line-height:1.7;outline:none;caret-color:var(--phos)}
  .briefcrt button{align-self:flex-end;background:#1a3325;color:#8fe3b0;border:1px solid #2a5a3d;border-radius:3px;
    font-family:var(--mono);font-size:9px;letter-spacing:.25em;padding:6px 14px;cursor:pointer}
  .briefcrt button:hover{background:#234530;box-shadow:0 0 8px #8fe3b033}
  .prow{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed #1f3a2c}
  .prow:hover{background:#8fe3b010}
  .prow .p{color:var(--phos)}.prow .m{color:#4a7a5f}
  .pstep{display:grid;grid-template-columns:22px 30px 1fr;gap:6px;padding:3px 0;border-bottom:1px dashed #1f3a2c;align-items:baseline}
  .pstep .n{color:var(--amber)}
  .pstep .w{color:#7ab8ff;font-size:9px}
  .pstep .w.B{color:#ffab60}.pstep .w.J{color:#7fd997}
  .pstep small{display:block;color:#4a7a5f}
  .ck{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed #1f3a2c}
  .ck .s{color:#3fff8a;font-weight:700}
  .ck .n{flex:1}.ck .v{color:#4a7a5f}
  .logline{padding:2px 0;color:#8fe3b0;border-bottom:1px dotted #143024}
  .logline:first-child{color:#4a7a5f}
  .logline:last-child{color:#d6ff9e;font-weight:700}
  .chips{display:flex;gap:6px;padding:8px 10px;border-top:1px solid #8f8b82}
  .chip{flex:1;text-align:center;font-size:8px;letter-spacing:.15em;color:#5a564c;
    background:#a8a498;border-radius:2px;padding:3px 0;border:1px solid #8f8b82}

  /* ============ TICKER ============ */
  .ticker{display:flex;align-items:center;background:#141414;border-radius:5px;overflow:hidden;
    border:1px solid #333;box-shadow:inset 0 2px 6px #000}
  .ticker .lab{flex:none;background:var(--red);color:#fff;font-size:10px;letter-spacing:.3em;
    padding:0 18px;align-self:stretch;display:flex;align-items:center;font-weight:700}
  .ticker .tk{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
  .ticker .tk span{display:inline-block;color:#e8c96a;font-size:11px;letter-spacing:.06em;
    animation:tk 34s linear infinite}
  @keyframes tk{to{transform:translateX(-50%)}}
</style>
</head>
<body>
<div class="room">
  <!-- BIG BOARD -->
  <div class="board">
    <div class="bcell">
      <div class="bh">MISSION DATA — FLIGHT DYNAMICS</div>
      <div class="mission" id="mname"></div>
      <div class="patch"><b id="patchtxt"></b></div>
      <table class="mtable" id="mtable"></table>
    </div>
    <div class="bcell boardmid">
      <div class="bh" id="boardtitle">MAIN BOARD — ASSEMBLED CONFIGURATION</div>
      <div class="boardimg">
        <img src="lamp_flat.png" alt="render">
        <div class="frame"></div>
        <div class="ov" id="bov"></div>
        <div class="bigverdict" id="bvd"></div>
      </div>
    </div>
    <div class="bcell">
      <div class="bh">SYSTEMS STATUS BOARD</div>
      <div class="statusboard" id="sboard"></div>
    </div>
  </div>

  <!-- CONSOLE ROW -->
  <div class="consoles">
    <div class="console">
      <div class="chead"><span class="role">FLIGHT</span><span class="sub">MISSION BRIEF DIRECTIVE</span><span class="cl"></span></div>
      <div class="crt briefcrt"><textarea id="brief" spellcheck="false"></textarea>
        <button id="send">UPLINK BRIEF ▸</button></div>
      <div class="chips"><span class="chip">CH-1</span><span class="chip">NL-SPEC</span><span class="chip" id="att"></span></div>
    </div>
    <div class="console">
      <div class="chead"><span class="role">GUIDO</span><span class="sub">SPEC · PARTS & MASS</span><span class="cl"></span></div>
      <div class="crt" id="spec"></div>
      <div class="chips"><span class="chip" id="pcts"></span><span class="chip" id="jcts"></span></div>
    </div>
    <div class="console">
      <div class="chead"><span class="role">TELMU</span><span class="sub">GEOMETRIC VERIFICATION</span><span class="cl"></span></div>
      <div class="crt" id="checks"></div>
      <div class="chips"><span class="chip" id="tlim"></span></div>
    </div>
    <div class="console">
      <div class="chead"><span class="role">ARMS</span><span class="sub">DUAL-ARM BUILD SEQUENCE · EVENT LOG</span><span class="cl"></span></div>
      <div class="crt" style="display:grid;grid-template-rows:1fr 86px;gap:8px;padding:9px 11px">
        <div style="overflow:auto;min-height:0" id="plan"></div>
        <div style="overflow:auto;border-top:1px solid #1f3a2c;padding-top:5px;min-height:0" id="log"></div>
      </div>
      <div class="chips"><span class="chip">ARM-A</span><span class="chip">ARM-B</span><span class="chip">2×6-DOF</span></div>
    </div>
  </div>

  <!-- TICKER -->
  <div class="ticker"><div class="lab">EVENTS</div><div class="tk"><span id="tk"></span></div></div>
</div>
<script src="data.js"></script>
<script>
const D=window.DATA;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const f1=v=>(+v).toFixed(1),f2=v=>(+v).toFixed(2);
const dimStr=p=>p.shape==='box'?p.size.join('×'):`⌀${p.size.r*2}×${p.size.h}`;
const totalMass=D.measures.reduce((s,m)=>s+m.massG,0);
const stab=D.report.checks.find(c=>c.name==='stability');
const clr=D.report.checks.find(c=>c.name==='clearance');

document.getElementById('mname').textContent=D.spec.name.toUpperCase();
document.getElementById('patchtxt').innerHTML='INKBENCH<br>FIG·'+D.figures[0].figNum;
document.getElementById('mtable').innerHTML=[
  ['FIG NO','0'+D.figures[0].figNum],['PARTS',D.figures[0].parts],['JOINTS',D.figures[0].joints],
  ['ATTEMPTS',D.attempts],['TOTAL MASS',f2(totalMass/1000)+' kg'],
  ['TIP MARGIN',f2(stab.measured)+' mm'],['VERIFY TIME',f1(D.report.timingMs)+' ms']
].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('');
document.getElementById('bov').textContent='CAM-A · '+D.spec.name.toUpperCase()+' · SCALE 1:1 mm';
const bvd=document.getElementById('bvd');
bvd.textContent=D.report.pass?'✓ VERIFIED':'✗ FAILED';
if(!D.report.pass){bvd.style.background='#3a1210';bvd.style.color='#ff7a6e';bvd.style.borderColor='#ff7a6e';}

document.getElementById('sboard').innerHTML=D.report.checks.map(c=>`
  <div class="sb"><span class="bl" style="${c.status!=='pass'?'background:#ff5348;box-shadow:0 0 10px #ff5348;border-color:#7a2018':''}"></span>
  <span class="nm">${esc(c.name.toUpperCase())}</span>
  <span class="vl">${c.measured?f2(c.measured):''}<br>${esc(c.status.toUpperCase())}</span></div>`).join('');

const bi=document.getElementById('brief');bi.value=D.brief;
document.getElementById('send').onclick=()=>{
  const l=document.getElementById('log');const d=document.createElement('div');
  d.className='logline';d.textContent='UPLINK ▸ '+bi.value;l.appendChild(d);l.scrollTop=1e6;};
document.getElementById('att').textContent='ATTEMPTS '+D.attempts;
document.getElementById('pcts').textContent=D.spec.parts.length+' PARTS';
document.getElementById('jcts').textContent=D.spec.joints.length+' JOINTS';
document.getElementById('tlim').textContent='LIMITS: clr≥'+D.spec.tests.min_clearance_mm+'mm · tip≤'+D.spec.tests.max_tip_angle_deg+'°';

document.getElementById('spec').innerHTML=D.spec.parts.map(p=>{
  const m=D.measures.find(x=>x.id===p.id);const mat=D.spec.materials[p.material];
  return `<div class="prow"><span class="p">${esc(p.id)}<span class="m"> ${p.shape}/${p.material}</span></span>
    <span class="m">${dimStr(p)}mm · <span class="amb">${f1(m.massG)}g</span></span></div>`;
}).join('')+`<div class="prow" style="border-top:1px solid #2a5a3d"><span class="p">TOTAL</span><span class="amb">${f1(totalMass)} g</span></div>`;

document.getElementById('checks').innerHTML=D.report.checks.map(c=>`
  <div class="ck"><span class="s" style="${c.status!=='pass'?'color:#ff5348':''}">${c.status==='pass'?'GO':'NO-GO'}</span>
  <span class="n">${esc(c.name)}</span><span class="v">${c.measured?f2(c.measured):''}</span></div>`).join('')
  +`<div class="dim" style="margin-top:6px;font-size:9px">${esc(stab.detail)}</div>`;

document.getElementById('plan').innerHTML=D.plan.map(p=>{
  if(p.kind==='place')return `<div class="pstep"><span class="n">${String(p.step).padStart(2,'0')}</span>
    <span class="w ${p.arm}">${p.arm}</span>
    <span><span class="p">${esc(p.part.toUpperCase())}</span> ${p.glyph}<small>${f1(p.massG)}g → seat ${p.seat.map(v=>f1(v)).join(',')}</small></span></div>`;
  return `<div class="pstep"><span class="n">··</span><span class="w J">JNT</span>
    <span><span class="dim">${esc(p.type)}</span> ${esc(p.a)}→${esc(p.b)}<small>axis ${p.axis.join(',')} @ ${p.anchor.map(v=>f1(v)).join(',')}</small></span></div>`;
}).join('');
document.getElementById('log').innerHTML=D.log.map(l=>`<div class="logline">${esc(l)}</div>`).join('');

const tk=D.log.map(esc).join('  ///  ')+'  ///  '+(D.report.pass?'REPORT ▸ PASS — ALL CHECKS GREEN':'REPORT ▸ FAIL');
document.getElementById('tk').textContent=(tk+'   ').repeat(3);
</script>
</body>
</html>
