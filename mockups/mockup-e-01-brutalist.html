<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — BRUTAL WORKBENCH</title>
<style>
  *{box-sizing:border-box;border-radius:0!important;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Courier New",Courier,monospace;
    background:#fff;color:#000;font-size:13px;
    display:grid;grid-template-rows:84px 1fr 34px;
  }
  /* ============ HEADER ============ */
  header{
    background:#000;color:#fff;display:flex;align-items:stretch;
    border-bottom:5px solid #000;
  }
  header .logo{
    font-family:"Arial Black",Arial,sans-serif;font-size:38px;letter-spacing:-2px;
    display:flex;align-items:center;padding:0 18px;background:#000;
  }
  header .tag{
    display:flex;align-items:center;padding:0 14px;background:#ffe600;color:#000;
    font-weight:bold;border-left:4px solid #fff;font-size:12px;letter-spacing:1px;
  }
  header .spacer{flex:1;border-left:4px solid #fff;background:repeating-linear-gradient(45deg,#000 0 10px,#111 10px 20px)}
  #verdict{
    display:flex;align-items:center;gap:10px;padding:0 22px;
    font-family:"Arial Black",Arial,sans-serif;font-size:26px;
    border-left:4px solid #fff;
  }
  #verdict.pass{background:#00ff41;color:#000}
  #verdict.fail{background:#ff2b2b;color:#fff;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  /* ============ MAIN GRID ============ */
  main{
    display:grid;gap:0;padding:0;
    grid-template-columns:380px 340px 1fr 380px;
    grid-template-rows:1.15fr .85fr;
    min-height:0;
  }
  section{border:3px solid #000;margin:-3px 0 0 -3px;min-height:0;display:flex;flex-direction:column;background:#fff}
  section.yellow{background:#ffe600}
  section h2{
    font-family:"Arial Black",Arial,sans-serif;font-size:13px;letter-spacing:1px;
    background:#000;color:#fff;padding:7px 10px;display:flex;justify-content:space-between;flex:0 0 auto;
  }
  section h2 .no{color:#ffe600}
  .body{flex:1;overflow:auto;padding:10px;min-height:0}
  /* brief */
  textarea{
    width:100%;height:110px;resize:none;border:3px solid #000;padding:8px;
    font-family:inherit;font-size:13px;background:#fff;
  }
  textarea:focus{outline:none;background:#ffe600}
  button.go{
    margin-top:8px;width:100%;padding:12px;font-family:"Arial Black",Arial,sans-serif;
    font-size:15px;background:#000;color:#fff;border:3px solid #000;cursor:pointer;
    box-shadow:6px 6px 0 #888;letter-spacing:1px;
  }
  button.go:hover{background:#ffe600;color:#000}
  button.go:active{transform:translate(6px,6px);box-shadow:0 0 0 #888}
  .meta{margin-top:10px;font-size:11px;line-height:1.7}
  .meta b{background:#000;color:#ffe600;padding:0 4px}
  /* render */
  .renderwrap{flex:1;display:flex;align-items:center;justify-content:center;background:
    repeating-conic-gradient(#ffe600 0 25%,#fff 0 50%) 0 0/28px 28px;min-height:0;overflow:hidden}
  .renderwrap img{max-height:96%;max-width:92%;border:4px solid #000;background:#fff;object-fit:contain}
  .figcap{border-top:3px solid #000;padding:5px 10px;font-size:11px;font-weight:bold;background:#fff;flex:0 0 auto}
  /* spec tables */
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:#000;color:#ffe600;text-align:left;padding:4px 6px;font-size:11px}
  td{border:2px solid #000;padding:4px 6px}
  tr:hover td{background:#ffe600}
  .mat{display:inline-block;width:12px;height:12px;border:2px solid #000;vertical-align:-2px;margin-right:5px}
  .sub{background:#000;color:#fff;font-weight:bold;padding:5px 8px;margin:10px -10px 6px;font-size:11px;letter-spacing:1px}
  /* checks */
  .check{display:flex;gap:8px;border:3px solid #000;margin-bottom:8px;padding:7px;align-items:flex-start}
  .check .mark{font-family:"Arial Black",Arial;font-size:16px;flex:0 0 26px;height:26px;line-height:26px;text-align:center;border:3px solid #000}
  .check.pass .mark{background:#00ff41}
  .check.fail .mark{background:#ff2b2b;color:#fff}
  .check .nm{font-weight:bold;text-transform:uppercase;font-size:12px}
  .check .dt{font-size:11px;line-height:1.5;margin-top:2px}
  .check:hover{background:#ffe600}
  /* plan */
  .step{display:flex;gap:8px;align-items:baseline;border-bottom:2px dashed #000;padding:6px 2px}
  .step:hover{background:#ffe600}
  .step .arm{border:3px solid #000;font-family:"Arial Black",Arial;font-size:11px;padding:1px 6px;background:#fff}
  .step .arm.A{background:#00ff41}.step .arm.B{background:#ff8de8}.step .arm.AB{background:#00d9ff}
  .step.joint{font-style:italic;font-size:11px}
  .step .n{font-family:"Arial Black",Arial;font-size:14px;min-width:22px}
  /* log */
  #log{font-size:11px;line-height:1.8;white-space:pre-wrap}
  #log div::before{content:"» "}
  #log div:hover{background:#000;color:#00ff41}
  /* footer status */
  footer{
    background:#000;color:#fff;display:flex;align-items:center;gap:0;font-size:12px;overflow:hidden;
  }
  footer .cell{padding:0 14px;border-right:2px solid #fff;white-space:nowrap}
  footer .cell b{color:#ffe600}
  .cursor{display:inline-block;width:9px;height:15px;background:#00ff41;animation:blink .9s steps(2) infinite;vertical-align:-2px;margin-left:10px}
  ::-webkit-scrollbar{width:14px;height:14px}
  ::-webkit-scrollbar-track{background:#fff;border:2px solid #000}
  ::-webkit-scrollbar-thumb{background:#000;border:2px solid #ffe600}
</style>
</head>
<body>
<header>
  <div class="logo">INKBENCH_</div>
  <div class="tag">AGENTIC CAD WORKBENCH // NO ROUNDED CORNERS WERE HARMED</div>
  <div class="spacer"></div>
  <div id="verdict">…</div>
</header>
<main>
  <section>
    <h2><span><span class="no">01/</span> BRIEF.TXT</span><span>■</span></h2>
    <div class="body">
      <textarea id="brief"></textarea>
      <button class="go" id="submit">SUBMIT BRIEF ▸▸</button>
      <div class="meta" id="briefmeta"></div>
    </div>
  </section>
  <section class="yellow" style="grid-row:span 2">
    <h2><span><span class="no">02/</span> RENDER</span><span>▼</span></h2>
    <div class="renderwrap"><img src="lamp_flat.png" alt="render"></div>
    <div class="figcap" id="figcap"></div>
  </section>
  <section>
    <h2><span><span class="no">03/</span> SPEC.DAT</span><span>■</span></h2>
    <div class="body" id="spec"></div>
  </section>
  <section>
    <h2><span><span class="no">04/</span> VERIFY.LOG</span><span>■</span></h2>
    <div class="body" id="checks"></div>
  </section>
  <section>
    <h2><span><span class="no">05/</span> SPEC.II — MATERIALS+JOINTS</span><span>■</span></h2>
    <div class="body" id="spec2"></div>
  </section>
  <section>
    <h2><span><span class="no">06/</span> ARMS.PLAN — 2-ARM CELL</span><span>■</span></h2>
    <div class="body" id="plan"></div>
  </section>
  <section>
    <h2><span><span class="no">07/</span> AGENT.LOG</span><span>■</span></h2>
    <div class="body" id="log"></div>
  </section>
</main>
<footer id="statusbar"></footer>
<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s);
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const dim=p=>Array.isArray(p.size)?p.size.join('×'):(p.size&&p.size.r!==undefined?'r'+p.size.r+'×h'+p.size.h:'—');
const mass=id=>{const m=D.measures.find(m=>m.id===id);return m?m.massG:0};
const TOT=D.measures.reduce((s,m)=>s+m.massG,0);
const f=a=>a.map(x=>(+x).toFixed(1).replace(/\.0$/,'')).join(',');

/* verdict */
const v=$('#verdict');v.className=D.report.pass?'pass':'fail';v.id='verdict';
v.textContent=D.report.pass?'▮ PASS':'▮ FAIL';

/* brief */
$('#brief').value=D.brief.toUpperCase();
$('#briefmeta').innerHTML=
 'UNITS: <b>'+D.spec.units+'</b> &nbsp;ATTEMPTS: <b>'+D.attempts+'</b><br>'+
 'TESTS: min_clearance <b>'+D.spec.tests.min_clearance_mm+'mm</b> · max_tip <b>'+D.spec.tests.max_tip_angle_deg+'°</b><br>'+
 'TIMING: <b>'+D.report.timingMs+'ms</b>';
$('#submit').onclick=()=>{const l=$('#log');const d=E('div','','re-queue ▸ "'+$('#brief').value.slice(0,48)+'…"');l.appendChild(d);l.parentElement.scrollTop=1e9};

/* figcap */
const F=D.figures[0]||{};
$('#figcap').textContent='FIG.'+(F.figNum||1)+' — '+(F.name||'').toUpperCase()+' · '+(F.parts||'')+' PARTS · '+(F.joints||'')+' JOINTS · RENDER 560×956';

/* spec parts table */
let h='<table><tr><th>ID</th><th>SHAPE</th><th>MAT</th><th>SIZE(mm)</th><th>MASS(g)</th></tr>';
D.spec.parts.forEach(p=>{
  const col=(D.spec.materials[p.material]||{}).color||'#fff';
  h+='<tr><td><b>'+p.id+'</b></td><td>'+p.shape+'</td><td><span class="mat" style="background:'+col+'"></span>'+p.material+'</td><td>'+dim(p)+'</td><td>'+mass(p.id).toFixed(1)+'</td></tr>';
});
h+='</table><div class="sub">Σ MASS = '+(TOT/1000).toFixed(3)+' KG — ASSEMBLY INSERTS ALL +Z ↑</div>';
$('#spec').innerHTML=h;

/* spec2: materials + joints */
h='<table><tr><th>MATERIAL</th><th>ρ kg/m³</th><th>SWATCH</th></tr>';
Object.entries(D.spec.materials).forEach(([n,m])=>{
  h+='<tr><td>'+n+'</td><td>'+m.density+'</td><td><span class="mat" style="background:'+m.color+';width:40px"></span>'+m.color+'</td></tr>';
});
h+='</table><div class="sub">JOINTS ('+D.spec.joints.length+')</div><table><tr><th>A</th><th>TYPE</th><th>B</th><th>ANCHOR</th></tr>';
D.spec.joints.forEach(j=>{h+='<tr><td>'+j.a+'</td><td>'+j.type+'</td><td>'+j.b+'</td><td>['+f(j.anchor)+']</td></tr>'});
h+='</table>';
$('#spec2').innerHTML=h;

/* checks */
const c=$('#checks');
D.report.checks.forEach(k=>{
  const ok=k.status==='pass';
  const d=E('div','check '+k.status);
  d.appendChild(E('div','mark',ok?'✓':'✗'));
  const t=E('div','','<div class="nm">'+k.name+(ok?'':' — FAIL')+'</div><div class="dt">'+k.detail+'</div>');
  d.appendChild(t);c.appendChild(d);
});
if(!D.report.checks.length)c.innerHTML='<b>NO CHECKS IN REPORT.</b>';

/* plan */
const p=$('#plan');let n=0;
D.plan.forEach(s=>{
  if(s.kind==='place'){n++;
    const d=E('div','step');
    const arm=s.arm==='A+B'?'AB':s.arm;
    d.innerHTML='<span class="n">'+String(s.step).padStart(2,'0')+'</span><span class="arm '+arm+'">ARM '+s.arm+'</span><span><b>'+s.part+'</b> '+s.glyph+' insert ['+f(s.insert_from)+'] → seat ['+f(s.seat)+'] · '+s.massG.toFixed(0)+'g'+(s.heavy?' ⚠HEAVY':'')+'</span>';
    p.appendChild(d);
  }else{
    const d=E('div','step joint');
    d.innerHTML='<span class="n">⌁</span><span class="arm">JNT</span><span>'+s.type+' joint '+s.a+'~'+s.b+' axis ['+f(s.axis)+']'+(s.late?' (LATE)':'')+'</span>';
    p.appendChild(d);
  }
});

/* log */
const l=$('#log');D.log.forEach(x=>l.appendChild(E('div','',x)));

/* statusbar */
const sb=$('#statusbar');
sb.innerHTML='<div class="cell">STATUS: <b>'+(D.report.pass?'PASS':'FAIL')+'</b></div>'+
 '<div class="cell">ATTEMPTS: <b>'+D.attempts+'</b></div>'+
 '<div class="cell">FAILURES: <b>'+(D.report.failures||[]).length+'</b></div>'+
 '<div class="cell">TIMING: <b>'+D.report.timingMs+'MS</b></div>'+
 '<div class="cell">PARTS: <b>'+D.spec.parts.length+'</b> JOINTS: <b>'+D.spec.joints.length+'</b></div>'+
 '<div class="cell">Σ'+(TOT/1000).toFixed(2)+'KG</div><span class="cursor"></span>';
</script>
</body>
</html>
