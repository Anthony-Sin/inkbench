<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Macintosh</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:Charcoal,Chicago,Geneva,"Lucida Grande",Verdana,sans-serif;font-size:11px;color:#000;
    background-color:#888;
    background-image:
      linear-gradient(45deg,#777 25%,transparent 25%),linear-gradient(-45deg,#777 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#777 75%),linear-gradient(-45deg,transparent 75%,#777 75%);
    background-size:2px 2px;background-position:0 0,0 1px,1px -1px,-1px 0;
    position:relative;
  }
  /* ===== menu bar ===== */
  #menubar{
    position:absolute;top:0;left:0;right:0;height:20px;background:#fff;border-bottom:1px solid #000;
    display:flex;align-items:center;padding:0 10px;gap:14px;z-index:5000;user-select:none;
  }
  #menubar .m{padding:1px 6px;cursor:default}
  #menubar .m:hover{background:#000;color:#fff}
  #menubar .apple{font-size:14px;line-height:1}
  #menubar .app{font-weight:bold}
  #menubar .right{margin-left:auto;display:flex;gap:12px;align-items:center}
  /* ===== window ===== */
  .win{
    position:absolute;background:#fff;border:1px solid #000;
    box-shadow:3px 3px 0 #000;display:flex;flex-direction:column;min-width:150px;
  }
  .tbar{
    height:18px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 4px;cursor:grab;user-select:none;
    background:repeating-linear-gradient(#fff 0 2px,#ddd 2px 3px);border-bottom:1px solid #000;
  }
  .win:not(.focus) .tbar{background:#fff}
  .win:not(.focus) .tbar .tt{color:#999}
  .close{width:11px;height:11px;border:1px solid #000;background:#fff;flex:0 0 auto}
  .close:active{background:#000}
  .tbar .tt{flex:1;text-align:center;font-size:11px;white-space:nowrap;overflow:hidden}
  .zoom{width:11px;height:11px;border:1px solid #000;background:#fff;flex:0 0 auto;position:relative}
  .zoom::after{content:"";position:absolute;inset:2px;border:1px solid #000}
  .wbody{flex:1;min-height:0;overflow:auto;padding:8px;background:#fff}
  .wbody::-webkit-scrollbar{width:14px}
  .wbody::-webkit-scrollbar-track{background:repeating-linear-gradient(#fff 0 3px,#ddd 3px 4px);border-left:1px solid #000}
  .wbody::-webkit-scrollbar-thumb{background:#fff;border:1px solid #000}
  /* ===== classic widgets ===== */
  .btn{
    display:inline-block;border:1px solid #000;background:#fff;padding:2px 14px;cursor:default;
    box-shadow:2px 2px 0 #000;border-radius:4px!important;font-size:11px;user-select:none;
  }
  .btn.def{border:3px double #000;font-weight:bold}
  .btn:active{box-shadow:0 0 0 #000;transform:translate(2px,2px);background:#ddd}
  textarea{width:100%;height:56px;border:1px solid #000;font-family:inherit;font-size:11px;padding:4px;resize:none}
  textarea:focus{outline:2px solid #000;outline-offset:1px}
  table{border-collapse:collapse;width:100%;font-size:11px}
  td,th{padding:2px 6px;border-bottom:1px dotted #000;text-align:left}
  th{border-bottom:1px solid #000}
  .hdr{border-bottom:2px solid #000;font-weight:bold;padding-bottom:2px;margin-bottom:5px;display:flex;justify-content:space-between}
  .okbox{border:2px solid #000;padding:6px;text-align:center;font-weight:bold;margin-top:6px}
  .imgwrap{display:flex;align-items:center;justify-content:center;background:#fff;height:100%;padding:6px}
  .imgwrap img{max-height:100%;max-width:100%;object-fit:contain;border:1px solid #000}
  .inv{background:#000;color:#fff;padding:0 3px}
  ul{list-style:none}
  .mono{font-family:Monaco,"Courier New",monospace;font-size:10px}
  .mat{display:inline-block;width:10px;height:10px;border:1px solid #000;vertical-align:-1px;margin-right:4px}
  .dicon{position:absolute;right:16px;width:64px;text-align:center;z-index:1;cursor:default}
  .dicon .img{font-size:26px;filter:grayscale(1)}
  .dicon span{background:#fff;padding:0 3px}
  marquee{font-weight:bold}
</style>
</head>
<body>
<div id="menubar">
  <span class="m apple">&#63743;</span>
  <span class="m app">INKBENCH</span>
  <span class="m">File</span><span class="m">Edit</span><span class="m">View</span>
  <span class="m">Build</span><span class="m">Verify</span><span class="m">Window</span>
  <div class="right"><span id="mstatus">…</span><span id="clock">--:--</span></div>
</div>

<div class="dicon" style="top:36px"><div class="img">💾</div><span>lamp</span></div>
<div class="dicon" style="top:104px"><div class="img">🗑</div><span>Trash</span></div>

<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s);
const dim=p=>Array.isArray(p.size)?p.size.join('×'):(p.size&&p.size.r!==undefined?'r'+p.size.r+' h'+p.size.h:'—');
const mass=id=>{const m=D.measures.find(m=>m.id===id);return m?m.massG:0};
const f=a=>a.map(x=>(+x).toFixed(1).replace(/\.0$/,'')).join(', ');
let z=100;
function mkWin(title,x,y,w,h,fill,opts){
  const win=document.createElement('div');win.className='win';
  win.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;z-index:'+(++z);
  win.innerHTML='<div class="tbar"><div class="close"></div><div class="tt">'+title+'</div><div class="zoom"></div></div><div class="wbody"'+(opts&&opts.nopad?' style="padding:0"':'')+'></div>';
  document.body.appendChild(win);
  fill(win.querySelector('.wbody'));
  const focus=()=>{document.querySelectorAll('.win').forEach(w=>w.classList.remove('focus'));win.classList.add('focus')};
  win.addEventListener('mousedown',()=>{win.style.zIndex=++z;focus()},true);focus();
  const bar=win.querySelector('.tbar');
  bar.addEventListener('mousedown',e=>{
    if(e.target.className==='close'||e.target.className==='zoom')return;
    const ox=e.clientX-win.offsetLeft,oy=e.clientY-win.offsetTop;
    const mv=ev=>{win.style.left=(ev.clientX-ox)+'px';win.style.top=Math.max(22,ev.clientY-oy)+'px'};
    const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
    addEventListener('mousemove',mv);addEventListener('mouseup',up);
  });
  win.querySelector('.close').onclick=()=>win.remove();
  return win;
}

/* render window (main, front) */
mkWin('Untitled — '+D.figures[0].name,560,60,340,600,(b)=>{
  b.innerHTML='<div class="imgwrap"><img src="lamp_flat.png"></div>';
},{nopad:true});

/* brief dialog */
mkWin('New Design Brief',60,60,420,190,(b)=>{
  b.innerHTML='<div class="hdr"><span>Describe the object:</span><span>⌘N</span></div>'+
   '<textarea id="brief"></textarea>'+
   '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px;align-items:center">'+
   '<span style="color:#666">units: '+D.spec.units+'</span>'+
   '<span class="btn" id="cancel">Cancel</span><span class="btn def" id="ok">Design</span></div>';
  b.querySelector('#brief').value=D.brief;
  b.querySelector('#ok').onclick=()=>{b.innerHTML='<div style="text-align:center;padding:30px">Designing…<br><br><span class="inv">▓▓▓▓▓▓▓▓▓▓</span> '+D.report.timingMs+'ms</div>'};
  b.querySelector('#cancel').onclick=()=>{b.querySelector('#brief').value=''};
});

/* spec window */
mkWin('Specification — '+D.spec.parts.length+' parts, '+D.spec.joints.length+' joints',300,220,430,320,(b)=>{
  let h='<table><tr><th>part</th><th>shape</th><th>material</th><th>size '+D.spec.units+'</th><th>mass g</th></tr>';
  D.spec.parts.forEach(p=>{const c=(D.spec.materials[p.material]||{}).color;
    h+='<tr><td><b>'+p.id+'</b></td><td>'+p.shape+'</td><td><span class="mat" style="background:'+c+'"></span>'+p.material+'</td><td>'+dim(p)+'</td><td>'+mass(p.id).toFixed(1)+'</td></tr>'});
  h+='</table><div class="hdr" style="margin-top:10px"><span>joints</span><span>'+D.spec.joints.length+'</span></div><ul>';
  D.spec.joints.forEach(j=>h+='<li>◆ '+j.a+' — <i>'+j.type+'</i> — '+j.b+'&nbsp; <span class="mono">['+f(j.anchor)+']</span></li>');
  b.innerHTML=h+'</ul>';
});

/* verification window */
mkWin('Verification',80,300,400,300,(b)=>{
  let h='';
  D.report.checks.forEach(k=>{
    const ok=k.status==='pass';
    h+='<div style="display:flex;gap:6px;margin-bottom:6px"><div style="flex:0 0 14px;height:14px;border:1px solid #000;text-align:center;line-height:13px">'+(ok?'✓':'✗')+'</div>'+
       '<div><b>'+k.name+'</b><br><span class="mono">'+k.detail+'</span></div></div>';
  });
  h+='<div class="okbox">'+(D.report.pass?'✓ VERIFIED — '+D.attempts+' attempt':'✗ '+D.report.failures.length+' FAILURE(S)')+'</div>';
  b.innerHTML=h;
});

/* robot plan window */
mkWin('Robot Build Plan — arms A & B',940,300,440,360,(b)=>{
  let h='<ol style="list-style:none">';
  D.plan.forEach(s=>{ if(s.kind==='place'){
    h+='<li style="margin-bottom:5px"><span class="inv">'+s.step+'</span> '+
      '<b>arm '+s.arm+'</b> places <b>'+s.part+'</b> '+s.glyph+'<br><span class="mono">&nbsp;&nbsp;&nbsp;seat ['+f(s.seat)+'] · '+s.massG.toFixed(0)+'g</span></li>';
  } else {
    h+='<li style="margin:2px 0 6px 14px" class="mono">⌁ make '+s.type+' joint '+s.a+'~'+s.b+'</li>';
  }});
  b.innerHTML=h+'</ol>';
});

/* log window */
mkWin('Notebook',420,560,400,160,(b)=>{
  b.innerHTML='<ul class="mono">'+D.log.map(x=>'<li>• '+x+'</li>').join('')+'</ul>';
});

/* status */
$('#mstatus').innerHTML=D.report.pass?'✓ '+(D.figures[0].name||'')+' — PASS':'✗ FAIL';
function tick(){const d=new Date();const h=d.getHours()%12||12;$('#clock').textContent=h+':'+String(d.getMinutes()).padStart(2,'0')+(d.getHours()<12?' AM':' PM')}
tick();setInterval(tick,30000);
</script>
</body>
</html>
