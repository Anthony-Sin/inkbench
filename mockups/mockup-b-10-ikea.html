<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Assembly Instructions</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#8a8f96}
  body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:#141414}
  #stage{position:absolute;left:50%;top:50%;width:1700px;height:900px;transform:translate(-50%,-50%);
    background:#fdfdf9;box-shadow:0 20px 60px rgba(0,0,0,.45);padding:26px 34px;display:flex;flex-direction:column}
  /* header */
  header{display:flex;align-items:center;gap:26px;border-bottom:3px solid #141414;padding-bottom:14px}
  .logo{background:#0058a3;color:#ffdb00;font-weight:900;font-size:26px;letter-spacing:2px;padding:12px 26px;
    border-radius:50%/60%;flex:none;box-shadow:0 3px 0 #003f75}
  .ttl h1{font-size:52px;font-weight:900;text-transform:uppercase;letter-spacing:-1px;line-height:.95}
  .ttl .sub{font-size:13px;letter-spacing:3px;color:#5c5c5c;margin-top:6px;text-transform:uppercase}
  .warn{display:flex;gap:14px;margin-left:auto;align-items:center}
  .wtri{width:70px;height:62px;clip-path:polygon(50% 0,100% 100%,0 100%);background:#ffdb00;border:0;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-weight:900;font-size:24px}
  .briefbox{width:430px;border:2.5px solid #141414;padding:10px 14px}
  .briefbox .q{font-size:14px;font-weight:700;font-style:italic;line-height:1.3}
  .briefbox .row{display:flex;gap:8px;margin-top:8px}
  .briefbox input{flex:1;border:1.5px solid #141414;font:inherit;font-size:12px;padding:6px 8px;outline:none;min-width:0}
  .briefbox input:focus{border-color:#0058a3;box-shadow:0 0 0 2px rgba(0,88,163,.25)}
  .briefbox button{background:#0058a3;color:#fff;border:0;font:inherit;font-weight:700;font-size:12px;
    letter-spacing:1px;padding:6px 16px;cursor:pointer;transition:.12s}
  .briefbox button:hover{background:#003f75}
  .briefbox .lbl{font-size:9px;letter-spacing:2.5px;color:#5c5c5c;text-transform:uppercase}
  /* body */
  .body{flex:1;display:grid;grid-template-columns:300px 1fr;gap:26px;min-height:0;padding-top:16px}
  .side{display:flex;flex-direction:column;gap:16px;min-height:0}
  .panel{border:2.5px solid #141414;padding:12px 14px}
  .panel h4{font-size:12px;letter-spacing:3px;text-transform:uppercase;border-bottom:2px solid #141414;
    padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
  .panel h4 .se{font-size:9px;color:#5c5c5c;letter-spacing:1px}
  .boxlist .it{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed #b7b7b7}
  .boxlist .it:last-child{border:0}
  .boxlist .it svg{width:44px;height:34px;flex:none}
  .boxlist .it .nm{font-weight:700;font-size:12.5px;text-transform:uppercase}
  .boxlist .it .dd{font-size:9.5px;color:#5c5c5c}
  .boxlist .it .ct{margin-left:auto;font-weight:900;font-size:15px}
  .tools .tl{display:flex;gap:12px;align-items:center;padding:6px 0;border-bottom:1px dashed #b7b7b7;font-size:12px}
  .tools .tl:last-child{border:0}
  .tools .tl svg{width:46px;height:30px;flex:none}
  .tools .tl b{font-size:12px}
  .hw{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .hw .b{border:1.5px solid #141414;font-size:10px;padding:3px 8px;font-weight:700;background:#f2f2ec}
  /* steps grid */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:18px;min-height:0}
  .step{border:2.5px solid #141414;position:relative;padding:12px 16px;display:flex;flex-direction:column;overflow:hidden}
  .step .no{position:absolute;top:-8px;left:8px;font-size:76px;font-weight:900;color:#e8e8e0;z-index:0}
  .step .scn{flex:1;display:flex;align-items:center;justify-content:center;gap:18px;position:relative;z-index:1;min-height:0}
  .step .scn svg.shape{width:150px;height:150px;overflow:visible}
  .step .dir{position:relative;z-index:1;text-align:right}
  .step .dir .glyph{font-size:40px;font-weight:900;color:#0058a3;line-height:1}
  .step .dir .seat{font-size:10px;color:#5c5c5c;margin-top:2px}
  .step .foot{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;
    border-top:2px solid #141414;padding-top:6px;margin-top:6px}
  .step .foot .pn{font-weight:900;font-size:14px;text-transform:uppercase}
  .step .foot .ms{font-size:10px;color:#5c5c5c}
  .step .jn{position:relative;z-index:1;font-size:9.5px;color:#5c5c5c;font-style:italic;margin-top:2px;min-height:12px}
  .armfig{display:flex;flex-direction:column;align-items:center;gap:2px}
  .armfig svg{width:44px;height:56px}
  .armfig .al{font-size:9px;font-weight:900;letter-spacing:1px}
  .step.done{padding:0;border:0}
  .step.done img{width:100%;height:100%;object-fit:cover;filter:contrast(1.04)}
  .step.done .cap{position:absolute;left:0;right:0;bottom:0;background:#141414;color:#fdfdf9;font-size:11px;
    letter-spacing:2px;text-transform:uppercase;padding:6px 12px;text-align:center}
  /* bottom band */
  .band{margin-top:16px;border-top:3px solid #141414;padding-top:10px;display:grid;grid-template-columns:1fr 340px 300px;gap:26px;height:170px}
  .qc h4,.svc h4,.stamph h4{font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
  .qc .row{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px dashed #b7b7b7;font-size:11.5px}
  .qc .row:last-child{border:0}
  .qc .ok{width:17px;height:17px;border:2px solid #141414;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:900;flex:none;transform:translateY(2px)}
  .qc .ok.bad{border-color:#c00;color:#c00}
  .qc .nm{font-weight:700;text-transform:capitalize;white-space:nowrap}
  .qc .dt{font-size:9.5px;color:#5c5c5c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qc .dt2{margin-left:auto;font-size:10px;font-variant-numeric:tabular-nums;color:#5c5c5c;white-space:nowrap}
  .svc{font-size:10.5px;line-height:1.7;font-style:italic;color:#3d3d3d;overflow-y:auto;scrollbar-width:thin}
  .svc div::before{content:"☎ ";font-style:normal}
  .stamph .stamp{width:100%;border:4px double #0058a3;color:#0058a3;font-weight:900;font-size:26px;letter-spacing:4px;
    text-align:center;padding:16px 0;transform:rotate(-2deg)}
  .stamph .sm{font-size:10px;text-align:center;color:#5c5c5c;margin-top:8px;letter-spacing:1px}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="logo">INKBENCH</div>
    <div class="ttl"><h1 id="pname"></h1><div class="sub" id="psub"></div></div>
    <div class="warn">
      <div class="wtri">!</div>
      <div class="briefbox">
        <div class="lbl">Design brief — keep for reference</div>
        <div class="q">“<span id="brief"></span>”</div>
        <div class="row"><input id="nb" spellcheck="false"><button id="nbBtn">ORDER ▸</button></div>
      </div>
    </div>
  </header>
  <div class="body">
    <div class="side">
      <div class="panel boxlist"><h4>In the box <span class="se" id="boxct"></span></h4><div id="boxl"></div></div>
      <div class="panel"><h4>Hardware <span class="se">JOINT FASTENERS</span></h4><div class="hw" id="hw"></div></div>
      <div class="panel tools" style="flex:1;min-height:0;overflow-y:auto"><h4>You will need <span class="se">NOT INCLUDED</span></h4>
        <div id="tools"></div></div>
    </div>
    <div class="steps" id="steps"></div>
  </div>
  <div class="band">
    <div class="qc"><h4>Factory quality check — do not return to store</h4><div id="qc"></div></div>
    <div class="svc"><h4>Customer service notes</h4><div id="svc"></div></div>
    <div class="stamph"><h4>Inspection</h4><div class="stamp" id="stamp"></div><div class="sm" id="sm"></div></div>
  </div>
</div>
<script src="data.js"></script>
<script>
const D=window.DATA,S=D.spec,R=D.report;
const $=id=>document.getElementById(id);
const f=(n,d=1)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const mass=g=>g>=1000?f(g/1000,2)+' kg':f(g,0)+' g';
const dims=p=>p.shape==='box'?p.size.join('×'):'⌀'+(p.size.r*2)+'×'+p.size.h;
const K='#141414';
const shape={
 cylinder:`<svg class="shape" viewBox="0 0 120 120"><ellipse cx="60" cy="34" rx="46" ry="16" fill="none" stroke="${K}" stroke-width="4"/><path d="M14 34v52a46 16 0 0 0 92 0V34" fill="none" stroke="${K}" stroke-width="4"/><ellipse cx="60" cy="86" rx="46" ry="16" fill="none" stroke="${K}" stroke-width="3" stroke-dasharray="5 5"/></svg>`,
 box:`<svg class="shape" viewBox="0 0 120 120"><path d="M28 44h52v58H28z" fill="none" stroke="${K}" stroke-width="4"/><path d="M28 44l14-16h52L80 44z" fill="none" stroke="${K}" stroke-width="4"/><path d="M80 44l14-16v58L80 102z" fill="none" stroke="${K}" stroke-width="4"/></svg>`,
 cone:`<svg class="shape" viewBox="0 0 120 120"><path d="M60 18L22 82h76z" fill="none" stroke="${K}" stroke-width="4"/><ellipse cx="60" cy="82" rx="38" ry="13" fill="none" stroke="${K}" stroke-width="4"/></svg>`};
const smIco={
 cylinder:`<svg viewBox="0 0 44 34"><ellipse cx="22" cy="9" rx="16" ry="6" fill="none" stroke="${K}" stroke-width="2.5"/><path d="M6 9v16a16 6 0 0 0 32 0V9" fill="none" stroke="${K}" stroke-width="2.5"/></svg>`,
 box:`<svg viewBox="0 0 44 34"><path d="M8 12h22v20H8z" fill="none" stroke="${K}" stroke-width="2.5"/><path d="M8 12l6-7h22l-6 7z" fill="none" stroke="${K}" stroke-width="2.5"/><path d="M30 12l6-7v20l-6 7z" fill="none" stroke="${K}" stroke-width="2.5"/></svg>`,
 cone:`<svg viewBox="0 0 44 34"><path d="M22 4L7 26h30z" fill="none" stroke="${K}" stroke-width="2.5"/><ellipse cx="22" cy="26" rx="15" ry="5" fill="none" stroke="${K}" stroke-width="2.5"/></svg>`};
const armFig=c=>`<svg viewBox="0 0 44 56"><rect x="14" y="46" width="16" height="6" fill="${K}"/><path d="M22 46V34" stroke="${c}" stroke-width="5"/><path d="M22 34L10 22" stroke="${c}" stroke-width="5"/><path d="M22 34L34 20" stroke="${c}" stroke-width="5" opacity=".45"/><circle cx="10" cy="22" r="5" fill="none" stroke="${K}" stroke-width="3"/><path d="M6 14l4 5 4-5" fill="none" stroke="${K}" stroke-width="2.5"/></svg>`;

$('pname').textContent=S.name.toUpperCase().replace('DESK LAMP','LÄMPE');
$('psub').textContent=`assembly instructions · ${S.parts.length} parts · ${S.joints.length} fasteners · EN/${S.units.toUpperCase()}`;
$('brief').textContent=D.brief;
$('nb').value=D.brief;
$('boxct').textContent=`${S.parts.length} PCS`;

$('boxl').innerHTML=S.parts.map(p=>`<div class="it">${smIco[p.shape]||smIco.box}
  <span><span class="nm">${p.id.replace('_',' ')}</span><br><span class="dd">${dims(p)} ${S.units} · ${p.material} · ${mass(D.measures.find(m=>m.id===p.id).massG)}</span></span>
  <span class="ct">×1</span></div>`).join('');

const hwCount={};S.joints.forEach(j=>hwCount[j.type]=(hwCount[j.type]||0)+1);
const hwName={fixed:'⌀ set-screw',revolute:'⌀ hinge-pin',prismatic:'⌀ slide-bolt'};
$('hw').innerHTML=Object.entries(hwCount).map(([t,n])=>`<span class="b">${hwName[t]||t+' fastener'} ×${n}</span>`).join('');

$('tools').innerHTML=
  `<div class="tl"><svg viewBox="0 0 46 30"><path d="M6 24L30 8l8 8-8 4-20 8z" fill="none" stroke="${K}" stroke-width="2.5"/><circle cx="38" cy="12" r="4" fill="none" stroke="${K}" stroke-width="2.5"/></svg><span><b>HEX KEY</b> — for set-screws</span></div>`+
  `<div class="tl">${armFig('#0058a3')}<span><b>ARM A</b> — places: ${D.plan.filter(s=>s.kind==='place'&&s.arm==='A').map(s=>s.part).join(', ')}</span></div>`+
  `<div class="tl">${armFig('#141414')}<span><b>ARM B</b> — places: ${D.plan.filter(s=>s.kind==='place'&&s.arm==='B').map(s=>s.part).join(', ')}</span></div>`+
  `<div class="tl"><svg viewBox="0 0 46 30"><rect x="8" y="4" width="30" height="22" fill="none" stroke="${K}" stroke-width="2.5"/><path d="M13 10h20M13 15h20M13 20h12" stroke="${K}" stroke-width="2"/></svg><span><b>BRIEF</b> — one per build</span></div>`;

const stepsEl=$('steps');
const jointAfter={};
D.plan.forEach(s=>{if(s.kind==='joint'){const places=D.plan.filter(p=>p.kind==='place'&&D.plan.indexOf(p)<D.plan.indexOf(s));
  const last=places[places.length-1];if(last)jointAfter[last.part]=s}});
const places=D.plan.filter(s=>s.kind==='place');
places.forEach((s,i)=>{
  const part=S.parts.find(p=>p.id===s.part);
  const jn=jointAfter[s.part];
  const el=document.createElement('div');el.className='step';
  el.innerHTML=`<span class="no">${s.step}</span>
    <div class="scn">${shape[part.shape]||shape.box}
      <div><div class="dir"><span class="glyph">${s.glyph}</span><div class="seat">seat z ${f(s.seat[2],0)}</div></div>
      <div class="armfig" style="margin-top:14px">${armFig(s.arm==='A'?'#0058a3':'#141414')}<span class="al">ARM ${s.arm}</span></div></div>
    </div>
    <div class="foot"><span class="pn">${s.part.replace('_',' ')}</span><span class="ms">${mass(s.massG)}</span></div>
    <div class="jn">${jn?`then fasten ⌖ ${jn.type} — ${jn.a} ~ ${jn.b}`:''}</div>`;
  stepsEl.appendChild(el);
});
const done=document.createElement('div');done.className='step done';
done.innerHTML=`<img src="lamp_flat.png" alt="finished"><div class="cap">Done — ${S.name} · verified ${f(R.timingMs,0)} ms</div>`;
stepsEl.appendChild(done);

$('qc').innerHTML=R.checks.map(c=>
  `<div class="row" title="${c.detail.replace(/"/g,'')}"><span class="ok${c.status==='pass'?'':' bad'}">${c.status==='pass'?'✓':'✗'}</span>
   <span class="nm">${c.name}</span><span class="dt">${c.detail}</span><span class="dt2">${c.measured?f(c.measured,1):''}</span></div>`).join('');
$('svc').innerHTML=D.log.map(l=>`<div>${l}</div>`).join('');
$('stamp').textContent=R.pass?'PASS ✓':'REJECT';
$('stamp').style.borderColor=R.pass?'#0058a3':'#c00';$('stamp').style.color=R.pass?'#0058a3':'#c00';
$('sm').textContent=`INSPECTED BY AGENT · ${R.checks.length}/${R.checks.length} CHECKS · ${D.attempts} ATTEMPT`;

$('nbBtn').onclick=()=>{$('svc').innerHTML+=`<div>new order placed ▸ ${$('nb').value||D.brief}</div>`;$('svc').scrollTop=1e6};
$('nb').addEventListener('keydown',e=>{if(e.key==='Enter')$('nbBtn').click()});

const stage=document.getElementById('stage');
function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1700,innerHeight/900)})`}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
