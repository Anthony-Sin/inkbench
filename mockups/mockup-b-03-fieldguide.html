<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INKBENCH — Field Guide Plate</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#33302a}
  body{font-family:Georgia,"Iowan Old Style",serif;color:#3a3427}
  #stage{position:absolute;left:50%;top:50%;width:1700px;height:900px;transform:translate(-50%,-50%);
    background:#f2ecd9;box-shadow:0 24px 80px rgba(0,0,0,.5)}
  .page{position:absolute;inset:30px 40px;border:1px solid #8f8668;padding:0}
  .hand{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
  .topline{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #8f8668;padding:12px 26px 10px}
  .topline .chap{font-variant:small-caps;letter-spacing:4px;font-size:14px}
  .topline .pl{font-variant:small-caps;letter-spacing:2px;font-size:13px;font-style:italic}
  .grid{display:grid;grid-template-columns:330px 1fr 330px;height:712px}
  .side{padding:20px 24px;overflow-y:auto;scrollbar-width:thin}
  .side.l{border-right:1px dashed #8f8668}
  .side.r{border-left:1px dashed #8f8668}
  h5{font-variant:small-caps;letter-spacing:3px;font-size:13px;color:#4a5d3a;border-bottom:1px solid #4a5d3a;display:inline-block;padding-bottom:3px;margin-bottom:11px}
  .taxo{font-size:12px;line-height:1.7;margin-bottom:16px}
  .taxo b{font-variant:small-caps}
  .keyrow{display:flex;gap:9px;font-size:11.5px;padding:5px 0;border-bottom:1px dotted #b3a984;align-items:baseline}
  .keyrow .dot{width:9px;height:9px;border:1.2px solid #3a3427;border-radius:50%;flex:none;transform:translateY(1px)}
  .keyrow i{font-style:italic}
  .meas{font-size:11.5px;line-height:1.85;margin-bottom:14px}
  .note{position:relative;font-size:13.5px;line-height:1.55;color:#4a5d3a;margin:0 0 16px 14px;transform:rotate(-.6deg)}
  .note::before{content:"✎";position:absolute;left:-16px;top:0;font-size:11px}
  .obs{font-size:12.5px;line-height:1.55;margin-bottom:12px}
  .obs b{font-variant:small-caps;letter-spacing:1px}
  .obs .tick{color:#4a5d3a;font-weight:700}
  .diary{font-size:11.5px;font-style:italic;line-height:1.8;border-top:1px dashed #b3a984;padding-top:10px}
  .assembly{font-size:12px;line-height:1.7;margin-bottom:14px}
  .assembly .st{margin-bottom:6px}
  .assembly .n{display:inline-block;width:18px;height:18px;border:1px solid #4a5d3a;border-radius:50%;text-align:center;line-height:17px;font-size:10.5px;color:#4a5d3a;margin-right:6px}
  /* plate center */
  .plate{position:relative;display:flex;flex-direction:column;align-items:center;padding:18px 0 6px}
  .frame{position:relative;width:372px;height:586px;padding:10px;border:1px solid #3a3427;border-radius:190px 190px 8px 8px;background:#ece4c9}
  .frame::before{content:"";position:absolute;inset:5px;border:1px solid #8f8668;border-radius:184px 184px 5px 5px;pointer-events:none}
  .frame img{width:100%;height:100%;object-fit:cover;object-position:center;border-radius:180px 180px 4px 4px;
    filter:invert(.93) sepia(.5) saturate(.75) contrast(1.06) brightness(1.03)}
  .lbl{position:absolute;font-style:italic;font-size:12.5px;text-align:center;line-height:1.25;color:#3a3427}
  .lbl b{font-style:normal;font-variant:small-caps;font-size:13px}
  .lbl .tick{display:block;width:60px;height:1px;background:#3a3427;margin:3px auto 0}
  .cap{margin-top:14px;text-align:center}
  .cap .t{font-variant:small-caps;letter-spacing:2px;font-size:15px}
  .cap .s{font-style:italic;font-size:11.5px;opacity:.75;margin-top:3px}
  .foot{border-top:1px solid #8f8668;display:flex;justify-content:space-between;align-items:center;padding:10px 26px;height:56px}
  .foot .impr{font-style:italic;font-size:11px;opacity:.7}
  .foot .plno{font-variant:small-caps;letter-spacing:4px;font-size:15px}
  .briefline{font-size:12.5px;font-style:italic;line-height:1.6;margin-bottom:10px}
  .reob{margin-top:4px;font-family:inherit;background:none;border:1px solid #4a5d3a;color:#4a5d3a;font-size:11px;letter-spacing:2px;padding:5px 12px;cursor:pointer;font-variant:small-caps;transition:.15s}
  .reob:hover{background:#4a5d3a;color:#f2ecd9}
</style>
</head>
<body>
<div id="stage"><div class="page">
  <div class="topline">
    <span class="chap">Mechanica — Order Lumina</span>
    <span class="pl">A Field Guide to Agent-Built Artefacts · Inkbench Press</span>
  </div>
  <div class="grid">
    <div class="side l">
      <h5>Identification</h5>
      <div class="taxo" id="taxo"></div>
      <h5>Key to the Species</h5>
      <div id="key"></div>
      <h5 style="margin-top:16px">Measurements</h5>
      <div class="meas" id="meas"></div>
      <h5>Field Sketch Request</h5>
      <div class="briefline" id="brief"></div>
      <button class="reob" id="reob">↻ Note another sighting</button>
    </div>
    <div class="plate">
      <div class="frame" id="frame"><img src="lamp_flat.png" alt="specimen"></div>
      <div class="cap"><div class="t" id="capT"></div><div class="s" id="capS"></div></div>
    </div>
    <div class="side r">
      <h5>Marginalia</h5>
      <div id="margins"></div>
      <h5>Field Observations</h5>
      <div id="obs"></div>
      <h5>Assembly, as Witnessed</h5>
      <div class="assembly" id="assembly"></div>
      <h5>Collector's Diary</h5>
      <div class="diary" id="diary"></div>
    </div>
  </div>
  <div class="foot">
    <span class="impr" id="imprL"></span>
    <span class="plno">Pl. I.</span>
    <span class="impr" id="imprR"></span>
  </div>
</div></div>
<script src="data.js"></script>
<script>
const D=window.DATA,S=D.spec,R=D.report;
const $=id=>document.getElementById(id);
const f=(n,d=1)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const mass=g=>g>=1000?f(g/1000,2)+' kg':f(g,0)+' g';
const dims=p=>p.shape==='box'?p.size.join(' × '):'⌀ '+(p.size.r*2)+' × '+p.size.h;
const tot=D.measures.reduce((a,m)=>a+m.massG,0);
const stab=R.checks.find(c=>c.name==='stability');
const clear=R.checks.find(c=>c.name==='clearance');

$('taxo').innerHTML=
 `<div><b>Order</b> — Lumina &nbsp;<b>Family</b> — Desklampidae</div>`+
 `<div><b>Genus</b> — <i>Inkbenchea</i> &nbsp;<b>Species</b> — <i>I. ${S.name.toLowerCase().replace(' ','-')}</i></div>`+
 `<div><b>Specimen</b> — ${S.parts.length} members, ${S.joints.length} articulations · attempt № ${D.attempts}</div>`;
$('key').innerHTML=S.parts.map(p=>
 `<div class="keyrow"><span class="dot" style="background:${S.materials[p.material].color}"></span><span><b>${p.id.replace('_',' ')}</b> — <i>${p.shape}</i>, ${dims(p)} ${S.units}, ${p.material}</span></div>`).join('');
$('meas').innerHTML=
 `<div>Overall height — <b>665 ${S.units}</b></div><div>Base spread — <b>⌀ 160 ${S.units}</b></div>`+
 `<div>Weight in hand — <b>${mass(tot)}</b></div><div>Poise — <b>tip margin ${f(stab?stab.measured:0,1)} ${S.units}</b></div>`+
 `<div>Close approach — <b>≥ ${f(clear?clear.measured:S.tests.min_clearance_mm,1)} ${S.units}</b></div>`;
$('brief').textContent='“'+D.brief+'” — as dictated to the agent.';

/* plate labels: alternate sides at part z */
const frame=$('frame'),imgH=586,zMax=665;
const sides=[['base','l'],['post','l'],['lower_arm','r'],['upper_arm','r'],['shade','l']];
const sideMap={};sides.forEach(([k,v])=>sideMap[k]=v);
const handNames={base:'stout base',post:'upright post',lower_arm:'lower arm',upper_arm:'upper arm',shade:'tilting shade'};
S.parts.forEach((p,i)=>{
  const y=10+imgH-30-(p.position[2]/zMax)*(imgH-90);
  const el=document.createElement('div');el.className='lbl';
  const L=sideMap[p.id]==='l';
  el.style.top=Math.max(4,Math.min(imgH-30,y-10))+'px';
  el.style[L?'right':'left']='calc(100% + 16px)';
  el.innerHTML=`<b>${i+1}.</b> ${handNames[p.id]||p.id}<span class="tick"></span>`;
  frame.appendChild(el);
});
$('capT').textContent=`${S.name} — Inkbencha ${S.name.toLowerCase().replace(' ','-')} (agent-built)`;
$('capS').textContent=`Adult specimen, assembled posture; ${S.parts.length} members drawn from life. Scale ca. 1:2.`;

const notes=[
 `— found “${D.brief.split(',')[0].replace('a desk lamp with ','')}…”, thrives on desks & drawing tables`,
 `— stands unaided! CoM low at ${stab&&stab.detail.match(/CoM=\(([^)]*)\)/)?stab.detail.match(/CoM=\(([^)]*)\)/)[1]:'—'} mm`,
 `— ${S.joints.filter(j=>j.type==='revolute').length} swivelling joints, all about the y axis`,
 `— ${mass(tot)} in the hand; the base alone is ${mass(D.measures[0].massG)}`];
$('margins').innerHTML=notes.map(n=>`<div class="note hand">${n}</div>`).join('');
$('obs').innerHTML=R.checks.map(c=>
 `<div class="obs"><span class="tick">${c.status==='pass'?'✓':'✗'}</span> <b>${c.name}</b> — <i>${c.detail}</i></div>`).join('');
$('assembly').innerHTML=D.plan.filter(s=>s.kind==='place').map(s=>
 `<div class="st"><span class="n">${s.step}</span>arm <b>${s.arm}</b> set the <i>${s.part.replace('_',' ')}</i> ${s.glyph} — ${mass(s.massG)}</div>`).join('');
$('diary').innerHTML=D.log.map(l=>`· ${l}`).join('<br>');
$('imprL').textContent='Inkbench del. et sculp.';
$('imprR').textContent=`Verified in ${f(R.timingMs,0)} ms — ${R.pass?'passed all trials':'trials failed'}`;
$('reob').onclick=()=>{$('diary').innerHTML+=`<br>· re-observation requested ▸ “${D.brief}”`};

const stage=document.getElementById('stage');
function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1700,innerHeight/900)})`}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
