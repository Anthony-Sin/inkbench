<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1700">
<title>INKBENCH — FIG-1 desk lamp</title>
<style>
:root{
  --bg:#14151a; --panel:#191b21; --panel2:#1e212a;
  --line:#262933; --line2:#333743;
  --txt:#e9eaef; --mut:#9ba0ae; --dim:#5d6272;
  --acc:#7c8cf8; --acc-soft:rgba(124,140,248,.16);
  --ok:#5fce8e; --ok-soft:rgba(95,206,142,.14);
  --mag:#c08cf8; --amber:#e5b567;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);overflow:hidden;display:flex;flex-direction:column;
  font:13px/1.5 "Inter","SF Pro Text",-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
::selection{background:var(--acc-soft)}
:focus-visible{outline:1.5px solid var(--acc);outline-offset:-1px}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:#353946;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
kbd{font:600 10px var(--mono);color:var(--mut);background:var(--panel2);border:1px solid var(--line2);
  border-bottom-width:2px;border-radius:4px;padding:1.5px 5px}

/* ---------- top bar ---------- */
#top{height:44px;flex:0 0 44px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 14px;position:relative;z-index:2}
.mark{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--acc),#a78bfa);
  display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#14151a}
#top .loc{font-size:13px;color:var(--mut)}
#top .loc b{color:var(--txt);font-weight:600}
#cmdhint{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px}
#statusline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
#statusline .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok)}

/* ---------- board ---------- */
#board{flex:1;min-height:0;display:grid;gap:12px;padding:14px;
  grid-template-columns:330px 1fr 370px;grid-template-rows:64px 1fr 190px;
  transition:filter .25s}
#board.dim{filter:brightness(.55) saturate(.7) blur(1.5px)}
.pan{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pan .ph{height:32px;flex:0 0 32px;display:flex;align-items:center;gap:8px;padding:0 12px;
  font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
.pan .ph .x{margin-left:auto;font:500 10px var(--mono);letter-spacing:0}
.pan .pb{flex:1;min-height:0;overflow-y:auto;padding:8px}

#p-brief{grid-column:1/4;grid-row:1}
#p-brief .pb{display:flex;align-items:center;gap:10px;padding:10px 12px}
#brief{flex:1;height:38px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:0 12px;
  font-size:13px;transition:border-color .15s,box-shadow .15s}
#brief::placeholder{color:var(--dim)}
#brief:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
#go{height:38px;padding:0 16px;border-radius:8px;background:var(--acc);color:#14151a;font-weight:650;transition:filter .13s}
#go:hover{filter:brightness(1.15)}
#go:disabled{opacity:.45;cursor:not-allowed}

#p-spec{grid-column:1;grid-row:2}
#p-rend{grid-column:2;grid-row:2}
#p-rend .pb{display:grid;place-items:center;background:radial-gradient(#1d2029 1px,transparent 1.1px);background-size:20px 20px;padding:14px}
#p-rend img{max-height:100%;max-width:100%;border-radius:8px;border:1px solid var(--line2);box-shadow:0 16px 44px rgba(0,0,0,.5)}
#p-chk{grid-column:3;grid-row:2}
#p-plan{grid-column:1/3;grid-row:3}
#p-log{grid-column:3;grid-row:3}

.srow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-size:12px}
.srow:hover{background:var(--panel2)}
.srow .sw{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.srow .id{flex:0 0 88px;font-weight:550}
.srow .sh{color:var(--mut);flex:0 0 64px}
.srow .mt{color:var(--dim);flex:1}
.srow .ms{font:10.5px var(--mono);color:var(--mut)}
.jr{display:flex;gap:8px;padding:4px 6px;border-radius:6px;font-size:11.5px;color:var(--mut)}
.jr:hover{background:var(--panel2)}
.jr .ty{color:var(--mag);flex:0 0 62px;font-family:var(--mono);font-size:10.5px}
.jr .ab{flex:1;color:var(--txt)}
.jr .ax{font:10px var(--mono);color:var(--dim)}

.ck{display:flex;gap:9px;padding:6px;border-radius:7px}
.ck:hover{background:var(--panel2)}
.ck .ci{width:17px;height:17px;border-radius:50%;flex:0 0 17px;background:var(--ok-soft);color:var(--ok);
  display:grid;place-items:center;font-size:10px;margin-top:1px}
.ck .nm{font-size:12.5px;font-weight:550}
.ck .nm .mv{font:10px var(--mono);color:var(--acc);margin-left:6px}
.ck .dt{font-size:10.5px;color:var(--mut);line-height:1.4}

.pl{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:6px;font-size:12px;white-space:nowrap}
.pl:hover{background:var(--panel2)}
.pl .n{font:600 10px var(--mono);color:var(--dim);width:18px}
.pl .p{flex:1;overflow:hidden;text-overflow:ellipsis}
.pl .p small{color:var(--dim)}
.pl .a{font:700 9.5px var(--mono);border-radius:4px;padding:2px 6px}
.pl .a.A{background:var(--acc-soft);color:var(--acc)}
.pl .a.B{background:rgba(192,140,248,.14);color:var(--mag)}
.pl .a.AB{background:rgba(229,181,103,.14);color:var(--amber)}
.pl .jt{font:10px var(--mono);color:var(--dim);border:1px dashed var(--line2);border-radius:4px;padding:1px 5px}

#loglines{font:11px/1.7 var(--mono);color:var(--mut)}
#loglines div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#loglines .g{color:var(--ok)}#loglines .c{color:var(--acc)}#loglines .y{color:var(--amber)}
#loglines .t{color:var(--dim)}

/* ---------- palette ---------- */
#scrim{position:fixed;inset:0;background:rgba(8,9,12,.55);backdrop-filter:blur(1px);z-index:10;
  display:grid;place-items:start center;opacity:1;transition:opacity .2s}
#scrim.hidden{opacity:0;pointer-events:none}
#pal{width:680px;margin-top:110px;background:#1c1e25;border:1px solid #333642;border-radius:14px;
  box-shadow:0 32px 90px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04) inset;overflow:hidden;
  transform:translateY(0) scale(1);transition:transform .18s,opacity .18s}
#scrim.hidden #pal{transform:translateY(-8px) scale(.985);opacity:0}
#pin{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid var(--line)}
#pin .ic{color:var(--acc);font-size:15px}
#q{flex:1;background:none;border:0;font-size:15.5px;color:var(--txt)}
#q::placeholder{color:var(--dim)}
#q:focus{outline:none}
#pin .tag{font:500 10px var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:2.5px 7px}
#plist{max-height:452px;overflow-y:auto;padding:7px}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:9px 10px 4px}
.rw{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;cursor:pointer}
.rw .ri{width:26px;height:26px;flex:0 0 26px;border-radius:7px;display:grid;place-items:center;font-size:12px;
  background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.rw .rm{flex:1;min-width:0}
.rw .rt{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .rs{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rw .rb{font:600 9.5px var(--mono);border-radius:4px;padding:2.5px 6px;flex:0 0 auto}
.rw .rb.ok{background:var(--ok-soft);color:var(--ok)}
.rw .rb.acc{background:var(--acc-soft);color:var(--acc)}
.rw .rb.mag{background:rgba(192,140,248,.14);color:var(--mag)}
.rw .rb.amb{background:rgba(229,181,103,.14);color:var(--amber)}
.rw .rb.dim{background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.rw.sel{background:var(--acc-soft)}
.rw.sel .ri{background:rgba(124,140,248,.2);color:var(--acc);border-color:rgba(124,140,248,.4)}
.rw.sel .rt{color:#fff}
.rw:hover{background:var(--panel2)}
.rw.sel:hover{background:var(--acc-soft)}
#pempty{padding:26px;text-align:center;color:var(--dim);font-size:13px}
#pfoot{display:flex;align-items:center;gap:16px;padding:10px 16px;border-top:1px solid var(--line);
  color:var(--dim);font-size:11.5px;background:#181a20}
#pfoot .h{display:flex;align-items:center;gap:6px}
#pfoot .r{margin-left:auto;font-family:var(--mono);font-size:10.5px}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);z-index:30;
  background:#22242c;border:1px solid var(--line2);border-radius:9px;padding:9px 16px;font-size:12.5px;
  color:var(--txt);opacity:0;transition:all .22s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="top">
  <div class="mark">IK</div>
  <span class="loc">inkbench / <b id="loc"></b></span>
  <div id="statusline" style="margin-left:auto"><span class="dot"></span><span id="statustxt"></span></div>
  <div id="cmdhint" style="margin-left:16px">⌘K command palette</div>
</div>

<div id="board" class="dim">
  <section class="pan" id="p-brief"><div class="pb">
    <input id="brief" spellcheck="false" placeholder="Describe a mechanism to design…">
    <button id="go">Submit brief</button>
  </div></section>

  <section class="pan" id="p-spec"><div class="ph">Specification<span class="x" id="specx"></span></div>
    <div class="pb" id="spec"></div></section>

  <section class="pan" id="p-rend"><div class="ph">Render<span class="x" id="rendx"></span></div>
    <div class="pb"><img src="lamp_flat.png" alt="render" id="rimg"></div></section>

  <section class="pan" id="p-chk"><div class="ph">Verification<span class="x" id="ckx"></span></div>
    <div class="pb" id="checks"></div></section>

  <section class="pan" id="p-plan"><div class="ph">Build plan — two arms<span class="x" id="planx"></span></div>
    <div class="pb" id="plan"></div></section>

  <section class="pan" id="p-log"><div class="ph">Agent log<span class="x">tail</span></div>
    <div class="pb"><div id="loglines"></div></div></section>
</div>

<!-- command palette -->
<div id="scrim">
  <div id="pal" role="dialog" aria-label="Command palette">
    <div id="pin">
      <span class="ic">⌘</span>
      <input id="q" spellcheck="false" autocomplete="off" placeholder="Search parts, checks, plan ops, actions…">
      <span class="tag">fig-1</span>
    </div>
    <div id="plist"></div>
    <div id="pfoot">
      <span class="h"><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span class="h"><kbd>↵</kbd> run</span>
      <span class="h"><kbd>esc</kbd> dismiss</span>
      <span class="r" id="pcount"></span>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const checks=D.report.checks,passed=checks.filter(c=>c.status==='pass').length;
const fig=D.figures[0];
const v3=v=>'('+v.map(n=>(+n).toFixed(0)).join(',')+')';

$('#loc').textContent='FIG-'+fig.figNum+' '+fig.name;
$('#statustxt').textContent=(D.report.pass?'verified':'failed')+' · '+D.report.timingMs.toFixed(0)+'ms';
$('#specx').textContent=D.spec.parts.length+'p '+D.spec.joints.length+'j';
$('#rendx').textContent='toon · '+D.spec.units;
$('#ckx').textContent=passed+'/'+checks.length+' pass';
$('#planx').textContent=D.plan.length+' ops';

/* board spec */
const sizeOf=p=>Array.isArray(p.size)?p.size.join('×'):'r'+p.size.r+' h'+p.size.h;
$('#spec').innerHTML=D.spec.parts.map(p=>{
  const m=D.measures.find(x=>x.id===p.id);
  const col=(D.spec.materials[p.material]||{}).color||'#888';
  return `<div class="srow"><span class="sw" style="background:${col}"></span>
    <span class="id">${esc(p.id)}</span><span class="sh">${esc(p.shape)}</span>
    <span class="mt">${esc(p.material)}</span><span class="ms">${sizeOf(p)} · ${m?Math.round(m.massG)+'g':''}</span></div>`;
}).join('')+D.spec.joints.map(j=>`
  <div class="jr"><span class="ty">${esc(j.type)}</span><span class="ab">${esc(j.a)} ↔ ${esc(j.b)}</span>
    <span class="ax">${v3(j.anchor)}</span></div>`).join('');

/* board checks */
$('#checks').innerHTML=checks.map(c=>`
  <div class="ck"><span class="ci">${c.status==='pass'?'✓':'✗'}</span>
    <div><div class="nm">${esc(c.name)}${c.measured?`<span class="mv">${(+c.measured).toFixed(2)}</span>`:''}</div>
    <div class="dt">${esc(c.detail)}</div></div></div>`).join('');

/* board plan */
$('#plan').innerHTML=D.plan.map(op=>op.kind==='place'?`
  <div class="pl"><span class="n">${String(op.step).padStart(2,'0')}</span>
    <span class="p">${op.glyph} place ${esc(op.part)} <small>seat ${v3(op.seat)} · ${Math.round(op.massG)}g</small></span>
    <span class="a ${op.arm}">${op.arm}</span></div>`:`
  <div class="pl"><span class="n">·</span>
    <span class="p"><small>joint ${esc(op.a)} ↔ ${esc(op.b)}</small></span>
    <span class="jt">${esc(op.type)}</span></div>`).join('');

/* log */
const logEl=$('#loglines');
function logLine(t,cls){
  const d=document.createElement('div');if(cls)d.className=cls;
  d.innerHTML='<span class="t">'+new Date().toTimeString().slice(0,8)+' </span>'+esc(t);
  logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;
}
D.log.forEach(l=>{let c='';if(/pass|✓|verified/i.test(l))c='g';else if(/▸/.test(l))c='c';else if(/…/.test(l))c='y';logLine(l,c)});

/* ---------- palette items ---------- */
const shapeIc={cylinder:'⬤',box:'▮',cone:'▲'};
const items=[];
items.push({g:'Actions',i:'⚡',t:'Submit brief',s:D.brief,b:['↵','acc'],run:()=>submitBrief()});
items.push({g:'Actions',i:'▣',t:'Toggle exploded render',s:'switch render view',b:['view','dim'],run:()=>{
  $('#rimg').src=$('#rimg').src.includes('flat')?'lamp_exploded.png':'lamp_flat.png';toast('render view switched')}});
items.push({g:'Actions',i:'↻',t:'Re-run verification',s:checks.length+' checks · '+D.report.timingMs.toFixed(1)+'ms',b:['run','dim'],
  run:()=>{logLine('verify ▸ re-run requested','y');toast('verification re-run queued')}});
items.push({g:'Actions',i:'⤓',t:'Export spec.json',s:JSON.stringify(D.spec).length+' bytes',b:['json','dim'],
  run:()=>toast('spec.json exported')});
D.spec.parts.forEach(p=>{
  const m=D.measures.find(x=>x.id===p.id);
  items.push({g:'Parts',i:shapeIc[p.shape]||'▮',t:'Jump to part: '+p.id,
    s:p.shape+' · '+p.material+' · '+sizeOf(p)+'mm · '+(m?Math.round(m.massG)+'g':''),
    b:['part','acc'],match:p.id+' '+p.shape+' '+p.material,
    run:()=>{logLine('focus ▸ part '+p.id,'c');toast('focused '+p.id)}});
});
checks.forEach(c=>{
  items.push({g:'Checks',i:c.status==='pass'?'✓':'✗',t:c.name,
    s:c.detail.slice(0,64)+(c.detail.length>64?'…':''),b:[c.status,c.status==='pass'?'ok':'mag'],
    match:c.name+' '+c.status,
    run:()=>{logLine('check ▸ '+c.name+' … '+c.status,c.status==='pass'?'g':'y');toast(c.name+' re-evaluated: '+c.status)}});
});
D.plan.forEach(op=>{
  if(op.kind==='place'){
    items.push({g:'Plan ops',i:'↑',t:'step '+op.step+': place '+op.part,
      s:'ARM '+op.arm+' · seat '+v3(op.seat)+' · '+Math.round(op.massG)+'g',
      b:['ARM '+op.arm,op.arm==='A'?'acc':'mag'],match:'place '+op.part+' arm '+op.arm+' step '+op.step,
      run:()=>{logLine('plan ▸ queue step '+op.step+' ('+op.part+') → ARM '+op.arm,'c');toast('step '+op.step+' queued to ARM '+op.arm)}});
  }else{
    items.push({g:'Plan ops',i:'◇',t:'joint: '+op.a+' ↔ '+op.b,
      s:op.type+' · anchor '+v3(op.anchor),b:[op.type,'amb'],match:'joint '+op.type+' '+op.a+' '+op.b,
      run:()=>toast('joint '+op.type+' '+op.a+'↔'+op.b)});
  }
});
items.push({g:'Meta',i:'◆',t:'Figure status: '+(D.report.pass?'PASS':'FAIL'),
  s:passed+'/'+checks.length+' checks · attempt '+D.attempts+' · '+D.report.timingMs.toFixed(1)+'ms',
  b:[D.report.pass?'PASS':'FAIL',D.report.pass?'ok':'mag'],match:'status pass fail verdict report',
  run:()=>toast('report: '+(D.report.pass?'PASS':'FAIL'))});

/* palette render + filter */
const q=$('#q'),plist=$('#plist'),scrim=$('#scrim'),board=$('#board');
let sel=0,vis=[];
function render(){
  const needle=q.value.trim().toLowerCase();
  vis=items.filter(it=>!needle||(it.t+' '+(it.match||'')+' '+it.s+' '+it.g).toLowerCase().includes(needle));
  if(sel>=vis.length)sel=0;
  if(!vis.length){plist.innerHTML='<div id="pempty">No matches — try “arm”, “check”, or a part name.</div>';$('#pcount').textContent='0 results';return}
  let html='',lastG='';
  vis.forEach((it,i)=>{
    if(it.g!==lastG){html+=`<div class="grp">${it.g}</div>`;lastG=it.g}
    html+=`<div class="rw${i===sel?' sel':''}" data-i="${i}">
      <span class="ri">${it.i}</span>
      <div class="rm"><div class="rt">${esc(it.t)}</div><div class="rs">${esc(it.s)}</div></div>
      <span class="rb ${it.b[1]}">${esc(it.b[0])}</span></div>`;
  });
  plist.innerHTML=html;
  $('#pcount').textContent=vis.length+' result'+(vis.length===1?'':'s');
  plist.querySelectorAll('.rw').forEach(el=>{
    el.addEventListener('mousemove',()=>{if(sel!=+el.dataset.i){sel=+el.dataset.i;render()}});
    el.addEventListener('click',()=>{sel=+el.dataset.i;runSel()});
  });
  const selEl=plist.querySelector('.rw.sel');selEl&&selEl.scrollIntoView({block:'nearest'});
}
function runSel(){const it=vis[sel];if(!it)return;it.run()}
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);
}
q.addEventListener('input',()=>{sel=0;render()});
document.addEventListener('keydown',e=>{
  const open=!scrim.classList.contains('hidden');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();toggle();return}
  if(!open)return;
  if(e.key==='ArrowDown'){e.preventDefault();sel=(sel+1)%Math.max(1,vis.length);render()}
  else if(e.key==='ArrowUp'){e.preventDefault();sel=(sel-1+Math.max(1,vis.length))%Math.max(1,vis.length);render()}
  else if(e.key==='Enter'){e.preventDefault();runSel()}
  else if(e.key==='Escape'){toggle()}
});
scrim.addEventListener('click',e=>{if(e.target===scrim)toggle()});
function toggle(){
  const hid=scrim.classList.toggle('hidden');
  board.classList.toggle('dim',!hid);
  if(!hid){q.value='';sel=0;render();setTimeout(()=>q.focus(),30)}
}
render();setTimeout(()=>q.focus(),60);

/* brief */
const brief=$('#brief'),go=$('#go');brief.value=D.brief;
function submitBrief(){
  const v=brief.value.trim()||D.brief;if(!v)return;
  go.disabled=true;go.textContent='Queued…';
  logLine('brief ▸ '+v,'c');logLine('designing…','y');toast('brief queued');
  setTimeout(()=>{go.disabled=false;go.textContent='Submit brief'},1000);
}
go.addEventListener('click',submitBrief);
brief.addEventListener('keydown',e=>{if(e.key==='Enter')submitBrief()});
</script>
</body>
</html>
